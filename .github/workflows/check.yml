name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install shellcheck
        run: command -v shellcheck || (sudo apt-get update && sudo apt-get install -y shellcheck)

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Check
        run: bash scripts/check.sh
