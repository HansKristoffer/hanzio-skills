			data.round ? h('div', {}, `Round ${data.round.n}${data.round.ended_at ? ' closed' : ' open'}, ${data.round.pushes} push${data.round.pushes === 1 ? '' : 'es'}`) : null,
			data.waiting?.on === 'limit' ? h('div', {}, `Stopped by a usage limit${data.waiting.note ? ` (${data.waiting.note})` : ''}; the thread goes on after the reset at ${clock(data.waiting.until)}.`) : data.waiting ? h('div', {}, `Waiting on ${data.waiting.on}${data.waiting.note ? `: ${data.waiting.note}` : ''} since ${ago(data.waiting.since)}${data.waiting.overdue ? ' (overdue)' : ''}. Safety net ${data.waiting.safetyNet}.`) : null
		)
	)
}

function reviewItems(items) {
	const order = (i) => (i.needsAction ? 0 : i.blocksMerge ? 1 : 2)
	return h('div', { class: 'panel' }, ...items.slice().sort((a, b) => order(a) - order(b) || a.createdAt - b.createdAt).map((item) => {
		const where = item.kind === 'thread' ? `${item.path || ''}${item.line ? `:${item.line}` : ''}` : item.kind
		const outcome = item.handled ? `${item.handled}${item.handledCommit ? ` in ${item.handledCommit.slice(0, 7)}` : ''}` : null
		const said = item.comments.map((c) => c.trusted || c.byFactory
			? h('div', { class: 'quote md' }, h('div', { class: 'meta' }, `@${c.author}${c.authorKind === 'bot' ? ' (bot)' : ''}${c.byFactory ? ' (the factory)' : ''} · ${ago(c.createdAt)}`), md(c.body))
			: h('div', { class: 'quote hidden' }, `Hidden: @${c.author} is outside the project, so the factory ignores this comment.`))
		return h('div', { class: 'item' },
			h('div', { class: 'item-head' },
				item.needsAction ? chip('needs action', 'warn') : null,
				item.blocksMerge ? chip('blocks merge', 'bad') : null,
				outcome ? chip(outcome, item.handled === 'fixed' ? 'ok' : '') : null,
				chip(item.state.toLowerCase().replaceAll('_', ' ')),
				h('span', { class: 'mono muted' }, where),
				item.truncated ? h('span', { class: 'meta' }, 'over 100 comments: read the rest on GitHub') : null,
				h('span', { class: 'end' }, safeLink(item.url, 'Open on GitHub'))
			),
			item.handledNote ? h('div', { class: 'meta' }, `Factory: ${item.handledNote}`) : null,
			item.needsAction || item.blocksMerge ? said : fold(`item:${item.id}`, `${count(said.length, 'comment')} by ${[...new Set(item.comments.map((c) => `@${c.author}`))].join(', ')}`, ...said)
		)
	}))
}

function findingsList(findings) {
	const order = { important: 0, nit: 1, 'pre-existing': 2 }
	return h('div', { class: 'panel' }, ...findings.slice().sort((a, b) => order[a.severity] - order[b.severity]).map((f) => h('div', { class: 'item' },
		h('div', { class: 'item-head' },
			chip(f.severity, f.severity === 'important' ? 'warn' : ''),
			chip(f.outcome || 'open', f.outcome === 'fixed' ? 'ok' : f.outcome === 'upheld' ? 'bad' : ''),
			h('span', { class: 'mono muted' }, dotted(f.subject, f.file ? `${f.file}${f.line ? `:${f.line}` : ''}` : null, f.id))
		),
		// A settled finding is history: its title and what became of it, with the text one click away.
		f.title && !isOpenFinding(f)
			? [h('div', {}, h('strong', { style: 'font-weight:500' }, f.title), f.outcomeNote ? h('span', { class: 'meta' }, ` · ${f.outcomeNote}`) : null), fold(`finding:${f.id}`, 'What it said', h('p', {}, f.text))]
			: [h('div', {}, f.title ? h('strong', { style: 'font-weight:500' }, `${f.title}. `) : null, f.text), f.outcomeNote ? h('div', { class: 'meta' }, f.outcomeNote) : null]
	)))
}

/** Each stage with what it does, and what its note is for. The orchestrator has a model and no note; land a note and no model. */
const STAGE_ROWS = [
	['orchestrator', 'The thread that owns the issue. It runs the stages and lands the PR', null],
	['research', 'Reproduces the issue, sizes it and routes it', 'What to start or set up before reproducing'],
	['plan', 'Plans a change that is too big to build directly', 'What a plan in this project must cover'],
	['implement', 'Makes the change and opens the PR', 'Commands to run, files never to touch'],
	['review', 'Reviews the plan and the PR', 'What to look at closely in this project'],
	['land', 'The merge and the deploy check, done by the orchestrator', 'How this project deploys and how to check it']
]
const getPath = (obj, path) => path.split('.').reduce((v, k) => (v == null ? v : v[k]), obj)
const optionsText = (options) => (options ? Object.entries(options).map(([key, value]) => `${key}: ${value}`).join(', ') : '')
/** Options as people write them, `effort: high, fast: true`. JSON is taken too. */
function parseOptions(text) {
	if (text.startsWith('{')) return JSON.parse(text)
	const options = {}
	for (const part of text.split(',')) {
		const pair = part.match(/^\s*([\w.-]+)\s*[:=]\s*(.+?)\s*$/)
		if (!pair) throw new Error(`Options: write them as "effort: high", not "${part.trim()}"`)
		options[pair[1]] = pair[2] === 'true' ? true : pair[2] === 'false' ? false : pair[2]
	}
	return options
}

/** A fallback target as one line: "codex/gpt-6-astra, reasoningEffort: high". */
function fallbackText(target) {
	if (!target?.model) return ''
	const options = optionsText(target.options)
	return `${target.provider}/${target.model}${options ? `, ${options}` : ''}`
}

function parseFallback(text) {
	const [first, ...rest] = text.split(',')
	const slash = first.indexOf('/')
	if (slash < 1 || slash === first.trim().length - 1) throw new Error(`Fallback: write it as "provider/model", not "${first.trim()}"`)
	const target = { provider: first.slice(0, slash).trim(), model: first.slice(slash + 1).trim() }
	if (rest.join(',').trim()) target.options = parseOptions(rest.join(',').trim())
	return target
}

let settingsDirty = false
/** The scope that was just saved, and values copied in from a project's file that are not saved yet. */
let settingsSaved = null
let settingsSeed = null

async function drawSettings() {
	let data
	try { data = await api('GET', '/api/settings') } catch (e) { render(h('p', { class: 'error' }, e.message)); return }
	if (route().page !== 'settings') return
	const projects = Object.entries(data.repos)
	if (settingsScope !== 'global' && !data.repos[settingsScope.slice('repo:'.length)]) settingsScope = 'global'
	const scope = settingsScope
	const name = scope === 'global' ? null : scope.slice('repo:'.length)
	if (settingsSeed && settingsSeed.scope !== scope) settingsSeed = null
	settingsDirty = !!settingsSeed
	const pick = (key) => {
		if (key === settingsScope || (settingsDirty && !confirm('Discard the changes you have not saved?'))) return
		settingsScope = key
		settingsSeed = settingsSaved = null
		drawSettings()
	}
	const item = (key, label, where) => h('button', { class: key === scope ? 'on' : '', 'aria-current': key === scope ? 'page' : undefined, onclick: () => pick(key) }, h('span', {}, label), where ? h('span', { class: 'where' }, where) : null)
	// Providers and models already in use anywhere, offered as suggestions while typing.
	const seen = { provider: new Set(), model: new Set() }
	for (const settings of [data.defaults, ...projects.map(([, r]) => r.resolved.settings)]) {
		for (const target of [settings.orchestrator, ...Object.values(settings.stages)]) {
			if (target.provider) seen.provider.add(target.provider)
			if (target.model) seen.model.add(target.model)
		}
	}
	render(
		h('h1', {}, 'Settings'),
		h('p', { class: 'lede' }, 'Every project starts from the settings for all projects and changes what it sets itself. A running issue keeps the settings it started with.'),
		h('div', { class: 'sgrid' },
			h('div', { class: 'snav', role: 'navigation', 'aria-label': 'Settings for' },
				item('global', 'All projects'),
				h('div', { class: 'snav-h' }, projects.length ? 'Projects' : 'A project shows here once the factory has worked an issue in it'),
				...projects.map(([repo, r]) => item(`repo:${repo}`, repo, r.store === 'file' ? 'repository' : 'this machine'))
			),
			h('div', {}, name ? projectSettings(scope, name, data.repos[name]) : [
				h('div', { class: 'shead' }, h('h2', {}, 'All projects'), h('p', {}, 'What a project uses for everything it does not set itself. Kept on this machine')),
				settingsEditor(scope, data.global, { settings: data.defaults, sources: null })
			]),
			...['provider', 'model'].map((kind) => h('datalist', { id: `seen-${kind}` }, ...[...seen[kind]].sort().map((value) => h('option', { value }))))
		),
		h('p', { class: 'foot' }, 'Anyone who can open this page can change these settings, start threads and answer decisions. There is no sign-in: keep the tailnet to people you trust.')
	)
}

/** A project's settings live in one place: its factory.config.yaml, or this machine. The other is left out whole. */
function projectSettings(scope, name, repo) {
	const ref = repo.branch || 'the default branch'
	const error = h('p', { class: 'error', style: 'margin-top:12px' })
	const choose = async (store) => {
		if (store === repo.store || (settingsDirty && !confirm('Discard the changes you have not saved?'))) return
		try {
			await api('PUT', `/api/stores/${encodeURIComponent(name)}`, { store })
			settingsSeed = settingsSaved = null
			drawSettings()
		} catch (e) { error.textContent = e.message }
	}
	const option = (store, title, text) => h('button', { class: `opt${repo.store === store ? ' on' : ''}`, role: 'radio', 'aria-checked': repo.store === store ? 'true' : 'false', onclick: () => choose(store) }, h('i'), h('span', {}, h('strong', {}, title), h('span', {}, text)))
	const local = Object.keys(repo.page).length > 0
	const copyIn = () => {
		if (local && !confirm('Replace what this machine holds for the project with the values in the file? Nothing is saved until you press Save.')) return
		settingsSeed = { scope, layer: repo.file }
		drawSettings()
	}
	const body = repo.store === 'machine'
		? [
			repo.file ? h('div', { class: 'notice quiet' }, h('span', {}, 'The repository has a factory.config.yaml. It is not read while the settings are kept here.'), h('button', { class: 'btn', onclick: copyIn }, 'Copy its values in')) : null,
			settingsEditor(scope, settingsSeed ? settingsSeed.layer : repo.page, repo.resolved),
			repo.yaml ? fold(`yaml:${scope}`, 'The saved settings as a factory.config.yaml', h('pre', {}, repo.yaml)) : null
		]
		: repo.fileError
			? h('p', { class: 'notice bad' }, `${repo.fileError}. The file is left out whole, so the project runs on the settings for all projects until it is fixed on ${ref}.`)
			: !repo.file
				? h('section', { class: 'panel' }, h('div', { class: 'part' },
					h('h2', {}, `No factory.config.yaml on ${ref}`),
					h('p', {}, `Until one is merged, this project runs on the settings for all projects.${repo.yaml ? ' This is what this machine holds for it, as a file to commit:' : ''}`),
					repo.yaml ? h('pre', { style: 'margin-top:16px' }, repo.yaml) : null
				))
				: [
					local ? h('p', { class: 'notice quiet' }, 'This machine also holds settings for this project. They are not used while the project reads its file.') : null,
					settingsEditor(scope, repo.file, repo.resolved, `Read from factory.config.yaml on ${ref}. To change a value, change the file and merge it.`)
				]
	return [
		h('div', { class: 'shead' }, h('h2', {}, name), h('p', {}, 'Where this project keeps its own settings')),
		h('div', { class: 'choice', role: 'radiogroup', 'aria-label': 'Where this project keeps its settings', style: 'margin-top:16px' },
			option('machine', 'On this machine', 'Kept by the factory here. Nothing goes into the repository'),
			option('file', 'In the repository', `Read from factory.config.yaml on ${ref}. A change counts once it is merged`)
		),
		error,
		body
	]
}

/** The form for one layer. With `locked` (the reason it cannot be edited here) every field is read-only. */
function settingsEditor(scope, layer, resolved, locked) {
	const draft = JSON.parse(JSON.stringify(layer || {}))
	const error = h('span', { class: 'error' })
	const fields = []
	const off = locked ? true : undefined
	// Only a value that comes from the settings for all projects is worth naming: a default is the default, and the rest is this layer.
	const shared = (key) => resolved.sources?.[key] === 'global'
	const inherit = scope === 'global' ? 'Default' : 'Inherit'
	const stageRow = ([name, about, noteHint]) => {
		const key = name === 'orchestrator' ? name : `stages.${name}`
		const cells = []
		if (name !== 'land') {
			const current = getPath(draft, key) || {}
			const shown = getPath(resolved.settings, key)
			const provider = h('input', { value: current.provider || '', placeholder: shown?.provider || '', 'aria-label': `${name} provider`, list: 'seen-provider', disabled: off })
			const model = h('input', { value: current.model || '', placeholder: shown?.model || '', 'aria-label': `${name} model`, list: 'seen-model', disabled: off })
			const opts = h('input', { value: optionsText(current.options), placeholder: optionsText(shown?.options), 'aria-label': `${name} options`, disabled: off })
			// Where the stage runs when its own provider refuses the run, written as "provider/model, effort: high".
			const fallback = name === 'orchestrator' ? null : h('input', { value: fallbackText(current.fallback), placeholder: fallbackText(shown?.fallback) || 'Fallback when the provider refuses the run, as provider/model, effort: high', 'aria-label': `${name} fallback`, disabled: off })
			fields.push(() => {
				const parent = name === 'orchestrator' ? draft : (draft.stages = draft.stages || {})
				const note = parent[name]?.note
				const next = {}
				if (provider.value.trim() || model.value.trim()) {
					next.provider = provider.value.trim()
					next.model = model.value.trim()
					if (opts.value.trim()) next.options = parseOptions(opts.value.trim())
				}
				if (fallback?.value.trim()) next.fallback = parseFallback(fallback.value.trim())
				if (note !== undefined) next.note = note
				if (Object.keys(next).length) parent[name] = next
				else delete parent[name]
			})
			const cell = (label, input) => h('div', {}, h('span', { class: 'flabel' }, label), input)
			cells.push(cell('Provider', provider), cell('Model', model), cell('Options', opts))
			// Its own row, like the note: the three columns above are the stage's own target.
			if (fallback) cells.push(h('div', { class: 'note' }, h('span', { class: 'flabel' }, 'Fallback'), fallback))
		}
		if (name !== 'orchestrator') {
			const inherited = resolved.settings.stages[name].note
			const area = h('textarea', { placeholder: inherited || noteHint, 'aria-label': `${name} note`, disabled: off }, getPath(draft, `${key}.note`) || '')
			fields.push(() => {
				draft.stages = draft.stages || {}
				const value = area.value.trim()
				if (value) draft.stages[name] = { ...(draft.stages[name] || {}), note: value }
				else if (draft.stages[name]) { delete draft.stages[name].note; if (!Object.keys(draft.stages[name]).length) delete draft.stages[name] }
			})
			cells.push(h('div', { class: 'note' }, h('span', { class: 'flabel' }, 'Note'), area, shared(`${key}.note`) ? h('span', { class: 'fhint' }, 'Note from all projects') : null))
		}
		return h('div', { class: 'stage' },
			h('div', { class: 'who' }, h('strong', {}, name), h('span', { class: 'fhint' }, about), name !== 'land' && shared(key) ? h('span', { class: 'fhint' }, 'Model from all projects') : null),
			...cells
		)
	}
	const choice = (key, values) => h('select', { disabled: off }, h('option', { value: '' }, `${inherit} (${resolved.settings[key]})`), ...values.map((v) => h('option', { value: v, selected: draft[key] === v }, v)))
	const number = (key, min, max) => h('input', { type: 'number', min, max, value: draft[key] ?? '', placeholder: String(resolved.settings[key]), disabled: off })
	const approval = choice('planApproval', ['auto', 'always', 'never'])
	const rounds = number('reviewRounds', 0, 5)
	const rulings = h('textarea', { placeholder: resolved.settings.rulings || 'One rule per line, such as: public API fields are never renamed', disabled: off }, draft.rulings || '')
	const reviewApproval = choice('approval', ['auto', 'required', 'off'])
	const merge = choice('merge', ['auto', 'ask', 'never'])
	const overdue = number('reviewOverdueHours', 1, 720)
	const lists = Object.fromEntries(['reviewers', 'bots', 'trust', 'ignore'].map((key) => [key, h('input', { value: (draft[key] || []).join(', '), placeholder: resolved.settings[key]?.join(', ') || 'None', disabled: off })]))
	fields.push(() => {
		if (approval.value) draft.planApproval = approval.value; else delete draft.planApproval
		if (rounds.value !== '') draft.reviewRounds = Number(rounds.value); else delete draft.reviewRounds
		if (rulings.value.trim()) draft.rulings = rulings.value.trim(); else delete draft.rulings
		if (reviewApproval.value) draft.approval = reviewApproval.value; else delete draft.approval
		if (merge.value) draft.merge = merge.value; else delete draft.merge
		if (overdue.value !== '') draft.reviewOverdueHours = Number(overdue.value); else delete draft.reviewOverdueHours
		for (const [key, input] of Object.entries(lists)) {
			const values = input.value.split(',').map((v) => v.trim()).filter(Boolean)
			if (values.length) draft[key] = values; else delete draft[key]
		}
	})
	const listField = {
		reviewers: ['Reviewers', 'Logins or org/team to request a review from'],
		bots: ['Review bots', 'Bots whose review the merge waits for'],
		trust: ['Trusted logins', 'People outside the repository whose comments count'],
		ignore: ['Ignored logins', 'Never acted on, such as a noisy bot']
	}
	const state = h('span', { class: 'state' }, settingsDirty ? 'Changes not saved' : settingsSaved === scope ? 'Saved' : '')
	const saveButton = h('button', { class: 'btn primary', disabled: !settingsDirty }, 'Save')
	saveButton.addEventListener('click', async () => {
		error.textContent = ''
		try {
			for (const f of fields) f()
			if (draft.stages && !Object.keys(draft.stages).length) delete draft.stages
			await api('PUT', `/api/settings/${encodeURIComponent(scope)}`, draft)
			settingsSeed = null
			settingsSaved = scope
			drawSettings()
		} catch (e) { error.textContent = e.message }
	})
	const part = (title, about, ...body) => h('div', { class: 'part' }, h('h2', {}, title), about ? h('p', {}, about) : null, ...body)
	const form = h('section', { class: 'panel' },
		part('Stages', locked || 'The model each stage runs on, and a note that goes into its brief. A stage without a model runs on the orchestrator\'s. Leave a field empty to inherit what it shows.', h('div', {},
			h('div', { class: 'stages-head' }, h('span', {}), h('span', {}, 'Provider'), h('span', {}, 'Model'), h('span', {}, 'Options')),
			...STAGE_ROWS.map(stageRow)
		)),
		part('Plan and review', null, h('div', { class: 'stack' },
			h('div', { class: 'fields' },
				field('Plan approval', approval, 'auto asks you about a feature, a large change or a one-way door'),
				field('Review rounds', rounds, 'Rounds on a PR before the merge becomes your decision. 0 skips the review')
			),
			field('Rulings', rulings, 'Standing rules that go into every brief')
		)),
		part('Review on GitHub', null, h('div', { class: 'stack' },
			h('div', { class: 'fields' },
				field('Approval', reviewApproval, 'auto waits for an approval when the branch rules or the reviewers call for one'),
				field('Who merges', merge, 'auto merges when the gate is ready, ask makes it your decision, never leaves it to people'),
				field('Review overdue after', overdue, 'Hours a wait for a review lasts before it shows as overdue')
			),
			h('div', { class: 'fields' }, ...Object.entries(lists).map(([key, input]) => field(listField[key][0], input, `${listField[key][1]}. Comma-separated${shared(key) ? ', from all projects' : ''}`)))
		)),
		locked ? null : h('div', { class: 'savebar' }, saveButton, state, error)
	)
	form.addEventListener('input', () => {
		settingsDirty = true
		settingsSaved = null
		saveButton.disabled = false
		state.textContent = 'Changes not saved'
	})
	return form
}

async function drawNew() {
	if (!loaded) return render()
	try {
		const res = await api('GET', '/api/repos')
		allRepos = res.repos || []
	} catch {}
	const repos = [...new Set([...allRepos, ...board.issues.map((i) => i.repo), ...board.done.map((i) => i.repo)])].sort()
	if (repos.length && !repos.includes(newDraft.repo)) newDraft.repo = repos[0]
	const error = h('span', { class: 'error' })
	const fetchStatus = h('span', { class: 'fhint' })
	const repo = h('select', { onchange: (e) => { newDraft.repo = e.target.value } }, ...repos.map((r) => h('option', { value: r, selected: r === newDraft.repo }, r)))
	const title = h('input', { value: newDraft.title, placeholder: newMode === 'pr' ? 'Leave empty to use the PR title' : 'What should be fixed or built', oninput: (e) => { newDraft.title = e.target.value } })
	const pr = h('input', { value: newDraft.pr, placeholder: 'https://github.com/owner/repo/pull/34', oninput: (e) => { newDraft.pr = e.target.value } })
	const source = h('input', { value: newDraft.source, placeholder: 'https://github.com/owner/repo/issues/12', oninput: (e) => { newDraft.source = e.target.value } })
	const merge = h('select', { onchange: (e) => { newDraft.merge = e.target.value } },
		h('option', { value: '', selected: newDraft.merge === '' }, 'Project default'),
		h('option', { value: 'ask', selected: newDraft.merge === 'ask' }, 'Ask before merging'),
		h('option', { value: 'never', selected: newDraft.merge === 'never' }, 'Never merge (a person merges)')
	)
	const body = h('textarea', {
		style: 'min-height:136px',
		placeholder: newMode === 'pr' ? 'What to do with this PR (leave empty for a review only)' : 'Context, steps to reproduce, acceptance criteria or links',
		oninput: (e) => { newDraft.body = e.target.value }
	}, newDraft.body)
	const fetchUrl = async (urlInput, btn) => {
		const url = urlInput.value.trim()
		if (!url) return
		btn.disabled = true
		error.textContent = ''
		fetchStatus.textContent = 'Reading from GitHub...'
		try {
			const item = await api('POST', '/api/github/fetch', { url })
			if (repos.includes(item.repo)) { newDraft.repo = item.repo; repo.value = item.repo }
			if (item.title && !newDraft.title.trim()) { newDraft.title = item.title; title.value = item.title }
			if (item.body && !newDraft.body.trim()) { newDraft.body = item.body; body.value = item.body }
			if (item.kind === 'pr') {
				newDraft.pr = item.url
				pr.value = item.url
				if (newMode !== 'pr') { newMode = 'pr'; drawNew(); return }
			} else {
				newDraft.source = item.url
				source.value = item.url
			}
			fetchStatus.textContent = `Loaded ${item.repo} #${item.number}${item.state ? ` (${item.state.toLowerCase()})` : ''}`
		} catch (err) {
			fetchStatus.textContent = ''
			error.textContent = err.message
		}
		btn.disabled = false
	}
	const start = async (e) => {
		e.target.disabled = true
		error.textContent = ''
		try {
			const payload = {
				repo: repo.value,
				title: title.value.trim() || undefined,
				body: body.value,
				source: newMode === 'issue' ? (source.value.trim() || undefined) : undefined,
				pr: newMode === 'pr' ? (pr.value.trim() || undefined) : undefined,
				merge: merge.value || undefined
			}
			const result = await api('POST', '/api/threads', payload)
			if (result.duplicateOf) error.textContent = `Already open: ${result.duplicateOf.title}`
			else if (result.closed) error.textContent = 'The factory already closed this item. Start it from a thread with --again to reopen it.'
			else {
				Object.assign(newDraft, { title: '', pr: '', source: '', body: '', merge: '' })
				location.hash = `#/issue/${encodeURIComponent(result.issue)}`
			}
		} catch (err) { error.textContent = err.message }
		e.target.disabled = false
	}
	const urlInput = newMode === 'pr' ? pr : source
	const fetchBtn = h('button', { type: 'button', class: 'btn', onclick: () => fetchUrl(urlInput, fetchBtn) }, 'Fetch')
	render(
		h('h1', {}, 'New issue'),
		repos.length
			? h('section', { class: 'panel narrow', style: 'margin-top:20px' }, h('div', { class: 'part stack' },
				h('div', { class: 'seg', role: 'tablist', 'aria-label': 'Start from' },
					h('button', { type: 'button', role: 'tab', 'aria-selected': newMode === 'issue' ? 'true' : 'false', class: newMode === 'issue' ? 'on' : '', onclick: () => { newMode = 'issue'; drawNew() } }, 'Bug or feature'),
					h('button', { type: 'button', role: 'tab', 'aria-selected': newMode === 'pr' ? 'true' : 'false', class: newMode === 'pr' ? 'on' : '', onclick: () => { newMode = 'pr'; drawNew() } }, 'Existing PR')
				),
				h('div', { class: 'fields' },
					field('Repository', repo),
					field('Who merges', merge)
				),
				newMode === 'pr'
					? field('Pull request URL', h('div', { class: 'fetch-row' }, pr, fetchBtn), fetchStatus)
					: field('GitHub issue or source URL (optional)', h('div', { class: 'fetch-row' }, source, fetchBtn), fetchStatus),
				field('Title', title, newMode === 'pr' ? 'Optional: defaults to the PR title' : null),
				field(newMode === 'pr' ? 'What to do with this PR' : 'Details', body),
				h('div', { class: 'row' }, h('button', { type: 'button', class: 'btn primary', onclick: start }, newMode === 'pr' ? 'Take in PR' : 'Start issue'), error)
			))
			: h('p', { class: 'lede' }, 'The factory starts threads in repositories it has seen. Start one issue from a T3 Code thread in the repository first.')
	)
}

// ---- Intake: open items from the connected trackers, each started in one click ----

const intake = {
	view: null,
	/** Per source id: { loading, error, items, readAt }. */
	lists: new Map(),
	filter: { source: '', show: 'new', label: '', state: '', assignee: '', query: '' },
	/** The source being added or edited in the slide-over sheet. */
	form: null,
	teams: null,
	/** What a start answered, per item URL, so the row says so until the list is read again. */
	starting: new Set(),
	notes: new Map(),
	linearKey: '',
	linearFormOpen: false
}

const sourceSheet = { el: null }

async function loadIntake(force) {
	try { intake.view = await api('GET', '/api/intake') } catch (e) { intake.view = { error: e.message, sources: [], repos: [] } }
	const ids = new Set(intake.view.sources.map((s) => s.id))
	for (const id of intake.lists.keys()) if (!ids.has(id)) intake.lists.delete(id)
	if (intake.filter.source && !ids.has(intake.filter.source)) intake.filter.source = ''
	for (const source of intake.view.sources) if (force || !intake.lists.has(source.id)) loadItems(source.id)
	if (route().page === 'intake') drawIntake()
	if (sourceSheet.el?.open && intake.form) drawSourceSheet()
}

async function loadItems(id) {
	const before = intake.lists.get(id)
	intake.lists.set(id, { ...(before || { items: [] }), loading: true, error: null })
	if (route().page === 'intake') drawIntake()
	try {
		const res = await api('GET', `/api/intake/sources/${encodeURIComponent(id)}/items`)
		intake.lists.set(id, { loading: false, error: null, items: res.items, readAt: res.readAt })
		for (const item of res.items) intake.notes.delete(item.url)
	} catch (e) {
		intake.lists.set(id, { ...(before || { items: [] }), loading: false, error: e.message })
	}
	if (route().page === 'intake') drawIntake()
}

async function startItem(source, item, again) {
	intake.starting.add(item.url)
	intake.notes.delete(item.url)
	drawIntake()
	try {
		const res = await api('POST', `/api/intake/sources/${encodeURIComponent(source.id)}/start`, { item: item.key, again: again || undefined })
		if (res.duplicateOf) {
			if (res.duplicateOf.id) item.factory = { id: res.duplicateOf.id, state: 'open', threadLink: res.duplicateOf.threadLink }
			else intake.notes.set(item.url, { text: 'A thread for it is starting now' })
		} else if (res.closed) {
			const last = res.closed[res.closed.length - 1]
			item.factory = { id: last.id, state: 'closed', outcome: last.outcome, closedAt: last.closedAt }
		} else {
			item.factory = { id: res.issue, state: 'open', threadLink: res.threadLink, fresh: true }
			refreshBoard()
		}
	} catch (e) {
		intake.notes.set(item.url, { text: e.message, bad: true })
	}
	intake.starting.delete(item.url)
	drawIntake()
}

async function removeSource(s) {
	if (!confirm(`Remove the source ${s.name}? Issues the factory started from it keep going.`)) return false
	try {
		await api('DELETE', `/api/intake/sources/${encodeURIComponent(s.id)}`)
		if (intake.filter.source === s.id) intake.filter.source = ''
		await loadIntake()
		return true
	} catch (e) {
		alert(e.message)
		return false
	}
}

async function disconnectLinear() {
	if (!confirm('Disconnect Linear? Its sources stay, and list nothing until it is connected again.')) return
	await api('DELETE', '/api/intake/linear').catch(() => {})
	intake.teams = null
	intake.linearFormOpen = false
	await loadIntake(true)
}

function linearConnectBox(onCancel, inline) {
	const error = h('span', { class: 'error' })
	const submitBtn = h('button', { type: 'button', class: 'btn sm primary' }, 'Connect')
	const key = h('input', {
		type: 'password',
		autocomplete: 'off',
		placeholder: 'lin_api_...',
		'aria-label': 'Linear API key',
		'data-draft': 'linear-key',
		value: intake.linearKey,
		oninput: (e) => { intake.linearKey = e.target.value },
		onkeydown: (e) => { if (e.key === 'Enter') { e.preventDefault(); connect() } }
	})
	const connect = async () => {
		const trimmed = key.value.trim()
		if (!trimmed) { error.textContent = 'Paste a Linear API key'; return }
		submitBtn.disabled = true
		error.textContent = ''
		try {
			await api('PUT', '/api/intake/linear', { apiKey: trimmed })
			intake.linearKey = ''
			intake.teams = null
			intake.linearFormOpen = false
			await loadIntake(true)
		} catch (err) {
			error.textContent = err.message
			submitBtn.disabled = false
		}
	}
	submitBtn.addEventListener('click', connect)
	return h('div', { class: 'in-conn-form' },
		inline
			? h('div', { class: 'in-conn-inline' }, key, submitBtn)
			: key,
		h('span', { class: 'fhint' }, 'Linear, Settings, Security & access. Kept on this machine and never shown again'),
		!inline ? h('div', { class: 'row' },
			submitBtn,
			onCancel ? h('button', { type: 'button', class: 'btn sm', onclick: onCancel }, 'Cancel') : null
		) : null,
		error
	)
}

function openSourceSheet(s) {
	const v = intake.view || { repos: [] }
	intake.form = s
		? { id: s.id, kind: s.kind, repo: s.repo, name: s.name, merge: s.merge || '', ghRepo: s.github?.repo || '', label: (s.github || s.linear)?.label || '', team: s.linear?.team || '', project: s.linear?.project || '' }
		: { kind: 'github', repo: v.repos[0] || '', name: '', merge: '', ghRepo: '', label: '', team: '', project: '' }
	if (!sourceSheet.el) {
		sourceSheet.el = h('dialog', {
			class: 'in-sheet',
			'aria-label': 'Source settings',
			onclick: (e) => { if (e.target === sourceSheet.el) sourceSheet.el.close() },
			onclose: () => { intake.form = null; sourceSheet.el.replaceChildren() }
		})
		document.body.append(sourceSheet.el)
	}
	drawSourceSheet()
	if (!sourceSheet.el.open) sourceSheet.el.showModal()
}

function drawSourceSheet() {
	const d = intake.form
	const v = intake.view
	if (!d || !v || !sourceSheet.el) return
	const linearOn = !!(v.linear && v.linear.connected)
	const error = h('span', { class: 'error' })
	if (d.kind === 'linear' && linearOn && !intake.teams) {
		intake.teams = []
		api('GET', '/api/intake/linear/teams')
			.then((r) => { intake.teams = r.teams; if (sourceSheet.el?.open && intake.form) drawSourceSheet() })
			.catch((e) => { intake.teams = []; error.textContent = e.message })
	}
	const set = (key) => (e) => { d[key] = e.target.value }
	const text = (key, placeholder) => h('input', { value: d[key], placeholder, oninput: set(key) })
	const repo = h('select', { onchange: set('repo') }, ...v.repos.map((r) => h('option', { value: r, selected: r === d.repo }, r)))
	const merge = h('select', { onchange: set('merge') },
		h('option', { value: '', selected: !d.merge }, 'Project default'),
		h('option', { value: 'ask', selected: d.merge === 'ask' }, 'Ask before merging'),
		h('option', { value: 'never', selected: d.merge === 'never' }, 'Never merge (a person merges)')
	)
	const teams = intake.teams || []
	const kindFields = d.kind === 'github'
		? [
			field('GitHub repository', text('ghRepo', d.repo || 'owner/name'), 'Leave empty for the repository the threads start in'),
			field('Label (optional)', text('label', 'factory'), 'Only list issues with this label')
		]
		: [
			!linearOn ? h('div', { class: 'stack', style: 'gap:8px' },
				h('p', { class: 'meta' }, 'Connect Linear first so the factory can read its teams and issues.'),
				linearConnectBox()
			) : null,
			field('Team', teams.length
				? h('select', { onchange: set('team') }, h('option', { value: '' }, 'Pick a team'), ...teams.map((t) => h('option', { value: t.key, selected: t.key === d.team }, `${t.key}: ${t.name}`)))
				: text('team', 'ENG')),
			field('Label (optional)', text('label', 'Bug')),
			field('Project (optional)', text('project', ''))
		]
	const save = async (e) => {
		e.target.disabled = true
		error.textContent = ''
		const payload = {
			kind: d.kind,
			repo: d.repo,
			name: d.name.trim() || undefined,
			merge: d.merge || '',
			...(d.kind === 'github'
				? { github: { repo: d.ghRepo.trim() || d.repo, label: d.label.trim() || undefined } }
				: { linear: { team: d.team.trim(), label: d.label.trim() || undefined, project: d.project.trim() || undefined } })
		}
		try {
			const res = d.id
				? await api('PUT', `/api/intake/sources/${encodeURIComponent(d.id)}`, payload)
				: await api('POST', '/api/intake/sources', payload)
			intake.lists.delete(res.source.id)
			sourceSheet.el.close()
			await loadIntake()
		} catch (err) {
			error.textContent = err.message
			e.target.disabled = false
		}
	}
	const existing = d.id ? v.sources.find((s) => s.id === d.id) : null
	fill(sourceSheet.el,
		h('div', { class: 'view-bar' },
			h('strong', {}, d.id ? 'Edit source' : 'Add source'),
			h('button', { type: 'button', class: 'btn sm', onclick: () => sourceSheet.el.close(), 'aria-label': 'Close' }, icon('close'), 'Close', h('span', { class: 'kbd' }, 'Esc'))
		),
		h('div', { class: 'in-sheet-body' },
			d.id ? null : h('div', { class: 'seg', role: 'tablist', 'aria-label': 'Source kind' },
				...[['github', 'GitHub issues'], ['linear', 'Linear']].map(([kind, label]) =>
					h('button', { type: 'button', role: 'tab', 'aria-selected': d.kind === kind ? 'true' : 'false', class: d.kind === kind ? 'on' : '', onclick: () => { d.kind = kind; drawSourceSheet() } }, label))
			),
			...kindFields,
			h('hr', { class: 'in-sheet-sep' }),
			field('Starts threads in', repo, 'The factory repository whose checkout works the items'),
			field('Who merges', merge),
			field('Name (optional)', text('name', 'Shown in the sources list')),
			error
		),
		h('div', { class: 'in-sheet-foot' },
			existing
				? h('button', { type: 'button', class: 'btn sm quiet', onclick: async () => { if (await removeSource(existing)) sourceSheet.el.close() } }, 'Remove source')
				: h('span', {}),
			h('div', { class: 'row' },
				h('button', { type: 'button', class: 'btn', onclick: () => sourceSheet.el.close() }, 'Cancel'),
				h('button', { type: 'button', class: 'btn primary', onclick: save }, d.id ? 'Save changes' : 'Add source')
			)
		)
	)
}

const priorityClass = (p) => {
	const v = String(p || '').toLowerCase()
	if (v === 'urgent') return 'urgent'
	if (v === 'high') return 'high'
	return ''
}

/** One open item: aligned ref, title, structured metadata and a clean Start action. */
function intakeRow(source, item, showSource) {
	const f = item.factory
	const busy = intake.starting.has(item.url)
	const note = intake.notes.get(item.url)
	let act
	if (busy) act = h('button', { type: 'button', class: 'in-start', disabled: true }, 'Starting…')
	else if (f && f.state === 'open') act = [chip(f.fresh ? 'Started' : 'In factory', 'ok'), h('a', { class: 'btn sm', href: issueHref(f) }, 'Open')]
	else if (f) act = [
		chip(outcomeName(f.outcome || f.state), f.outcome === 'shipped' ? 'ok' : ''),
		h('a', { class: 'btn sm quiet', href: issueHref(f) }, 'Record'),
		h('button', { type: 'button', class: 'btn sm', onclick: () => startItem(source, item, true) }, 'Start again')
	]
	else act = h('button', { type: 'button', class: 'in-start', onclick: () => startItem(source, item) }, icon('play'), 'Start')

	const titleNode = isUrl(item.url)
		? h('a', { class: 'in-title', href: item.url, target: '_blank', rel: 'noreferrer' }, item.title)
		: h('span', { class: 'in-title' }, item.title)

	const metaBits = []
	const pushText = (node) => {
		if (!node) return
		if (metaBits.length) metaBits.push(h('span', { class: 'in-sep', 'aria-hidden': 'true' }, '·'))
		metaBits.push(node)
	}
	if (showSource) pushText(h('span', {}, source.name))
	if (item.state && item.state !== 'open') pushText(h('span', { class: 'in-state' }, item.state))
	if (item.priority) pushText(h('span', { class: `in-pri ${priorityClass(item.priority)}` }, h('i'), item.priority))
	if (item.project) pushText(h('span', {}, item.project))
	if (item.assignees.length) pushText(h('span', {}, item.assignees.join(', ')))

	const labelTags = item.labels.map((label) => {
		const active = intake.filter.label === label
		return h('button', {
			type: 'button',
			class: `in-tag${active ? ' on' : ''}`,
			title: active ? `Clear ${label} filter` : `Filter by ${label}`,
			onclick: () => { intake.filter.label = active ? '' : label; drawIntake() }
		}, label)
	})

	return h('div', { class: 'in-row' },
		h('div', { class: 'in-ref', title: source.kind === 'github' ? 'GitHub issue' : 'Linear issue' },
			icon(source.kind),
			h('span', {}, item.ref)
		),
		h('div', { class: 'in-main' },
			h('div', { class: 'in-title-line' },
				titleNode,
				isUrl(item.url) ? h('span', { class: 'in-title-out', 'aria-hidden': 'true' }, icon('out')) : null
			),
			(metaBits.length || labelTags.length) ? h('div', { class: 'in-meta' }, ...metaBits, ...labelTags) : null,
			note ? h('div', { class: `in-note ${note.bad ? 'error' : 'meta'}` }, note.text) : null
		),
		h('div', { class: 'in-end' },
			item.updatedAt ? h('span', { class: 'in-time', title: `Updated ${clock(item.updatedAt)}` }, when(item.updatedAt)) : null,
			h('div', { class: 'row' }, act)
		)
	)
}

function drawIntake() {
	const v = intake.view
	if (!v) {
		return render(
			h('div', { class: 'in-head' },
				h('div', { class: 'in-head-main' }, h('h1', {}, 'Intake'), h('p', { class: 'in-head-sub' }, 'Reading sources…'))
			),
			h('section', { class: 'panel' }, h('div', { class: 'empty' }, h('p', {}, 'Reading sources…')))
		)
	}
	if (!v.sources.length) return render(intakeOnboarding(v))

	const f = intake.filter
	const activeSource = f.source ? v.sources.find((s) => s.id === f.source) || null : null
	const shown = activeSource ? [activeSource] : v.sources
	const allRows = v.sources.flatMap((s) => (intake.lists.get(s.id)?.items || []).map((item) => ({ source: s, item })))
	const rows = shown.flatMap((s) => (intake.lists.get(s.id)?.items || []).map((item) => ({ source: s, item })))

	const options = (pick) => [...new Set(rows.flatMap(({ item }) => pick(item)).filter(Boolean))].sort((a, b) => a.localeCompare(b))
	const labels = options((i) => i.labels)
	const states = options((i) => [i.state])
	const people = options((i) => i.assignees)
	for (const [key, list] of [['label', labels], ['state', states], ['assignee', people]]) if (f[key] && f[key] !== '-' && !list.includes(f[key])) f[key] = ''

	const showInNew = (item) => !item.factory || intake.starting.has(item.url) || !!item.factory.fresh
	const countForShow = (items) => f.show === 'new'
		? items.filter((i) => !i.factory).length
		: f.show === 'factory'
			? items.filter((i) => !!i.factory).length
			: items.length

	const q = f.query.trim().toLowerCase()
	const matches = ({ item }) => {
		if (f.show === 'new' && !showInNew(item)) return false
		if (f.show === 'factory' && !item.factory) return false
		if (f.label && !item.labels.includes(f.label)) return false
		if (f.state && item.state !== f.state) return false
		if (f.assignee === '-' ? item.assignees.length : f.assignee && !item.assignees.includes(f.assignee)) return false
		if (q && !`${item.ref} ${item.title} ${item.labels.join(' ')} ${item.project || ''}`.toLowerCase().includes(q)) return false
		return true
	}
	const list = rows.filter(matches).sort((a, b) => b.item.updatedAt - a.item.updatedAt)
	const loading = shown.some((s) => intake.lists.get(s.id)?.loading)
	const errors = shown.map((s) => [s, intake.lists.get(s.id)?.error]).filter(([, e]) => e)
	const notStartedCount = rows.filter(({ item }) => !item.factory).length
	const inFactoryCount = rows.filter(({ item }) => item.factory).length
	const hasActiveFilters = !!(f.label || f.state || f.assignee || f.query.trim())
	const lastRead = Math.max(0, ...shown.map((s) => intake.lists.get(s.id)?.readAt || 0))
	const kinds = [...new Set(v.sources.map((s) => (s.kind === 'github' ? 'GitHub' : 'Linear')))]

	const pick = (key, value) => { f[key] = value; drawIntake() }
	const select = (key, all, values, extra) => values.length || extra
		? h('select', { class: `in-select${f[key] ? ' on' : ''}`, 'aria-label': all, onchange: (e) => pick(key, e.target.value) },
			h('option', { value: '', selected: !f[key] }, all),
			extra || null,
			...values.map((x) => h('option', { value: x, selected: f[key] === x }, x)))
		: null

	const sourcesNav = h('aside', { class: 'in-sources' },
		h('div', { class: 'in-sec-head' },
			h('span', {}, 'Sources'),
			v.repos.length ? h('button', { type: 'button', class: 'in-rail-add', onclick: () => openSourceSheet(null) }, icon('plus'), 'Add') : null
		),
		h('div', { class: 'in-nav', role: 'navigation', 'aria-label': 'Intake sources' },
			h('div', { class: 'in-nav-item' },
				h('button', {
					type: 'button',
					class: `in-nav-btn${!f.source ? ' on' : ''}`,
					'aria-current': !f.source ? 'page' : undefined,
					onclick: () => pick('source', '')
				},
					icon('inbox'),
					h('span', { class: 'in-nav-name' }, 'All sources'),
					h('span', { class: 'in-nav-cnt' }, v.sources.every((s) => intake.lists.get(s.id)?.loading && !(intake.lists.get(s.id)?.items || []).length) ? '…' : countForShow(allRows.map((r) => r.item)))
				)
			),
			...v.sources.map((s) => {
				const st = intake.lists.get(s.id)
				const on = f.source === s.id
				const cnt = st?.loading && !st?.items?.length ? '…' : countForShow(st?.items || [])
				return h('div', { class: 'in-nav-item' },
					h('button', {
						type: 'button',
						class: `in-nav-btn${on ? ' on' : ''}`,
						'aria-current': on ? 'page' : undefined,
						onclick: () => pick('source', s.id)
					},
						icon(s.kind),
						h('span', { class: 'in-nav-name' }, s.name),
						st?.error ? h('span', { class: 'in-nav-err', title: st.error }) : h('span', { class: 'in-nav-cnt' }, cnt)
					),
					h('button', {
						type: 'button',
						class: 'in-nav-edit',
						'aria-label': `Edit ${s.name}`,
						title: `Edit ${s.name}`,
						onclick: (e) => { e.stopPropagation(); openSourceSheet(s) }
					}, icon('edit'))
				)
			})
		)
	)

	const filterBar = h('div', { class: 'in-bar' },
		h('div', { class: 'seg', role: 'tablist', 'aria-label': 'Status filter' },
			...[
				['new', 'Not started', notStartedCount],
				['factory', 'In factory', inFactoryCount],
				['all', 'All', rows.length]
			].map(([key, label, n]) =>
				h('button', {
					type: 'button',
					role: 'tab',
					'aria-selected': f.show === key ? 'true' : 'false',
					class: f.show === key ? 'on' : '',
					onclick: () => pick('show', key)
				}, label, h('span', { class: 'count' }, n))
			)
		),
		h('div', { class: 'in-filters' },
			select('label', 'Label', labels),
			select('state', 'State', states.length > 1 ? states : []),
			select('assignee', 'Assignee', people, h('option', { value: '-', selected: f.assignee === '-' }, 'Unassigned')),
			hasActiveFilters ? h('button', {
				type: 'button',
				class: 'btn sm quiet',
				onclick: () => { Object.assign(f, { label: '', state: '', assignee: '', query: '' }); drawIntake() }
			}, 'Clear') : null
		),
		h('div', { class: 'in-search-wrap' },
			icon('search'),
			h('input', {
				type: 'search',
				class: 'search',
				placeholder: 'Filter',
				'aria-label': 'Filter items',
				'data-draft': 'intake-search',
				value: f.query,
				oninput: (e) => pick('query', e.target.value),
				onkeydown: (e) => { if (e.key === 'Escape' && f.query) { e.preventDefault(); pick('query', '') } }
			}),
			!f.query ? h('span', { class: 'kbd', 'aria-hidden': 'true' }, '/') : null
		)
	)

	const queueHead = h('div', { class: 'in-head' },
		h('div', { class: 'in-head-main' },
			h('h1', {},
				activeSource ? activeSource.name : 'All sources',
				h('span', { class: 'count' }, list.length)
			),
			h('div', { class: 'in-head-sub' },
				activeSource
					? [sourceMeta(activeSource), activeSource.merge ? chip(activeSource.merge === 'never' ? 'never merges' : 'asks before merging') : null]
					: dotted(count(v.sources.length, 'source'), kinds.join(', '))
			)
		),
		h('div', { class: 'in-head-act' },
			activeSource ? h('button', { type: 'button', class: 'btn sm', onclick: () => openSourceSheet(activeSource) }, 'Edit') : null,
			h('button', {
				type: 'button',
				class: `btn sm${loading ? ' in-spin' : ''}`,
				disabled: loading,
				title: lastRead ? `Last read ${clock(lastRead)}` : 'Refresh sources',
				onclick: () => loadIntake(true)
			}, icon('refresh'), loading ? 'Reading…' : 'Refresh')
		)
	)

	const queueBody = list.length
		? list.map(({ source, item }) => intakeRow(source, item, !activeSource && v.sources.length > 1))
		: h('div', { class: 'empty' },
			h('p', {}, loading && !rows.length ? 'Reading sources…' : rows.length ? 'No matching items' : 'No open items'),
			rows.length ? h('button', { type: 'button', class: 'btn', onclick: () => { Object.assign(f, { show: 'all', label: '', state: '', assignee: '', query: '' }); drawIntake() } }, 'Reset filters') : null
		)

	render(
		h('div', { class: 'in-grid' },
			sourcesNav,
			h('div', { class: 'in-queue' },
				queueHead,
				v.error ? h('p', { class: 'notice bad', style: 'margin:0 0 12px' }, v.error) : null,
				errors.length ? h('div', { style: 'margin-bottom:12px' }, errors.map(([s, e]) => h('p', { class: 'notice bad', style: 'margin-top:0' }, `${s.name}: ${e}`))) : null,
				h('section', { class: 'panel', 'aria-label': 'Items' }, filterBar, queueBody),
				h('p', { class: 'foot' }, 'Anyone who can open this page can add sources and start threads. The Linear key stays on this machine and is never sent back to the page.')
			),
			connectionsSidebar(v)
		)
	)
}

async function refreshBoard() {
	try { board = await api('GET', '/api/board'); loaded = true } catch { return }
	drawNav()
}

async function draw() {
	drawNav()
	const { page, id } = route()
	if (page === 'issue' && id) return drawIssue(id)
	if (page === 'settings') return drawSettings()
	if (page === 'new') return drawNew()
	if (page === 'intake') {
		// Each visit reads the sources again, so an item another thread or a scheduled run started shows as such.
		drawIntake()
		return loadIntake(true)
	}
	if (page === 'done') return drawDone()
	drawBoard()
}

let timer
function connect() {
	const live = document.getElementById('live')
	const set = (text, up) => { live.lastElementChild.textContent = text; live.classList.toggle('up', up) }
	const source = new EventSource('/api/stream')
	source.onopen = () => set('Live', true)
	source.onerror = () => set('Reconnecting', false)
	source.addEventListener('change', (e) => {
		let data = {}
		try { data = JSON.parse(e.data) } catch {}
		clearTimeout(timer)
		timer = setTimeout(async () => {
			await refreshBoard()
			const { page, id } = route()
			if (page === 'board' || page === 'done' || (page === 'issue' && id === data.issue) || (page === 'settings' && data.issue === null && !settingsDirty)) draw()
		}, 150)
	})
}

setInterval(() => {
	for (const el of document.querySelectorAll('[data-at]')) el.textContent = ago(Number(el.dataset.at))
	for (const el of document.querySelectorAll('[data-since]')) el.textContent = span(Date.now() - Number(el.dataset.since))
}, 20000)

window.addEventListener('keydown', (e) => {
	if (e.metaKey || e.ctrlKey || e.altKey) return
	if (document.querySelector('dialog[open]')) return
	const tag = document.activeElement?.tagName
	if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return
	const { page } = route()
	if (e.key === '/' && (page === 'board' || page === 'done' || page === 'intake')) {
		const el = main.querySelector('.search')
		if (el) { e.preventDefault(); el.focus() }
	} else if (e.key === 'n' && page === 'board') {
		e.preventDefault()
		location.hash = '#/new'
	}
})

document.getElementById('new').append(icon('plus'), 'New issue')
window.addEventListener('hashchange', () => { justSubmitted = null; window.scrollTo(0, 0); draw() })
refreshBoard().then(draw)
connect()
</script>
