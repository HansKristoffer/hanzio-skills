<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Factory</title>
<style>
	:root {
		--bg: #fafafa; --panel: #ffffff; --raised: #f4f4f5;
		--ink: #171717; --ink2: #525252; --muted: #737373;
		--line: rgba(23, 23, 23, .08); --line2: rgba(23, 23, 23, .16); --passed: #a3a3a3;
		--warn: #b45309; --warn-dot: #d97706; --warn-bg: #fffaf0; --warn-line: rgba(180, 83, 9, .3);
		--ok: #15803d; --ok-dot: #16a34a; --bad: #c62424; --bad-dot: #dc2626; --bad-bg: #fef4f4;
		--shadow: 0 1px 2px rgba(0, 0, 0, .05);
		--ease: cubic-bezier(.22, 1, .36, 1);
		--sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
		--mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
		color-scheme: light;
	}
	@media (prefers-color-scheme: dark) {
		:root {
			--bg: #141415; --panel: #19191b; --raised: #232325;
			--ink: #ededed; --ink2: #a1a1a6; --muted: #85858b;
			--line: rgba(237, 237, 237, .08); --line2: rgba(237, 237, 237, .16); --passed: #5f5f66;
			--warn: #f0a35c; --warn-dot: #f0a35c; --warn-bg: #211c16; --warn-line: rgba(240, 163, 92, .3);
			--ok: #4cc38a; --ok-dot: #4cc38a; --bad: #f2777a; --bad-dot: #e5484d; --bad-bg: #241819;
			--shadow: none;
			color-scheme: dark;
		}
	}
	* { box-sizing: border-box; }
	body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/20px var(--sans); -webkit-font-smoothing: antialiased; }
	h1, h2, h3, p { margin: 0; }
	a { color: inherit; }
	:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; border-radius: 4px; }
	.wrap { max-width: 1280px; margin: 0 auto; padding: 0 24px; }
	.mono { font-family: var(--mono); font-size: 12px; }
	.muted { color: var(--muted); }
	.ic { display: inline-flex; width: 16px; height: 16px; flex: none; }
	.ic svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }

	/* Top bar */
	.top { position: sticky; top: 0; z-index: 2; background: var(--panel); border-bottom: 1px solid var(--line); }
	.bar { display: flex; align-items: center; gap: 24px; min-height: 56px; }
	.brand { display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 600; text-decoration: none; }
	.brand svg { width: 20px; height: 20px; }
	nav { display: flex; gap: 4px; }
	nav a { display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 12px; border-radius: 8px; color: var(--ink2); text-decoration: none; transition: background-color .15s var(--ease), color .15s var(--ease); }
	nav a:hover { color: var(--ink); background: var(--raised); }
	nav a.on { color: var(--ink); background: var(--raised); font-weight: 500; }
	.count { font: 12px/16px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
	nav .count.warn { padding: 0 6px; border-radius: 6px; background: var(--warn-bg); color: var(--warn); box-shadow: inset 0 0 0 1px var(--warn-line); }
	.right { margin-left: auto; display: flex; align-items: center; gap: 16px; }
	.live { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); white-space: nowrap; }
	.live i { width: 8px; height: 8px; border-radius: 50%; background: var(--bad-dot); }
	.live.up i { background: var(--ok-dot); }

	/* Controls */
	.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 32px; padding: 0 12px; border: 1px solid var(--line2); border-radius: 8px; background: var(--panel); color: var(--ink); font: 500 13px/20px var(--sans); text-decoration: none; white-space: nowrap; cursor: pointer; transition: background-color .15s var(--ease), border-color .15s var(--ease), color .15s var(--ease), transform .15s var(--ease); }
	.btn:hover { background: var(--raised); }
	.btn:active { transform: scale(.98); }
	.btn:disabled { opacity: .5; cursor: default; transform: none; }
	.btn.primary { background: var(--ink); border-color: var(--ink); color: var(--bg); }
	.btn.primary:hover { background: color-mix(in srgb, var(--ink) 86%, var(--bg)); }
	.btn.sm { height: 28px; padding: 0 8px; color: var(--ink2); }
	.btn.sm:hover { color: var(--ink); }
	.btn.quiet { border-color: transparent; background: transparent; color: var(--ink2); }
	.btn.quiet:hover { background: var(--raised); color: var(--bad); }
	.btn.long { height: auto; min-height: 32px; padding: 6px 12px; justify-content: flex-start; text-align: left; white-space: normal; }
	input, select, textarea { width: 100%; border: 1px solid var(--line2); border-radius: 8px; background: var(--panel); color: var(--ink); font: 14px/20px var(--sans); transition: border-color .15s var(--ease), box-shadow .15s var(--ease); }
	input, select { height: 36px; padding: 0 12px; }
	textarea { display: block; min-height: 76px; padding: 8px 12px; resize: vertical; }
	input:focus, select:focus, textarea:focus { outline: none; border-color: var(--ink2); box-shadow: 0 0 0 3px var(--line); }
	::placeholder { color: var(--muted); opacity: .8; }
	@media (prefers-color-scheme: dark) { input, select, textarea { background: var(--raised); } }
	.field { display: block; min-width: 0; }
	.flabel { display: block; margin-bottom: 6px; font-size: 13px; color: var(--ink2); }
	.fhint { display: block; margin-top: 4px; font-size: 12px; line-height: 16px; color: var(--muted); }
	.fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; }
	.stack { display: grid; gap: 16px; }
	.row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
	.error { color: var(--bad); font-size: 13px; }
	.error:empty { display: none; }

	/* Surfaces */
	main.wrap { container-type: inline-size; padding-top: 32px; padding-bottom: 80px; }
	.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); }
	.sec { display: flex; align-items: baseline; gap: 8px; margin: 32px 0 12px; }
	.sec h2 { font-size: 14px; font-weight: 500; }
	h1 { font-size: 24px; line-height: 32px; font-weight: 500; overflow-wrap: anywhere; }
	.lede { max-width: 72ch; margin-top: 8px; color: var(--ink2); }
	.chip { display: inline-flex; align-items: center; gap: 6px; min-height: 22px; padding: 1px 8px; border-radius: 6px; background: var(--raised); color: var(--ink2); font-size: 12px; line-height: 16px; }
	.chip.ok::before, .chip.warn::before, .chip.bad::before { content: ""; flex: none; width: 6px; height: 6px; border-radius: 50%; background: var(--ok-dot); }
	.chip.warn::before { background: var(--warn-dot); }
	.chip.bad::before { background: var(--bad-dot); }
	.chip.warn { color: var(--warn); }
	.chip.bad { color: var(--bad); }
	pre { margin: 0; padding: 12px; border-radius: 8px; background: var(--raised); font: 12px/18px var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; max-height: 420px; overflow: auto; }
	details summary { cursor: pointer; font-size: 13px; color: var(--ink2); }
	details[open] summary { margin-bottom: 8px; }
	.notice { margin-top: 12px; padding: 12px 16px; border-radius: 10px; background: var(--warn-bg); color: var(--warn); font-size: 13px; box-shadow: inset 0 0 0 1px var(--warn-line); }
	.notice.bad { background: var(--bad-bg); color: var(--bad); box-shadow: none; }
	.empty { padding: 48px 20px; text-align: center; color: var(--ink2); }
	.empty p + p { margin-top: 4px; color: var(--muted); }
	.empty .btn { margin-top: 16px; }

	/* Overview figures */
	.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1px; overflow: hidden; background: linear-gradient(var(--line), var(--line)), var(--panel); }
	.stat { padding: 16px 20px; background: var(--panel); text-decoration: none; }
	a.stat { transition: background-color .15s var(--ease); }
	a.stat:hover { background: var(--raised); }
	.stat-l { font-size: 13px; color: var(--ink2); }
	.stat-n { margin-top: 8px; font-size: 28px; line-height: 32px; font-weight: 500; font-variant-numeric: tabular-nums; }
	.stat.warn .stat-l, .stat.warn .stat-n { color: var(--warn); }
	@container (max-width: 640px) { .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

	/* The line: five stations, the one an issue is at lit in its status colour */
	.t-idle { --tone: var(--ink); }
	.t-live { --tone: var(--ok-dot); }
	.t-warn { --tone: var(--warn-dot); }
	.t-bad { --tone: var(--bad-dot); }
	.track { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); }
	.st { position: relative; display: grid; place-items: center; height: 20px; }
	.st::before { content: ""; position: absolute; left: -50%; right: 50%; top: 9px; height: 2px; background: var(--line2); }
	.track .st:first-child::before, .stn:first-child .st::before { display: none; }
	.st.done::before, .st.skip::before, .st.now::before { background: var(--passed); }
	.st i { position: relative; width: 8px; height: 8px; border-radius: 50%; background: var(--panel); box-shadow: inset 0 0 0 1.5px var(--passed); }
	.st.done i { background: var(--passed); }
	.st.now i { width: 12px; height: 12px; background: var(--tone); box-shadow: 0 0 0 4px color-mix(in srgb, var(--tone) 20%, var(--panel)); }
	.st.now.running i::after { content: ""; position: absolute; inset: -4px; border-radius: 50%; border: 1.5px solid var(--tone); animation: ping 2s var(--ease) infinite; }
	@keyframes ping { from { transform: scale(.7); opacity: .8; } to { transform: scale(1.9); opacity: 0; } }
	@media (prefers-reduced-motion: reduce) { .st.now.running i::after { animation: none; opacity: 0; } }

	/* Board list */
	.lhead, .lrow { display: grid; grid-template-columns: minmax(0, 1fr) 280px 184px 148px; column-gap: 24px; align-items: center; padding: 0 20px; }
	.lhead { min-height: 44px; font-size: 12px; line-height: 16px; color: var(--muted); }
	.lhead h2 { display: flex; align-items: baseline; gap: 8px; font-size: 14px; line-height: 20px; font-weight: 500; color: var(--ink); }
	.stations { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); text-align: center; white-space: nowrap; }
	.lrow { padding-top: 16px; padding-bottom: 16px; border-top: 1px solid var(--line); }
	.title { font-size: 15px; line-height: 22px; font-weight: 500; text-decoration: none; overflow-wrap: anywhere; }
	.title:hover { text-decoration: underline; text-underline-offset: 3px; }
	.meta { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
	.last { margin-top: 4px; font-size: 13px; color: var(--ink2); display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; overflow-wrap: anywhere; }
	time, .num { font-family: var(--mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
	.last time { margin-right: 8px; }
	.stage-name { display: none; font-size: 13px; color: var(--ink2); }
	.slabel { font-size: 13px; font-weight: 500; }
	.t-warn > .slabel { color: var(--warn); }
	.t-bad > .slabel { color: var(--bad); }
	.snote { font-size: 12px; line-height: 16px; margin-top: 2px; color: var(--muted); overflow-wrap: anywhere; }
	.snote.bad { color: var(--bad); }
	.cell-act { display: flex; justify-content: flex-end; gap: 8px; }
	@container (max-width: 980px) {
		.lhead { grid-template-columns: minmax(0, 1fr); }
		.lhead > :not(h2) { display: none; }
		.lrow { grid-template-columns: 96px minmax(0, 1fr); column-gap: 12px; row-gap: 12px; }
		.cell-main, .cell-act, .cell-status { grid-column: 1 / -1; }
		.cell-track { display: contents; }
		.stage-name { display: block; }
		.cell-act { justify-content: flex-start; }
	}

	/* Needs you */
	.needs { border-color: var(--warn-line); }
	.needs .lhead h2 { color: var(--warn); }
	.need { padding: 20px; border-top: 1px solid var(--line); }
	.need-top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; font-size: 13px; color: var(--muted); }
	.need-top a { color: var(--ink2); font-weight: 500; text-underline-offset: 3px; }
	.need-top time { margin-left: auto; }
	.kind { font-weight: 500; color: var(--warn); }
	.kind.bad { color: var(--bad); }
	.question { max-width: 80ch; margin-top: 8px; font-size: 16px; line-height: 24px; font-weight: 500; overflow-wrap: anywhere; }
	.need > .meta, .need > pre, .need > .answer, .need > .row { margin-top: 12px; }
	.need > .meta { max-width: 80ch; color: var(--ink2); }
	.own { display: flex; gap: 8px; align-items: flex-end; max-width: 720px; margin-top: 12px; }
	.own textarea { min-height: 36px; height: 36px; }
	.need .error { margin-top: 8px; }

	/* Issue page */
	.back { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; color: var(--muted); text-decoration: none; }
	.back:hover { color: var(--ink); }
	.ititle { display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 12px 24px; margin-top: 12px; }
	.ititle h1 { flex: 1 1 320px; }
	.imeta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-top: 8px; font-size: 13px; color: var(--muted); }
	.imeta .slabel { color: var(--ink); }
	.imeta.t-warn .slabel { color: var(--warn); }
	.imeta.t-bad .slabel { color: var(--bad); }
	.line { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); margin-top: 24px; padding: 20px 0; }
	.stn { min-width: 0; text-align: center; }
	.stn .st { height: 24px; }
	.stn .st::before { top: 11px; }
	.stn-name { margin-top: 8px; font-size: 13px; font-weight: 500; color: var(--muted); }
	.stn.on .stn-name { color: var(--ink); }
	.stn-sub { min-height: 16px; margin-top: 2px; padding: 0 4px; font: 12px/16px var(--mono); color: var(--muted); }
	.stn-sub.bad { color: var(--bad); }
	.igrid { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 0 32px; align-items: start; }
	@container (max-width: 980px) { .igrid { grid-template-columns: minmax(0, 1fr); } }
	.igrid > div > .sec:first-child { margin-top: 32px; }
	.body { padding: 16px 20px; }
	.body > * + * { margin-top: 12px; }
	.gate { display: flex; align-items: center; gap: 8px; font-weight: 500; }
	.gate::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--passed); }
	.gate.ok::before { background: var(--ok-dot); }
	ul.plain { margin: 8px 0 0; padding-left: 20px; color: var(--ink2); }
	.item { padding: 16px 20px; border-top: 1px solid var(--line); overflow-wrap: anywhere; }
	.item:first-child { border-top: 0; }
	.item > * + * { margin-top: 8px; }
	.item-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
	.item-head strong { font-weight: 500; }
	.item-head .end { margin-left: auto; }
	.item-head .end a:not(.btn) { font-size: 13px; color: var(--ink2); text-underline-offset: 3px; }
	.quote { padding-left: 12px; border-left: 2px solid var(--line2); white-space: pre-wrap; }
	.quote .meta { margin-bottom: 2px; }
	.quote.hidden { color: var(--muted); }
	.tl { margin-left: 4px; padding: 4px 0 4px 16px; border-left: 1px solid var(--line2); }
	.tl > div { position: relative; padding: 6px 0; font-size: 13px; color: var(--ink2); overflow-wrap: anywhere; }
	.tl > div::before { content: ""; position: absolute; left: -20px; top: 13px; width: 7px; height: 7px; border-radius: 50%; background: var(--passed); box-shadow: 0 0 0 3px var(--bg); }
	.tl > div:first-child { color: var(--ink); }
	.tl time { display: block; }


	/* What the reviewer looks at: captures, the dev environment, and what the implementer proved */
	.shots { display: grid; gap: 24px; padding: 20px; }
	.shots h3 { font-size: 14px; line-height: 20px; font-weight: 500; overflow-wrap: anywhere; }
	.shots h3 + p { max-width: 72ch; margin-top: 2px; font-size: 13px; color: var(--ink2); overflow-wrap: anywhere; }
	.shot-row { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 260px), 1fr)); gap: 12px; margin-top: 12px; }
	.shot-row.pair { grid-template-columns: repeat(2, minmax(0, 1fr)); }
	.shot { position: relative; display: block; width: 100%; padding: 0; border: 0; border-radius: 10px; background: var(--raised); box-shadow: 0 0 0 1px var(--line2); overflow: hidden; cursor: zoom-in; transition: box-shadow .15s var(--ease); }
	.shot:hover { box-shadow: 0 0 0 1px var(--ink2); }
	.shot img { display: block; width: 100%; aspect-ratio: 16 / 10; object-fit: cover; object-position: top center; }
	.shot .blank { display: grid; place-items: center; aspect-ratio: 16 / 10; color: var(--muted); font-size: 13px; }
	.tag { position: absolute; left: 8px; top: 8px; padding: 1px 8px; border-radius: 6px; background: var(--panel); color: var(--ink); font: 500 12px/18px var(--sans); box-shadow: 0 0 0 1px var(--line2); }
	.play { position: absolute; left: 50%; top: 50%; display: grid; place-items: center; width: 48px; height: 48px; margin: -24px 0 0 -24px; border-radius: 50%; background: var(--ink); color: var(--bg); }
	.play svg { width: 20px; height: 20px; margin-left: 2px; fill: currentColor; stroke: none; }
	.shot-meta { margin-top: 6px; font: 12px/16px var(--mono); color: var(--muted); overflow-wrap: anywhere; }
	.env { gap: 8px; }
	.env i { width: 6px; height: 6px; border-radius: 50%; background: var(--passed); }
	.env.ok i { background: var(--ok-dot); }
	.env.dead i { background: var(--bad-dot); }
	.body .tryit { max-width: 72ch; color: var(--ink2); white-space: pre-wrap; overflow-wrap: anywhere; }
	.body .sub { font-size: 13px; line-height: 20px; font-weight: 500; }
	.claims-head, .claim { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 3fr); gap: 4px 24px; padding: 12px 20px; }
	.claims-head { padding-bottom: 8px; font-size: 12px; line-height: 16px; color: var(--muted); }
	.claim { border-top: 1px solid var(--line); overflow-wrap: anywhere; }
	.proof { font: 12px/18px var(--mono); color: var(--ink2); white-space: pre-wrap; }
	.claims + .body { border-top: 1px solid var(--line); }
	@container (max-width: 640px) {
		.claims-head { display: none; }
		.claim { grid-template-columns: minmax(0, 1fr); }
	}
	dialog.view { width: 100vw; max-width: 100vw; height: 100dvh; max-height: 100dvh; margin: 0; padding: 0; border: 0; background: var(--bg); color: var(--ink); }
	dialog.view[open] { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; }
	.view-bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; min-height: 56px; padding: 8px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
	.view-bar strong { font-size: 15px; font-weight: 500; overflow-wrap: anywhere; }
	.view-stage { display: grid; place-items: center; min-height: 0; padding: 16px; }
	.view-stage img, .view-stage video { max-width: 100%; max-height: 100%; min-height: 0; border-radius: 8px; box-shadow: 0 0 0 1px var(--line2); background: var(--raised); object-fit: contain; }
	.view-note { max-width: 80ch; margin: 0 auto; padding: 0 16px 16px; text-align: center; color: var(--ink2); overflow-wrap: anywhere; }
	.view-note:empty { display: none; }

	/* Settings */
	.sgrid { display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 32px; align-items: start; margin-top: 24px; }
	.snav { position: sticky; top: 80px; display: grid; gap: 2px; }
	.snav-h { margin-top: 16px; padding: 0 12px 4px; font-size: 12px; line-height: 16px; color: var(--muted); }
	.snav button { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-width: 0; height: 36px; padding: 0 12px; border: 0; border-radius: 8px; background: transparent; color: var(--ink2); font: 14px/20px var(--sans); text-align: left; cursor: pointer; transition: background-color .15s var(--ease), color .15s var(--ease); }
	.snav button:hover, .snav button.on { background: var(--raised); color: var(--ink); }
	.snav button.on { font-weight: 500; box-shadow: inset 0 0 0 1px var(--line); }
	.snav button > span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
	.snav .where { flex: none; font-size: 12px; font-weight: 400; color: var(--muted); }
	.shead h2 { font-size: 18px; line-height: 24px; font-weight: 500; overflow-wrap: anywhere; }
	.shead p { max-width: 72ch; margin-top: 4px; color: var(--ink2); }
	.sgrid .panel, .sgrid .notice, .sgrid details { margin-top: 16px; }
	.choice { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
	.opt { display: flex; gap: 12px; padding: 16px; border: 1px solid var(--line2); border-radius: 10px; background: var(--panel); color: var(--ink); font: 14px/20px var(--sans); text-align: left; cursor: pointer; transition: border-color .15s var(--ease), background-color .15s var(--ease); }
	.opt:hover { background: var(--raised); }
	.opt.on { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); background: var(--panel); cursor: default; }
	.opt i { flex: none; width: 16px; height: 16px; margin-top: 2px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px var(--line2); }
	.opt.on i { box-shadow: inset 0 0 0 5px var(--ink); }
	.opt strong { display: block; font-weight: 500; }
	.opt span span { display: block; margin-top: 2px; font-size: 13px; color: var(--ink2); }
	.part { padding: 20px; border-top: 1px solid var(--line); }
	.part:first-child { border-top: 0; }
	.part > h2 { font-size: 14px; font-weight: 500; }
	.part > h2 + p { max-width: 72ch; margin-top: 2px; font-size: 13px; color: var(--ink2); }
	.part > h2 ~ div { margin-top: 16px; }
	.stages-head, .stage { display: grid; grid-template-columns: 200px repeat(3, minmax(0, 1fr)); gap: 8px 12px; align-items: start; }
	.stages-head { padding-bottom: 8px; font-size: 13px; color: var(--ink2); }
	.stage { padding: 16px 0; border-top: 1px solid var(--line); }
	.stage:last-child { padding-bottom: 0; }
	.stage .who { grid-row: span 2; padding-top: 8px; }
	.stage .who strong { display: block; font-weight: 500; text-transform: capitalize; }
	.stage .note { grid-column: 2 / -1; }
	.stage .note textarea { min-height: 56px; }
	.stage .flabel { display: none; }
	input:disabled, select:disabled, textarea:disabled { border-color: var(--line); background: var(--raised); color: var(--ink2); opacity: 1; resize: none; }
	.savebar { position: sticky; bottom: 0; display: flex; align-items: center; gap: 12px; padding: 12px 20px; border-top: 1px solid var(--line); border-radius: 0 0 11px 11px; background: var(--panel); }
	.savebar .state { font-size: 13px; color: var(--muted); }
	.foot { max-width: 72ch; margin-top: 32px; font-size: 13px; color: var(--muted); }
	.notice.quiet { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; background: var(--raised); color: var(--ink2); box-shadow: none; }
	@container (max-width: 1040px) {
		.stages-head { display: none; }
		.stage { grid-template-columns: repeat(3, minmax(0, 1fr)); }
		.stage .who { grid-column: 1 / -1; grid-row: auto; padding-top: 0; }
		.stage .note { grid-column: 1 / -1; }
		.stage .flabel { display: block; }
	}
	@container (max-width: 860px) {
		.sgrid { grid-template-columns: minmax(0, 1fr); gap: 24px; }
		.snav { position: static; }
	}
	@container (max-width: 560px) {
		.stage, .choice { grid-template-columns: minmax(0, 1fr); }
	}
	.narrow { max-width: 640px; }

	@media (max-width: 640px) {
		.wrap { padding: 0 16px; }
		.bar { flex-wrap: wrap; gap: 0 16px; }
		.brand, .right { min-height: 56px; }
		nav { order: 3; width: 100%; padding-bottom: 12px; margin-left: -12px; }
		main.wrap { padding-top: 24px; }
	}
</style>
</head>
<body>
<header class="top">
	<div class="wrap bar">
		<a class="brand" href="#/">
			<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 10h12" stroke="currentColor" stroke-width="1.5"/><circle cx="4" cy="10" r="3" fill="currentColor"/><circle cx="16" cy="10" r="2.25" fill="var(--panel)" stroke="currentColor" stroke-width="1.5"/></svg>
			Factory
		</a>
		<nav id="nav"></nav>
		<div class="right">
			<span class="live" id="live"><i></i><span>Offline</span></span>
			<a class="btn primary" href="#/new" id="new"></a>
		</div>
	</div>
</header>
<main class="wrap" id="main"></main>
<script>
const STAGES = ['research', 'plan', 'implement', 'review', 'land']
const ICONS = {
	plus: '<path d="M5 12h14"/><path d="M12 5v14"/>',
	back: '<path d="m12 19-7-7 7-7"/><path d="M19 12H5"/>',
	pr: '<circle cx="18" cy="18" r="3"/><circle cx="6" cy="6" r="3"/><path d="M13 6h3a2 2 0 0 1 2 2v7"/><path d="M6 9v12"/>',
	thread: '<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',
	source: '<path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>',
	play: '<path d="m7 4 13 8-13 8z"/>',
	prev: '<path d="m15 18-6-6 6-6"/>',
	next: '<path d="m9 18 6-6-6-6"/>',
	close: '<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
	out: '<path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>'
}
const main = document.getElementById('main')
let board = { issues: [], done: [], open: 0, needsYou: 0 }
let loaded = false
let settingsScope = 'global'
/** What the user typed and opened survives the redraw each live change causes. */
const drafts = new Map()
const opened = new Set()

function h(tag, attrs, ...children) {
	const el = document.createElement(tag)
	for (const [key, value] of Object.entries(attrs || {})) {
		if (value === undefined || value === null || value === false) continue
		if (key.startsWith('on')) el.addEventListener(key.slice(2), value)
		else if (key === 'class') el.className = value
		else el.setAttribute(key, value === true ? '' : value)
	}
	for (const child of children.flat(Infinity)) {
		if (child === null || child === undefined || child === false) continue
		el.append(child instanceof Node ? child : document.createTextNode(String(child)))
	}
	return el
}

/** replaceChildren turns null into the text "null", so empty parts are dropped first. */
function render(...nodes) {
	const active = document.activeElement
	const key = active && active.dataset ? active.dataset.draft : undefined
	const caret = key ? [active.selectionStart, active.selectionEnd] : null
	main.replaceChildren(...nodes.flat(Infinity).filter((n) => n !== null && n !== undefined && n !== false))
	const again = key && main.querySelector(`[data-draft="${CSS.escape(key)}"]`)
	if (again) {
		again.focus()
		again.setSelectionRange(caret[0], caret[1])
	}
}

function icon(name) {
	const el = h('span', { class: 'ic', 'aria-hidden': 'true' })
	el.innerHTML = `<svg viewBox="0 0 24 24">${ICONS[name]}</svg>`
	return el
}

const cap = (word) => (word ? word[0].toUpperCase() + word.slice(1) : '')
/** An outcome such as `not-a-bug`, as words. */
const outcomeName = (outcome) => cap(String(outcome || '').replaceAll('-', ' '))
const ago = (ms) => {
	if (!ms) return ''
	const s = Math.max(0, Math.round((Date.now() - ms) / 1000))
	if (s < 60) return `${s}s ago`
	if (s < 3600) return `${Math.round(s / 60)}m ago`
	if (s < 86400) return `${Math.round(s / 3600)}h ago`
	return `${Math.round(s / 86400)}d ago`
}
const span = (ms) => {
	const m = Math.max(0, Math.round(ms / 60000))
	if (m < 1) return 'under a minute'
	if (m < 60) return `${m} min`
	if (m < 1440) return `${Math.floor(m / 60)}h ${m % 60}m`
	return `${Math.round(m / 1440)}d`
}
const clock = (ms) => new Date(ms).toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' })
/** Times that count up are kept current by the ticker at the end of this script. */
const when = (ms) => h('time', { 'data-at': ms, title: clock(ms) }, ago(ms))
const since = (ms) => h('span', { 'data-since': ms }, span(Date.now() - ms))
const lasting = (ms) => h('span', {}, 'for ', since(ms))
const plain = (value) => (value && typeof value === 'object' ? Object.entries(value).map(([k, v]) => `${k} ${typeof v === 'object' ? JSON.stringify(v) : v}`).join(', ') : '')
const dotted = (...parts) => parts.filter((p) => p !== null && p !== undefined && p !== false && p !== '').flatMap((p, n) => (n ? [' · ', p] : [p]))
const isUrl = (url) => !!url && /^https?:\/\//.test(url)
const safeLink = (url, label) => (isUrl(url) ? h('a', { href: url, target: '_blank', rel: 'noreferrer' }, label) : null)
const out = (url, label, name, cls = 'btn sm', title) => (isUrl(url) ? h('a', { class: cls, href: url, target: '_blank', rel: 'noreferrer', title }, icon(name), label) : null)
const issueHref = (issue) => `#/issue/${encodeURIComponent(issue.id)}`
const short = (sha) => (sha ? sha.slice(0, 7) : '')
const sameCommit = (a, b) => !!a && !!b && (a.startsWith(b) || b.startsWith(a))
const count = (n, word) => `${n} ${word}${n === 1 ? '' : 's'}`
const chip = (text, kind) => h('span', { class: `chip${kind ? ` ${kind}` : ''}` }, text)
const field = (label, control, hint) => h('label', { class: 'field' }, h('span', { class: 'flabel' }, label), control, hint ? h('span', { class: 'fhint' }, hint) : null)
const fold = (key, summary, ...body) => h('details', { open: opened.has(key), ontoggle: (e) => (e.target.open ? opened.add(key) : opened.delete(key)) }, h('summary', {}, summary), ...body)

async function api(method, path, body) {
	const res = await fetch(path, { method, headers: { 'content-type': 'application/json' }, body: body === undefined ? undefined : JSON.stringify(body) })
	const json = await res.json().catch(() => ({ error: `HTTP ${res.status}` }))
	if (!res.ok) throw new Error(json.error || `HTTP ${res.status}`)
	return json
}

function route() {
	const hash = location.hash.replace(/^#\/?/, '')
	const [page, id] = hash.split('/')
	return { page: page || 'board', id: id && decodeURIComponent(id) }
}

function drawNav() {
	const { page } = route()
	const on = (name) => (page === name || (name === 'board' && page === 'issue') ? 'on' : '')
	document.getElementById('nav').replaceChildren(
		h('a', { href: '#/', class: on('board') }, 'Board', board.needsYou ? h('span', { class: 'count warn', title: `${board.needsYou} for you` }, board.needsYou) : null),
		h('a', { href: '#/done', class: on('done') }, 'Done'),
		h('a', { href: '#/settings', class: on('settings') }, 'Settings')
	)
	document.title = board.needsYou ? `(${board.needsYou}) Factory` : 'Factory'
}

/** One line for where an issue stands: who has to act, and since when. */
function statusOf(i) {
	if (i.state && i.state !== 'open') return { tone: 'idle', label: outcomeName(i.outcome || i.state) }
	if (i.threadGone) return { tone: 'bad', label: 'Thread gone', note: ['T3 Code cannot find its thread'] }
	if (i.stuck) return { tone: 'bad', label: 'Stuck', note: ['No report after being asked to go on'] }
	const open = (i.decisions || []).filter((d) => d.answer === null).length
	if (open) {
		const blocking = i.decisions.some((d) => d.answer === null && !d.provisional)
		return { tone: 'warn', label: open === 1 ? 'Needs your answer' : `Needs ${open} answers`, note: [blocking ? 'Paused until you answer' : 'Work goes on, the merge waits'] }
	}
	if (i.decisions && i.decisions.length) return { tone: 'warn', label: 'Answer not delivered' }
	const w = i.waiting
	if (w) {
		return {
			tone: w.overdue ? 'warn' : 'idle',
			label: `Waiting on ${w.on}${w.overdue ? ', overdue' : ''}`,
			note: dotted(w.who.length ? w.who.join(', ') : null, w.note, lasting(w.since)),
			alarm: w.safetyNet !== 'on' ? `Safety net ${w.safetyNet}` : null
		}
	}
	if (i.run) return { tone: 'live', label: 'Working', running: true, note: dotted(i.run.model, lasting(i.run.startedAt)) }
	return { tone: 'idle', label: i.ran && !i.ran.length ? 'Starting' : 'Between runs' }
}

function track(issue, status) {
	const closed = issue.state && issue.state !== 'open'
	const at = issue.outcome === 'shipped' ? STAGES.length : STAGES.indexOf(issue.stage)
	const ran = issue.ran || STAGES
	return h('div', { class: `track t-${status.tone}`, role: 'img', 'aria-label': closed ? outcomeName(issue.outcome) : `At ${issue.stage}` }, ...STAGES.map((stage, n) => {
		const state = n === at && !closed ? `now${status.running ? ' running' : ''}` : n <= at ? (ran.includes(stage) ? 'done' : 'skip') : ''
		return h('span', { class: `st ${state}`, title: cap(stage) }, h('i'))
	}))
}

/** `own` is set on the issue's own page, where naming the issue again would repeat the title. */
function decisionCard(issue, d, own = false) {
	const error = h('div', { class: 'error' })
	const words = h('textarea', { rows: 1, placeholder: 'Or answer in your own words', 'aria-label': 'Your answer', 'data-draft': d.id, oninput: () => drafts.set(d.id, words.value), onkeydown: (e) => { if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) sendOwn() } }, drafts.get(d.id) || '')
	const send = async (answer) => {
		for (const b of card.querySelectorAll('button')) b.disabled = true
		try {
			const result = await api('POST', `/api/decisions/${encodeURIComponent(d.id)}/answer`, { answer })
			drafts.delete(d.id)
			if (result.error) error.textContent = `Saved, but not delivered: ${result.error}`
		} catch (e) {
			error.textContent = e.message
			for (const b of card.querySelectorAll('button')) b.disabled = false
		}
	}
	const sendOwn = () => words.value.trim() && send(words.value.trim())
	const retry = async () => {
		try { await api('POST', `/api/issues/${encodeURIComponent(issue.id)}/deliver`, {}) } catch (e) { error.textContent = e.message }
	}
	const answered = d.answer !== null
	// A merge decision, and one about going on past the round budget, take only their two answers.
	const fixed = d.kind === 'merge' || d.round !== null
	const card = h('div', { class: 'need' },
		h('div', { class: 'need-top' },
			h('span', { class: 'kind' }, d.provisional ? 'Provisional' : cap(d.kind)),
			own ? null : h('a', { href: issueHref(issue) }, issue.title),
			own ? null : h('span', {}, issue.repo),
			!own && d.kind === 'merge' && issue.captures ? h('a', { href: issueHref(issue) }, `See what was built: ${count(issue.captures, 'capture')}`) : null,
			when(d.askedAt)
		),
		h('p', { class: 'question' }, d.question),
		d.provisional && !answered ? h('p', { class: 'meta' }, `The work went on with "${d.recommendation}". The merge waits for your answer.`) : null,
		d.body ? h('pre', {}, d.body) : null,
		answered
			? h('div', { class: 'answer' },
				h('p', {}, `Answered: ${d.answer}`),
				h('p', { class: 'meta' }, d.delivery === 'held' ? 'Held until the other questions are answered' : 'Not delivered to the thread yet'),
				d.delivery === 'failed' ? h('div', { class: 'row', style: 'margin-top:12px' }, h('button', { class: 'btn', onclick: retry }, 'Retry delivery')) : null)
			: fixed
				? [
					h('p', { class: 'meta' }, d.head ? `About commit ${d.head.slice(0, 7)}. Recommended: ${d.recommendation}` : `Recommended: ${d.recommendation}`),
					h('div', { class: 'row' }, ...d.options.map((o, n) => h('button', { class: `btn long${n === 0 ? ' primary' : ''}`, onclick: () => send(o) }, o)))
				]
				: [
					h('div', { class: 'row' },
						h('button', { class: 'btn long primary', onclick: () => send(d.recommendation) }, `Accept: ${d.recommendation}`),
						...(d.options || []).filter((o) => o !== d.recommendation).map((o) => h('button', { class: 'btn long', onclick: () => send(o) }, o))
					),
					h('div', { class: 'own' }, words, h('button', { class: 'btn', onclick: sendOwn }, 'Send'))
				],
		error
	)
	return card
}

function dropButton(issue, then) {
	const error = h('span', { class: 'error' })
	const button = h('button', { class: 'btn quiet', onclick: async () => {
		if (!confirm(`Drop "${issue.title}"? It closes as dropped, and its thread is told to stop.`)) return
		button.disabled = true
		try { await api('POST', `/api/issues/${encodeURIComponent(issue.id)}/drop`, {}); then && then() } catch (e) { error.textContent = e.message; button.disabled = false }
	} }, 'Drop')
	return [button, error]
}

function troubleCard(i) {
	const why = i.threadGone
		? ['Thread gone', 'T3 Code cannot find this thread any more. Drop the issue, or start it again.']
		: ['Stuck', 'Asked to go on with no report. Look at the thread.']
	return h('div', { class: 'need' },
		h('div', { class: 'need-top' }, h('span', { class: 'kind bad' }, why[0]), h('a', { href: issueHref(i) }, i.title), h('span', {}, i.repo), i.lastEvent ? when(i.lastEvent.at) : null),
		h('p', { class: 'question' }, why[1]),
		h('div', { class: 'row' }, out(i.threadLink, 'Open in T3 Code', 'thread', 'btn'), dropButton(i))
	)
}

function issueRow(i) {
	const s = statusOf(i)
	return h('div', { class: 'lrow' },
		h('div', { class: 'cell-main' },
			h('a', { class: 'title', href: issueHref(i) }, i.title),
			h('div', { class: 'meta' }, dotted(i.repo, i.kind, i.captures ? count(i.captures, 'capture') : null, i.preview === 'up' ? 'dev environment up' : null)),
			i.lastEvent ? h('div', { class: 'last' }, when(i.lastEvent.at), i.lastEvent.text) : null
		),
		h('div', { class: 'cell-track' }, track(i, s), h('span', { class: 'stage-name' }, cap(i.stage))),
		h('div', { class: `cell-status t-${s.tone}` },
			h('div', { class: 'slabel' }, s.label),
			s.note && s.note.length ? h('div', { class: 'snote' }, s.note) : null,
			s.alarm ? h('div', { class: 'snote bad' }, s.alarm) : null
		),
		h('div', { class: 'cell-act' }, out(i.prUrl, 'PR', 'pr'), out(i.threadLink, 'Thread', 'thread', 'btn sm', 'Open in T3 Code'))
	)
}

function drawBoard() {
	if (!loaded) return render()
	const waiting = board.issues.flatMap((issue) => issue.decisions.map((d) => [issue, d]))
	const trouble = board.issues.filter((i) => i.stuck || i.threadGone)
	const others = board.issues.filter((i) => i.waiting && !i.needsYou).length
	const stat = (label, value, cls, href) => h(href ? 'a' : 'div', { class: `stat${cls ? ` ${cls}` : ''}`, href }, h('div', { class: 'stat-l' }, label), h('div', { class: 'stat-n' }, value))
	const needs = waiting.length + trouble.length
	// Issues that wait for the user come first; the rest keep the order they came in.
	const rows = [...board.issues.filter((i) => i.needsYou), ...board.issues.filter((i) => !i.needsYou)]
	render(
		h('section', { class: 'panel stats', 'aria-label': 'Overview' },
			stat('Needs you', board.needsYou, board.needsYou ? 'warn' : ''),
			stat('Working', board.open - board.needsYou - others),
			stat('Waiting on others', others),
			stat('Shipped, last 30 days', board.done.filter((i) => i.outcome === 'shipped').length, '', '#/done')
		),
		needs ? h('section', { class: 'panel needs', style: 'margin-top:24px' },
			h('div', { class: 'lhead' }, h('h2', {}, 'Needs you')),
			...waiting.map(([issue, d]) => decisionCard(issue, d)),
			...trouble.map(troubleCard)
		) : null,
		h('section', { class: 'panel', style: 'margin-top:24px' },
			h('div', { class: 'lhead' },
				h('h2', {}, 'In work', h('span', { class: 'count' }, board.open)),
				rows.length ? h('div', { class: 'stations' }, ...STAGES.map((stage) => h('span', {}, cap(stage)))) : null,
				rows.length ? h('span', {}, 'Status') : null
			),
			rows.length ? rows.map(issueRow) : h('div', { class: 'empty', style: 'border-top:1px solid var(--line)' },
				h('p', {}, 'No issues in work'),
				h('p', {}, 'Start one here, or tell a T3 Code thread to work an issue with the factory skill'),
				h('a', { class: 'btn', href: '#/new' }, 'New issue')
			)
		)
	)
}

function drawDone() {
	if (!loaded) return render()
	render(
		h('h1', {}, 'Closed in the last 30 days'),
		h('section', { class: 'panel', style: 'margin-top:24px' }, board.done.length ? board.done.map((i) => h('div', { class: 'item' },
			h('div', { class: 'item-head' },
				h('a', { class: 'title', href: issueHref(i) }, i.title),
				chip(outcomeName(i.outcome), i.outcome === 'shipped' ? 'ok' : ''),
				i.deploy && i.deploy !== 'none' ? chip(`deploy ${i.deploy}`, i.deploy === 'verified' ? 'ok' : 'warn') : null,
				h('span', { class: 'end' }, out(i.prUrl, 'PR', 'pr'))
			),
			i.summary ? h('p', { style: 'max-width:80ch;color:var(--ink2)' }, i.summary) : null,
			h('div', { class: 'meta' }, dotted(i.repo, i.kind, when(i.closedAt)))
		)) : h('div', { class: 'empty' }, h('p', {}, 'Nothing closed yet')))
	)
}

function stationLine(issue, runs, status) {
	const closed = issue.state !== 'open'
	const at = issue.outcome === 'shipped' ? STAGES.length : STAGES.indexOf(issue.stage)
	return h('section', { class: `panel line t-${status.tone}`, 'aria-label': 'Stages' }, ...STAGES.map((stage, n) => {
		const mine = runs.filter((r) => r.stage === stage)
		const last = mine.at(-1)
		const now = n === at && !closed
		const state = now ? `now${status.running ? ' running' : ''}` : n <= at ? (mine.length ? 'done' : 'skip') : ''
		const sub = !last ? (n < at ? 'skipped' : '')
			: last.state === 'running' ? since(last.startedAt)
			: last.state === 'failed' ? 'failed'
			: span(last.endedAt - last.startedAt)
		return h('div', { class: `stn${now ? ' on' : ''}` },
			h('div', { class: `st ${state}` }, h('i')),
			h('div', { class: 'stn-name' }, cap(stage)),
			h('div', { class: `stn-sub${last && last.state === 'failed' ? ' bad' : ''}` }, dotted(sub, mine.length > 1 ? `${mine.length} runs` : null))
		)
	}))
}

function runRow(r) {
	const name = r.subject === 'plan' ? 'Plan review' : cap(r.stage)
	const state = r.state === 'running' ? chip('running', 'ok') : r.state === 'failed' ? chip('failed', 'bad') : chip('done')
	return h('div', { class: 'item' },
		h('div', { class: 'item-head' },
			h('strong', {}, name), state,
			r.model ? h('span', { class: 'mono muted' }, dotted(`${r.provider} / ${r.model}`, plain(r.options))) : null,
			h('span', { class: 'end num' }, dotted(clock(r.startedAt), r.endedAt ? span(r.endedAt - r.startedAt) : null, r.head ? `head ${r.head.slice(0, 7)}` : null))
		),
		r.summary ? h('p', {}, r.summary) : null,
		r.result ? fold(`run:${r.id}`, `Result: ${r.result.outcome}`, h('pre', {}, JSON.stringify(r.result, null, 2))) : null,
		r.resultMissing ? h('div', { class: 'meta' }, cap(r.resultMissing)) : null
	)
}

async function drawIssue(id) {
	let data
	try { data = await api('GET', `/api/issues/${encodeURIComponent(id)}`) } catch (e) { render(h('p', { class: 'error' }, e.message)); return }
	if (route().id !== id) return
	const i = data.issue
	const pending = data.decisions.filter((d) => d.answer === null || (d.answeredVia === 'page' && d.delivery !== 'sent'))
	const status = statusOf({ ...i, decisions: pending, waiting: data.waiting, run: data.runs.findLast((r) => r.state === 'running') })
	const section = (title, count, ...body) => [h('div', { class: 'sec' }, h('h2', {}, title), count ? h('span', { class: 'count' }, count) : null), ...body]
	const result = (stage, subject = null) => data.runs.findLast((r) => r.stage === stage && r.subject === subject && r.result?.outcome === 'done')?.result.result
	const built = result('implement')
	const shots = data.evidence || []
	if (data.preview?.state === 'up') probe(id)
	else probes.delete(id)
	render(
		h('a', { class: 'back', href: i.state === 'open' ? '#/' : '#/done' }, icon('back'), i.state === 'open' ? 'Board' : 'Done'),
		h('div', { class: 'ititle' },
			h('h1', {}, i.title),
			h('div', { class: 'row' },
				out(i.prUrl, 'PR', 'pr', 'btn'), out(i.threadLink, 'Open in T3 Code', 'thread', 'btn'), out(i.source, 'Source', 'source', 'btn'),
				i.state === 'open' ? dropButton(i, () => draw()) : null
			)
		),
		h('div', { class: `imeta t-${status.tone}` },
			h('span', { class: 'slabel' }, status.label),
			status.note && status.note.length ? h('span', {}, status.note) : null,
			h('span', {}, dotted(i.repo, i.kind, i.source && !isUrl(i.source) ? i.source : null, h('span', {}, 'started ', when(i.createdAt))))
		),
		stationLine(i, data.runs, status),
		i.configError ? h('p', { class: 'notice bad' }, i.configError) : null,
		i.threadGone ? h('p', { class: 'notice bad' }, 'T3 Code cannot find this thread any more.') : null,
		status.alarm ? h('p', { class: 'notice bad' }, status.alarm) : null,
		...(data.warnings || []).map((w) => h('p', { class: 'notice' }, w)),
		pending.length ? h('section', { class: 'panel needs', style: 'margin-top:24px' },
			h('div', { class: 'lhead' }, h('h2', {}, 'Needs you')),
			...pending.map((d) => decisionCard(i, d, true))
		) : null,
		h('div', { class: 'igrid' },
			h('div', {},
				data.report ? section('Closing report', null, h('pre', {}, data.report)) : null,
				shots.length || built?.media ? section('What it looks like', shots.length, gallery(shots, built?.media, data.pr?.head)) : null,
				(i.state === 'open' && (built || data.preview)) || data.preview?.state === 'up' ? section('Try it', null, previewPanel(i, data.preview, built?.tryIt, data.pr?.head)) : null,
				built ? section('What was built', null, builtPanel(built, result('review', 'pr'))) : null,
				data.pr ? section('Pull request', `#${data.pr.number}`, prPanel(data)) : null,
				data.items?.length ? section('Review on GitHub', data.items.length, reviewItems(data.items)) : null,
				data.findings?.length ? section('Internal review findings', data.findings.length, findingsList(data.findings)) : null,
				section('Runs', data.runs.length, data.runs.length ? h('div', { class: 'panel' }, ...data.runs.map(runRow)) : h('p', { class: 'muted' }, 'No runs yet')),
				data.decisions.length ? section('Decisions', data.decisions.length, h('div', { class: 'panel' }, ...data.decisions.map((d) => h('div', { class: 'item' },
					h('div', { class: 'item-head' }, chip(d.provisional ? `${d.kind}, provisional` : d.kind), h('span', { class: 'end' }, when(d.askedAt))),
					h('p', {}, d.question),
					h('p', { class: 'meta' }, d.answer === null ? `Recommended: ${d.recommendation}` : `Answer (${d.answeredVia}): ${d.answer}`)
				)))) : null,
				section('The issue as taken in', null, h('pre', {}, data.body || '(no text)'))
			),
			h('div', {}, section('Timeline', null, h('div', { class: 'tl' }, ...data.events.slice().reverse().map((e) => h('div', {}, cap(e.text), h('time', {}, clock(e.at)))))))

/** The viewer sits outside <main>, so a live redraw never closes it or restarts a video. */
const viewer = { el: null, items: [], at: 0 }
function showViewer() {
	const item = viewer.items[viewer.at]
	const many = viewer.items.length > 1
	const step = (by) => () => { viewer.at = (viewer.at + by + viewer.items.length) % viewer.items.length; showViewer() }
	const stage = item.kind === 'video'
		? h('video', { src: item.url, poster: item.poster, controls: true, autoplay: true, playsinline: true })
		: h('img', { src: item.url, alt: item.label ? `${cap(item.label)}: ${item.title}` : item.title })
	viewer.el.replaceChildren(
		h('div', { class: 'view-bar' },
			h('div', { class: 'row' }, h('strong', {}, item.title), item.label ? chip(cap(item.label)) : null, many ? h('span', { class: 'num' }, `${viewer.at + 1} / ${viewer.items.length}`) : null),
			h('div', { class: 'row' },
				many ? h('button', { class: 'btn sm', onclick: step(-1), title: 'Previous (left arrow)', 'aria-label': 'Previous' }, icon('prev')) : null,
				many ? h('button', { class: 'btn sm', onclick: step(1), title: 'Next (right arrow)', 'aria-label': 'Next' }, icon('next')) : null,
				out(new URL(item.url, location.href).href, 'Original', 'out'),
				h('button', { class: 'btn sm', onclick: () => viewer.el.close(), 'aria-label': 'Close' }, icon('close'), 'Close')
			)
		),
		h('div', { class: 'view-stage' }, stage),
		h('p', { class: 'view-note' }, item.note || '')
	)
}
function openViewer(items, at) {
	if (!viewer.el) {
		viewer.el = h('dialog', { class: 'view', 'aria-label': 'Capture', onkeydown: (e) => {
			if (viewer.items.length < 2 || (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight')) return
			// The arrows scrub a video that has the focus; they change capture everywhere else.
			if (e.target.tagName === 'VIDEO') return
			viewer.at = (viewer.at + (e.key === 'ArrowLeft' ? -1 : 1) + viewer.items.length) % viewer.items.length
			showViewer()
		}, onclose: () => viewer.el.replaceChildren() })
		document.body.append(viewer.el)
	}
	viewer.items = items
	viewer.at = at
	showViewer()
	viewer.el.showModal()
}

/** Captures under one title sit together; a before and an after sit side by side. */
function gallery(shots, why, prHead) {
	if (!shots.length) return h('div', { class: 'panel body' }, h('p', { class: 'tryit' }, why))
	// Before comes first, so the arrows in the viewer flip between the two.
	const rank = { before: 0, after: 1 }
	const titles = [...new Set(shots.map((s) => s.title))]
	const ordered = titles.flatMap((title) => shots.filter((s) => s.title === title).sort((a, b) => (rank[a.label] ?? 2) - (rank[b.label] ?? 2)))
	const tile = (shot) => {
		const still = shot.kind === 'video' ? shot.poster : shot.url
		const name = `${shot.label ? `${cap(shot.label)}: ` : ''}${shot.title}`
		return h('div', {},
			h('button', { class: 'shot', onclick: () => openViewer(ordered, ordered.indexOf(shot)), 'aria-label': `${shot.kind === 'video' ? 'Play' : 'Open'} ${name}` },
				still ? h('img', { src: still, alt: name, loading: 'lazy' }) : h('div', { class: 'blank' }, 'Video'),
				shot.label ? h('span', { class: 'tag' }, cap(shot.label)) : null,
				shot.kind === 'video' ? h('span', { class: 'play', 'aria-hidden': 'true' }, icon('play').firstChild) : null
			),
			h('div', { class: 'shot-meta' }, dotted(
				shot.kind === 'video' ? 'video' : null,
				shot.head ? `at ${short(shot.head)}${prHead && !sameCommit(shot.head, prHead) ? ', before the PR\'s last commit' : ''}` : null,
				shot.github ? 'on GitHub' : 'on this page only'
			))
		)
	}
	return h('div', { class: 'panel shots' }, ...titles.map((title) => {
		const mine = ordered.filter((s) => s.title === title)
		const notes = [...new Set(mine.map((s) => s.note).filter(Boolean))]
		const pair = mine.length === 2 && mine[0].label === 'before' && mine[1].label === 'after'
		return h('div', {}, h('h3', {}, title), notes.length ? h('p', {}, notes.join(' ')) : null, h('div', { class: `shot-row${pair ? ' pair' : ''}` }, ...mine.map(tile)))
	}))
}

/** Whether each address of a running dev environment answers, asked at most every 30 seconds. */
const probes = new Map()
async function probe(id) {
	const last = probes.get(id)
	if (last && Date.now() - last.at < 30000) return
	probes.set(id, { at: Date.now(), ok: last ? last.ok : new Map() })
	try {
		const { urls } = await api('GET', `/api/issues/${encodeURIComponent(id)}/preview`)
		const changed = !last || urls.some((u) => last.ok.get(u.url) !== u.ok)
		probes.set(id, { at: Date.now(), ok: new Map(urls.map((u) => [u.url, u.ok])) })
		if (changed && route().id === id) draw()
	} catch {}
}

/** The dev environment runs in the issue's own checkout, so its thread starts and stops it when asked here. */
function previewPanel(i, preview, tryIt, prHead) {
	const error = h('p', { class: 'error' })
	const ask = (action) => async (e) => {
		e.target.disabled = true
		error.textContent = ''
		try { await api('POST', `/api/issues/${encodeURIComponent(i.id)}/preview`, { action }) } catch (err) { error.textContent = err.message; e.target.disabled = false }
	}
	// A closed issue's thread no longer works on it, so there is nobody to ask.
	const live = i.state === 'open' && !i.threadGone
	const start = (label) => live ? h('button', { class: 'btn primary', onclick: ask('start') }, label) : null
	const thread = out(i.threadLink, 'Open the thread', 'thread', 'btn')
	const state = preview ? preview.state : 'down'
	const seen = probes.get(i.id)?.ok
	const links = (preview?.urls || []).filter((u) => isUrl(u.url))
	let parts
	if (state === 'up') {
		const dead = !!seen && links.length > 0 && links.every((u) => seen.get(u.url) === false)
		const moved = prHead && preview.head && !sameCommit(preview.head, prHead)
		parts = [
			h('div', { class: 'row' },
				...links.map((u, n) => h('a', { class: `btn env${n === 0 && !dead ? ' primary' : ''}${seen?.get(u.url) === true ? ' ok' : seen?.get(u.url) === false ? ' dead' : ''}`, href: u.url, target: '_blank', rel: 'noreferrer', title: seen?.get(u.url) === false ? 'Nothing answers here' : u.url }, h('i'), `Open ${u.name}`)),
				dead ? start('Start it again') : live ? h('button', { class: 'btn quiet', onclick: ask('stop') }, 'Stop') : null
			),
			h('p', { class: 'meta' }, dead
				? 'Nothing answers at these addresses any more. It was probably stopped.'
				: dotted('Running', preview.head ? `on ${short(preview.head)}` : null, moved ? `the PR has moved to ${short(prHead)} since` : null, h('span', {}, 'started ', when(preview.at)))),
			preview.error ? fold(`preview:${i.id}`, 'Not every app came up', h('pre', {}, preview.error)) : null
		]
	} else if (state === 'requested') {
		parts = [h('div', { class: 'row' }, h('button', { class: 'btn primary', disabled: true }, 'Starting'), thread), h('p', { class: 'meta' }, 'The thread was asked to start it ', when(preview.at), '. The links show here when it is up.')]
	} else if (state === 'stopping') {
		parts = [h('div', { class: 'row' }, h('button', { class: 'btn', disabled: true }, 'Stopping'), thread), h('p', { class: 'meta' }, 'The thread was asked to stop it ', when(preview.at), '.')]
	} else if (state === 'failed') {
		parts = [h('div', { class: 'row' }, start('Try again'), thread), h('p', { class: 'notice bad', style: 'margin-top:0' }, 'It did not start.'), preview.error ? h('pre', {}, preview.error) : null]
	} else {
		parts = [h('div', { class: 'row' }, start('Start the dev environment')), h('p', { class: 'meta' }, i.threadGone ? 'T3 Code cannot find the thread that would start it.' : 'The issue\'s thread starts it in its own checkout, on the branch of the PR. It takes a minute or two.')]
	}
	return h('div', { class: 'panel body' }, ...parts, error, tryIt ? h('p', { class: 'tryit' }, tryIt) : null)
}

/** What the implementer says it proved, and what the reviewer model says to look at. */
function builtPanel(built, reviewed) {
	const list = (title, rows) => rows && rows.length ? h('div', {}, h('h3', { class: 'sub' }, title), h('ul', { class: 'plain' }, ...rows.map((r) => h('li', {}, r)))) : null

	const open = (built.decisions || []).slice().sort((a, b) => order.indexOf(a.confidence) - order.indexOf(b.confidence)).map((d) => `${d.decision} (${d.confidence} confidence)`)
	const risk = reviewed?.risk
	const rest = [
		risk ? h('div', { class: 'row' }, chip(`${risk.door} door`, risk.door === 'one-way' ? 'warn' : ''), chip(`reaches the ${risk.reach}`, risk.reach === 'data' || risk.reach === 'app' ? 'warn' : '')) : null,
		list('Where to look first', risk?.focus),
		list('Not checked', built.notChecked),
		list('Decided without you, least sure first', open),
		list('Changed beyond what was asked', risk?.unrelated)

	return h('div', { class: 'panel' },

/** Each stage with what it does, and what its note is for. The orchestrator has a model and no note; land a note and no model. */
const STAGE_ROWS = [
	['orchestrator', 'The thread that owns the issue. It runs the stages and lands the PR', null],
	['research', 'Reproduces the issue, sizes it and routes it', 'What to start or set up before reproducing'],
	['plan', 'Plans a change that is too big to build directly', 'What a plan in this project must cover'],
	['implement', 'Makes the change and opens the PR', 'Commands to run, files never to touch'],
	['review', 'Reviews the plan and the PR', 'What to look at closely in this project'],
	['land', 'The merge and the deploy check, done by the orchestrator', 'How this project deploys and how to check it']
]
const getPath = (obj, path) => path.split('.').reduce((v, k) => (v == null ? v : v[k]), obj)
const optionsText = (options) => (options ? Object.entries(options).map(([key, value]) => `${key}: ${value}`).join(', ') : '')
/** Options as people write them, `effort: high, fast: true`. JSON is taken too. */
function parseOptions(text) {
	if (text.startsWith('{')) return JSON.parse(text)
	const options = {}
	for (const part of text.split(',')) {
		const pair = part.match(/^\s*([\w.-]+)\s*[:=]\s*(.+?)\s*$/)
		if (!pair) throw new Error(`Options: write them as "effort: high", not "${part.trim()}"`)
		options[pair[1]] = pair[2] === 'true' ? true : pair[2] === 'false' ? false : pair[2]
	}
	return options
}

/** A fallback target as one line: "codex/gpt-6-astra, reasoningEffort: high". */
function fallbackText(target) {
	if (!target?.model) return ''
	const options = optionsText(target.options)
	return `${target.provider}/${target.model}${options ? `, ${options}` : ''}`
}

function parseFallback(text) {
	const [first, ...rest] = text.split(',')
	const slash = first.indexOf('/')
	if (slash < 1 || slash === first.trim().length - 1) throw new Error(`Fallback: write it as "provider/model", not "${first.trim()}"`)
	const target = { provider: first.slice(0, slash).trim(), model: first.slice(slash + 1).trim() }
	if (rest.join(',').trim()) target.options = parseOptions(rest.join(',').trim())
	return target
}

let settingsDirty = false
/** The scope that was just saved, and values copied in from a project's file that are not saved yet. */
let settingsSaved = null
let settingsSeed = null

async function drawSettings() {
	let data
	try { data = await api('GET', '/api/settings') } catch (e) { render(h('p', { class: 'error' }, e.message)); return }
	if (route().page !== 'settings') return
	const projects = Object.entries(data.repos)
	if (settingsScope !== 'global' && !data.repos[settingsScope.slice('repo:'.length)]) settingsScope = 'global'
	const scope = settingsScope
	const name = scope === 'global' ? null : scope.slice('repo:'.length)
	if (settingsSeed && settingsSeed.scope !== scope) settingsSeed = null
	settingsDirty = !!settingsSeed
	const pick = (key) => {
		if (key === settingsScope || (settingsDirty && !confirm('Discard the changes you have not saved?'))) return
		settingsScope = key
		settingsSeed = settingsSaved = null
		drawSettings()
	}
	const item = (key, label, where) => h('button', { class: key === scope ? 'on' : '', 'aria-current': key === scope ? 'page' : undefined, onclick: () => pick(key) }, h('span', {}, label), where ? h('span', { class: 'where' }, where) : null)
	// Providers and models already in use anywhere, offered as suggestions while typing.
	const seen = { provider: new Set(), model: new Set() }
	for (const settings of [data.defaults, ...projects.map(([, r]) => r.resolved.settings)]) {
		for (const target of [settings.orchestrator, ...Object.values(settings.stages)]) {
			if (target.provider) seen.provider.add(target.provider)
			if (target.model) seen.model.add(target.model)
		}
	}
	render(
		h('h1', {}, 'Settings'),
		h('p', { class: 'lede' }, 'Every project starts from the settings for all projects and changes what it sets itself. A running issue keeps the settings it started with.'),
		h('div', { class: 'sgrid' },
			h('div', { class: 'snav', role: 'navigation', 'aria-label': 'Settings for' },
				item('global', 'All projects'),
				h('div', { class: 'snav-h' }, projects.length ? 'Projects' : 'A project shows here once the factory has worked an issue in it'),
				...projects.map(([repo, r]) => item(`repo:${repo}`, repo, r.store === 'file' ? 'repository' : 'this machine'))
			),
			h('div', {}, name ? projectSettings(scope, name, data.repos[name]) : [
				h('div', { class: 'shead' }, h('h2', {}, 'All projects'), h('p', {}, 'What a project uses for everything it does not set itself. Kept on this machine')),
				settingsEditor(scope, data.global, { settings: data.defaults, sources: null })
			]),
			...['provider', 'model'].map((kind) => h('datalist', { id: `seen-${kind}` }, ...[...seen[kind]].sort().map((value) => h('option', { value }))))
		),
		h('p', { class: 'foot' }, 'Anyone who can open this page can change these settings, start threads and answer decisions. There is no sign-in: keep the tailnet to people you trust.')
	)
}

/** A project's settings live in one place: its factory.config.yaml, or this machine. The other is left out whole. */
function projectSettings(scope, name, repo) {
	const ref = repo.branch || 'the default branch'
	const error = h('p', { class: 'error', style: 'margin-top:12px' })
	const choose = async (store) => {
		if (store === repo.store || (settingsDirty && !confirm('Discard the changes you have not saved?'))) return
		try {
			await api('PUT', `/api/stores/${encodeURIComponent(name)}`, { store })
			settingsSeed = settingsSaved = null
			drawSettings()
		} catch (e) { error.textContent = e.message }
	}
	const option = (store, title, text) => h('button', { class: `opt${repo.store === store ? ' on' : ''}`, role: 'radio', 'aria-checked': repo.store === store ? 'true' : 'false', onclick: () => choose(store) }, h('i'), h('span', {}, h('strong', {}, title), h('span', {}, text)))
	const local = Object.keys(repo.page).length > 0
	const copyIn = () => {
		if (local && !confirm('Replace what this machine holds for the project with the values in the file? Nothing is saved until you press Save.')) return
		settingsSeed = { scope, layer: repo.file }
		drawSettings()
	}
	const body = repo.store === 'machine'
		? [
			repo.file ? h('div', { class: 'notice quiet' }, h('span', {}, 'The repository has a factory.config.yaml. It is not read while the settings are kept here.'), h('button', { class: 'btn', onclick: copyIn }, 'Copy its values in')) : null,
			settingsEditor(scope, settingsSeed ? settingsSeed.layer : repo.page, repo.resolved),
			repo.yaml ? fold(`yaml:${scope}`, 'The saved settings as a factory.config.yaml', h('pre', {}, repo.yaml)) : null
		]
		: repo.fileError
			? h('p', { class: 'notice bad' }, `${repo.fileError}. The file is left out whole, so the project runs on the settings for all projects until it is fixed on ${ref}.`)
			: !repo.file
				? h('section', { class: 'panel' }, h('div', { class: 'part' },
					h('h2', {}, `No factory.config.yaml on ${ref}`),
					h('p', {}, `Until one is merged, this project runs on the settings for all projects.${repo.yaml ? ' This is what this machine holds for it, as a file to commit:' : ''}`),
					repo.yaml ? h('pre', { style: 'margin-top:16px' }, repo.yaml) : null
				))
				: [
					local ? h('p', { class: 'notice quiet' }, 'This machine also holds settings for this project. They are not used while the project reads its file.') : null,
					settingsEditor(scope, repo.file, repo.resolved, `Read from factory.config.yaml on ${ref}. To change a value, change the file and merge it.`)
				]
	return [
		h('div', { class: 'shead' }, h('h2', {}, name), h('p', {}, 'Where this project keeps its own settings')),
		h('div', { class: 'choice', role: 'radiogroup', 'aria-label': 'Where this project keeps its settings', style: 'margin-top:16px' },
			option('machine', 'On this machine', 'Kept by the factory here. Nothing goes into the repository'),
			option('file', 'In the repository', `Read from factory.config.yaml on ${ref}. A change counts once it is merged`)
		),
		error,
		body
	]
}

/** The form for one layer. With `locked` (the reason it cannot be edited here) every field is read-only. */
function settingsEditor(scope, layer, resolved, locked) {
	const draft = JSON.parse(JSON.stringify(layer || {}))
	const error = h('span', { class: 'error' })
	const fields = []
	const off = locked ? true : undefined
	// Only a value that comes from the settings for all projects is worth naming: a default is the default, and the rest is this layer.
	const shared = (key) => resolved.sources?.[key] === 'global'
	const inherit = scope === 'global' ? 'Default' : 'Inherit'
	const stageRow = ([name, about, noteHint]) => {
		const key = name === 'orchestrator' ? name : `stages.${name}`
		const cells = []
		if (name !== 'land') {
			const current = getPath(draft, key) || {}
			const shown = getPath(resolved.settings, key)
			const provider = h('input', { value: current.provider || '', placeholder: shown?.provider || '', 'aria-label': `${name} provider`, list: 'seen-provider', disabled: off })
			const model = h('input', { value: current.model || '', placeholder: shown?.model || '', 'aria-label': `${name} model`, list: 'seen-model', disabled: off })
			const opts = h('input', { value: optionsText(current.options), placeholder: optionsText(shown?.options), 'aria-label': `${name} options`, disabled: off })
			// Where the stage runs when its own provider refuses the run, written as "provider/model, effort: high".
			const fallback = name === 'orchestrator' ? null : h('input', { value: fallbackText(current.fallback), placeholder: fallbackText(shown?.fallback) || 'Fallback when the provider refuses the run, as provider/model, effort: high', 'aria-label': `${name} fallback`, disabled: off })
			fields.push(() => {
				const parent = name === 'orchestrator' ? draft : (draft.stages = draft.stages || {})
				const note = parent[name]?.note
				const next = {}
				if (provider.value.trim() || model.value.trim()) {
					next.provider = provider.value.trim()
					next.model = model.value.trim()
					if (opts.value.trim()) next.options = parseOptions(opts.value.trim())
				}
				if (fallback?.value.trim()) next.fallback = parseFallback(fallback.value.trim())
				if (note !== undefined) next.note = note
				if (Object.keys(next).length) parent[name] = next
				else delete parent[name]
			})
			const cell = (label, input) => h('div', {}, h('span', { class: 'flabel' }, label), input)
			cells.push(cell('Provider', provider), cell('Model', model), cell('Options', opts))
			// Its own row, like the note: the three columns above are the stage's own target.
			if (fallback) cells.push(h('div', { class: 'note' }, h('span', { class: 'flabel' }, 'Fallback'), fallback))
		}
		if (name !== 'orchestrator') {
			const inherited = resolved.settings.stages[name].note
			const area = h('textarea', { placeholder: inherited || noteHint, 'aria-label': `${name} note`, disabled: off }, getPath(draft, `${key}.note`) || '')
			fields.push(() => {
				draft.stages = draft.stages || {}
				const value = area.value.trim()
				if (value) draft.stages[name] = { ...(draft.stages[name] || {}), note: value }
				else if (draft.stages[name]) { delete draft.stages[name].note; if (!Object.keys(draft.stages[name]).length) delete draft.stages[name] }
			})
			cells.push(h('div', { class: 'note' }, h('span', { class: 'flabel' }, 'Note'), area, shared(`${key}.note`) ? h('span', { class: 'fhint' }, 'Note from all projects') : null))
		}
		return h('div', { class: 'stage' },
			h('div', { class: 'who' }, h('strong', {}, name), h('span', { class: 'fhint' }, about), name !== 'land' && shared(key) ? h('span', { class: 'fhint' }, 'Model from all projects') : null),
			...cells
		)
	}
	const choice = (key, values) => h('select', { disabled: off }, h('option', { value: '' }, `${inherit} (${resolved.settings[key]})`), ...values.map((v) => h('option', { value: v, selected: draft[key] === v }, v)))
	const number = (key, min, max) => h('input', { type: 'number', min, max, value: draft[key] ?? '', placeholder: String(resolved.settings[key]), disabled: off })
	const approval = choice('planApproval', ['auto', 'always', 'never'])
	const rounds = number('reviewRounds', 0, 5)
	const rulings = h('textarea', { placeholder: resolved.settings.rulings || 'One rule per line, such as: public API fields are never renamed', disabled: off }, draft.rulings || '')
	const reviewApproval = choice('approval', ['auto', 'required', 'off'])
	const merge = choice('merge', ['auto', 'ask', 'never'])
	const overdue = number('reviewOverdueHours', 1, 720)
	const lists = Object.fromEntries(['reviewers', 'bots', 'trust', 'ignore'].map((key) => [key, h('input', { value: (draft[key] || []).join(', '), placeholder: resolved.settings[key]?.join(', ') || 'None', disabled: off })]))
	fields.push(() => {
		if (approval.value) draft.planApproval = approval.value; else delete draft.planApproval
		if (rounds.value !== '') draft.reviewRounds = Number(rounds.value); else delete draft.reviewRounds
		if (rulings.value.trim()) draft.rulings = rulings.value.trim(); else delete draft.rulings
		if (reviewApproval.value) draft.approval = reviewApproval.value; else delete draft.approval
		if (merge.value) draft.merge = merge.value; else delete draft.merge
		if (overdue.value !== '') draft.reviewOverdueHours = Number(overdue.value); else delete draft.reviewOverdueHours
		for (const [key, input] of Object.entries(lists)) {
			const values = input.value.split(',').map((v) => v.trim()).filter(Boolean)
			if (values.length) draft[key] = values; else delete draft[key]
		}
	})
	const listField = {
		reviewers: ['Reviewers', 'Logins or org/team to request a review from'],
		bots: ['Review bots', 'Bots whose review the merge waits for'],
		trust: ['Trusted logins', 'People outside the repository whose comments count'],
		ignore: ['Ignored logins', 'Never acted on, such as a noisy bot']
	}
	const state = h('span', { class: 'state' }, settingsDirty ? 'Changes not saved' : settingsSaved === scope ? 'Saved' : '')
	const saveButton = h('button', { class: 'btn primary', disabled: !settingsDirty }, 'Save')
	saveButton.addEventListener('click', async () => {
		error.textContent = ''
		try {
			for (const f of fields) f()
			if (draft.stages && !Object.keys(draft.stages).length) delete draft.stages
			await api('PUT', `/api/settings/${encodeURIComponent(scope)}`, draft)
			settingsSeed = null
			settingsSaved = scope
			drawSettings()
		} catch (e) { error.textContent = e.message }
	})
	const part = (title, about, ...body) => h('div', { class: 'part' }, h('h2', {}, title), about ? h('p', {}, about) : null, ...body)
	const form = h('section', { class: 'panel' },
		part('Stages', locked || 'The model each stage runs on, and a note that goes into its brief. A stage without a model runs on the orchestrator\'s. Leave a field empty to inherit what it shows.', h('div', {},
			h('div', { class: 'stages-head' }, h('span', {}), h('span', {}, 'Provider'), h('span', {}, 'Model'), h('span', {}, 'Options')),
			...STAGE_ROWS.map(stageRow)
		)),
		part('Plan and review', null, h('div', { class: 'stack' },
			h('div', { class: 'fields' },
				field('Plan approval', approval, 'auto asks you about a feature, a large change or a one-way door'),
				field('Review rounds', rounds, 'Rounds on a PR before the merge becomes your decision. 0 skips the review')
			),
			field('Rulings', rulings, 'Standing rules that go into every brief')
		)),
		part('Review on GitHub', null, h('div', { class: 'stack' },
			h('div', { class: 'fields' },
				field('Approval', reviewApproval, 'auto waits for an approval when the branch rules or the reviewers call for one'),
				field('Who merges', merge, 'auto merges when the gate is ready, ask makes it your decision, never leaves it to people'),
				field('Review overdue after', overdue, 'Hours a wait for a review lasts before it shows as overdue')
			),
			h('div', { class: 'fields' }, ...Object.entries(lists).map(([key, input]) => field(listField[key][0], input, `${listField[key][1]}. Comma-separated${shared(key) ? ', from all projects' : ''}`)))
		)),
		locked ? null : h('div', { class: 'savebar' }, saveButton, state, error)
	)
	form.addEventListener('input', () => {
		settingsDirty = true
		settingsSaved = null
		saveButton.disabled = false
		state.textContent = 'Changes not saved'
	})
	return form
}

async function drawNew() {
	if (!loaded) return render()
	const repos = [...new Set([...board.issues, ...board.done].map((i) => i.repo))].sort()
	const error = h('span', { class: 'error' })
	const repo = h('select', {}, ...repos.map((r) => h('option', { value: r }, r)))
	const title = h('input', { placeholder: 'What should be fixed or built' })
	const source = h('input', { placeholder: 'https://github.com/owner/repo/issues/12' })
	const body = h('textarea', { style: 'min-height:136px' })
	const start = async (e) => {
		e.target.disabled = true
		error.textContent = ''
		try {
			const result = await api('POST', '/api/threads', { repo: repo.value, title: title.value, body: body.value, source: source.value || undefined })
			if (result.duplicateOf) error.textContent = `Already open: ${result.duplicateOf.title}`
			else if (result.closed) error.textContent = 'The factory already closed this item. Start it from a thread with --again to reopen it.'
			else location.hash = `#/issue/${encodeURIComponent(result.issue)}`
		} catch (err) { error.textContent = err.message }
		e.target.disabled = false
	}
	render(
		h('h1', {}, 'New issue'),
		repos.length
			? h('section', { class: 'panel narrow', style: 'margin-top:24px' }, h('div', { class: 'part stack' },
				field('Repository', repo), field('Title', title), field('Source', source, 'Optional: the issue, error or feedback item this comes from'), field('Details', body),
				h('div', { class: 'row' }, h('button', { class: 'btn primary', onclick: start }, 'Start a thread'), error)
			))
			: h('p', { class: 'lede' }, 'The factory starts threads in repositories it has seen. Start one issue from a T3 Code thread in the repository first.')
	)
}

async function refreshBoard() {
	try { board = await api('GET', '/api/board'); loaded = true } catch { return }
	drawNav()
}

async function draw() {
	drawNav()
	const { page, id } = route()
	if (page === 'issue' && id) return drawIssue(id)
	if (page === 'settings') return drawSettings()
	if (page === 'new') return drawNew()
	if (page === 'done') return drawDone()
	drawBoard()
}

let timer
function connect() {
	const live = document.getElementById('live')
	const set = (text, up) => { live.lastElementChild.textContent = text; live.classList.toggle('up', up) }
	const source = new EventSource('/api/stream')
	source.onopen = () => set('Live', true)
	source.onerror = () => set('Reconnecting', false)
	source.addEventListener('change', (e) => {
		let data = {}
		try { data = JSON.parse(e.data) } catch {}
		clearTimeout(timer)
		timer = setTimeout(async () => {
			await refreshBoard()
			const { page, id } = route()
			if (page === 'board' || page === 'done' || (page === 'issue' && id === data.issue) || (page === 'settings' && data.issue === null && !settingsDirty)) draw()
		}, 150)
	})
}

setInterval(() => {
	for (const el of document.querySelectorAll('[data-at]')) el.textContent = ago(Number(el.dataset.at))
	for (const el of document.querySelectorAll('[data-since]')) el.textContent = span(Date.now() - Number(el.dataset.since))
}, 20000)

document.getElementById('new').append(icon('plus'), 'New issue')
window.addEventListener('hashchange', () => { window.scrollTo(0, 0); draw() })
refreshBoard().then(draw)
connect()
</script>
