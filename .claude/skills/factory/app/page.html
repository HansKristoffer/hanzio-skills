<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Factory</title>
<script>
(function(){
	try {
		var p = new URLSearchParams(location.search);
		var embed = p.get('embed') === '1';
		if (embed) document.documentElement.dataset.embed = '1';
		var forced = p.get('theme');
		var t = (forced === 'light' || forced === 'dark' || forced === 'system') ? forced : (localStorage.getItem('factory-theme') || 'system');
		var dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
		if (dark) document.documentElement.classList.add('dark');
		if (!embed && localStorage.getItem('factory-sidebar-collapsed') === 'true') document.documentElement.dataset.sb = 'collapsed';
		// Start fetching initial data before CSS and main script finish parsing.
		var boot = window.__boot = { board: fetch('/api/board') };
		var hp = location.hash.replace(/^#\/?/, '').split('/');
		if (hp[0] === 'issue' && hp[1]) {
			var bid = decodeURIComponent(hp[1]);
			boot.issue = { id: bid, p: fetch('/api/issues/' + encodeURIComponent(bid)) };
		} else if (hp[0] === 'settings') {
			boot.settings = [fetch('/api/settings'), fetch('/api/mcp'), fetch('/api/webhook')];
		} else if (hp[0] === 'intake') {
			boot.intake = fetch('/api/intake');
		}
	} catch (e) {}
})();
</script>
<style>
	/*
	 * Design tokens inspired by Relay: calm zinc neutrals, one crisp blue accent,
	 * green/amber/red reserved strictly for state, hairline ring cards and tight tabular numbers.
	 */
	:root {
		--bg: #ffffff;
		--surface: #fafafb;
		--panel: #ffffff;
		--muted: #f4f4f6;
		--hover: #f1f1f4;
		--border: #e8e8ec;
		--border-strong: #d6d6dc;
		--fg: #17171c;
		--fg-muted: #55555f;
		--fg-subtle: #6e6e79;
		--accent: #4263eb;
		--accent-hover: #3554d1;
		--accent-solid: #4263eb;
		--accent-solid-hover: #3554d1;
		--accent-fg: #ffffff;
		--accent-soft: #eef1fe;
		--accent-text: #3150d4;
		--ok: #188050;
		--ok-soft: #ebf7f0;
		--warn: #9a5a09;

		--warn-soft: #fdf4e3;

		--bad: #cc3340;

		--agent: #e8590c;

		--ring: color-mix(in oklab, var(--accent) 42%, transparent);
		--shadow-sm: 0 1px 2px rgb(16 16 24 / 0.04);
		--shadow-md: 0 1px 2px rgb(16 16 24 / 0.04), 0 8px 24px -6px rgb(16 16 24 / 0.1);
		--shadow-lg: 0 2px 4px rgb(16 16 24 / 0.04), 0 24px 56px -12px rgb(16 16 24 / 0.22);
		--shadow-card: 0 0 0 1px rgb(0 0 0 / 0.06), 0 1px 2px -1px rgb(0 0 0 / 0.05), 0 2px 4px rgb(0 0 0 / 0.03);
		--series-1: #2a78d6;
		--series-2: #eb6834;
		--series-3: #1baf7a;
		--series-4: #eda100;
		--series-5: #8b5cf6;
		--chart-grid: #ececf0;
		--chart-empty: #f1f1f4;
		--radius-box: 12px;
		--radius-ctrl: 8px;
		--ease: cubic-bezier(0.22, 1, 0.36, 1);
		--ease-drawer: cubic-bezier(0.32, 0.72, 0, 1);
		--sans: "Inter Variable", "Inter", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
		--mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
		color-scheme: light;
	}
	.dark {
		--bg: #0c0c0e;
		--surface: #0f0f12;
		--panel: #131316;
		--muted: #1b1b1f;
		--hover: #1d1d22;
		--border: #26262c;
		--border-strong: #34343c;
		--fg: #ececf0;
		--fg-muted: #a0a0ab;
		--fg-subtle: #8a8a96;
		--accent: #5b7cfa;
		--accent-hover: #6f8cff;
		--accent-solid: #4a69f0;
		--accent-solid-hover: #3f5ee6;
		--accent-fg: #ffffff;
		--accent-soft: rgb(91 124 250 / 0.14);
		--accent-text: #9db0ff;
		--ok: #4cc38a;
		--ok-soft: rgb(76 195 138 / 0.12);
		--warn: #e5a54a;
		--warn-dot: #f0a35c;
		--warn-soft: rgb(229 165 74 / 0.12);
		--warn-line: rgb(229 165 74 / 0.3);
		--bad: #f0717b;
		--bad-soft: rgb(240 113 123 / 0.12);
		--agent: #fb923c;
		--agent-soft: rgb(251 146 60 / 0.14);
		--shadow-sm: 0 1px 2px rgb(0 0 0 / 0.3);
		--shadow-md: 0 1px 2px rgb(0 0 0 / 0.3), 0 8px 24px -6px rgb(0 0 0 / 0.5);
		--shadow-lg: 0 2px 4px rgb(0 0 0 / 0.3), 0 24px 56px -12px rgb(0 0 0 / 0.7);
		--shadow-card: 0 0 0 1px rgb(255 255 255 / 0.08), 0 1px 2px -1px rgb(0 0 0 / 0.4), 0 2px 4px rgb(0 0 0 / 0.3);
		--series-1: #3987e5;
		--series-2: #d95926;
		--series-3: #199e70;
		--series-4: #c98500;
		--series-5: #a78bfa;
		--chart-grid: #222228;
		--chart-empty: #1b1b1f;
		color-scheme: dark;
	}

	* { box-sizing: border-box; }
	html {
		font-size: 14px;
		-webkit-font-smoothing: antialiased;
		-moz-osx-font-smoothing: grayscale;
		text-rendering: optimizeLegibility;
		font-feature-settings: "cv11", "ss01";
		scroll-padding-top: 72px;
	}
	body {
		margin: 0;
		background: var(--bg);
		color: var(--fg);
		font: 14px/1.5 var(--sans);
	}
	h1, h2, h3, h4, p { margin: 0; }
	a { color: inherit; }
	::selection { background: color-mix(in oklab, var(--accent) 25%, transparent); }
	:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 5px; }
	button:not(:disabled), [role="button"]:not(:disabled) { cursor: pointer; }
	code, kbd, pre { font-family: var(--mono); }

	@keyframes pulse-soft { 50% { opacity: 0.42; } }
	@keyframes spotlight { from { box-shadow: 0 0 0 3px var(--ring); } }
	@keyframes spin { to { transform: rotate(360deg); } }
	@keyframes ping { from { transform: scale(.75); opacity: .8; } to { transform: scale(1.9); opacity: 0; } }
	@media (prefers-reduced-motion: reduce) {
		*, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; scroll-behavior: auto !important; }
		.spin-icon svg { animation: spin 2.4s linear infinite !important; }
	}

	.spotlight { animation: spotlight 1.2s ease-out; }
	.mono { font-family: var(--mono); font-size: 12px; }
	.muted { color: var(--fg-muted); }
	.subtle { color: var(--fg-subtle); }
	.tabular { font-variant-numeric: tabular-nums; }
	.ic { display: inline-flex; align-items: center; justify-content: center; width: 15px; height: 15px; flex: none; }
	.ic svg { width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
	.ic.sm { width: 13px; height: 13px; }
	.ic.lg { width: 18px; height: 18px; }

	/* App Shell: Relay-style collapsible sidebar + sticky translucent topbar */
	.shell { display: flex; min-height: 100dvh; }
	.sidebar {
		position: sticky; top: 0; z-index: 25;
		display: flex; flex-direction: column;
		width: 240px; height: 100dvh; flex: none;
		padding: 12px; border-right: 1px solid var(--border);
		background: var(--surface);
		transition: width 0.18s var(--ease);
	}
	html[data-sb="collapsed"] .sidebar { width: 64px; }
	.sb-head { display: flex; align-items: center; gap: 8px; min-height: 36px; margin-bottom: 10px; }
	html[data-sb="collapsed"] .sb-head { flex-direction: column; gap: 6px; }
	.brand {
		display: flex; align-items: center; gap: 9px; min-width: 0; flex: 1;
		padding: 4px 8px; border-radius: 8px;
		font-size: 15px; font-weight: 600; letter-spacing: -0.015em; text-decoration: none;
		color: var(--fg);
	}
	html[data-sb="collapsed"] .brand { flex: none; width: 36px; height: 36px; padding: 0; justify-content: center; }
	html[data-sb="collapsed"] .brand span { display: none; }
	.brand-mark {
		display: grid; place-items: center; width: 22px; height: 22px; flex: none;
		border-radius: 6px; background: var(--accent-solid); color: var(--accent-fg);
	}
	.brand-mark svg { width: 14px; height: 14px; }

	.sb-scope { padding-bottom: 10px; margin-bottom: 12px; border-bottom: 1px solid var(--border); }
	.scope-btn {
		position: relative; display: flex; align-items: center; gap: 8px; width: 100%;
		height: 32px; padding: 0 9px; border: 1px solid var(--border); border-radius: 8px;
		background: var(--panel); color: var(--fg); font: 500 12.5px/1 var(--sans);
		text-align: left; transition: background-color .15s var(--ease), border-color .15s var(--ease);
	}
	.scope-btn:hover { background: var(--hover); border-color: var(--border-strong); }
	.scope-btn .scope-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
	.scope-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--warn-dot); flex: none; }
	html[data-sb="collapsed"] .scope-btn { width: 38px; height: 36px; padding: 0; justify-content: center; margin: 0 auto; }
	html[data-sb="collapsed"] .scope-btn .scope-name,
	html[data-sb="collapsed"] .scope-btn .scope-chev { display: none; }
	html[data-sb="collapsed"] .scope-dot { position: absolute; top: 5px; right: 5px; }
	.scope-wrap { position: relative; }
	.scope-menu {
		position: absolute; left: 0; top: calc(100% + 4px); z-index: 50;
		min-width: 220px; max-height: 320px; overflow-y: auto;
		padding: 4px; border: 1px solid var(--border); border-radius: 10px;
		background: var(--panel); box-shadow: var(--shadow-md);
	}
	.scope-opt {
		display: flex; align-items: center; gap: 8px; width: 100%;
		padding: 6px 8px; border: 0; border-radius: 6px; background: transparent;
		color: var(--fg-muted); font: 13px/1.3 var(--sans); text-align: left;
	}
	.scope-opt:hover { background: var(--hover); color: var(--fg); }
	.scope-opt.on { background: var(--hover); color: var(--fg); font-weight: 500; }
	.scope-opt .scope-cnt { margin-left: auto; font: 11px/1 var(--mono); color: var(--fg-subtle); }
	.scope-opt .scope-cnt.warn { padding: 2px 5px; border-radius: 99px; background: var(--warn-soft); color: var(--warn); font-weight: 600; }

	.sb-nav { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; scrollbar-width: none; }
	.sb-nav::-webkit-scrollbar { display: none; }
	.sb-group-label {
		padding: 0 10px 4px; font-size: 11px; font-weight: 500;
		letter-spacing: 0.04em; text-transform: uppercase; color: var(--fg-subtle);
	}
	html[data-sb="collapsed"] .sb-group-label { display: none; }
	.sb-list { display: flex; flex-direction: column; gap: 2px; }
	.nav-link {
		position: relative; display: flex; align-items: center; gap: 9px;
		height: 30px; padding: 0 10px; border-radius: 7px;
		color: var(--fg-muted); font-size: 13px; font-weight: 500; text-decoration: none;
		transition: background-color .14s var(--ease), color .14s var(--ease);
	}
	.nav-link:hover { background: var(--hover); color: var(--fg); }
	.nav-link.on { background: var(--hover); color: var(--fg); }
	.nav-link .ic { color: var(--fg-subtle); }
	.nav-link:hover .ic, .nav-link.on .ic { color: var(--fg); }
	.nav-text { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
	.nav-badge {
		min-width: 19px; height: 18px; padding: 0 6px; border-radius: 99px;
		display: inline-flex; align-items: center; justify-content: center;
		font: 600 11px/1 var(--mono); font-variant-numeric: tabular-nums;
		background: var(--muted); color: var(--fg-muted);
	}
	.nav-badge.accent { background: var(--accent-solid); color: var(--accent-fg); }
	.nav-badge.warn { background: var(--warn-soft); color: var(--warn); }
	.nav-badge.soft { background: var(--accent-soft); color: var(--accent-text); }
	html[data-sb="collapsed"] .nav-link { width: 38px; height: 36px; padding: 0; justify-content: center; margin: 0 auto; }
	html[data-sb="collapsed"] .nav-text { display: none; }
	html[data-sb="collapsed"] .nav-badge { position: absolute; top: 1px; right: 1px; min-width: 14px; height: 14px; padding: 0 3px; font-size: 9px; }

	.sb-foot {
		margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border);
		display: flex; align-items: center; gap: 4px;
	}
	html[data-sb="collapsed"] .sb-foot { flex-direction: column; gap: 4px; }
	.sb-live { display: flex; align-items: center; gap: 7px; flex: 1; min-width: 0; padding: 0 6px; font-size: 12px; color: var(--fg-subtle); }
	.sb-live i { width: 7px; height: 7px; border-radius: 50%; background: var(--bad); flex: none; }
	.sb-live.up i { background: var(--ok); }
	.sb-live span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
	html[data-sb="collapsed"] .sb-live { flex: none; padding: 6px; }
	html[data-sb="collapsed"] .sb-live span { display: none; }

	.workspace { flex: 1; min-width: 0; display: flex; flex-direction: column; }
	.topbar {
		position: sticky; top: 0; z-index: 20;
		display: flex; align-items: center; gap: 10px;
		height: 48px; padding: 0 24px;
		border-bottom: 1px solid var(--border);
		background: color-mix(in oklab, var(--bg) 86%, transparent);
		backdrop-filter: blur(12px);
	}
	.menu-btn { display: none; }
	.crumb { display: flex; align-items: center; gap: 6px; min-width: 0; flex: 1; font-size: 13px; }
	.crumb a { color: var(--fg-subtle); text-decoration: none; white-space: nowrap; }
	.crumb a:hover { color: var(--fg); }
	.crumb .sep { color: var(--border-strong); flex: none; }
	.crumb .cur { font-weight: 500; color: var(--fg); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
	.cmd-trigger {
		display: inline-flex; align-items: center; gap: 8px;
		height: 30px; width: 210px; padding: 0 10px;
		border: 1px solid var(--border); border-radius: 8px;
		background: var(--surface); color: var(--fg-subtle);
		font: 12.5px/1 var(--sans); text-align: left;
		transition: border-color .14s var(--ease), background-color .14s var(--ease), color .14s var(--ease);
	}
	.cmd-trigger:hover { border-color: var(--border-strong); background: var(--hover); color: var(--fg-muted); }
	.cmd-trigger .cmd-lbl { flex: 1; }
	.top-conn {
		display: inline-flex; align-items: center; gap: 6px;
		height: 28px; padding: 0 10px; border-radius: 99px;
		font-size: 12px; color: var(--fg-muted); white-space: nowrap;
	}
	.top-conn[hidden] { display: none; }
	.top-conn i { width: 6px; height: 6px; border-radius: 50%; background: var(--bad); }
	.top-conn.up i { background: var(--ok); }

	main.main {
		container-type: inline-size;
		width: 100%; max-width: 1320px; margin: 0 auto;
		padding: 26px 28px 72px; flex: 1;
	}
	main.main:focus, main.main:focus-visible { outline: none; }

	/* Mobile sidebar drawer */
	dialog.drawer-nav {
		width: 260px; max-width: 85vw; height: 100dvh; max-height: 100dvh;
		margin: 0 auto 0 0; padding: 12px; border: 0; border-right: 1px solid var(--border);
		background: var(--surface); color: var(--fg);
	}
	dialog.drawer-nav::backdrop { background: rgb(0 0 0 / 0.45); }
	dialog.drawer-nav[open] { display: flex; flex-direction: column; }
	dialog.drawer-nav { --sheet-from: translateX(-100%); }

	/* Controls */
	.btn {
		display: inline-flex; align-items: center; justify-content: center; gap: 6px;
		height: 32px; padding: 0 12px;
		border: 1px solid var(--border-strong); border-radius: var(--radius-ctrl);
		background: var(--panel); color: var(--fg);
		font: 500 13px/1 var(--sans); text-decoration: none; white-space: nowrap;
		box-shadow: var(--shadow-sm);
		transition: background-color .14s var(--ease), border-color .14s var(--ease), color .14s var(--ease), transform .12s var(--ease);
	}
	.btn:hover:not(:disabled) { background: var(--hover); }
	.btn:active:not(:disabled) { transform: scale(.985); }
	.btn:disabled { opacity: 0.5; cursor: default; }
	.btn.primary {
		background: var(--accent-solid); border-color: var(--accent-solid);
		color: var(--accent-fg); box-shadow: none;
	}
	.btn.primary:hover:not(:disabled) { background: var(--accent-solid-hover); border-color: var(--accent-solid-hover); }
	.btn.dark-primary {
		background: var(--fg); border-color: var(--fg); color: var(--bg); box-shadow: none;
	}
	.btn.dark-primary:hover:not(:disabled) { opacity: 0.88; }
	.btn.sm { height: 28px; padding: 0 9px; font-size: 12.5px; }
	.btn.xs { height: 24px; padding: 0 7px; font-size: 12px; border-radius: 6px; }
	.btn.icon-only { width: 28px; height: 28px; padding: 0; border-color: transparent; background: transparent; box-shadow: none; color: var(--fg-subtle); }
	.btn.icon-only:hover:not(:disabled) { background: var(--hover); color: var(--fg); }
	.btn.menu-btn { display: none; }
	.btn.quiet { border-color: transparent; background: transparent; box-shadow: none; color: var(--fg-muted); }
	.btn.quiet:hover:not(:disabled) { background: var(--hover); color: var(--fg); }
	.btn.danger:hover:not(:disabled) { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
	.btn.long { height: auto; min-height: 32px; padding: 7px 12px; justify-content: flex-start; text-align: left; white-space: normal; line-height: 1.35; }

	input, select, textarea {
		width: 100%; border: 1px solid var(--border-strong); border-radius: var(--radius-ctrl);
		background: var(--panel); color: var(--fg); font: 13.5px/1.45 var(--sans);
		transition: border-color .14s var(--ease), box-shadow .14s var(--ease);
	}
	input, select { height: 34px; padding: 0 11px; }
	textarea { display: block; min-height: 76px; padding: 8px 11px; resize: vertical; }
	input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
	input:disabled, select:disabled, textarea:disabled { border-color: var(--border); background: var(--muted); color: var(--fg-muted); opacity: 1; resize: none; }
	::placeholder { color: var(--fg-subtle); opacity: 0.85; }
	.field { display: block; min-width: 0; }
	.flabel { display: block; margin-bottom: 5px; font-size: 12.5px; font-weight: 500; color: var(--fg-muted); }
	.fhint { display: block; margin-top: 4px; font-size: 12px; line-height: 1.35; color: var(--fg-subtle); }
	.fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 14px; }
	.stack { display: grid; gap: 14px; }
	.row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
	.error { color: var(--bad); font-size: 12.5px; }
	.error:empty { display: none; }
	.kbd {
		display: inline-flex; align-items: center; justify-content: center;
		min-width: 18px; height: 18px; padding: 0 5px; border-radius: 5px;
		border: 1px solid var(--border-strong); background: var(--muted);
		font: 500 11px/1 var(--mono); color: var(--fg-subtle);
	}
	.btn.primary .kbd { border-color: rgb(255 255 255 / 0.25); background: rgb(255 255 255 / 0.14); color: var(--accent-fg); }

	/* Cards, page headers, badges */
	.page-head { display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 12px 16px; margin-bottom: 20px; }
	.page-head h1 { display: flex; align-items: center; gap: 9px; font-size: 22px; line-height: 1.25; font-weight: 600; letter-spacing: -0.02em; }
	.page-head .sub { margin-top: 3px; font-size: 13.5px; color: var(--fg-muted); }
	.count-pill {
		display: inline-flex; align-items: center; height: 22px; padding: 0 8px;
		border-radius: 6px; background: var(--muted); color: var(--fg-muted);
		font: 500 12px/1 var(--mono); font-variant-numeric: tabular-nums;
	}
	.card {
		background: var(--panel); border-radius: var(--radius-box);
		box-shadow: var(--shadow-card);
	}
	.card-head {
		display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px;
		padding: 13px 16px; border-bottom: 1px solid var(--border);
	}
	.card-head h2, .card-head h3 { font-size: 13.5px; font-weight: 600; letter-spacing: -0.01em; display: flex; align-items: center; gap: 8px; }
	.sec-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 8px 16px; margin: 26px 0 11px; }
	.sec-head h2 { font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }
	.sec-head p { margin-top: 2px; font-size: 13px; color: var(--fg-muted); }
	.sec-link { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 500; color: var(--fg-muted); text-decoration: none; }
	.sec-link:hover { color: var(--fg); }

	.chip {
		display: inline-flex; align-items: center; gap: 5px;
		height: 21px; padding: 0 7px; border-radius: 6px;
		background: var(--muted); color: var(--fg-muted);
		font-size: 11.5px; font-weight: 500; line-height: 1; white-space: nowrap;
	}
	.chip.ok { background: var(--ok-soft); color: var(--ok); }
	.chip.warn { background: var(--warn-soft); color: var(--warn); }
	.chip.bad { background: var(--bad-soft); color: var(--bad); }
	.chip.accent { background: var(--accent-soft); color: var(--accent-text); }
	.chip.agent { background: var(--agent-soft); color: var(--agent); }
	.chip .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex: none; }
	.repo-chip {
		display: inline-flex; align-items: center; gap: 4px;
		height: 20px; padding: 0 6px; border-radius: 5px;
		border: 1px solid var(--border); background: var(--surface);
		color: var(--fg-muted); font: 500 11.5px/1 var(--sans); white-space: nowrap;
	}
	.repo-chip .ic { width: 11px; height: 11px; color: var(--fg-subtle); }
	.diffstat { display: inline-flex; gap: 5px; font: 500 12px/1 var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
	.diffstat .add { color: var(--ok); }
	.diffstat .del { color: var(--bad); }

	pre { margin: 0; padding: 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--muted); font: 12px/1.55 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; max-height: 420px; overflow: auto; }
	.notice { margin-top: 12px; padding: 11px 14px; border-radius: 10px; background: var(--warn-soft); color: var(--warn); font-size: 13px; border: 1px solid var(--warn-line); }
	.notice.bad { background: var(--bad-soft); color: var(--bad); border-color: color-mix(in oklab, var(--bad) 28%, transparent); }
	.notice.quiet { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; background: var(--muted); color: var(--fg-muted); border-color: var(--border); }
	.empty { padding: 44px 20px; text-align: center; color: var(--fg-muted); }
	.empty h3 { font-size: 14.5px; font-weight: 600; color: var(--fg); margin-bottom: 4px; }
	.empty p { font-size: 13px; color: var(--fg-subtle); max-width: 48ch; margin: 0 auto; }
	.empty .btn { margin-top: 14px; }

	/* Segmented control */
	.seg { display: inline-flex; padding: 2px; border-radius: 8px; background: var(--muted); border: 1px solid var(--border); gap: 2px; }
	.seg button {
		display: inline-flex; align-items: center; gap: 5px;
		height: 26px; padding: 0 10px; border: 0; border-radius: 6px;
		background: transparent; color: var(--fg-muted);
		font: 500 12.5px/1 var(--sans);
		transition: background-color .14s var(--ease), color .14s var(--ease);
	}
	.seg button:hover { color: var(--fg); }
	.seg button.on { background: var(--panel); color: var(--fg); box-shadow: var(--shadow-sm); }
	.seg .cnt { font: 11px/1 var(--mono); color: var(--fg-subtle); }

	/* Stat strip (Relay joined hairline grid) */
	.stat-strip {
		display: grid; grid-template-columns: repeat(5, minmax(0, 1fr));
		gap: 1px; overflow: hidden; border-radius: var(--radius-box);
		background: var(--border); box-shadow: var(--shadow-card);
		margin-bottom: 20px;
	}
	.stat-strip.cols-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
	.stat-tile {
		display: flex; flex-direction: column; gap: 2px;
		padding: 13px 16px; border: 0; background: var(--panel);
		color: inherit; font: inherit; text-align: left; text-decoration: none;
		transition: background-color .14s var(--ease);
	}
	a.stat-tile:hover, button.stat-tile:hover { background: var(--hover); }
	.stat-tile.active { background: var(--hover); box-shadow: inset 0 -2px 0 var(--accent); }
	.stat-lbl { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--fg-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
	.stat-lbl .dot { width: 6px; height: 6px; border-radius: 50%; flex: none; }
	.stat-val-row { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-top: 2px; }
	.stat-val { font-size: 24px; line-height: 1.25; font-weight: 600; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
	.stat-val.accent { color: var(--accent-text); }
	.stat-val.warn { color: var(--warn); }
	.stat-val.bad { color: var(--bad); }
	.stat-tile .arr { color: var(--fg-subtle); opacity: 0; transition: opacity .14s var(--ease); }
	.stat-tile:hover .arr { opacity: 1; }
	.stat-sub { font-size: 11.5px; color: var(--fg-subtle); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
	@container (max-width: 820px) { .stat-strip { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

	/* Dashboard charts & list cards */
	.dash-grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
	.dash-grid-4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
	.dash-grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
	@container (max-width: 940px) { .dash-grid-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
	@container (max-width: 900px) { .dash-grid-3 { grid-template-columns: minmax(0, 1fr); } }
	@container (max-width: 680px) { .dash-grid-4, .dash-grid-2 { grid-template-columns: minmax(0, 1fr); } }

	.chart-card { padding: 15px 16px; display: flex; flex-direction: column; gap: 12px; }
	.chart-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
	.chart-top h3 { font-size: 13.5px; font-weight: 600; }
	.chart-top p { margin-top: 2px; font-size: 12px; color: var(--fg-muted); }
	.hbar-list { display: grid; gap: 9px; }
	.hbar-row {
		display: grid; grid-template-columns: 124px minmax(0, 1fr) 26px; align-items: center; gap: 10px;
		padding: 2px 4px; margin: -2px -4px; border: 0; border-radius: 6px; background: transparent;
		color: inherit; font: 12.5px/1.2 var(--sans); text-align: left;
		transition: background-color .14s var(--ease);
	}
	button.hbar-row:hover { background: var(--hover); }
	.hbar-track { height: 12px; border-radius: 4px; background: var(--chart-empty); overflow: hidden; }
	.hbar-fill { height: 100%; border-radius: 4px; background: var(--series-1); min-width: 0; transition: width .25s var(--ease); }
	.hbar-val { text-align: right; font: 500 12px/1 var(--mono); color: var(--fg-muted); font-variant-numeric: tabular-nums; }

	.vbar-chart { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; align-items: end; height: 120px; padding-top: 16px; }
	.vbar-col { display: flex; flex-direction: column; align-items: center; height: 100%; justify-content: flex-end; gap: 5px; }
	.vbar-num { font: 500 11px/1 var(--mono); color: var(--fg-muted); font-variant-numeric: tabular-nums; }
	.vbar-stack { width: 22px; display: flex; flex-direction: column-reverse; border-radius: 4px 4px 2px 2px; overflow: hidden; min-height: 2px; background: var(--chart-empty); }
	.vbar-seg { width: 100%; }
	.vbar-lbl { font-size: 11px; color: var(--fg-subtle); white-space: nowrap; }
	.legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 11.5px; color: var(--fg-muted); }
	.legend span { display: inline-flex; align-items: center; gap: 5px; }
	.legend i { width: 8px; height: 8px; border-radius: 2px; flex: none; }
	.legend i.line { width: 10px; height: 2px; border-radius: 1px; }

	.list-card { display: flex; flex-direction: column; }
	.list-card-head { display: flex; align-items: flex-start; gap: 10px; padding: 13px 14px 8px; }
	.list-card-ic { width: 26px; height: 26px; border-radius: 7px; display: grid; place-items: center; flex: none; background: var(--muted); color: var(--fg-subtle); }
	.list-card-ic.accent { background: var(--accent-soft); color: var(--accent-text); }
	.list-card-ic.warn { background: var(--warn-soft); color: var(--warn); }
	.list-card-ic.bad { background: var(--bad-soft); color: var(--bad); }
	.list-card-ic.ok { background: var(--ok-soft); color: var(--ok); }
	.list-card-title { display: flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 600; }
	.list-card-desc { font-size: 12px; color: var(--fg-muted); margin-top: 1px; }
	.list-card-body { padding: 4px 8px 10px; display: flex; flex-direction: column; gap: 2px; flex: 1; }
	.lc-item {
		display: flex; flex-direction: column; gap: 2px;
		padding: 7px 8px; border-radius: 7px; text-decoration: none;
		transition: background-color .13s var(--ease);
	}
	.lc-item:hover { background: var(--hover); }
	.lc-item-top { display: flex; align-items: center; gap: 6px; min-width: 0; }
	.lc-item-title { font-size: 13px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
	.lc-item-sub { font-size: 12px; color: var(--fg-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
	.lc-empty { padding: 8px; font-size: 12px; color: var(--fg-subtle); }
	.lc-foot { margin-top: auto; padding: 6px 8px 0; }
	.lc-foot a { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 500; color: var(--fg-muted); text-decoration: none; }
	.lc-foot a:hover { color: var(--fg); }

	/* Sticky Filter Bar (Board & Done) */
	.filter-bar { margin: 0 0 18px; display: flex; flex-direction: column; gap: 9px; }
	.filter-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
	.search-box { position: relative; flex: 1; min-width: 200px; }
	.search-box .ic { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--fg-subtle); pointer-events: none; }
	.search-box input { height: 34px; padding: 0 32px 0 32px; background: var(--panel); }
	.search-box .kbd { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); pointer-events: none; }
	.select-ctrl { width: auto; height: 34px; padding: 0 28px 0 10px; font-size: 12.5px; color: var(--fg-muted); background-color: var(--panel); }
	.select-ctrl.on { border-color: var(--accent); color: var(--fg); font-weight: 500; }
	.toggle-pills { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
	.tpill {
		display: inline-flex; align-items: center; gap: 5px;
		height: 25px; padding: 0 9px; border-radius: 99px;
		border: 1px solid var(--border); background: var(--panel);
		color: var(--fg-muted); font: 500 12px/1 var(--sans);
		transition: background-color .13s var(--ease), border-color .13s var(--ease), color .13s var(--ease);
	}
	.tpill:hover { background: var(--hover); color: var(--fg); border-color: var(--border-strong); }
	.tpill.on { border-color: var(--accent); background: var(--accent-soft); color: var(--accent-text); }
	.tpill .cnt { font: 500 11px/1 var(--mono); opacity: 0.78; }

	/* Queue groups & rows (Relay style) */
	.q-group { margin-top: 22px; scroll-margin-top: 112px; }
	.q-group:first-of-type { margin-top: 0; }
	.q-group-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 8px; padding: 0 2px; }
	.q-group-title { display: flex; align-items: center; gap: 8px; font-size: 13.5px; font-weight: 600; color: var(--fg); }
	.q-group-title .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
	.q-group-title .cnt { font: 500 12px/1 var(--mono); color: var(--fg-subtle); }
	.q-head, .q-row {
		display: grid; grid-template-columns: minmax(0, 1fr) 156px minmax(175px, 225px) 136px;
		align-items: center; column-gap: 16px; padding: 0 16px;
	}
	.q-head {
		height: 34px; border-bottom: 1px solid var(--border);
		font-size: 11.5px; font-weight: 500; color: var(--fg-subtle);
	}
	.q-row {
		position: relative; padding-top: 12px; padding-bottom: 12px;
		border-bottom: 1px solid var(--border);
		transition: background-color .13s var(--ease);
		scroll-margin-top: 120px; scroll-margin-bottom: 48px;
		contain: layout style;
		content-visibility: auto; contain-intrinsic-size: auto 74px;
	}
	.q-row:last-child { border-bottom: 0; }
	.q-row:hover { background: color-mix(in oklab, var(--hover) 62%, transparent); }
	.q-row:has([data-row-open]:focus-visible) { box-shadow: inset 0 0 0 2px var(--focus); }
	.q-main { min-width: 0; }
	.q-title {
		display: block; font-size: 13.5px; line-height: 1.35; font-weight: 500; color: var(--fg);
		text-decoration: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
		outline: none;
	}
	.q-title::after { content: ""; position: absolute; inset: 0; }
	.q-title:hover { color: var(--accent-text); }
	.q-sub { margin-top: 2px; font-size: 12.5px; color: var(--fg-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
	.q-meta { margin-top: 5px; display: flex; flex-wrap: wrap; align-items: center; gap: 5px 8px; font-size: 12px; color: var(--fg-muted); }
	.q-meta > * { position: relative; z-index: 1; }
	.q-next { min-width: 0; }
	.q-next-title { display: flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 500; }
	.q-next-title .dot { width: 6px; height: 6px; border-radius: 50%; flex: none; }
	.q-next-title span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
	.q-next-title.warn { color: var(--warn); }
	.q-next-title.bad { color: var(--bad); }
	.q-next-title.live { color: var(--accent-text); }
	.q-next-title.ok { color: var(--ok); }
	.q-next-detail { margin-top: 2px; padding-left: 12px; font-size: 12px; color: var(--fg-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
	.q-act { position: relative; z-index: 1; display: flex; align-items: center; justify-content: flex-end; gap: 6px; }
	.row-copy { opacity: 0; transition: opacity .14s var(--ease); }
	.q-row:hover .row-copy, .q-row:focus-within .row-copy { opacity: 1; }

	/* Relay-style 5-stage LaneStrip */
	.lanes { position: relative; z-index: 1; display: inline-flex; align-items: center; gap: 4px; }
	.lane {
		display: inline-flex; align-items: center; justify-content: center;
		width: 26px; height: 22px; border-radius: 6px;
		border: 1px solid var(--border); background: var(--surface);
		font: 600 10.5px/1 var(--mono); color: var(--fg-subtle);
		font-variant-numeric: tabular-nums;
	}
	.lane.done { background: var(--ok-soft); border-color: color-mix(in oklab, var(--ok) 25%, transparent); color: var(--ok); }
	.lane.run { background: var(--accent-soft); border-color: color-mix(in oklab, var(--accent) 30%, transparent); color: var(--accent-text); animation: pulse-soft 1.8s ease-in-out infinite; }
	.lane.now { background: var(--warn-soft); border-color: var(--warn-line); color: var(--warn); }
	.lane.bad { background: var(--bad-soft); border-color: color-mix(in oklab, var(--bad) 28%, transparent); color: var(--bad); }
	.lane.skip { border-color: transparent; background: transparent; color: var(--fg-subtle); opacity: 0.55; }
	.lane.pending { background: var(--muted); border-color: transparent; color: var(--fg-subtle); opacity: 0.7; }

	.legend-fold { margin-top: 24px; border: 1px solid var(--border); border-radius: var(--radius-box); padding: 10px 14px; font-size: 12.5px; color: var(--fg-muted); }
	.legend-fold summary { cursor: pointer; display: flex; align-items: center; gap: 7px; font-weight: 500; list-style: none; }
	.legend-fold summary::-webkit-details-marker { display: none; }
	.legend-fold .legend-items { display: flex; flex-wrap: wrap; gap: 10px 18px; margin-top: 10px; }
	.legend-fold .legend-item { display: inline-flex; align-items: center; gap: 6px; }

	@container (max-width: 920px) {
		.q-head { display: none; }
		.q-row { grid-template-columns: minmax(0, 1fr) auto; row-gap: 10px; }
		.q-main { grid-column: 1 / -1; }
		.q-title { white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
		.q-next { grid-column: 1 / -1; }
		.row-copy { opacity: 1; }
	}

	/* Issue Trail Page (Relay 2-column PR layout + tabs) */
	.itop { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; margin-bottom: 12px; }
	.back-link { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; color: var(--fg-muted); text-decoration: none; }
	.back-link:hover { color: var(--fg); }
	.triage-nav { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--fg-muted); }
	.triage-badge { padding: 2px 8px; border-radius: 6px; background: var(--warn-soft); color: var(--warn); font: 600 11.5px/1.4 var(--mono); border: 1px solid var(--warn-line); }
	.banner {
		display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px;
		margin-bottom: 14px; padding: 10px 14px; border-radius: 10px;
		background: var(--ok-soft); border: 1px solid color-mix(in oklab, var(--ok) 25%, transparent); font-size: 13px;
	}
	.banner strong { color: var(--ok); font-weight: 600; }

	.issue-head { display: flex; flex-direction: column; gap: 9px; }
	.issue-head-row { display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 10px 16px; }
	.issue-head h1 { flex: 1 1 320px; font-size: 21px; line-height: 1.3; font-weight: 600; letter-spacing: -0.02em; overflow-wrap: anywhere; }
	.issue-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; font-size: 12.5px; color: var(--fg-muted); }
	.issue-links { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; font-size: 12.5px; }
	.issue-links a.alink { display: inline-flex; align-items: center; gap: 4px; color: var(--accent-text); text-decoration: none; font-weight: 500; }
	.issue-links a.alink:hover { text-decoration: underline; text-underline-offset: 3px; }

	/* Interactive 5-stage rail */
	.rail { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); margin-top: 14px; padding: 8px 6px; }
	.stn {
		min-width: 0; display: flex; flex-direction: column; align-items: center;
		padding: 5px 4px; border: 0; border-radius: 8px; background: transparent;
		color: inherit; font: inherit; text-align: center;
		transition: background-color .14s var(--ease);
	}
	.stn:hover { background: var(--hover); }
	.stn-track { position: relative; display: grid; place-items: center; width: 100%; height: 18px; }
	.stn-track::before { content: ""; position: absolute; left: -50%; right: 50%; top: 8px; height: 2px; background: var(--border-strong); }
	.stn:first-child .stn-track::before { display: none; }
	.stn-track.done::before, .stn-track.skip::before, .stn-track.now::before { background: var(--fg-subtle); }
	.stn-track i { position: relative; width: 8px; height: 8px; border-radius: 50%; background: var(--panel); box-shadow: inset 0 0 0 1.5px var(--fg-subtle); }
	.stn-track.done i { background: var(--ok); box-shadow: none; }
	.stn-track.bad i { background: var(--bad); box-shadow: none; }
	.stn-track.now i { width: 11px; height: 11px; background: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
	.stn-track.now.warn i { background: var(--warn-dot); box-shadow: 0 0 0 4px var(--warn-soft); }
	.stn-track.now.bad i { background: var(--bad); box-shadow: 0 0 0 4px var(--bad-soft); }
	.stn-track.now.running i::after { content: ""; position: absolute; inset: -4px; border-radius: 50%; border: 1.5px solid var(--accent); animation: ping 2s var(--ease) infinite; }
	.stn-row { display: inline-flex; flex-wrap: wrap; align-items: baseline; justify-content: center; gap: 4px; margin-top: 4px; }
	.stn-name { font-size: 12px; font-weight: 500; color: var(--fg-muted); }
	.stn.on .stn-name { color: var(--fg); font-weight: 600; }
	.stn-sub { font: 11px/1.2 var(--mono); color: var(--fg-subtle); }
	.stn-sub.bad { color: var(--bad); }

	/* Tab bar */
	.tabs {
		display: flex; align-items: center; gap: 2px; overflow-x: auto; scrollbar-width: none;
		margin: 18px 0 20px; border-bottom: 1px solid var(--border);
	}
	.tabs::-webkit-scrollbar { display: none; }
	.tab-btn {
		position: relative; display: inline-flex; align-items: center; gap: 6px;
		height: 36px; padding: 0 12px; border: 0; background: transparent;
		color: var(--fg-muted); font: 500 13px/1 var(--sans); white-space: nowrap;
		transition: color .14s var(--ease);
	}
	.tab-btn:hover { color: var(--fg); }
	.tab-btn.on { color: var(--fg); }
	.tab-btn.on::after { content: ""; position: absolute; left: 8px; right: 8px; bottom: 0; height: 2px; border-radius: 2px 2px 0 0; background: var(--accent); }
	.tab-cnt { padding: 1px 6px; border-radius: 99px; background: var(--muted); color: var(--fg-muted); font: 600 11px/1.4 var(--mono); }
	.tab-cnt.hot { background: var(--warn-soft); color: var(--warn); }

	/* Relay 2-column Trail Grid */
	.trail-grid { display: grid; grid-template-columns: minmax(0, 1fr) 356px; gap: 20px; align-items: start; }
	.trail-main { min-width: 0; display: flex; flex-direction: column; gap: 18px; }
	.trail-side { min-width: 0; display: flex; flex-direction: column; gap: 16px; position: sticky; top: 64px; }
	@container (max-width: 1020px) {
		.trail-grid { grid-template-columns: minmax(0, 1fr); }
		.trail-side { position: static; order: -1; }
	}

	/* Merge & Status Gate Box (Relay MergeBox) */
	.gate-box-top { padding: 15px 16px; display: flex; flex-direction: column; gap: 10px; }
	.gate-box-top h2 { font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }
	.gate-box-top h2.ok { color: var(--ok); }
	.gate-box-top h2.warn { color: var(--warn); }
	.gate-box-top h2.bad { color: var(--bad); }
	.gate-box-detail { font-size: 13px; color: var(--fg-muted); margin-top: 2px; }
	.gate-box-sum { font-size: 12px; color: var(--fg-subtle); font-variant-numeric: tabular-nums; margin-top: 3px; }
	.gate-list { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--border); }
	.gate-row { display: flex; align-items: flex-start; gap: 10px; padding: 9px 16px; border-bottom: 1px solid var(--border); font-size: 13px; }
	.gate-row:last-child { border-bottom: 0; }
	.gate-glyph { width: 16px; height: 16px; margin-top: 1px; flex: none; display: inline-flex; align-items: center; justify-content: center; }
	.gate-glyph.ok { color: var(--ok); }
	.gate-glyph.warn { color: var(--warn-dot); }
	.gate-glyph.bad { color: var(--bad); }
	.gate-glyph.live { color: var(--accent); }
	.gate-glyph.muted { color: var(--fg-subtle); }
	.gate-body { flex: 1; min-width: 0; }
	.gate-label { font-weight: 500; color: var(--fg); margin-right: 6px; }
	.gate-val { font-size: 12px; color: var(--fg-muted); overflow-wrap: anywhere; }
	.gate-blockers { padding: 10px 16px 12px; border-top: 1px solid var(--border); background: var(--surface); border-radius: 0 0 var(--radius-box) var(--radius-box); }
	.gate-blockers h4 { font-size: 11.5px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.03em; color: var(--fg-subtle); margin-bottom: 6px; }
	.gate-blockers ul { margin: 0; padding-left: 16px; font-size: 12.5px; color: var(--fg-muted); display: grid; gap: 3px; }

	/* About / In brief card */
	.brief-body { padding: 15px 16px; display: flex; flex-direction: column; gap: 14px; }
	.brief-row { display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: 4px 14px; }
	.brief-lbl { font-size: 12.5px; font-weight: 500; color: var(--fg-subtle); padding-top: 2px; }
	.brief-txt { font-size: 14px; line-height: 1.55; color: var(--fg); white-space: pre-line; overflow-wrap: anywhere; }
	.clamp { max-height: 140px; overflow: hidden; }
	.clamp.cut { -webkit-mask-image: linear-gradient(#000 calc(100% - 44px), transparent); mask-image: linear-gradient(#000 calc(100% - 44px), transparent); }
	@container (max-width: 560px) { .brief-row { grid-template-columns: minmax(0, 1fr); } }

	/* Heads up & Live activity */
	.headsup { padding: 14px 16px; border: 1px solid var(--warn-line); background: color-mix(in oklab, var(--warn-soft) 55%, var(--panel)); }
	.headsup h3 { font-size: 13px; font-weight: 600; color: var(--warn); display: flex; align-items: center; gap: 6px; }
	.headsup-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px 18px; margin-top: 10px; }
	.headsup-col h4 { font-size: 12px; font-weight: 600; color: var(--fg-muted); margin-bottom: 4px; }
	.headsup-col ul { margin: 0; padding-left: 16px; font-size: 12.5px; color: var(--fg); display: grid; gap: 2px; }

	.live-feed { padding: 14px 16px; }
	.live-feed-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; font-size: 13px; }
	.live-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex: none; animation: pulse-soft 1.6s ease-in-out infinite; }
	.live-feed-list { margin: 10px 0 0; padding: 0; list-style: none; display: grid; gap: 6px; }
	.live-feed-list li { display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 8px; font-size: 12.5px; color: var(--fg-muted); overflow-wrap: anywhere; }
	.live-feed-list li:first-child { color: var(--fg); font-weight: 500; }

	/* Iteration Strip (Relay style) */
	.iter-strip { padding: 12px 16px; border-bottom: 1px solid var(--border); }
	.iter-axis { position: relative; height: 42px; }
	.iter-line { position: absolute; left: 0; right: 0; height: 1px; background: var(--chart-grid); }
	.iter-line.top { top: 12px; }
	.iter-line.bot { top: 30px; }
	.iter-span {
		position: absolute; top: 7px; height: 10px; min-width: 9px; border-radius: 4px;
		border: 0; padding: 0; box-shadow: 0 0 0 2px var(--panel);
		transition: filter .13s var(--ease);
	}
	.iter-span:hover { filter: brightness(1.12); z-index: 2; }
	.iter-pt {
		position: absolute; top: 26px; width: 8px; height: 8px; margin-left: -4px; border-radius: 50%;
		border: 0; padding: 0; box-shadow: 0 0 0 2px var(--panel);
	}
	.iter-times { display: flex; justify-content: space-between; margin-top: 4px; font: 11px/1 var(--mono); color: var(--fg-subtle); }
	.iter-row { border-bottom: 1px solid var(--border); }
	.iter-row:last-child { border-bottom: 0; }
	.iter-row > summary {
		display: flex; align-items: center; gap: 9px; padding: 10px 16px; cursor: pointer; list-style: none;
		font-size: 13px; transition: background-color .13s var(--ease);
	}
	.iter-row > summary::-webkit-details-marker { display: none; }
	.iter-row > summary:hover { background: var(--hover); }
	.iter-row-body { padding: 4px 16px 14px 41px; display: flex; flex-direction: column; gap: 8px; font-size: 13px; }
	.iter-end { margin-left: auto; font: 12px/1 var(--mono); color: var(--fg-subtle); white-space: nowrap; }

	/* Decision Workbench (Enhanced Relay cards) */
	.wb-card { border: 1px solid var(--warn-line); box-shadow: var(--shadow-card); }
	.wb-head {
		display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px;
		padding: 13px 16px; border-bottom: 1px solid var(--border);
		background: var(--warn-soft); border-radius: 11px 11px 0 0;
	}
	.wb-head h2 { display: flex; align-items: center; gap: 7px; font-size: 14px; font-weight: 600; color: var(--warn); }
	.wb-plan { padding: 14px 16px; border-bottom: 1px solid var(--border); }
	.wb-plan-top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; }
	.wb-plan-top h3 { font-size: 14px; font-weight: 600; }
	.outline { max-width: 78ch; margin: 10px 0 0; padding-left: 18px; font-size: 13.5px; color: var(--fg-muted); }
	.outline li + li { margin-top: 5px; }
	.wb-facts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
	.need { padding: 16px; border-top: 1px solid var(--border); }
	.need:first-child { border-top: 0; }
	.need.blocking { box-shadow: inset 3px 0 0 var(--warn-dot); }
	.need-top { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; font-size: 12px; color: var(--fg-subtle); }
	.need-top time { margin-left: auto; }
	.q-num { display: inline-flex; align-items: center; justify-content: center; width: 20px; height: 20px; border-radius: 6px; background: var(--muted); color: var(--fg-muted); font: 600 11.5px/1 var(--mono); }
	.kind-lbl { font-weight: 600; color: var(--warn); }
	.kind-lbl.quiet { color: var(--fg-subtle); font-weight: 500; }
	.question { max-width: 78ch; margin-top: 7px; font-size: 14.5px; line-height: 1.45; font-weight: 600; overflow-wrap: anywhere; }
	.q-more { max-width: 78ch; margin-top: 4px; font-size: 13px; color: var(--fg-muted); overflow-wrap: anywhere; }
	.opt-list { display: grid; gap: 7px; margin-top: 11px; max-width: 76ch; }
	.opt-card {
		display: flex; align-items: flex-start; gap: 10px; width: 100%;
		padding: 9px 12px; border: 1px solid var(--border-strong); border-radius: 9px;
		background: var(--panel); color: var(--fg); font: 13px/1.45 var(--sans); text-align: left;
		transition: border-color .13s var(--ease), background-color .13s var(--ease), box-shadow .13s var(--ease);
	}
	.opt-card:hover { background: var(--hover); }
	.opt-card.picked { border-color: var(--accent); background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent); }
	.opt-card .radio { flex: none; width: 15px; height: 15px; margin-top: 2px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px var(--border-strong); transition: box-shadow .13s var(--ease); }
	.opt-card.picked .radio { box-shadow: inset 0 0 0 4.5px var(--accent); }
	.opt-card .opt-body { min-width: 0; flex: 1; overflow-wrap: anywhere; }
	.opt-card .opt-rec { display: inline-flex; margin-left: 7px; padding: 1px 6px; border-radius: 5px; background: var(--panel); border: 1px solid var(--border); color: var(--fg-muted); font-size: 11px; font-weight: 500; vertical-align: 1px; }
	.opt-card.custom-toggle { color: var(--fg-muted); border-style: dashed; }
	.opt-custom-box { margin-top: 6px; }
	.opt-custom-box textarea { min-height: 54px; font-size: 13px; }
	.answered-row { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 10px; padding: 10px 16px; border-top: 1px solid var(--border); font-size: 13px; color: var(--fg-muted); }
	.answered-row .ok-mark { color: var(--ok); font-weight: 700; }
	.answered-row .ans-val { color: var(--fg); font-weight: 500; }
	.wb-feedback { padding: 12px 16px; border-top: 1px solid var(--border); background: var(--panel); }
	.wb-feedback textarea { min-height: 62px; font-size: 13px; }
	.wb-bar {
		display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 14px;
		padding: 12px 16px; border-top: 1px solid var(--border);
		background: var(--surface); border-radius: 0 0 11px 11px;
	}
	.wb-bar-meta { display: grid; gap: 4px; min-width: 0; }
	.wb-status { font-size: 12.5px; color: var(--fg-muted); }
	.wb-status.warn { color: var(--warn); font-weight: 500; }
	.wb-auto { display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--fg-muted); cursor: pointer; user-select: none; }
	.wb-auto input { width: 14px; height: 14px; margin: 0; accent-color: var(--accent); cursor: pointer; }
	.own { display: flex; gap: 8px; align-items: flex-end; max-width: 720px; margin-top: 12px; }
	.own textarea { min-height: 34px; height: 34px; }

	/* Findings (Relay-style severity bars + cards) */
	.sev-chart { padding: 12px 16px; border-bottom: 1px solid var(--border); display: grid; gap: 8px; }
	.sev-row {
		display: grid; grid-template-columns: 84px minmax(0, 1fr) 28px; align-items: center; gap: 10px;
		padding: 3px 6px; margin: -3px -6px; border: 0; border-radius: 6px; background: transparent;
		font: 12px/1.2 var(--sans); color: var(--fg-muted); text-align: left;
	}
	.sev-row:hover { background: var(--hover); }
	.sev-row.on { background: var(--accent-soft); color: var(--accent-text); font-weight: 600; }
	.sev-bar { height: 10px; border-radius: 4px; background: var(--chart-empty); display: flex; overflow: hidden; }
	.finding-item { padding: 14px 16px; border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 7px; }
	.finding-item:last-child { border-bottom: 0; }
	.finding-code { padding: 9px 11px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); font-size: 13px; color: var(--fg-muted); }
	.finding-path { font: 500 11.5px/1.3 var(--mono); color: var(--fg-subtle); margin-bottom: 4px; }

	/* Steer / message box */
	.steer { padding: 12px 14px; }
	.steer-row { display: flex; gap: 8px; align-items: flex-end; }
	.steer-row textarea { min-height: 34px; height: 34px; font-size: 13px; }

	/* Markdown */
	.md { max-width: 78ch; overflow-wrap: anywhere; font-size: 13.5px; line-height: 1.6; }
	.md > * + * { margin-top: 9px; }
	.md h3, .md h4, .md h5, .md h6 { font-size: 14px; font-weight: 600; color: var(--fg); }
	.md h3 { font-size: 15px; }
	.md * + h3, .md * + h4 { margin-top: 18px; }
	.md p, .md li { color: var(--fg-muted); }
	.md ul, .md ol { margin: 0; padding-left: 20px; }
	.md li + li { margin-top: 4px; }
	.md strong { font-weight: 600; color: var(--fg); }
	.md code { padding: 1px 5px; border-radius: 5px; border: 1px solid var(--border); background: var(--muted); font: 12px/1.4 var(--mono); color: var(--fg); }
	.md pre code { padding: 0; border: 0; background: none; }
	.md a { color: var(--accent-text); text-underline-offset: 3px; }
	.md blockquote { margin: 0; padding-left: 12px; border-left: 2px solid var(--border-strong); color: var(--fg-muted); }
	.md hr { border: 0; border-top: 1px solid var(--border); }
	.md .table { overflow-x: auto; }
	.md table { min-width: 100%; border-collapse: collapse; font-size: 12.5px; }
	.md th, .md td { padding: 6px 10px 6px 0; border-bottom: 1px solid var(--border); text-align: left; vertical-align: top; }
	.md th { font-weight: 600; color: var(--fg); }
	.quote { padding-left: 11px; border-left: 2px solid var(--border-strong); white-space: pre-wrap; font-size: 13px; }
	.quote.md { white-space: normal; }
	.quote.hidden { color: var(--fg-subtle); font-style: italic; }

	/* Timeline */
	.tl { margin: 12px 16px 12px 22px; padding: 2px 0 2px 16px; border-left: 1px solid var(--border-strong); }
	.tl > div { position: relative; padding: 6px 0; font-size: 13px; color: var(--fg-muted); overflow-wrap: anywhere; }
	.tl > div::before { content: ""; position: absolute; left: -20px; top: 13px; width: 7px; height: 7px; border-radius: 50%; background: var(--fg-subtle); box-shadow: 0 0 0 3px var(--panel); }
	.tl > div:first-child { color: var(--fg); font-weight: 500; }
	.tl > div:first-child::before { background: var(--accent); }
	.tl time { display: block; font: 11.5px/1.3 var(--mono); color: var(--fg-subtle); margin-top: 2px; }

	/* Visual Proof, Measurements, Claims, Preview */
	.shots { display: grid; gap: 20px; padding: 16px; }
	.shots h3 { font-size: 13.5px; font-weight: 600; }
	.shots h3 + p { margin-top: 2px; font-size: 12.5px; color: var(--fg-muted); }
	.shot-row { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 240px), 1fr)); gap: 12px; margin-top: 10px; }
	.shot-row.pair { grid-template-columns: repeat(2, minmax(0, 1fr)); }
	.shot { position: relative; display: block; width: 100%; padding: 0; border: 0; border-radius: 10px; background: var(--muted); box-shadow: 0 0 0 1px var(--border-strong); overflow: hidden; cursor: zoom-in; transition: box-shadow .14s var(--ease); }
	.shot:hover { box-shadow: 0 0 0 1.5px var(--accent); }
	.shot img { display: block; width: 100%; aspect-ratio: 16 / 10; object-fit: cover; object-position: top center; }
	.shot .blank { display: grid; place-items: center; aspect-ratio: 16 / 10; color: var(--fg-subtle); font-size: 13px; }
	.tag { position: absolute; left: 8px; top: 8px; padding: 2px 7px; border-radius: 6px; background: var(--panel); color: var(--fg); font: 600 11.5px/1.4 var(--sans); box-shadow: 0 0 0 1px var(--border-strong); }
	.play-btn { position: absolute; left: 50%; top: 50%; display: grid; place-items: center; width: 44px; height: 44px; margin: -22px 0 0 -22px; border-radius: 50%; background: var(--accent-solid); color: var(--accent-fg); box-shadow: var(--shadow-md); }
	.play-btn svg { width: 18px; height: 18px; margin-left: 2px; fill: currentColor; stroke: none; }
	.env-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--fg-subtle); flex: none; }
	.env-dot.ok { background: var(--ok); }
	.env-dot.dead { background: var(--bad); }
	.btn.primary .env-dot.ok { background: #6ee7b7; box-shadow: 0 0 0 1.5px rgb(255 255 255 / 0.35); }
	.claims-head, .claim { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 3fr); gap: 4px 20px; padding: 10px 16px; }
	.claims-head { font-size: 11.5px; font-weight: 500; color: var(--fg-subtle); border-bottom: 1px solid var(--border); }
	.claim { border-bottom: 1px solid var(--border); font-size: 13px; overflow-wrap: anywhere; }
	.claim:last-child { border-bottom: 0; }
	.proof-mono { font: 12px/1.5 var(--mono); color: var(--fg-muted); white-space: pre-wrap; }
	.measures-head, .measure { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 1fr) minmax(0, 1fr); gap: 4px 18px; padding: 10px 16px; }
	.measures-head { font-size: 11.5px; font-weight: 500; color: var(--fg-subtle); border-bottom: 1px solid var(--border); }
	.measure { border-bottom: 1px solid var(--border); font-size: 13px; }
	.measure:last-child { border-bottom: 0; }
	.measures-head span + span, .measure .num { text-align: right; font-variant-numeric: tabular-nums; font-family: var(--mono); font-size: 12px; }
	.tryit { max-width: 72ch; color: var(--fg-muted); font-size: 13px; white-space: pre-wrap; overflow-wrap: anywhere; }

	/* Modals, Lightbox, Plan Sheet, Source Sheet, Command Palette, Shortcuts */
	dialog.view { width: 100vw; max-width: 100vw; height: 100dvh; max-height: 100dvh; margin: 0; padding: 0; border: 0; background: var(--bg); color: var(--fg); }
	dialog.view[open] { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; }
	.view-bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 14px; min-height: 52px; padding: 8px 16px; border-bottom: 1px solid var(--border); background: var(--panel); }
	.view-bar strong { font-size: 14.5px; font-weight: 600; }
	.view-stage { display: grid; place-items: center; min-height: 0; padding: 16px; }
	.view-stage img, .view-stage video { max-width: 100%; max-height: 100%; min-height: 0; border-radius: 8px; box-shadow: 0 0 0 1px var(--border-strong); background: var(--muted); object-fit: contain; }
	.view-stage.side { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; align-items: stretch; }
	.view-pane { display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 8px; min-height: 0; min-width: 0; }
	.view-pane-head { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--fg-muted); }
	.view-pane img { justify-self: center; align-self: center; }
	.view-note { max-width: 80ch; margin: 0 auto; padding: 0 16px 16px; text-align: center; color: var(--fg-muted); font-size: 13px; }
	.view-note:empty { display: none; }

	dialog.sheet { width: min(560px, 100vw); max-width: 100vw; height: 100dvh; max-height: 100dvh; margin: 0 0 0 auto; padding: 0; border: 0; border-left: 1px solid var(--border); background: var(--panel); color: var(--fg); box-shadow: var(--shadow-lg); }
	dialog.sheet.wide { width: min(840px, 100vw); }
	dialog.sheet[open] { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; }
	dialog.sheet.no-foot[open] { grid-template-rows: auto minmax(0, 1fr); }
	dialog.sheet { border-radius: 0; }
	dialog:focus, dialog:focus-visible { outline: none; }

	/*
	 * Side sheets and the mobile nav slide in from their edge and the scrim fades.
	 * The closed state holds the exit timing (faster), the open state the entry timing.
	 * display and overlay transition discretely so the sheet stays painted while it slides out.
	 */
	dialog.sheet { --sheet-from: translateX(100%); --scrim: rgb(0 0 0 / 0.45); }
	dialog.sheet, dialog.drawer-nav {
		transform: var(--sheet-from);
		transition: transform .2s var(--ease), overlay .2s allow-discrete, display .2s allow-discrete;
	}
	dialog.sheet[open], dialog.drawer-nav[open] {
		transform: none;
		transition: transform .32s var(--ease-drawer), overlay .32s allow-discrete, display .32s allow-discrete;
	}
	dialog.sheet::backdrop, dialog.drawer-nav::backdrop {
		background: transparent;
		transition: background-color .2s var(--ease), overlay .2s allow-discrete, display .2s allow-discrete;
	}
	dialog.sheet[open]::backdrop { background: var(--scrim); }
	dialog.drawer-nav[open]::backdrop { background: rgb(0 0 0 / 0.45); }
	dialog.sheet[open]::backdrop, dialog.drawer-nav[open]::backdrop { transition-duration: .32s; }
	@starting-style {
		dialog.sheet[open], dialog.drawer-nav[open] { transform: var(--sheet-from); }
		dialog.sheet[open]::backdrop, dialog.drawer-nav[open]::backdrop { background: transparent; }
	}
	html:has(dialog.sheet[open], dialog.drawer-nav[open]) { overflow: hidden; }
	.sheet-body { overflow-y: auto; overscroll-behavior: contain; padding: 20px 24px 36px; display: grid; gap: 16px; align-content: start; }
	.sheet-foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 13px 24px; border-top: 1px solid var(--border); background: var(--surface); }

	dialog.modal {
		width: min(580px, calc(100vw - 32px)); max-height: min(76dvh, 580px);
		margin: 10dvh auto auto; padding: 0; border: 1px solid var(--border-strong); border-radius: 14px;
		background: var(--panel); color: var(--fg); box-shadow: var(--shadow-lg); overflow: hidden;
	}
	dialog.modal::backdrop { background: rgb(0 0 0 / 0.48); backdrop-filter: blur(2px); }
	dialog.modal[open] { display: flex; flex-direction: column; }
	.cmd-input-wrap { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--border); }
	.cmd-input-wrap input { border: 0; background: transparent; padding: 0; height: 28px; font-size: 14.5px; box-shadow: none !important; }
	.cmd-list { overflow-y: auto; padding: 6px; display: flex; flex-direction: column; gap: 2px; max-height: 420px; }
	.cmd-sec { padding: 8px 10px 4px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; color: var(--fg-subtle); }
	.cmd-item {
		display: flex; align-items: center; gap: 10px; width: 100%;
		padding: 8px 10px; border: 0; border-radius: 8px; background: transparent;
		color: var(--fg); font: 13px/1.3 var(--sans); text-align: left;
	}
	.cmd-item:hover, .cmd-item.sel { background: var(--hover); }
	.cmd-item.sel { background: var(--accent-soft); color: var(--accent-text); }
	.cmd-item .cmd-meta { margin-left: auto; font-size: 11.5px; color: var(--fg-subtle); white-space: nowrap; }
	.cmd-foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 14px; border-top: 1px solid var(--border); background: var(--surface); font-size: 11.5px; color: var(--fg-subtle); }

	.sc-body { padding: 16px 20px 20px; overflow-y: auto; display: grid; gap: 16px; }
	.sc-group h3 { font-size: 11.5px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; color: var(--fg-subtle); margin-bottom: 8px; }
	.sc-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 5px 0; font-size: 13px; border-bottom: 1px solid var(--border); }
	.sc-row:last-child { border-bottom: 0; }
	.sc-keys { display: inline-flex; gap: 4px; }

	/* Intake Workspace */
	.in-grid { display: grid; grid-template-columns: 236px minmax(0, 1fr); grid-template-rows: auto 1fr; column-gap: 24px; align-items: start; }
	.in-sources { grid-column: 1; grid-row: 1; }
	.in-conns { grid-column: 1; grid-row: 2; margin-top: 18px; border-top: 1px solid var(--border); padding-top: 14px; }
	.in-queue { grid-column: 2; grid-row: 1 / span 2; min-width: 0; }
	.in-sec-head { display: flex; align-items: center; justify-content: space-between; padding: 0 8px 6px; font-size: 11.5px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; color: var(--fg-subtle); }
	.in-nav { display: grid; gap: 2px; }
	.in-nav-item { position: relative; display: flex; align-items: center; }
	.in-nav-btn {
		display: flex; align-items: center; gap: 8px; width: 100%; height: 32px; padding: 0 10px;
		border: 0; border-radius: 7px; background: transparent; color: var(--fg-muted);
		font: 500 13px/1 var(--sans); text-align: left;
	}
	.in-nav-btn:hover { background: var(--hover); color: var(--fg); }
	.in-nav-btn.on { background: var(--hover); color: var(--fg); }
	.in-nav-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
	.in-nav-cnt { font: 500 11.5px/1 var(--mono); color: var(--fg-subtle); }
	.in-nav-edit { position: absolute; right: 5px; width: 22px; height: 22px; display: inline-flex; align-items: center; justify-content: center; border: 0; border-radius: 5px; background: var(--hover); color: var(--fg-subtle); opacity: 0; }
	.in-nav-item:hover .in-nav-edit, .in-nav-item:focus-within .in-nav-edit { opacity: 1; }
	.in-nav-edit:hover { color: var(--fg); background: var(--panel); box-shadow: inset 0 0 0 1px var(--border-strong); }
	.in-conn { padding: 7px 8px; border-radius: 8px; }
	.in-conn-row { display: flex; align-items: center; gap: 8px; font-size: 12.5px; }
	.in-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--fg-subtle); flex: none; }
	.in-dot.ok { background: var(--ok); }
	.in-dot.bad { background: var(--bad); }
	.in-conn-val { margin-left: auto; font-size: 12px; color: var(--fg-subtle); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
	.in-conn-form { display: grid; gap: 8px; margin-top: 8px; padding: 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--panel); }
	.in-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; padding: 10px 14px; border-bottom: 1px solid var(--border); }
	.in-batch { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px; padding: 9px 16px; border-bottom: 1px solid var(--border); background: var(--accent-soft); font-size: 13px; color: var(--accent-text); }
	.in-row {
		display: grid; grid-template-columns: 20px 84px minmax(0, 1fr) auto; column-gap: 12px;
		align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--border);
		transition: background-color .13s var(--ease);
		contain: layout style;
		content-visibility: auto; contain-intrinsic-size: auto 72px;
	}
	.in-row:last-child { border-bottom: 0; }
	.in-row:hover { background: color-mix(in oklab, var(--hover) 55%, transparent); }
	.in-row input[type="checkbox"] { width: 15px; height: 15px; margin: 0; accent-color: var(--accent); cursor: pointer; }
	.in-ref { display: inline-flex; align-items: center; gap: 5px; font: 500 12px/1 var(--mono); color: var(--fg-subtle); white-space: nowrap; }
	.in-title { font-size: 13.5px; font-weight: 500; color: var(--fg); text-decoration: none; overflow-wrap: anywhere; }
	.in-title:hover { color: var(--accent-text); text-decoration: underline; text-underline-offset: 3px; }
	.in-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 5px 8px; margin-top: 4px; font-size: 12px; color: var(--fg-muted); }
	.in-tag { display: inline-flex; align-items: center; height: 19px; padding: 0 7px; border: 1px solid var(--border); border-radius: 5px; background: var(--muted); color: var(--fg-muted); font-size: 11.5px; }
	.in-tag:hover { border-color: var(--border-strong); color: var(--fg); }
	.in-tag.on { border-color: var(--accent); background: var(--accent-soft); color: var(--accent-text); }
	.in-end { display: flex; align-items: center; justify-content: flex-end; gap: 10px; }
	.in-setup { max-width: 740px; }
	.in-setup-cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; margin-top: 18px; }
	.in-setup-card { padding: 16px; display: flex; flex-direction: column; gap: 10px; }
	.in-setup-next { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin-top: 14px; padding: 16px; }
	@container (max-width: 860px) {
		.in-grid { grid-template-columns: minmax(0, 1fr); row-gap: 18px; }
		.in-sources { grid-column: 1; grid-row: 1; }
		.in-queue { grid-column: 1; grid-row: 2; }
		.in-conns { grid-column: 1; grid-row: 3; margin-top: 0; }
		.in-nav { display: flex; flex-wrap: wrap; gap: 6px; }
		.in-nav-btn { width: auto; border: 1px solid var(--border); background: var(--panel); }
		.in-nav-btn.on { border-color: var(--accent); background: var(--accent-soft); color: var(--accent-text); }
		.in-nav-edit { display: none; }
		.in-row { grid-template-columns: 20px minmax(0, 1fr); row-gap: 6px; }
		.in-ref { grid-column: 2; }
		.in-main { grid-column: 1 / -1; }
		.in-end { grid-column: 1 / -1; justify-content: space-between; }
		.in-setup-cards { grid-template-columns: minmax(0, 1fr); }
	}

	/* Settings */
	.sgrid { display: grid; grid-template-columns: 224px minmax(0, 1fr); gap: 28px; align-items: start; }
	.snav { position: sticky; top: 66px; display: grid; gap: 2px; }
	.snav-h { margin-top: 14px; padding: 0 10px 4px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; color: var(--fg-subtle); }
	.snav button {
		display: flex; align-items: center; justify-content: space-between; gap: 8px;
		height: 32px; padding: 0 10px; border: 0; border-radius: 7px;
		background: transparent; color: var(--fg-muted); font: 500 13px/1 var(--sans); text-align: left;
	}
	.snav button:hover, .snav button.on { background: var(--hover); color: var(--fg); }
	.snav .where { font-size: 11.5px; font-weight: 400; color: var(--fg-subtle); }
	.shead h2 { font-size: 17px; font-weight: 600; letter-spacing: -0.015em; }
	.shead p { margin-top: 3px; font-size: 13px; color: var(--fg-muted); max-width: 72ch; }
	.sgrid .card, .sgrid .notice { margin-top: 16px; }
	.choice { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
	.opt {
		display: flex; gap: 11px; padding: 14px; border: 1px solid var(--border-strong); border-radius: 10px;
		background: var(--panel); color: var(--fg); font: 13.5px/1.4 var(--sans); text-align: left;
	}
	.opt:hover { background: var(--hover); }
	.opt.on { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); background: var(--accent-soft); cursor: default; }
	.opt i { flex: none; width: 15px; height: 15px; margin-top: 2px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px var(--border-strong); }
	.opt.on i { box-shadow: inset 0 0 0 4.5px var(--accent); }
	.opt strong { display: block; font-weight: 600; }
	.opt span span { display: block; margin-top: 2px; font-size: 12.5px; color: var(--fg-muted); }
	.part { padding: 18px; border-top: 1px solid var(--border); }
	.part:first-child { border-top: 0; }
	.part > h3 { font-size: 14px; font-weight: 600; }
	.part > h3 + p { max-width: 72ch; margin-top: 2px; font-size: 12.5px; color: var(--fg-muted); }
	.part > h3 ~ div { margin-top: 14px; }
	.stages-head, .stage { display: grid; grid-template-columns: 188px repeat(3, minmax(0, 1fr)); gap: 8px 12px; align-items: start; }
	.stages-head { padding-bottom: 6px; font-size: 12px; font-weight: 500; color: var(--fg-subtle); }
	.stage { padding: 14px 0; border-top: 1px solid var(--border); }
	.stage:last-child { padding-bottom: 0; }
	.stage .who { grid-row: span 2; padding-top: 6px; }
	.stage .who strong { display: block; font-weight: 600; text-transform: capitalize; }
	.stage .note { grid-column: 2 / -1; }
	.stage .note textarea { min-height: 52px; }
	.stage .flabel { display: none; }
	.savebar { position: sticky; bottom: 0; display: flex; align-items: center; gap: 12px; padding: 12px 18px; border-top: 1px solid var(--border); border-radius: 0 0 var(--radius-box) var(--radius-box); background: var(--surface); }
	.savebar .state { font-size: 12.5px; color: var(--fg-muted); }
	.foot { max-width: 72ch; margin-top: 24px; font-size: 12.5px; color: var(--fg-subtle); }
	@container (max-width: 980px) {
		.stages-head { display: none; }
		.stage { grid-template-columns: repeat(3, minmax(0, 1fr)); }
		.stage .who, .stage .note { grid-column: 1 / -1; grid-row: auto; padding-top: 0; }
		.stage .flabel { display: block; }
	}
	@container (max-width: 820px) { .sgrid { grid-template-columns: minmax(0, 1fr); gap: 20px; } .snav { position: static; } }
	@container (max-width: 540px) { .stage, .choice { grid-template-columns: minmax(0, 1fr); } }

	/* Toast notification */
	.toast {
		position: fixed; right: 20px; bottom: 20px; z-index: 90;
		padding: 9px 14px; border-radius: 9px;
		background: var(--fg); color: var(--bg); font: 500 13px/1.3 var(--sans);
		box-shadow: var(--shadow-md); opacity: 0; pointer-events: none;
		transform: translateY(8px); transition: opacity .16s var(--ease), transform .16s var(--ease);
	}
	.toast.show { opacity: 1; transform: translateY(0); }

	/* Responsive breakpoint for sidebar -> mobile drawer */
	@media (max-width: 1000px) {
		.sidebar { display: none; }
		.btn.menu-btn { display: inline-flex; }
		.topbar { padding: 0 14px; }
		main.main { padding: 18px 16px 64px; }
		.filter-bar { margin-bottom: 14px; }
		.cmd-trigger { width: auto; padding: 0 9px; }
		.cmd-trigger .cmd-lbl, .top-conn { display: none; }
	}

	/* Embedded mode (?embed=1, e.g. inside Agentgate): host owns sidebar and top bar. */
	html[data-embed="1"], html[data-embed="1"] body { background: transparent; }
	html[data-embed="1"] .sidebar, html[data-embed="1"] .topbar { display: none !important; }
	html[data-embed="1"] .shell { min-height: 100%; }
	html[data-embed="1"] main.main { max-width: 1200px; padding: 12px 24px 48px; }
	html[data-embed="1"] .filter-bar { margin-bottom: 14px; }
	html[data-embed="1"] .page-head > div:first-child { display: none; }
	html[data-embed="1"] .page-head:not(:has(> :nth-child(2))) { display: none; }
	html[data-embed="1"] .page-head { margin-bottom: 14px; justify-content: flex-end; }
	/*
	 * Inside the host the scrim only covers the iframe, so an edge-to-edge sheet reads as a box
	 * pasted on top. Float it as a card with the host's radius and a lighter scrim instead.
	 */
	html[data-embed="1"] dialog.sheet {
		--sheet-from: translateX(calc(100% + 16px));
		--scrim: rgb(0 0 0 / 0.16);
		height: calc(100dvh - 16px); max-height: calc(100dvh - 16px); max-width: calc(100vw - 16px);
		margin: 8px 8px 8px auto; border: 1px solid var(--border); border-radius: var(--radius-box);
		overflow: hidden;
	}
	html.dark[data-embed="1"] dialog.sheet { --scrim: rgb(0 0 0 / 0.4); }
	.embed-back {
		display: inline-flex; align-items: center; gap: 6px; margin-bottom: 10px;
		color: var(--fg-subtle); font-size: 12.5px; font-weight: 500; text-decoration: none;
	}
	.embed-back:hover { color: var(--fg); }
</style>
</head>
<body>
<div class="shell">
	<aside class="sidebar" id="sidebar" aria-label="Navigation"></aside>
	<div class="workspace">
		<header class="topbar">
			<button type="button" class="btn icon-only menu-btn" id="menu-btn" aria-label="Open navigation"></button>
			<nav class="crumb" id="crumb" aria-label="Breadcrumb"></nav>
			<button type="button" class="cmd-trigger" id="cmd-btn" aria-label="Search and commands">
				<span class="ic sm" id="cmd-ic"></span>
				<span class="cmd-lbl">Search...</span>
				<span class="kbd">⌘K</span>
			</button>
			<span class="top-conn" id="top-conn" hidden><i></i><span>Reconnecting</span></span>
			<button type="button" class="btn primary sm" id="new-btn"></button>
		</header>
		<main class="main" id="main" tabindex="-1"></main>
	</div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

function appendNodes(parent, item) {
	if (item === null || item === undefined || item === false) return
	if (Array.isArray(item)) {
		for (let i = 0; i < item.length; i++) appendNodes(parent, item[i])
	} else if (item instanceof Node) {
		parent.appendChild(item)
	} else {
		parent.appendChild(document.createTextNode(String(item)))
	}
}

function h(tag, attrs, ...children) {
	const el = document.createElement(tag)
	if (attrs) {
		for (const key in attrs) {
			const value = attrs[key]
			if (value === undefined || value === null || value === false) continue
			if (key.charCodeAt(0) === 111 && key.charCodeAt(1) === 110) el.addEventListener(key.slice(2), value)
			else if (key === 'class') el.className = value
			else el.setAttribute(key, value === true ? '' : value)
		}
	}
	for (let i = 0; i < children.length; i++) appendNodes(el, children[i])
	return el
}

// Opens a side sheet with focus on the sheet itself, so its Close button does not light up a focus ring.
// Tab still moves into the sheet and Esc closes it.
function showSheet(el) {
	el.showModal()

}

// Waits out the sheet's exit transition (.2s) before emptying it, unless it reopened meanwhile.
function emptyAfterClose(el) {
	clearTimeout(el.emptyTimer)
	el.emptyTimer = setTimeout(() => { if (!el.open) el.replaceChildren() }, 240)
}

function fill(el, ...nodes) {
	const frag = document.createDocumentFragment()
	for (let i = 0; i < nodes.length; i++) appendNodes(frag, nodes[i])
	el.replaceChildren(frag)
}

function render(...nodes) {

	fill(main, ...nodes)
	const again = key && main.querySelector(`[data-draft="${CSS.escape(key)}"]`)
	if (again) {
		again.focus()
		if (caret && typeof again.setSelectionRange === 'function') again.setSelectionRange(caret[0], caret[1])
	}
}

const ICON_TEMPLATES = new Map()
function icon(name, cls = '') {
	let svg = ICON_TEMPLATES.get(name)

		else if (em || em2) res.push(h('em', {}, mdInline(em || em2)))

		else if (bare) res.push(safeLink(bare, bare))

function statusNote(s) {
	if (!s) return null
	if (s.detail === 'Paused' && s.since) return ['Paused ', lasting(s.since)]
	const parts = []
	if (s.detail) parts.push(s.detail)
	if (s.since) parts.push(lasting(s.since))
	if (s.until && s.label !== 'Usage limit') parts.push(`checks ${clock(s.until)}`)
	if (!parts.length) return null
	const out = []
	for (let k = 0; k < parts.length; k++) {
		if (k) out.push(' · ')
		out.push(parts[k])
	}
	return out
}

			let glyph = '·'
			let tip = `${cap(st.stage)}: pending`
			if (st.state === 'running') { cls = 'run'; glyph = STAGE_SHORT[st.stage][0]; tip = `${cap(st.stage)}: running` }
			else if (st.state === 'failed') { cls = 'bad'; glyph = '!'; tip = `${cap(st.stage)}: last run failed` }
			else if (st.state === 'findings') { cls = st.importantFindings ? 'bad' : 'now'; glyph = String(st.openFindings); tip = `${cap(st.stage)}: ${count(st.openFindings, 'open finding')}` }
			else if (st.state === 'current') { cls = s.tone === 'bad' ? 'bad' : 'now'; glyph = STAGE_SHORT[st.stage][0]; tip = `${cap(st.stage)}: current` }
			else if (st.state === 'done') { cls = 'done'; glyph = '✓'; tip = `${cap(st.stage)}: done` }
			else if (st.state === 'skipped') { cls = 'skip'; glyph = '-'; tip = `${cap(st.stage)}: skipped` }
			return h('span', { class: `lane ${cls}`, title: tip }, glyph)
		})
	)
}

function ciBadge(state) {
	if (!state) return null
	if (state === 'passing') return chip('CI pass', 'ok', true)
	if (state === 'failing') return chip('CI fail', 'bad', true)
	if (state === 'pending') return chip('CI running', 'accent', true)
	if (state === 'absent') return chip('no CI')
	return chip(`CI ${state}`)
}

// ---- History loader (for Dashboard & Done; board.done already carries 30d metrics) ----

function historyFromBoard(days) {
	if (!loaded || days > 30) return null
	if (board.done.some((i) => i.minutes === undefined)) return null
	const cutoff = Date.now() - days * 86400000
	return { days, issues: board.done.filter((i) => (i.closedAt || 0) > cutoff) }
}

async function loadHistory(days) {
	const local = historyFromBoard(days)
	if (local) return local
	const cached = historyCache.get(days)
	if (cached && Date.now() - cached.at < 30000) return cached.data
	try {
		const data = await api('GET', `/api/history?days=${days}`)
		historyCache.set(days, { at: Date.now(), data })
		return data
	} catch {
		return cached?.data || { days, issues: [] }
	}
}
