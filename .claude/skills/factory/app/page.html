function renderIssueData(data, tab = 'overview') {
	const id = data.issue.id
	currentIssueData = data
	const i = data.issue
	const pending = data.decisions.filter((d) => isOpenDec(d) || (d.answeredVia === 'page' && d.delivery !== 'sent'))
	const activeRun = data.runs.findLast((r) => r.state === 'running')
	const status = data.derived
	const brief = data.brief || {}
	const shots = data.evidence || []
	const findings = data.findings || []
	const items = data.items || []
	if (data.preview?.state === 'up') probe(id)
	else probes.delete(id)

	const reviewCount = findings.length + items.length
	const openFindings = findings.filter(isOpenFinding)
	const openReviewCount = openFindings.length + items.filter((x) => x.needsAction).length
	const hasOpenMerge = pending.some((d) => isOpenDec(d) && d.kind === 'merge')
	const hasTryIt = (i.state === 'open' && (brief.built || brief.tryIt || data.preview)) || data.preview?.state === 'up'

	const TABS = [
		{ id: 'overview', label: 'Overview', cnt: 0 },
		{ id: 'reviews', label: 'Reviews', cnt: openReviewCount || reviewCount, hot: openReviewCount > 0 },
		{ id: 'activity', label: 'Activity', cnt: data.runs.length },
		{ id: 'issue', label: 'Issue', cnt: 0 }
	]
	const tabAlias = { decisions: 'activity', runs: 'activity', proof: 'overview', source: 'issue' }[tab] || tab
	const activeTab = TABS.some((t) => t.id === tabAlias) ? tabAlias : 'overview'
	const dataSeq = data._seq || (data._seq = ++issueDataSeq)
	const scheduleClamps = (node) => {
		const clamps = node.querySelectorAll('.clamp')
		if (!clamps.length) return
		requestAnimationFrame(() => {
			if (!node.isConnected) return
			for (const el of clamps) el.classList.toggle('cut', el.scrollHeight > el.clientHeight)
		})
	}
	const tabSlot = `issue-tab:${id}:${activeTab}`
	const tabSig = `${dataSeq}|${activeTab === 'overview' || activeTab === 'reviews' ? (findingSevFilter.get(id) || '') : ''}|${activeTab === 'overview' ? (probes.get(id)?.at || 0) : ''}`

	let tabBody = getCachedView(tabSlot, tabSig)
	let tabFromCache = !!tabBody
	if (!tabBody) {
		if (activeTab === 'overview') {
			const decisionBlocks = pending.length ? decisionWorkbench(data, pending, brief) : []
			const visualBlocks = [
				(shots.length || brief.media) ? galleryCard(shots, brief.media) : null,
				measuredCard(brief.measured, data.pr?.head),
				hasOpenMerge ? headsupCard(brief, data.reviewRisk) : null
			].filter(Boolean)

			tabBody = h('div', { class: 'trail-grid page-enter', id: 'issue-tab-body' },
				h('div', { class: 'trail-main' },
					...(hasOpenMerge ? [...visualBlocks, ...decisionBlocks] : [...decisionBlocks]),
					data.report
						? h('section', { class: 'card' }, h('div', { class: 'card-head' }, h('h2', {}, 'Closing report')), h('div', { style: 'padding:16px' }, h('div', { class: 'md' }, md(data.report))))
						: briefCard(data),
					status.running && activeRun && !pending.length ? liveActivityCard(activeRun, data.events) : null,
					!hasOpenMerge ? visualBlocks : null,
					!hasOpenMerge ? headsupCard(brief, data.reviewRisk) : null,
					openFindings.length ? findingsCard(i.id, openFindings, true) : null,
					i.state === 'open' && !i.threadGone ? steerCard(i) : null
				),
				h('aside', { class: 'trail-side' },
					mergeGateBox(data, status, pending, activeRun),
					hasTryIt ? previewCard(i, data.preview, brief.tryIt, data.pr?.head) : null
				)
			)
		} else if (activeTab === 'reviews') {
			tabBody = h('div', { class: 'stack page-enter', id: 'issue-tab-body', style: 'max-width:960px' },
				findingsCard(i.id, findings, false),
				githubItemsCard(items),
				!findings.length && !items.length ? h('section', { class: 'card' }, h('div', { class: 'empty' }, h('h3', {}, 'No review findings yet'), h('p', {}, 'Internal review findings and GitHub review threads appear here once a review runs.'))) : null
			)
		} else if (activeTab === 'activity') {
			tabBody = h('div', { class: 'stack page-enter', id: 'issue-tab-body', style: 'max-width:960px' },
				iterationsCard(data, false),
				data.decisions.length
					? h('section', { class: 'card' }, h('div', { class: 'card-head' }, h('h2', {}, 'Decisions', h('span', { class: 'count-pill', style: 'height:19px;font-size:11px' }, data.decisions.length))), ...data.decisions.slice().reverse().map(decisionRow))
					: null,
				data.events.length ? h('section', { class: 'card' },
					h('div', { class: 'card-head' }, h('h2', {}, 'Event timeline', h('span', { class: 'count-pill', style: 'height:19px;font-size:11px' }, data.events.length))),
					h('div', { class: 'tl' }, ...data.events.slice().reverse().map((e) => h('div', {}, cap(e.text), h('time', {}, clock(e.at)))))
				) : null,
				!data.runs.length && !data.events.length ? h('section', { class: 'card' }, h('div', { class: 'empty' }, h('h3', {}, 'No activity recorded yet'))) : null
			)
		} else {
			tabBody = h('div', { class: 'stack page-enter', id: 'issue-tab-body', style: 'max-width:860px' },
				h('section', { class: 'card' },
					h('div', { class: 'card-head' },
						h('h2', {}, 'The issue as taken in'),
						i.source ? (isUrl(i.source) ? out(i.source, 'Open source', 'out') : h('span', { class: 'mono subtle' }, i.source)) : null
					),
					h('div', { style: 'padding:18px' }, data.body ? h('div', { class: 'md' }, md(data.body)) : h('p', { class: 'muted' }, '(no description text)'))
				),
				claimsCard(brief.claims)
			)
		}
		putCachedView(tabSlot, tabSig, tabBody)
	}

	const syncTabButtons = (root) => {
		for (const btn of root.querySelectorAll('.tabs .tab-btn')) {
			const on = btn.dataset.tab === activeTab
			btn.classList.toggle('on', on)
			if (on) btn.setAttribute('aria-current', 'page')
			else btn.removeAttribute('aria-current')
		}
	}

	// Fast path 1: switching tabs on the same issue with unchanged data swaps only the tab body.
	const existingBody = renderedIssueShellId === id && renderedIssueShellData === data && !justSubmitted
		? main.querySelector('#issue-tab-body')
		: null
	if (existingBody) {
		syncTabButtons(main)
		if (existingBody !== tabBody) existingBody.replaceWith(tabBody)
		if (!tabFromCache) scheduleClamps(tabBody)
		return
	}

	drawSidebar()
	drawBreadcrumb([
		{ label: i.state === 'open' ? 'Board' : 'Done', href: i.state === 'open' ? '#/' : '#/done' },
		{ label: repoShort(i.repo), href: '#/', onclick: () => setRepoScope(i.repo) },
		{ label: prNumber(i.prUrl) ? `#${prNumber(i.prUrl)} · ${i.title}` : i.title }
	])

	// Fast path 2: returning to an issue whose shell DOM is cached in memory.
	const shellSlot = `issue:${id}`
	const shellSig = `${dataSeq}|${boardVersion}|${repoScope}|${justSubmitted?.issueId === id ? justSubmitted.label : ''}`
	const cachedShell = getCachedView(shellSlot, shellSig)
	if (cachedShell) {
		syncTabButtons(cachedShell)
		const curBody = cachedShell.querySelector('#issue-tab-body')
		if (curBody && curBody !== tabBody) curBody.replaceWith(tabBody)
		render(cachedShell)
		renderedIssueShellId = id
		renderedIssueShellData = data
		if (!tabFromCache) scheduleClamps(tabBody)
		return
	}

	// Triage stepper across waiting issues
	const waitingIssues = board.issues.filter((x) => inScope(x) && x.needsYou)
	const idxInQueue = waitingIssues.findIndex((x) => x.id === id)
	const otherWaiting = waitingIssues.filter((x) => x.id !== id)
	const prevWaiting = idxInQueue > 0 ? waitingIssues[idxInQueue - 1] : null
	const nextWaiting = idxInQueue >= 0 && idxInQueue + 1 < waitingIssues.length ? waitingIssues[idxInQueue + 1] : otherWaiting[0] || null
	const triageNav = waitingIssues.length > 1 || (idxInQueue < 0 && otherWaiting.length > 0) ? h('div', { class: 'triage-nav' },
		h('span', { class: 'triage-badge' }, idxInQueue >= 0 ? `Needs you ${idxInQueue + 1} / ${waitingIssues.length}` : `${otherWaiting.length} waiting`),
		prevWaiting ? h('a', { class: 'btn sm', href: issueHref(prevWaiting), title: prevWaiting.title }, icon('prev', 'sm'), 'Prev') : null,
		nextWaiting ? h('a', { class: 'btn sm', href: issueHref(nextWaiting), title: nextWaiting.title }, 'Next', icon('next', 'sm')) : null
	) : null

	// Prefetch triage neighbors so Prev / Next clicks are instant.
	if (nextWaiting) prefetchIssue(nextWaiting.id)
	if (prevWaiting) prefetchIssue(prevWaiting.id)

	const submittedBanner = justSubmitted && justSubmitted.issueId === id ? h('div', { class: 'banner' },
		h('span', {}, h('strong', {}, '✓ '), justSubmitted.label),
		h('div', { class: 'row' },
			otherWaiting.length ? h('a', { class: 'btn primary sm', href: issueHref(otherWaiting[0]), onclick: () => { justSubmitted = null } }, `Review next (${otherWaiting.length} left)`) : null,
			h('button', { type: 'button', class: 'btn quiet sm', onclick: () => { justSubmitted = null; renderIssueData(data, route().tab) } }, 'Dismiss')
		)
	) : null

	const overviewLinkBtn = data.overview ? h('a', {
		class: 'btn sm', href: `/overview/${encodeURIComponent(i.id)}`, target: '_blank', rel: 'noreferrer',
		title: data.overview.stale ? `Written for ${shortSha(data.overview.head)}; PR moved since` : 'High-level PR overview page'
	}, icon('doc', 'sm'), data.overview.stale ? 'PR Overview (older)' : 'PR Overview') : null

	const statusToneChip = i.state !== 'open'
		? chip(outcomeName(i.outcome || i.state), i.outcome === 'shipped' ? 'ok' : '', true)
		: status.tone === 'warn' ? chip('Needs you', 'warn', true)
		: status.tone === 'bad' ? chip(statusLabel(status), 'bad', true)
		: status.running ? chip('Working', 'accent', true)
		: chip(statusLabel(status), '', true)

	const issueShell = h('div', { class: 'issue-shell' },
		EMBED ? h('a', { class: 'embed-back', href: i.state === 'open' ? '#/' : '#/done' }, icon('back', 'sm'), i.state === 'open' ? 'Back to Board' : 'Back to Done') : null,
		submittedBanner,
		h('header', { class: 'issue-head' },
			h('div', { class: 'issue-head-row' },
				h('h1', {}, i.title),
				triageNav
			),
			h('div', { class: 'issue-meta' },
				statusToneChip,
				repoChip(i.repo),
				i.kind ? h('span', { class: 'subtle' }, i.kind) : null,
				prNumber(i.prUrl) ? h('span', { class: 'mono subtle' }, `#${prNumber(i.prUrl)}`) : null,
				diffstat(i.size),
				data.pr ? ciBadge(data.pr.checks.state) : null,
				data.autoShip && i.state === 'open' ? chip('auto-ship', 'accent') : null,
				h('span', { class: 'subtle' }, 'started ', when(i.createdAt))
			),
			h('div', { class: 'row', style: 'justify-content:space-between;margin-top:2px' },
				h('div', { class: 'row', style: 'gap:6px' },
					out(i.prUrl, prNumber(i.prUrl) ? `PR #${prNumber(i.prUrl)}` : 'PR', 'pr', 'btn sm'),
					out(i.threadLink, 'T3 Thread', 'thread', 'btn sm'),
					overviewLinkBtn,
					isUrl(i.source) && i.source !== i.prUrl ? out(i.source, 'Source', 'out', 'btn sm') : null
				),
				h('div', { class: 'row', style: 'gap:4px' },
					h('button', { type: 'button', class: 'btn quiet sm', onclick: () => copyText(issueCopyLine(i), 'Copied issue link') }, icon('copy', 'sm'), 'Copy'),
					i.state === 'open' ? dropButton(i) : null
				)
			)
		),
		stationRail(i, status, () => navigateHash(issueHref(i, 'activity'))),
		i.configError ? h('p', { class: 'notice bad' }, i.configError) : null,
		i.threadGone ? h('p', { class: 'notice bad' }, 'T3 Code cannot find this thread any more.') : null,
		status.alarm ? h('p', { class: 'notice bad' }, status.alarm) : null,
		...(data.warnings || []).map((w) => h('p', { class: 'notice' }, w)),
		h('nav', { class: 'tabs', 'aria-label': 'Issue sections' }, ...TABS.map((t) =>
			h('button', {
				type: 'button',
				class: `tab-btn${activeTab === t.id ? ' on' : ''}`,
				'data-tab': t.id,
				'aria-current': activeTab === t.id ? 'page' : undefined,
				onclick: () => navigateHash(issueHref(i, t.id))
			}, t.label, t.cnt ? h('span', { class: `tab-cnt${t.hot ? ' hot' : ''}` }, t.cnt) : null)
		)),
		tabBody
	)
	putCachedView(shellSlot, shellSig, issueShell)
	render(issueShell)
	renderedIssueShellId = id
	renderedIssueShellData = data
	if (!tabFromCache) scheduleClamps(tabBody)
}

async function drawIssue(id, tab = 'overview', { force = false } = {}) {
	const cached = issueCache.get(id)
	if (cached) {
		renderIssueData(cached.data, tab)
		if (!cached.dirty && !force) return
		try {
			const fresh = await fetchIssueData(id, { force: true })
			if (route().page === 'issue' && route().id === id) {
				renderedIssueShellData = null
				renderIssueData(fresh, route().tab)
				notifyHostState()
			}
		} catch {}
		return
	}
	const summary = boardSummaryOf(id)
	if (summary) renderIssueShellFromBoard(summary)
	let data
	try { data = await fetchIssueData(id) } catch (e) { if (route().page === 'issue' && route().id === id) render(h('p', { class: 'error' }, e.message)); return }
	if (route().page !== 'issue' || route().id !== id) return
	renderIssueData(data, route().tab)
}

// ---- Page: Intake (#/intake) with multi-select batch start ----

const INTAKE_TTL_MS = 60_000
const intake = {
	ver: 0,
	view: null,
	fetchedAt: 0,
	viewInflight: null,
	lists: new Map(),
	itemsInflight: new Map(),
	filter: { source: '', show: 'new', label: '', state: '', assignee: '', query: '' },
	selected: new Set(), // keys: `${source.id}\n${item.key}`
	batchBusy: false,
	form: null,
	teams: null,
	starting: new Set(),
	notes: new Map(),
	linearKey: '',
	linearFormOpen: false
}
const sourceSheet = { el: null }

function persistIntakeSess() {
	if (!intake.view || intake.view.error) return
	const lists = {}
	for (const [id, st] of intake.lists.entries()) {
		if (!st.loading && !st.error && st.items) lists[id] = { items: st.items, readAt: st.readAt }
	}
	writeSess('factory-cache-intake', { view: intake.view, fetchedAt: intake.fetchedAt, lists })
}

async function loadIntake(force = false) {
	const fresh = !force && intake.view && !intake.view.error && Date.now() - intake.fetchedAt < INTAKE_TTL_MS
	let fetchedView = false
	if (!fresh) {
		fetchedView = true
		if (!force && intake.viewInflight) {
			await intake.viewInflight
		} else {
			let rawReq
			if (!force && window.__boot?.intake) {
				const p = window.__boot.intake
				window.__boot.intake = null
				rawReq = p.then(readJsonResponse)
			} else {
				rawReq = api('GET', force ? '/api/intake?refresh=1' : '/api/intake')
			}
			const req = rawReq
				.then((v) => { intake.view = v; intake.fetchedAt = Date.now(); intake.ver++; persistIntakeSess() })
				.catch((e) => { intake.view = { error: e.message, sources: [], repos: [] }; intake.ver++ })
			intake.viewInflight = req
			try { await req } finally { if (intake.viewInflight === req) intake.viewInflight = null }
		}
	}
	const ids = new Set(intake.view.sources.map((s) => s.id))
	for (const id of intake.lists.keys()) if (!ids.has(id)) intake.lists.delete(id)
	if (intake.filter.source && !ids.has(intake.filter.source)) intake.filter.source = ''
	syncIntakeFromBoard()
	const now = Date.now()
	let startedAny = false
	for (const source of intake.view.sources) {
		const st = intake.lists.get(source.id)
		if (force || !st || (!st.loading && now - (st.readAt || 0) >= INTAKE_TTL_MS)) {
			startedAny = true
			loadItems(source.id, force)
		}
	}
	// Avoid double-rendering Intake when draw() just painted fresh cached data.
	if (route().page === 'intake' && (fetchedView || !startedAny)) drawIntake()
	if (sourceSheet.el?.open && intake.form) drawSourceSheet()
}

async function loadItems(id, force = false) {
	if (!force && intake.itemsInflight.has(id)) return intake.itemsInflight.get(id)
	const before = intake.lists.get(id)
	intake.lists.set(id, { ...(before || { items: [] }), loading: true, error: null })
	intake.ver++
	if (route().page === 'intake') drawIntake()
	const req = api('GET', `/api/intake/sources/${encodeURIComponent(id)}/items${force ? '?refresh=1' : ''}`)
		.then((res) => {
			intake.lists.set(id, { loading: false, error: null, items: res.items, readAt: res.readAt })
			for (const item of res.items) intake.notes.delete(item.url)
			intake.ver++
			persistIntakeSess()
		})
		.catch((e) => {
			intake.lists.set(id, { ...(before || { items: [] }), loading: false, error: e.message })
			intake.ver++
		})
	intake.itemsInflight.set(id, req)
	try { await req } finally { if (intake.itemsInflight.get(id) === req) intake.itemsInflight.delete(id) }
	if (route().page === 'intake') drawIntake()
}

async function startItem(source, item, again) {
	intake.starting.add(item.url); intake.notes.delete(item.url); intake.ver++; drawIntake()
	try {
		const res = await api('POST', `/api/intake/sources/${encodeURIComponent(source.id)}/start`, { item: item.key, again: again || undefined })
		if (res.duplicateOf) {
			if (res.duplicateOf.id) item.factory = { id: res.duplicateOf.id, state: 'open', threadLink: res.duplicateOf.threadLink }
			else intake.notes.set(item.url, { text: 'A thread for it is starting now' })
		} else if (res.closed) {
			const last = res.closed[res.closed.length - 1]
			item.factory = { id: last.id, state: 'closed', outcome: last.outcome, closedAt: last.closedAt }
		} else {
			item.factory = { id: res.issue, state: 'open', threadLink: res.threadLink, fresh: true }
			intake.selected.delete(`${source.id}\n${item.key}`)
			toast(`Started ${item.ref}`)
			refreshBoard()
		}
	} catch (e) {
		intake.notes.set(item.url, { text: e.message, bad: true })
	}
	intake.starting.delete(item.url); intake.ver++; drawIntake()
}

async function startSelectedBatch(rows) {
	if (intake.batchBusy) return
	const targets = rows.filter(({ source, item }) => intake.selected.has(`${source.id}\n${item.key}`) && !item.factory)
	if (!targets.length) return
	intake.batchBusy = true; intake.ver++; drawIntake()
	for (const { source, item } of targets) await startItem(source, item)
	intake.batchBusy = false; intake.selected.clear(); intake.ver++; drawIntake()
}

async function removeSource(s) {
	if (!confirm(`Remove the source ${s.name}? Issues already started keep going.`)) return false
	try {
		await api('DELETE', `/api/intake/sources/${encodeURIComponent(s.id)}`)
		if (intake.filter.source === s.id) intake.filter.source = ''
		intake.fetchedAt = 0
		await loadIntake(false); return true
	} catch (e) { alert(e.message); return false }
}

async function disconnectLinear() {
	if (!confirm('Disconnect Linear? Its sources stay and list nothing until connected again.')) return
	await api('DELETE', '/api/intake/linear').catch(() => {})
	intake.teams = null; intake.linearFormOpen = false; await loadIntake(true)
}

function linearConnectBox(onCancel, inline) {
	const error = h('span', { class: 'error' })
	const submitBtn = h('button', { type: 'button', class: 'btn sm primary' }, 'Connect')
	const key = h('input', {
		type: 'password', autocomplete: 'off', placeholder: 'lin_api_...', 'aria-label': 'Linear API key', 'data-draft': 'linear-key',
		value: intake.linearKey, oninput: (e) => { intake.linearKey = e.target.value },
		onkeydown: (e) => { if (e.key === 'Enter') { e.preventDefault(); connect() } }
	})
	const connect = async () => {
		const trimmed = key.value.trim()
		if (!trimmed) { error.textContent = 'Paste a Linear API key'; return }
		submitBtn.disabled = true; error.textContent = ''
		try {
			await api('PUT', '/api/intake/linear', { apiKey: trimmed })
			intake.linearKey = ''; intake.teams = null; intake.linearFormOpen = false
			toast('Linear connected'); await loadIntake(true)
		} catch (err) { error.textContent = err.message; submitBtn.disabled = false }
	}
	submitBtn.addEventListener('click', connect)
	return h('div', { class: 'in-conn-form' },
		inline ? h('div', { style: 'display:flex;gap:8px;align-items:center' }, key, submitBtn) : key,
		h('span', { class: 'fhint' }, 'Linear -> Settings -> Security & access. Kept on this machine only.'),
		!inline ? h('div', { class: 'row' }, submitBtn, onCancel ? h('button', { type: 'button', class: 'btn sm', onclick: onCancel }, 'Cancel') : null) : null,
		error
	)
}

function openSourceSheet(s) {
	const v = intake.view || { repos: [] }
	intake.form = s
		? { id: s.id, kind: s.kind, repo: s.repo, name: s.name, merge: s.merge || '', ghRepo: s.github?.repo || '', label: (s.github || s.linear)?.label || '', team: s.linear?.team || '', project: s.linear?.project || '' }
		: { kind: 'github', repo: (repoScope && v.repos.includes(repoScope) ? repoScope : v.repos[0]) || '', name: '', merge: '', ghRepo: '', label: '', team: '', project: '' }
	if (!sourceSheet.el) {
		sourceSheet.el = h('dialog', { class: 'sheet', 'aria-label': 'Source settings', onclick: (e) => { if (e.target === sourceSheet.el) sourceSheet.el.close() }, tabindex: '-1', onclose: () => { intake.form = null; emptyAfterClose(sourceSheet.el) } })
		document.body.append(sourceSheet.el)
	}
	drawSourceSheet()
	if (!sourceSheet.el.open) showSheet(sourceSheet.el)
}

function drawSourceSheet() {
	const d = intake.form; const v = intake.view
	if (!d || !v || !sourceSheet.el) return
	const linearOn = !!(v.linear && v.linear.connected)
	const error = h('span', { class: 'error' })
	if (d.kind === 'linear' && linearOn && !intake.teams) {
		intake.teams = []
		api('GET', '/api/intake/linear/teams').then((r) => { intake.teams = r.teams; if (sourceSheet.el?.open && intake.form) drawSourceSheet() }).catch((e) => { intake.teams = []; error.textContent = e.message })
	}
	const set = (k) => (e) => { d[k] = e.target.value }
	const text = (k, ph) => h('input', { value: d[k], placeholder: ph, oninput: set(k) })
	const repo = h('select', { onchange: set('repo') }, ...v.repos.map((r) => h('option', { value: r, selected: r === d.repo }, r)))
	const merge = h('select', { onchange: set('merge') },
		h('option', { value: '', selected: !d.merge }, 'Project default'),
		h('option', { value: 'ask', selected: d.merge === 'ask' }, 'Ask before merging'),
		h('option', { value: 'never', selected: d.merge === 'never' }, 'Never merge (a person merges)')
	)
	const teams = intake.teams || []
	const kindFields = d.kind === 'github'
		? [field('GitHub repository', text('ghRepo', d.repo || 'owner/name'), 'Leave empty for the repository the threads start in'), field('Label (optional)', text('label', 'factory'), 'Only list issues with this label')]
		: [
			!linearOn ? h('div', { class: 'stack', style: 'gap:8px' }, h('p', { class: 'muted', style: 'font-size:13px' }, 'Connect Linear first so the factory can read its teams.'), linearConnectBox()) : null,
			field('Team', teams.length ? h('select', { onchange: set('team') }, h('option', { value: '' }, 'Pick a team'), ...teams.map((t) => h('option', { value: t.key, selected: t.key === d.team }, `${t.key}: ${t.name}`))) : text('team', 'ENG')),
			field('Label (optional)', text('label', 'Bug')),
			field('Project (optional)', text('project', ''))
		]
	const save = async (e) => {
		e.target.disabled = true; error.textContent = ''
		const payload = {
			kind: d.kind, repo: d.repo, name: d.name.trim() || undefined, merge: d.merge || '',
			...(d.kind === 'github' ? { github: { repo: d.ghRepo.trim() || d.repo, label: d.label.trim() || undefined } } : { linear: { team: d.team.trim(), label: d.label.trim() || undefined, project: d.project.trim() || undefined } })
		}
		try {
			const res = d.id ? await api('PUT', `/api/intake/sources/${encodeURIComponent(d.id)}`, payload) : await api('POST', '/api/intake/sources', payload)
			intake.lists.delete(res.source.id); intake.fetchedAt = 0; sourceSheet.el.close(); toast(d.id ? 'Source updated' : 'Source added'); await loadIntake(false)
		} catch (err) { error.textContent = err.message; e.target.disabled = false }
	}
	const existing = d.id ? v.sources.find((s) => s.id === d.id) : null
	fill(sourceSheet.el,
		h('div', { class: 'view-bar' },
			h('strong', {}, d.id ? 'Edit source' : 'Add source'),
			h('button', { type: 'button', class: 'btn sm', onclick: () => sourceSheet.el.close() }, icon('close', 'sm'), 'Close', h('span', { class: 'kbd' }, 'Esc'))
		),
		h('div', { class: 'sheet-body' },
			d.id ? null : h('div', { class: 'seg', role: 'tablist' },
				...[['github', 'GitHub issues'], ['linear', 'Linear']].map(([kind, label]) => h('button', { type: 'button', role: 'tab', class: d.kind === kind ? 'on' : '', onclick: () => { d.kind = kind; drawSourceSheet() } }, label))
			),
			...kindFields,
			h('hr', { style: 'border:0;border-top:1px solid var(--border);margin:2px 0' }),
			field('Starts threads in', repo, 'The factory repository whose checkout works the items'),
			field('Who merges', merge),
			field('Name (optional)', text('name', 'Shown in the sources list')),
			error
		),
		h('div', { class: 'sheet-foot' },
			existing ? h('button', { type: 'button', class: 'btn quiet danger sm', onclick: async () => { if (await removeSource(existing)) sourceSheet.el.close() } }, 'Remove source') : h('span', {}),
			h('div', { class: 'row' },
				h('button', { type: 'button', class: 'btn', onclick: () => sourceSheet.el.close() }, 'Cancel'),
				h('button', { type: 'button', class: 'btn primary', onclick: save }, d.id ? 'Save changes' : 'Add source')
			)
		)
	)
}

function intakeRow(source, item, showSource) {
	const f = item.factory
	const busy = intake.starting.has(item.url)
	const note = intake.notes.get(item.url)
	const selKey = `${source.id}\n${item.key}`
	const canSelect = !f && !busy
	let act
	if (busy) act = h('button', { type: 'button', class: 'btn sm primary', disabled: true }, 'Starting...')
	else if (f && f.state === 'open') act = [chip(f.fresh ? 'Started' : 'In factory', 'ok'), h('a', { class: 'btn sm', href: issueHref(f) }, 'Open')]
	else if (f) act = [chip(outcomeName(f.outcome || f.state), f.outcome === 'shipped' ? 'ok' : ''), h('a', { class: 'btn quiet sm', href: issueHref(f) }, 'Record'), h('button', { type: 'button', class: 'btn sm', onclick: () => startItem(source, item, true) }, 'Start again')]
	else act = h('button', { type: 'button', class: 'btn primary sm', onclick: () => startItem(source, item) }, icon('play', 'sm'), 'Start')

	const labelTags = item.labels.map((label) => {
		const active = intake.filter.label === label
		return h('button', { type: 'button', class: `in-tag${active ? ' on' : ''}`, onclick: () => { intake.filter.label = active ? '' : label; drawIntake() } }, label)
	})

	return h('div', { class: 'in-row', 'data-list-row': '' },
		canSelect ? h('input', {
			type: 'checkbox',
			'aria-label': `Select ${item.title}`,
			checked: intake.selected.has(selKey),
			onchange: (e) => { if (e.target.checked) intake.selected.add(selKey); else intake.selected.delete(selKey); intake.ver++; drawIntake() }
		}) : h('span', {}),
		h('div', { class: 'in-ref', title: source.kind === 'github' ? 'GitHub issue' : 'Linear issue' }, icon(source.kind, 'sm'), h('span', {}, item.ref)),
		h('div', { class: 'in-main' },
			isUrl(item.url) ? h('a', { class: 'in-title', href: item.url, target: '_blank', rel: 'noreferrer', 'data-row-open': '' }, item.title) : h('span', { class: 'in-title' }, item.title),
			h('div', { class: 'in-meta' },
				showSource ? chip(source.name) : null,
				item.state && item.state !== 'open' ? h('span', {}, item.state) : null,
				item.priority ? chip(item.priority, item.priority.toLowerCase() === 'urgent' ? 'bad' : item.priority.toLowerCase() === 'high' ? 'warn' : '') : null,
				item.project ? h('span', {}, item.project) : null,
				item.assignees.length ? h('span', {}, item.assignees.join(', ')) : null,
				item.blockedBy?.length ? chip(`blocked by ${item.blockedBy.join(', ')}`, 'warn') : null,
				...labelTags
			),
			note ? h('div', { class: note.bad ? 'error' : 'muted', style: 'margin-top:4px;font-size:12px' }, note.text) : null
		),
		h('div', { class: 'in-end' },
			item.updatedAt ? h('span', { class: 'mono subtle' }, when(item.updatedAt)) : null,
			h('div', { class: 'row' }, act)
		)
	)
}

function drawIntake() {
	drawBreadcrumb([])
	const v = intake.view

// ---- Page: Settings (#/settings) ----

const STAGE_ROWS = [
	['orchestrator', 'The thread that owns the issue. Runs stages and lands the PR', null],
	['research', 'Reproduces the issue, sizes it and routes it', 'What to start or set up before reproducing'],
	['plan', 'Plans a change too big to build directly', 'What a plan in this project must cover'],
	['implement', 'Makes the change and opens the PR', 'Commands to run, files never to touch'],
	['review', 'Reviews the plan and the PR', 'What to look at closely in this project'],
	['land', 'Merge and deploy check, done by the orchestrator', 'How this project deploys and how to check it']
]
const getPath = (obj, path) => path.split('.').reduce((v, k) => (v == null ? v : v[k]), obj)
const optionsText = (o) => (o ? Object.entries(o).map(([k, v]) => `${k}: ${v}`).join(', ') : '')
function parseOptions(text) {
	if (text.startsWith('{')) return JSON.parse(text)
	const o = {}
	for (const part of text.split(',')) {
		const pair = part.match(/^\s*([\w.-]+)\s*[:=]\s*(.+?)\s*$/)
		if (!pair) throw new Error(`Options: write as "effort: high", not "${part.trim()}"`)
		o[pair[1]] = pair[2] === 'true' ? true : pair[2] === 'false' ? false : pair[2]
	}
	return o
}
function fallbackOneText(t) { if (!t?.model) return ''; const o = optionsText(t.options); return `${t.provider}/${t.model}${o ? `, ${o}` : ''}` }
function fallbackText(t) { return Array.isArray(t) ? t.map(fallbackOneText).filter(Boolean).join('; ') : fallbackOneText(t) }
function parseFallbackOne(text) {
	const [first, ...rest] = text.split(',')
	const slash = first.indexOf('/')
	if (slash < 1 || slash === first.trim().length - 1) throw new Error(`Fallback: write as "provider/model", not "${first.trim()}"`)
	const target = { provider: first.slice(0, slash).trim(), model: first.slice(slash + 1).trim() }
	if (rest.join(',').trim()) target.options = parseOptions(rest.join(',').trim())
	return target
}
function parseFallback(text) {
	const entries = text.split(';').map((s) => s.trim()).filter(Boolean).map(parseFallbackOne)
	return entries.length === 1 ? entries[0] : entries
}

let settingsDirty = false
let settingsSaved = null
let settingsSeed = null

function settingsEditor(scope, layer, resolved, locked) {
	const draft = JSON.parse(JSON.stringify(layer || {}))
	const error = h('span', { class: 'error' })
	const fields = []
	const off = locked ? true : undefined
	const shared = (key) => resolved.sources?.[key] === 'global'
	const inherit = scope === 'global' ? 'Default' : 'Inherit'
	const stageRow = ([name, about, noteHint]) => {
		const key = name === 'orchestrator' ? name : `stages.${name}`
		const cells = []
		if (name !== 'land') {
			const current = getPath(draft, key) || {}
			const shown = getPath(resolved.settings, key)
			const provider = h('input', { value: current.provider || '', placeholder: shown?.provider || '', 'aria-label': `${name} provider`, list: 'seen-provider', disabled: off })
			const model = h('input', { value: current.model || '', placeholder: shown?.model || '', 'aria-label': `${name} model`, list: 'seen-model', disabled: off })
			const opts = h('input', { value: optionsText(current.options), placeholder: optionsText(shown?.options), 'aria-label': `${name} options`, disabled: off })
			const fallback = name === 'orchestrator' ? null : h('input', { value: fallbackText(current.fallback), placeholder: fallbackText(shown?.fallback) || 'Fallback: provider/model, effort: high', 'aria-label': `${name} fallback`, disabled: off })
			fields.push(() => {
				const parent = name === 'orchestrator' ? draft : (draft.stages = draft.stages || {})
				const note = parent[name]?.note
				const next = {}
				if (provider.value.trim() || model.value.trim()) { next.provider = provider.value.trim(); next.model = model.value.trim(); if (opts.value.trim()) next.options = parseOptions(opts.value.trim()) }
				if (fallback?.value.trim()) next.fallback = parseFallback(fallback.value.trim())
				if (note !== undefined) next.note = note
				if (Object.keys(next).length) parent[name] = next; else delete parent[name]
			})
			const cell = (lbl, inp) => h('div', {}, h('span', { class: 'flabel' }, lbl), inp)
			cells.push(cell('Provider', provider), cell('Model', model), cell('Options', opts))
			if (fallback) cells.push(h('div', { class: 'note' }, h('span', { class: 'flabel' }, 'Fallback'), fallback))
		}
		if (name !== 'orchestrator') {
			const inherited = resolved.settings.stages[name].note
			const area = h('textarea', { placeholder: inherited || noteHint, 'aria-label': `${name} note`, disabled: off }, getPath(draft, `${key}.note`) || '')
			fields.push(() => {
				draft.stages = draft.stages || {}
				const value = area.value.trim()
				if (value) draft.stages[name] = { ...(draft.stages[name] || {}), note: value }
				else if (draft.stages[name]) { delete draft.stages[name].note; if (!Object.keys(draft.stages[name]).length) delete draft.stages[name] }
			})
			cells.push(h('div', { class: 'note' }, h('span', { class: 'flabel' }, 'Note'), area, shared(`${key}.note`) ? h('span', { class: 'fhint' }, 'Note from all projects') : null))
		}
		return h('div', { class: 'stage' },
			h('div', { class: 'who' }, h('strong', {}, name), h('span', { class: 'fhint' }, about), name !== 'land' && shared(key) ? h('span', { class: 'fhint' }, 'Model from all projects') : null),
			...cells
		)
	}
	const choice = (k, values) => h('select', { disabled: off }, h('option', { value: '' }, `${inherit} (${resolved.settings[k]})`), ...values.map((v) => h('option', { value: v, selected: draft[k] === v }, v)))
	const number = (k, min, max) => h('input', { type: 'number', min, max, value: draft[k] ?? '', placeholder: String(resolved.settings[k]), disabled: off })
	const approval = choice('planApproval', ['auto', 'always', 'never'])
	const rounds = number('reviewRounds', 0, 5)
	const rulings = h('textarea', { placeholder: resolved.settings.rulings || 'One rule per line, e.g. public API fields are never renamed', disabled: off }, draft.rulings || '')
	const reviewApproval = choice('approval', ['auto', 'required', 'off'])
	const merge = choice('merge', ['auto', 'ask', 'never'])
	const overdue = number('reviewOverdueHours', 1, 720)
	const lists = Object.fromEntries(['reviewers', 'bots', 'trust', 'ignore'].map((k) => [k, h('input', { value: (draft[k] || []).join(', '), placeholder: resolved.settings[k]?.join(', ') || 'None', disabled: off })]))
	fields.push(() => {
		if (approval.value) draft.planApproval = approval.value; else delete draft.planApproval
		if (rounds.value !== '') draft.reviewRounds = Number(rounds.value); else delete draft.reviewRounds
		if (rulings.value.trim()) draft.rulings = rulings.value.trim(); else delete draft.rulings
		if (reviewApproval.value) draft.approval = reviewApproval.value; else delete draft.approval
		if (merge.value) draft.merge = merge.value; else delete draft.merge
		if (overdue.value !== '') draft.reviewOverdueHours = Number(overdue.value); else delete draft.reviewOverdueHours
		for (const [k, inp] of Object.entries(lists)) {
			const values = inp.value.split(',').map((v) => v.trim()).filter(Boolean)
			if (values.length) draft[k] = values; else delete draft[k]
		}
	})
	const listField = {
		reviewers: ['Reviewers', 'Logins or org/team to request a review from'],
		bots: ['Review bots', 'Bots whose review the merge waits for'],
		trust: ['Trusted logins', 'People outside the repo whose comments count'],
		ignore: ['Ignored logins', 'Never acted on, such as a noisy bot']
	}
	const state = h('span', { class: 'state' }, settingsDirty ? 'Changes not saved' : settingsSaved === scope ? 'Saved' : '')
	const saveButton = h('button', { type: 'button', class: 'btn primary', disabled: !settingsDirty }, 'Save')
	saveButton.addEventListener('click', async () => {
		error.textContent = ''
		try {
			for (const f of fields) f()
			if (draft.stages && !Object.keys(draft.stages).length) delete draft.stages
			await api('PUT', `/api/settings/${encodeURIComponent(scope)}`, draft)
			settingsCache.dirty = true; settingsSeed = null; settingsSaved = scope; toast('Settings saved'); drawSettings({ force: true })
		} catch (e) { error.textContent = e.message }
	})
	const part = (title, about, ...body) => h('div', { class: 'part' }, h('h3', {}, title), about ? h('p', {}, about) : null, ...body)
	const form = h('section', { class: 'card' },
		part('Stages', locked || 'Model each stage runs on, and a note included in its brief. Leave empty to inherit.', h('div', {},
			h('div', { class: 'stages-head' }, h('span', {}), h('span', {}, 'Provider'), h('span', {}, 'Model'), h('span', {}, 'Options')),
			...STAGE_ROWS.map(stageRow)
		)),
		part('Plan and review', null, h('div', { class: 'stack' },
			h('div', { class: 'fields' },
				field('Plan approval', approval, 'auto asks about features, large changes, or one-way doors'),
				field('Review rounds', rounds, 'Rounds before merge becomes your decision (0 skips review)')
			),
			field('Rulings', rulings, 'Standing rules included in every brief')
		)),
		part('Review on GitHub', null, h('div', { class: 'stack' },
			h('div', { class: 'fields' },
				field('Approval', reviewApproval, 'auto waits for approval when branch rules or reviewers call for one'),
				field('Who merges', merge, 'auto merges when ready, ask makes it your decision, never leaves it to people'),
				field('Review overdue after (hours)', overdue, 'Hours before a waiting review shows as overdue')
			),
			h('div', { class: 'fields' }, ...Object.entries(lists).map(([k, inp]) => field(listField[k][0], inp, `${listField[k][1]}. Comma-separated${shared(k) ? ', from all projects' : ''}`)))
		)),
		locked ? null : h('div', { class: 'savebar' }, saveButton, state, error)
	)
	form.addEventListener('input', () => { settingsDirty = true; settingsSaved = null; saveButton.disabled = false; state.textContent = 'Changes not saved' })
	return form
}

function projectSettings(scope, name, repo) {
	const ref = repo.branch || 'the default branch'
	const error = h('p', { class: 'error', style: 'margin-top:10px' })
	const choose = async (store) => {
		if (store === repo.store || (settingsDirty && !confirm('Discard unsaved changes?'))) return
		try { await api('PUT', `/api/settings/${encodeURIComponent(scope)}`, { store }); settingsCache.dirty = true; settingsSeed = settingsSaved = null; toast('Updated settings location'); drawSettings({ force: true }) }
		catch (e) { error.textContent = e.message }
	}
	const option = (store, title, text) => h('button', { type: 'button', class: `opt${repo.store === store ? ' on' : ''}`, role: 'radio', 'aria-checked': repo.store === store ? 'true' : 'false', onclick: () => choose(store) }, h('i'), h('span', {}, h('strong', {}, title), h('span', {}, text)))
	const local = Object.keys(repo.page).length > 0
	const copyIn = () => {
		if (local && !confirm('Replace this machine\'s settings with values from factory.config.yaml?')) return
		settingsSeed = { scope, layer: repo.file }; drawSettings()
	}
	const body = repo.store === 'machine'
		? [
			repo.file ? h('div', { class: 'notice quiet' }, h('span', {}, 'Repository has a factory.config.yaml (not read while kept on this machine).'), h('button', { type: 'button', class: 'btn sm', onclick: copyIn }, 'Copy values in')) : null,
			settingsEditor(scope, settingsSeed ? settingsSeed.layer : repo.page, repo.resolved),
			repo.yaml ? fold(`yaml:${scope}`, 'Saved settings as factory.config.yaml', h('pre', { style: 'margin-top:8px' }, repo.yaml)) : null
		]
		: repo.fileError
			? h('p', { class: 'notice bad' }, `${repo.fileError}. Left out whole until fixed on ${ref}.`)
			: !repo.file
				? h('section', { class: 'card' }, h('div', { class: 'part' }, h('h3', {}, `No factory.config.yaml on ${ref}`), h('p', {}, `Runs on All projects defaults until merged.${repo.yaml ? ' Saved machine settings ready to commit:' : ''}`), repo.yaml ? h('pre', { style: 'margin-top:12px' }, repo.yaml) : null))
				: [local ? h('p', { class: 'notice quiet' }, 'Machine settings also exist, but are unused while reading the repository file.') : null, settingsEditor(scope, repo.file, repo.resolved, `Read from factory.config.yaml on ${ref}. Edit and merge the file to change.`)]
	return [
		h('div', { class: 'shead' }, h('h2', {}, name), h('p', {}, 'Where this project keeps its own settings.')),
		h('div', { class: 'choice', role: 'radiogroup', style: 'margin-top:14px' },
			option('machine', 'On this machine', 'Kept by the factory here. Nothing goes into the repository.'),
			option('file', 'In the repository', `Read from factory.config.yaml on ${ref}. Changes apply once merged.`)
		),
		error, body
	]
}

function fetchSettingsData({ force = false } = {}) {
	if (!force && settingsInflight) return settingsInflight
	let rawReqs
	if (!force && window.__boot?.settings) {
		const [p1, p2, p3] = window.__boot.settings
		window.__boot.settings = null
		rawReqs = [p1.then(readJsonResponse), p2.then(readJsonResponse).catch(() => null), p3.then(readJsonResponse).catch(() => null)]
	} else {
		rawReqs = [api('GET', '/api/settings'), api('GET', '/api/mcp').catch(() => null), api('GET', '/api/webhook').catch(() => null)]
	}
	const req = Promise.all(rawReqs).then(([data, mcpInfo, webhookInfo]) => {
		settingsCache.data = data
		settingsCache.mcpInfo = mcpInfo
		settingsCache.webhookInfo = webhookInfo
		settingsCache.dirty = false
		settingsCache.at = Date.now()
		writeSess('factory-cache-settings', { data, mcpInfo, webhookInfo })
		return settingsCache
	})
	settingsInflight = req
	req.then(
		() => { if (settingsInflight === req) settingsInflight = null },
		() => { if (settingsInflight === req) settingsInflight = null }
	)
	return req
}

function prefetchSettings() {
	if ((settingsCache.data && !settingsCache.dirty) || settingsInflight) return
	fetchSettingsData().catch(() => {})
}

function prefetchIntake() {
	if (intake.view && !intake.view.error && Date.now() - intake.fetchedAt < INTAKE_TTL_MS) {
		const now = Date.now()
		for (const source of intake.view.sources) {
			const st = intake.lists.get(source.id)
			if (!st || (!st.loading && now - (st.readAt || 0) >= INTAKE_TTL_MS)) loadItems(source.id, false)
		}
		return
	}
	loadIntake(false)
}

function renderSettingsView() {
	const { data, mcpInfo, webhookInfo } = settingsCache
	if (!data || route().page !== 'settings') return
	const projects = Object.entries(data.repos)
	const validScopes = new Set(['appearance', 'integrations', 'global', ...projects.map(([r]) => `repo:${r}`)])
	if (!validScopes.has(settingsScope)) settingsScope = 'global'
	const scope = settingsScope
	const name = scope.startsWith('repo:') ? scope.slice('repo:'.length) : null
	if (settingsSeed && settingsSeed.scope !== scope) settingsSeed = null
	settingsDirty = !!settingsSeed

	const pick = (k) => {
		if (k === settingsScope || (settingsDirty && !confirm('Discard unsaved changes?'))) return
		settingsScope = k; settingsSeed = settingsSaved = null; renderSettingsView()
	}
	const navItem = (k, label, where) => h('button', { type: 'button', 'data-snav': k, class: k === scope ? 'on' : '', onclick: () => pick(k) },

		where ? h('span', { class: 'where' }, where) : null

	const seen = { provider: new Set(), model: new Set() }
	for (const settings of [data.defaults, ...projects.map(([, r]) => r.resolved.settings)]) {
		for (const target of [settings.orchestrator, ...Object.values(settings.stages)]) {
			if (target.provider) seen.provider.add(target.provider)
			if (target.model) seen.model.add(target.model)

	}

	let rightPane

			h('section', { class: 'card' },

						h('button', { type: 'button', class: themePref === k ? 'on' : '', onclick: () => { applyTheme(k); renderSettingsView() } }, lbl)
					))

					h('h3', {}, 'Start page'),
					h('p', {}, 'Which view opens when visiting the Factory root URL.'),
					h('div', { class: 'seg', style: 'margin-top:12px' }, ...[['board', 'Board (Queue)'], ['dashboard', 'Dashboard']].map(([k, lbl]) =>
						h('button', { type: 'button', class: startPagePref === k ? 'on' : '', onclick: () => { startPagePref = k; writeStore('factory-start-page', k); toast(`Start page set to ${lbl}`); renderSettingsView() } }, lbl)
					))
				)
			)
		]
	} else if (scope === 'integrations') {
		rightPane = [
			h('div', { class: 'shead' }, h('h2', {}, 'MCP & Webhooks'), h('p', {}, 'Connect another agent to Factory over MCP or receive live webhook updates.')),
			mcpInfo ? h('section', { class: 'card' },
				h('div', { class: 'part' },
					h('h3', {}, 'MCP server'),
					h('p', {}, 'Drive Factory from Claude Code or Codex.'),
					h('div', { class: 'stack', style: 'margin-top:12px;gap:10px' },
						h('div', {}, h('span', { class: 'flabel' }, 'Endpoint'), h('pre', {}, mcpInfo.mcp?.tailnet || mcpInfo.mcp?.local || '')),
						mcpInfo.addCommand?.claude ? h('div', {}, h('span', { class: 'flabel' }, 'Claude Code'), h('pre', {}, mcpInfo.addCommand.claude)) : null,
						mcpInfo.addCommand?.codex ? h('div', {}, h('span', { class: 'flabel' }, 'Codex'), h('pre', {}, mcpInfo.addCommand.codex)) : null
					)
				)
			) : null,
			webhookInfo ? h('section', { class: 'card' },
				h('div', { class: 'part' },
					h('h3', {}, 'Outgoing webhook'),
					h('p', {}, webhookInfo.url ? `Posting updates to ${webhookInfo.url}` : 'No outgoing webhook configured.'),
					webhookInfo.recent?.length ? h('div', { style: 'margin-top:10px' }, h('pre', {}, JSON.stringify(webhookInfo.recent.slice(0, 5), null, 2))) : null
				)
			) : null
		]
	} else if (name) {
		rightPane = projectSettings(scope, name, data.repos[name])
	} else {
		rightPane = [
			h('div', { class: 'shead' }, h('h2', {}, 'All projects'), h('p', {}, 'Default settings for every project, kept on this machine.')),
			settingsEditor(scope, data.global, { settings: data.defaults, sources: null })
		]
	}

	const existingPane = renderedSettingsShell ? main.querySelector('#settings-pane') : null
	if (existingPane) {
		for (const btn of main.querySelectorAll('.snav button[data-snav]')) {
			btn.classList.toggle('on', btn.dataset.snav === scope)

}

async function drawSettings({ force = false } = {}) {
	drawBreadcrumb([])
	if (settingsCache.data) {
		if (force) renderedSettingsShell = false
		renderSettingsView()
		if (!settingsCache.dirty && !force) return
		try {
			await fetchSettingsData({ force: true })
			if (route().page === 'settings' && !settingsDirty) {
				renderedSettingsShell = false
				renderSettingsView()
			}
		} catch {}
		return
	}
	try { await fetchSettingsData({ force }) }
	catch (e) { if (route().page === 'settings') render(h('p', { class: 'error' }, e.message)); return }
	if (route().page !== 'settings') return
	renderSettingsView()
}

// ---- New Issue Sheet (accessible from anywhere via + New issue, `n`, ⌘K, or #/new) ----

const newSheet = { el: null }
async function buildNewIssueForm(onDone) {
	if (!loaded) await refreshBoard()
	const repos = knownRepoList()
	if (repos.length && (!newDraft.repo || !repos.includes(newDraft.repo))) {
		newDraft.repo = (repoScope && repos.includes(repoScope)) ? repoScope : repos[0]
	}
	const wrap = h('div', { class: 'stack' })
	const rebuild = () => {
		const error = h('span', { class: 'error' })
		const fetchStatus = h('span', { class: 'fhint' })
		const repo = h('select', { onchange: (e) => { newDraft.repo = e.target.value } }, ...repos.map((r) => h('option', { value: r, selected: r === newDraft.repo }, r)))
		const title = h('input', { value: newDraft.title, placeholder: newMode === 'pr' ? 'Leave empty to use the PR title' : 'What should be fixed or built', oninput: (e) => { newDraft.title = e.target.value } })
		const pr = h('input', { value: newDraft.pr, placeholder: 'https://github.com/owner/repo/pull/34', oninput: (e) => { newDraft.pr = e.target.value } })
		const source = h('input', { value: newDraft.source, placeholder: 'https://github.com/owner/repo/issues/12', oninput: (e) => { newDraft.source = e.target.value } })
		const merge = h('select', { onchange: (e) => { newDraft.merge = e.target.value } },
			h('option', { value: '', selected: newDraft.merge === '' }, 'Project default'),
			h('option', { value: 'ask', selected: newDraft.merge === 'ask' }, 'Ask before merging'),
			h('option', { value: 'never', selected: newDraft.merge === 'never' }, 'Never merge (a person merges)')
		)
		const body = h('textarea', { style: 'min-height:130px', placeholder: newMode === 'pr' ? 'What to do with this PR (leave empty for a review only)' : 'Context, steps to reproduce, acceptance criteria or links', oninput: (e) => { newDraft.body = e.target.value } }, newDraft.body)
		const fetchUrl = async (urlInput, btn) => {
			const url = urlInput.value.trim(); if (!url) return
			btn.disabled = true; error.textContent = ''; fetchStatus.textContent = 'Reading from GitHub...'
			try {
				const item = await api('POST', '/api/github/fetch', { url })
				if (repos.includes(item.repo)) { newDraft.repo = item.repo; repo.value = item.repo }
				if (item.title && !newDraft.title.trim()) { newDraft.title = item.title; title.value = item.title }
				if (item.body && !newDraft.body.trim()) { newDraft.body = item.body; body.value = item.body }
				if (item.kind === 'pr') { newDraft.pr = item.url; pr.value = item.url; if (newMode !== 'pr') { newMode = 'pr'; rebuild(); return } }
				else { newDraft.source = item.url; source.value = item.url }
				fetchStatus.textContent = `Loaded ${item.repo} #${item.number}${item.state ? ` (${item.state.toLowerCase()})` : ''}`
			} catch (err) { fetchStatus.textContent = ''; error.textContent = err.message }
			btn.disabled = false
		}
		const start = async (e) => {
			e.target.disabled = true; error.textContent = ''
			try {
				const payload = { repo: repo.value, title: title.value.trim() || undefined, body: body.value, source: newMode === 'issue' ? (source.value.trim() || undefined) : undefined, pr: newMode === 'pr' ? (pr.value.trim() || undefined) : undefined, merge: merge.value || undefined }
				const res = await api('POST', '/api/threads', payload)
				if (res.duplicateOf) error.textContent = `Already open: ${res.duplicateOf.title}`
				else if (res.closed) error.textContent = 'The factory already closed this item. Start it from a thread with --again.'
				else {
					Object.assign(newDraft, { title: '', pr: '', source: '', body: '', merge: '' })
					onDone && onDone()
					toast('Started factory issue')
					location.hash = `#/issue/${encodeURIComponent(res.issue)}`
				}
			} catch (err) { error.textContent = err.message }
			e.target.disabled = false
		}
		const urlInput = newMode === 'pr' ? pr : source
		const fetchBtn = h('button', { type: 'button', class: 'btn', onclick: () => fetchUrl(urlInput, fetchBtn) }, 'Fetch')
		fill(wrap,
			!repos.length ? h('p', { class: 'muted' }, 'Start one issue from a T3 Code thread in the repository first so the factory knows its checkout.') : [
				h('div', { class: 'seg', role: 'tablist' },
					h('button', { type: 'button', role: 'tab', class: newMode === 'issue' ? 'on' : '', onclick: () => { newMode = 'issue'; rebuild() } }, 'Bug or feature'),
					h('button', { type: 'button', role: 'tab', class: newMode === 'pr' ? 'on' : '', onclick: () => { newMode = 'pr'; rebuild() } }, 'Existing PR')
				),
				h('div', { class: 'fields' }, field('Repository', repo), field('Who merges', merge)),
				newMode === 'pr'
					? field('Pull request URL', h('div', { style: 'display:flex;gap:8px' }, pr, fetchBtn), fetchStatus)
					: field('GitHub issue or source URL (optional)', h('div', { style: 'display:flex;gap:8px' }, source, fetchBtn), fetchStatus),
				field('Title', title, newMode === 'pr' ? 'Optional: defaults to the PR title' : null),
				field(newMode === 'pr' ? 'What to do with this PR' : 'Details', body),
				h('div', { class: 'row', style: 'margin-top:4px' }, h('button', { type: 'button', class: 'btn primary', onclick: start }, newMode === 'pr' ? 'Take in PR' : 'Start issue'), error)
			]
		)
	}
	rebuild()
	return wrap
}

async function openNewSheet() {
	if (!newSheet.el) {
		newSheet.el = h('dialog', { class: 'sheet no-foot', 'aria-label': 'New issue', onclick: (e) => { if (e.target === newSheet.el) newSheet.el.close() }, tabindex: '-1', onclose: () => emptyAfterClose(newSheet.el) })

const cmdModal = { el: null, query: '', idx: 0 }
function openCmdPalette() {
	if (!cmdModal.el) {
		cmdModal.el = h('dialog', { class: 'modal', 'aria-label': 'Command palette', onclick: (e) => { if (e.target === cmdModal.el) cmdModal.el.close() }, onclose: () => cmdModal.el.replaceChildren() })
		document.body.append(cmdModal.el)
	}
	cmdModal.query = ''; cmdModal.idx = 0
	const input = h('input', {
		type: 'text', placeholder: 'Jump to issue, page, repo, or action...', 'aria-label': 'Search commands',
		oninput: (e) => { cmdModal.query = e.target.value; cmdModal.idx = 0; renderList() },
		onkeydown: (e) => {
			if (e.key === 'ArrowDown') { e.preventDefault(); cmdModal.idx++; renderList() }
			else if (e.key === 'ArrowUp') { e.preventDefault(); cmdModal.idx = Math.max(0, cmdModal.idx - 1); renderList() }
			else if (e.key === 'Enter') { e.preventDefault(); const btn = listEl.querySelector('.cmd-item.sel'); if (btn) btn.click() }
		}
	})
	const listEl = h('div', { class: 'cmd-list' })
	const runAndClose = (fn) => () => { cmdModal.el.close(); fn() }

	const renderList = () => {
		const q = cmdModal.query.trim().toLowerCase()
		const match = (s) => !q || s.toLowerCase().includes(q)
		const sections = []

		const openMatches = board.issues.filter((i) => match(`${i.title} ${i.repo} ${prNumber(i.prUrl) || ''} ${i.stage}`)).slice(0, 8)
		if (openMatches.length) sections.push(['Open issues', openMatches.map((i) => ({ ic: i.needsYou ? 'alert' : 'layers', label: i.title, meta: `${repoShort(i.repo)} · ${statusLabel(i.derived)}`, run: runAndClose(() => { location.hash = issueHref(i) }) }))])

		const navItems = [
			{ ic: 'plus', label: 'New issue', meta: 'n', run: runAndClose(() => openNewSheet()) },
			{ ic: 'dash', label: 'Go to Dashboard', meta: 'g d', run: runAndClose(() => { location.hash = '#/dashboard' }) },
			{ ic: 'layers', label: 'Go to Board', meta: 'g b', run: runAndClose(() => { location.hash = '#/' }) },
			{ ic: 'inbox', label: 'Go to Intake', meta: 'g i', run: runAndClose(() => { location.hash = '#/intake' }) },
			{ ic: 'checkCircle', label: 'Go to Done', meta: 'g o', run: runAndClose(() => { location.hash = '#/done' }) },
			{ ic: 'settings', label: 'Go to Settings', meta: 'g s', run: runAndClose(() => { location.hash = '#/settings' }) }
		].filter((x) => match(x.label))
		if (navItems.length) sections.push(['Navigation', navItems])

		const repos = knownRepoList()
		const repoItems = [
			{ ic: 'globe', label: 'Scope: All repos', meta: !repoScope ? 'active' : '', run: runAndClose(() => setRepoScope('')) },
			...repos.map((r) => ({ ic: 'repo', label: `Scope: ${r}`, meta: repoScope === r ? 'active' : '', run: runAndClose(() => setRepoScope(r)) }))
		].filter((x) => match(x.label))
		if (repoItems.length) sections.push(['Repository scope', repoItems])

		const actions = [
			{ ic: 'sun', label: 'Theme: Light', meta: themePref === 'light' ? 'active' : '', run: runAndClose(() => applyTheme('light')) },
			{ ic: 'moon', label: 'Theme: Dark', meta: themePref === 'dark' ? 'active' : '', run: runAndClose(() => applyTheme('dark')) },
			{ ic: 'monitor', label: 'Theme: System', meta: themePref === 'system' ? 'active' : '', run: runAndClose(() => applyTheme('system')) },
			{ ic: 'help', label: 'Keyboard shortcuts', meta: '?', run: runAndClose(() => openShortcuts()) }
		].filter((x) => match(x.label))
		if (actions.length) sections.push(['Actions', actions])

		if (q) {
			const doneMatches = board.done.filter((i) => match(`${i.title} ${i.repo}`)).slice(0, 5)
			if (doneMatches.length) sections.push(['Closed issues', doneMatches.map((i) => ({ ic: 'checkCircle', label: i.title, meta: `${repoShort(i.repo)} · ${outcomeName(i.outcome)}`, run: runAndClose(() => { location.hash = issueHref(i) }) }))])
		}

		const flat = sections.flatMap(([, items]) => items)
		if (cmdModal.idx >= flat.length) cmdModal.idx = Math.max(0, flat.length - 1)
		let cursor = 0
		const nodes = []
		for (const [secTitle, items] of sections) {
			nodes.push(h('div', { class: 'cmd-sec' }, secTitle))
			for (const it of items) {
				const cur = cursor++
				nodes.push(h('button', { type: 'button', class: `cmd-item${cur === cmdModal.idx ? ' sel' : ''}`, onclick: it.run },
					icon(it.ic, 'sm'),
					h('span', { style: 'overflow:hidden;text-overflow:ellipsis;white-space:nowrap' }, it.label),
					it.meta ? h('span', { class: 'cmd-meta' }, it.meta) : null
				))
			}
		}
		fill(listEl, nodes.length ? nodes : h('div', { class: 'empty', style: 'padding:28px' }, h('p', {}, 'No matches')))
		const selEl = listEl.querySelector('.cmd-item.sel')
		if (selEl) selEl.scrollIntoView({ block: 'nearest' })
	}
	renderList()
	fill(cmdModal.el,
		h('div', { class: 'cmd-input-wrap' }, icon('search'), input, h('span', { class: 'kbd' }, 'Esc')),
		listEl,
		h('div', { class: 'cmd-foot' }, h('span', {}, '↑↓ navigate · ↵ select'), h('span', {}, '⌘K'))
	)
	cmdModal.el.showModal()
	input.focus()
}

		needsYou: board.needsYou || 0,
		needsByRepo: board.needsByRepo || {},
		repos: knownRepoList(),
		repoScope,
		connected: sseConnected,
		title: r.page === 'issue' ? (currentIssueData?.issue?.title || null) : null
	})
}

let lastBoardJson = ''
async function refreshBoard() {
	let next
	try {
		if (window.__boot?.board) {
			const p = window.__boot.board
			window.__boot.board = null
			next = await p.then(readJsonResponse)
		} else {
			next = await api('GET', '/api/board')
		}
	} catch { return false }
	const nextJson = JSON.stringify(next)
	const changed = !loaded || nextJson !== lastBoardJson
	board = next
	lastBoardJson = nextJson
	loaded = true
	writeSess('factory-cache-board', board)
	if (changed) {
		boardVersion++
		drawSidebar()
		notifyHostState()
	}
	return changed
}

async function draw() {
	const { page, id, tab } = route()
	const sameIssue = page === 'issue' && id && renderedIssueShellId === id
	if (page !== 'issue' || !id) currentIssueData = null
	if (!sameIssue) drawSidebar()
	notifyHostState()
	if (page === 'dashboard') return drawDashboard()
	if (page === 'issue' && id) { await drawIssue(id, tab); notifyHostState(); return }
	if (page === 'settings') return drawSettings()
	if (page === 'new') return drawNew()
	if (page === 'intake') {
		if (intake.view && !intake.view.error && Date.now() - intake.fetchedAt < INTAKE_TTL_MS) {
			syncIntakeFromBoard()
			drawIntake()
			const now = Date.now()
			for (const source of intake.view.sources) {
				const st = intake.lists.get(source.id)
				if (!st || (!st.loading && now - (st.readAt || 0) >= INTAKE_TTL_MS)) loadItems(source.id, false)
			}
			return
		}
		drawIntake()
		return loadIntake(false)
	}
	if (page === 'done') return drawDone()
	drawBoard()
}

function invalidateAllCaches() {
	historyCache.clear()
	viewCache.clear()
	for (const entry of issueCache.values()) entry.dirty = true
	settingsCache.dirty = true
}

function invalidateForEvent(ev) {
	if (!ev || ev.issue === null || ev.issue === undefined) {
		ssePendingGlobal = true
		if (!ev || ev.kind === 'settings' || ev.kind === 'webhook' || ev.kind === 'global') settingsCache.dirty = true
		if (!ev || ev.kind === 'intake') intake.fetchedAt = 0
		if (!ev || ev.kind === 'global') {
			for (const entry of issueCache.values()) entry.dirty = true
			historyCache.clear()
		}
		return
	}
	ssePendingIssues.add(ev.issue)
	markIssueDirty(ev.issue)
	if (ev.kind === 'closed') historyCache.clear()
}

function syncIntakeFromBoard() {
	if (!intake.view) return
	const byKey = new Map()
	for (const i of board.done) if (i.source) byKey.set(`${i.repo}\n${i.source}`, { id: i.id, state: i.state, outcome: i.outcome, threadLink: i.threadLink, closedAt: i.closedAt })
	for (const i of board.issues) if (i.source) byKey.set(`${i.repo}\n${i.source}`, { id: i.id, state: i.state, outcome: i.outcome, threadLink: i.threadLink, closedAt: i.closedAt })
	let changed = false
	for (const s of intake.view.sources) {
		const st = intake.lists.get(s.id)
		if (!st) continue
		for (const item of st.items) {
			const match = byKey.get(`${s.repo}\n${item.url}`)
			if (match) { item.factory = match; changed = true }
		}
	}
	if (changed) intake.ver++
}

let sseTimer
let sseOpenedOnce = false
let sseDisconnected = false
const ssePendingIssues = new Set()
let ssePendingGlobal = false

async function flushLiveUpdate(forceAll = false) {
	const changedIssues = new Set(ssePendingIssues)
	const hadGlobal = ssePendingGlobal || forceAll
	ssePendingIssues.clear()
	ssePendingGlobal = false
	if (forceAll) invalidateAllCaches()
	await refreshBoard()
	const { page, id, tab } = route()
	if (page === 'board' || page === 'dashboard' || page === 'done') return draw()
	if (page === 'issue' && (hadGlobal || changedIssues.has(id))) {
		markIssueDirty(id)
		return drawIssue(id, tab, { force: true })
	}
	if (page === 'intake') { syncIntakeFromBoard(); return drawIntake() }
	if (page === 'settings' && hadGlobal && !settingsDirty) return drawSettings({ force: true })
}

function connectLongPoll() {
	let seq = 0
	let initialized = false
	const set = (up) => { sseConnected = up; drawSidebar(); notifyHostState() }
	const step = async () => {
		try {
			const res = await api('GET', `/api/changes?after=${seq}&wait=${initialized ? 25 : 0}`)
			const wasDown = sseDisconnected
			sseDisconnected = false
			set(true)
			seq = res.seq ?? seq
			if (!initialized) {
				initialized = true
			} else if (res.reset || wasDown) {
				await flushLiveUpdate(true)
			} else if (res.events && res.events.length) {
				for (const ev of res.events) invalidateForEvent(ev)
				await flushLiveUpdate(false)
			}
			setTimeout(step, 50)
		} catch {
			sseDisconnected = true
			set(false)
			setTimeout(step, 2500)
		}
	}
	step()
}

function connect() {
	if (EMBED) return connectLongPoll()
	const set = (up) => { sseConnected = up; drawSidebar() }
	const source = new EventSource('/api/stream')
	source.onopen = () => {
		set(true)
		if (sseOpenedOnce && sseDisconnected) {
			flushLiveUpdate(true)
		}
		sseOpenedOnce = true
		sseDisconnected = false
	}
	source.onerror = () => {
		sseDisconnected = true
		set(false)
	}
	source.addEventListener('change', (e) => {
		let data = {}
		try { data = JSON.parse(e.data) } catch {}
		invalidateForEvent(data)
		clearTimeout(sseTimer)
		sseTimer = setTimeout(() => flushLiveUpdate(false), 150)
	})
}

const overviewSheet = { el: null }
function openOverviewSheet(url) {
	if (!overviewSheet.el) {
		overviewSheet.el = h('dialog', { class: 'sheet no-foot', style: 'width:min(1040px,96vw)', 'aria-label': 'PR Overview', onclick: (e) => { if (e.target === overviewSheet.el) overviewSheet.el.close() }, tabindex: '-1', onclose: () => emptyAfterClose(overviewSheet.el) })
		document.body.append(overviewSheet.el)
	}
	fill(overviewSheet.el,
		h('div', { class: 'view-bar' },
			h('strong', {}, 'PR Overview'),
			h('button', { type: 'button', class: 'btn sm', onclick: () => overviewSheet.el.close() }, icon('close', 'sm'), 'Close', h('span', { class: 'kbd' }, 'Esc'))
		),
		h('iframe', { src: url, style: 'width:100%;flex:1;border:0;min-height:70vh;background:#fff' })
	)
	showSheet(overviewSheet.el)
}

if (EMBED) {
	window.addEventListener('message', (e) => {
		const msg = e.data
		if (!msg || typeof msg !== 'object') return
		if (msg.type === 'factory:navigate' && typeof msg.hash === 'string') {
			const target = msg.hash.startsWith('#') ? msg.hash : `#${msg.hash}`
			if ((location.hash || '#/') !== target) navigateHash(target)
		} else if (msg.type === 'factory:prefetch' && typeof msg.hash === 'string') {
			prefetchHref(msg.hash.startsWith('#') ? msg.hash : `#${msg.hash}`)
		} else if (msg.type === 'factory:theme' && (msg.theme === 'light' || msg.theme === 'dark' || msg.theme === 'system')) {
			applyTheme(msg.theme, false)
		} else if (msg.type === 'factory:scope' && typeof msg.repo === 'string') {
			setRepoScope(msg.repo)
		} else if (msg.type === 'factory:action') {
			if (msg.action === 'new') openNewSheet()
			else if (msg.action === 'cmdk') openCmdPalette()
			else if (msg.action === 'shortcuts') openShortcuts()
			else if (msg.action === 'refresh') { historyCache.clear(); flushLiveUpdate(true) }
		}
	})
	document.addEventListener('click', (e) => {
		const a = e.target?.closest?.('a[href]')
		if (!a) return
		const raw = a.getAttribute('href') || ''
		if (raw.startsWith('#')) return
		if (raw.startsWith('/overview/')) {
			e.preventDefault()
			openOverviewSheet(raw)
			return
		}
		if (a.target === '_blank' || /^(https?|t3):/i.test(raw)) {
			e.preventDefault()
			postParent({ type: 'factory:open', url: a.href })
		}
	})
}

setInterval(() => {
	for (const el of document.querySelectorAll('[data-at]')) el.textContent = ago(Number(el.dataset.at))
	for (const el of document.querySelectorAll('[data-since]')) el.textContent = span(Date.now() - Number(el.dataset.since))
}, 20000)

// Close repo scope popover when clicking outside
window.addEventListener('click', (e) => {
	if (scopeMenuOpen && !e.target.closest('.scope-wrap')) { scopeMenuOpen = false; drawSidebar() }
})

// Keyboard shortcuts (⌘K, /, ?, n, j/k list nav, g+key navigation chords)
let chord = null
let chordTimer = null
window.addEventListener('keydown', (e) => {
	if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
		e.preventDefault(); openCmdPalette(); return
	}
	if (e.metaKey || e.ctrlKey || e.altKey) return
	if (document.querySelector('dialog[open]')) return
	const tag = document.activeElement?.tagName
	if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return

	if (chord === 'g') {
		clearTimeout(chordTimer); chord = null
		const k = e.key.toLowerCase()
		if (k === 'd') { e.preventDefault(); navigateHash('#/dashboard'); return }
		if (k === 'b') { e.preventDefault(); navigateHash('#/'); return }
		if (k === 'i') { e.preventDefault(); navigateHash('#/intake'); return }
		if (k === 'o') { e.preventDefault(); navigateHash('#/done'); return }
		if (k === 's') { e.preventDefault(); navigateHash('#/settings'); return }
	}
	if (e.key === 'g') {
		chord = 'g'
		clearTimeout(chordTimer)
		chordTimer = setTimeout(() => { chord = null }, 900)
		return
	}
	if (e.key === '?') { e.preventDefault(); openShortcuts(); return }
	if (e.key === 'n') { e.preventDefault(); openNewSheet(); return }
	if (e.key === '/') {
		const el = main.querySelector('.search')
		if (el) { e.preventDefault(); el.focus() }
		else { e.preventDefault(); openCmdPalette() }
		return
	}
	if (e.key === 'j' || e.key === 'k') {
		const openers = [...main.querySelectorAll('[data-list-row] [data-row-open]')]
		if (!openers.length) return
		e.preventDefault()
		const cur = openers.indexOf(document.activeElement)
		const next = e.key === 'j' ? (cur < 0 ? 0 : Math.min(openers.length - 1, cur + 1)) : (cur <= 0 ? 0 : cur - 1)
		openers[next].focus()
		return
	}
	if (e.key === 'Escape' && document.activeElement?.hasAttribute('data-row-open')) {
		document.activeElement.blur()
	}
})

// Wire static topbar buttons
document.getElementById('menu-btn').append(icon('menu'))
document.getElementById('menu-btn').addEventListener('click', openMobileNav)
document.getElementById('cmd-ic').replaceWith(icon('search', 'sm'))
document.getElementById('cmd-btn').addEventListener('click', openCmdPalette)
document.getElementById('new-btn').append(icon('plus', 'sm'), 'New issue')
document.getElementById('new-btn').addEventListener('click', openNewSheet)

let prevRouteKey = ''
function onRouteChange() {
	justSubmitted = null
	const r = route()
	const key = `${r.page}:${r.id || ''}`
	if (key !== prevRouteKey) {
		prevRouteKey = key
		if (window.scrollY > 0) window.scrollTo(0, 0)
	}
	draw()
}
function navigateHash(href) {
	const target = href.startsWith('#') ? href : `#${href}`
	if ((location.hash || '#/') === target) return
	try {
		history.pushState(null, '', location.pathname + location.search + target)
	} catch {
		location.hash = target
		return
	}
	onRouteChange()
}
window.addEventListener('hashchange', onRouteChange)
document.addEventListener('click', (e) => {
	if (e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return
	const a = e.target?.closest?.('a[href^="#/"]')
	if (!a || a.target) return
	const href = a.getAttribute('href')
	if (!href) return
	e.preventDefault()
	navigateHash(href)
})

// Predictive prefetch on hover, pointerdown, and keyboard focus.
function prefetchHref(href) {
	if (!href || !href.startsWith('#')) return
	if (href.startsWith('#/issue/')) {
		const raw = href.slice('#/issue/'.length).split('/')[0]
		if (raw) {
			try { prefetchIssue(decodeURIComponent(raw)) } catch {}
		}
	} else if (href === '#/settings') {
		prefetchSettings()
	} else if (href === '#/intake') {
		prefetchIntake()
	}
}
const onPrefetchTarget = (e) => {
	const a = e.target?.closest?.('a[href^="#/"]')
	if (a) prefetchHref(a.getAttribute('href'))
}
document.addEventListener('mouseover', onPrefetchTarget, { passive: true })
document.addEventListener('pointerdown', onPrefetchTarget, { passive: true })
document.addEventListener('focusin', onPrefetchTarget, { passive: true })

const onTimeTip = (e) => {
	const t = e.target?.closest?.('time[data-at]')
	if (t && !t.title) t.title = clock(Number(t.dataset.at))
}
document.addEventListener('mouseover', onTimeTip, { passive: true })
document.addEventListener('focusin', onTimeTip, { passive: true })

// Hydrate Board, Settings, and Intake from sessionStorage so F5 reloads and iframe remounts paint on frame 1.
function hydrateSessionCaches() {
	const bc = readSess('factory-cache-board')
	if (bc?.value?.issues) {
		board = bc.value
		lastBoardJson = JSON.stringify(board)
		loaded = true
		boardVersion++
	}
	const sc = readSess('factory-cache-settings')
	if (sc?.value?.data) {
		settingsCache.data = sc.value.data
		settingsCache.mcpInfo = sc.value.mcpInfo ?? null
		settingsCache.webhookInfo = sc.value.webhookInfo ?? null
		settingsCache.at = sc.at
		settingsCache.dirty = Date.now() - sc.at > 30_000
	}
	const ic = readSess('factory-cache-intake')
	if (ic?.value?.view) {
		intake.view = ic.value.view
		intake.fetchedAt = ic.value.fetchedAt || ic.at
		for (const [id, st] of Object.entries(ic.value.lists || {})) {
			intake.lists.set(id, { loading: false, error: null, items: st.items || [], readAt: st.readAt || ic.at })
		}
		intake.ver++
	}
}
hydrateSessionCaches()

// Background warm-up after first paint in two phases: priority issues + Settings + Intake first,
// then remaining open issues staggered after initial user navigation settles.
let warmedOnce = false
function warmApp() {
	if (warmedOnce || navigator.connection?.saveData) return
	warmedOnce = true
	const openIds = [
		...board.issues.filter((i) => i.needsYou),
		...board.issues.filter((i) => !i.needsYou)
	].slice(0, 16).map((i) => i.id)
	const runPhase1 = () => {
		prefetchSettings()
		prefetchIntake()
		prefetchIssuesBatch(openIds.slice(0, 4))
		if (openIds.length > 4) {
			setTimeout(() => {
				if (typeof requestIdleCallback === 'function') requestIdleCallback(() => prefetchIssuesBatch(openIds.slice(4)), { timeout: 400 })
				else prefetchIssuesBatch(openIds.slice(4))
			}, 450)
		}
	}
	if (typeof requestIdleCallback === 'function') requestIdleCallback(runPhase1, { timeout: 150 })
	else setTimeout(runPhase1, 40)
}

// Apply start page preference on initial bare load
if (!location.hash && startPagePref === 'dashboard') {
	location.replace('#/dashboard')
}
if (loaded) {
	syncIntakeFromBoard()
	draw()
	requestAnimationFrame(warmApp)
	refreshBoard().then((changed) => {
		if (changed) {
			syncIntakeFromBoard()
			draw()
		}
	})
} else {
	refreshBoard().then(() => draw()).then(() => requestAnimationFrame(warmApp))
}
connect()
</script>
