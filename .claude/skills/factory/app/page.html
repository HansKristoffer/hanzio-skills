async function drawDashboard() {
	drawBreadcrumb(repoScope ? [{ label: 'Dashboard', href: '#/dashboard', onclick: () => setRepoScope('') }, { label: repoShort(repoScope) }] : [])
	if (!loaded) return render()
	const local = historyFromBoard(dashDays)
	const hist = local || await loadHistory(dashDays)
	if (route().page !== 'dashboard') return
	const dashSig = `${boardVersion}|${repoScope}|${dashDays}|${local ? 1 : historyCache.get(dashDays)?.at || 0}`
	const cachedView = getCachedView('dashboard', dashSig)
	if (cachedView) return render(cachedView)

	const open = board.issues.filter(inScope)
	const closed = (hist.issues || []).filter(inScope)
	const shipped = closed.filter((i) => i.outcome === 'shipped')
	const otherClosed = closed.filter((i) => i.outcome !== 'shipped')

	const yours = open.filter((i) => i.needsYou)
	const working = open.filter((i) => !!i.run)
	const waiting = open.filter((i) => !i.needsYou && !i.run && !!i.waiting)

	// Breakdown of Needs you
	const planNeeds = yours.filter((i) => (i.decisions || []).some((d) => isOpenDec(d) && d.kind === 'plan'))
	const questionNeeds = yours.filter((i) => (i.decisions || []).some((d) => isOpenDec(d) && d.kind === 'question') && !(i.decisions || []).some((d) => isOpenDec(d) && d.kind === 'plan'))
	const mergeNeeds = yours.filter((i) => (i.decisions || []).some((d) => isOpenDec(d) && d.kind === 'merge'))
	const attentionNeeds = open.filter((i) => i.derived?.attention)

	const avgMin = shipped.length ? Math.round(shipped.reduce((s, i) => s + (i.minutes || 0), 0) / shipped.length) : null
	const avgRounds = shipped.length ? (shipped.reduce((s, i) => s + (i.reviewRounds || 0), 0) / shipped.length).toFixed(1) : null
	const autoMerged = shipped.filter((i) => i.merged === 'factory').length
	const humanMerged = shipped.filter((i) => i.merged === 'person').length

	const needsBreakdown = [
		planNeeds.length ? count(planNeeds.length, 'plan') : null,
		questionNeeds.length ? count(questionNeeds.length, 'decision') : null,
		mergeNeeds.length ? count(mergeNeeds.length, 'merge') : null
	].filter(Boolean).join(', ') || 'All clear right now'

	// Chart 1: Where issues are (by stage)
	const stageCounts = STAGES.map((s) => ({ stage: s, n: open.filter((i) => i.stage === s).length }))
	const maxStage = Math.max(1, ...stageCounts.map((s) => s.n))
	const stageCard = h('section', { class: 'card chart-card' },
		h('div', { class: 'chart-top' },
			h('div', {}, h('h3', {}, 'Where issues are'), h('p', {}, 'Open issues by pipeline stage. Click a stage to filter the board.')),
			h('a', { class: 'btn icon-only', href: '#/', title: 'Open Board' }, icon('arrowUR', 'sm'))
		),
		h('div', { class: 'hbar-list' }, ...stageCounts.map(({ stage, n }) =>
			h('button', {
				type: 'button',
				class: 'hbar-row',
				onclick: () => { boardFilter.stage = stage; boardFilter.quick = ''; navigateHash('#/') }
			},
				h('span', {}, cap(stage)),
				h('div', { class: 'hbar-track' }, h('div', { class: 'hbar-fill', style: `width:${(n / maxStage) * 100}%;background:${STAGE_COLOR[stage]}` })),
				h('span', { class: 'hbar-val' }, n)
			)
		))
	)

	// Chart 2: How long open issues have waited (age buckets, Needs you vs Others)
	const now = Date.now()
	const H = 3600000
	const buckets = [
		{ label: '<2h', min: 0, max: 2 * H },
		{ label: '2-12h', min: 2 * H, max: 12 * H },
		{ label: '12-24h', min: 12 * H, max: 24 * H },
		{ label: '1-3d', min: 24 * H, max: 72 * H },
		{ label: '3d+', min: 72 * H, max: Infinity }
	].map((b) => {
		const mine = open.filter((i) => { const age = now - i.createdAt; return age >= b.min && age < b.max })
		return { ...b, needs: mine.filter((i) => i.needsYou).length, other: mine.filter((i) => !i.needsYou).length, total: mine.length }
	})
	const maxBucket = Math.max(1, ...buckets.map((b) => b.total))
	const ageCard = h('section', { class: 'card chart-card' },
		h('div', { class: 'chart-top' },
			h('div', {}, h('h3', {}, 'How long open issues have waited'), h('p', {}, open.length ? `${count(open.length, 'open issue')}, ${yours.length} waiting on you highlighted.` : 'No open issues right now.')),
			h('a', { class: 'btn icon-only', href: '#/', title: 'Open Board' }, icon('arrowUR', 'sm'))
		),
		h('div', { class: 'vbar-chart' }, ...buckets.map((b) => {
			const hPx = Math.round((b.total / maxBucket) * 76)
			const nPx = b.total ? Math.round((b.needs / b.total) * hPx) : 0
			const oPx = Math.max(0, hPx - nPx)
			return h('div', { class: 'vbar-col', title: `${b.label}: ${b.needs} waiting on you, ${b.other} others` },
				h('span', { class: 'vbar-num' }, b.total || ''),
				h('div', { class: 'vbar-stack', style: `height:${Math.max(2, hPx)}px` },
					oPx ? h('div', { class: 'vbar-seg', style: `height:${oPx}px;background:var(--series-1)` }) : null,
					nPx ? h('div', { class: 'vbar-seg', style: `height:${nPx}px;background:var(--agent)` }) : null
				),
				h('span', { class: 'vbar-lbl' }, b.label)
			)
		})),
		h('div', { class: 'legend' },
			h('span', {}, h('i', { style: 'background:var(--agent)' }), 'Needs you'),
			h('span', {}, h('i', { style: 'background:var(--series-1)' }), 'In progress / waiting')
		)
	)

	// Chart 3: Shipped & closed per day (SVG area/line chart)
	const dayMs = 86400000
	const startDay = new Date(); startDay.setHours(0, 0, 0, 0)
	const daysArr = Array.from({ length: dashDays }, (_, idx) => {
		const t = startDay.getTime() - (dashDays - 1 - idx) * dayMs
		const dayShipped = shipped.filter((i) => i.closedAt >= t && i.closedAt < t + dayMs).length
		const dayOther = otherClosed.filter((i) => i.closedAt >= t && i.closedAt < t + dayMs).length
		return { t, shipped: dayShipped, total: dayShipped + dayOther }
	})
	const maxDay = Math.max(2, ...daysArr.map((d) => d.total))
	const W = 280, Hc = 92, padY = 8
	const px = (idx) => (daysArr.length <= 1 ? W / 2 : (idx / (daysArr.length - 1)) * W)
	const py = (val) => Hc - padY - (val / maxDay) * (Hc - padY * 2)
	const polyShip = daysArr.map((d, i) => `${px(i).toFixed(1)},${py(d.shipped).toFixed(1)}`).join(' ')
	const areaShip = `0,${Hc - padY} ${polyShip} ${W},${Hc - padY}`
	const polyTot = daysArr.map((d, i) => `${px(i).toFixed(1)},${py(d.total).toFixed(1)}`).join(' ')

		<circle cx="${px(daysArr.length - 1)}" cy="${py(daysArr.at(-1).shipped)}" r="3" fill="var(--series-3)"/>

	for (const i of [...yours, ...attentionNeeds]) if (!waitingMap.has(i.id)) waitingMap.set(i.id, i)

			h('a', { class: 'stat-tile', href: '#/', onclick: () => { boardFilter.quick = attentionNeeds.length ? 'attention' : ''; boardFilter.stage = '' } },
				h('span', { class: 'stat-lbl' }, h('span', { class: 'dot', style: `background:${attentionNeeds.length ? 'var(--bad)' : 'var(--ok)'}` }), 'Attention'),
				h('span', { class: 'stat-val-row' }, h('span', { class: `stat-val${attentionNeeds.length ? ' bad' : ''}` }, attentionNeeds.length), h('span', { class: 'arr' }, icon('arrowR', 'sm'))),
				h('span', { class: 'stat-sub' }, board.limited?.length ? `${board.limited.length} on usage limit` : attentionNeeds.length ? 'Blocked, stuck or CI failing' : 'Pipeline healthy')
			)
		),
		h('div', { class: 'dash-grid-3' }, stageCard, ageCard, trendCard),
		h('div', { class: 'dash-grid-2', style: 'margin-top:16px' },
			h('section', { class: 'card list-card' },
				h('div', { class: 'card-head' },
					h('h2', {}, 'Waiting on you', h('span', { class: 'count-pill', style: 'height:19px;font-size:11px' }, waitingItems.length)),
					yours.length ? h('a', { class: 'sec-link', style: 'font-size:12.5px', href: issueHref(yours[0]) }, `Start triaging (${yours.length})`, icon('arrowR', 'sm')) : null
				),
				h('div', { class: 'list-card-body', style: 'padding:8px' },
					waitingItems.length ? waitingItems.slice(0, 6).map((i) => {
						const s = i.derived
						const next = inOrder(i.decisions || []).find(isOpenDec)
						return h('a', { class: 'lc-item', href: issueHref(i) },
							h('div', { class: 'lc-item-top', style: 'justify-content:space-between' },
								h('div', { class: 'lc-item-top', style: 'flex:1' }, repoChip(i.repo), h('span', { class: 'lc-item-title' }, i.title)),
								chip(i.needsYou ? s.actionLabel : statusLabel(s), i.needsYou ? 'warn' : 'bad')
							),
							h('div', { class: 'lc-item-sub' }, next ? splitQuestion(next.question)[0] : statusLabel(s))
						)
					}) : h('p', { class: 'lc-empty' }, 'Nothing waiting on you right now.')
				)
			),
			h('section', { class: 'card chart-card' },
				h('div', { class: 'chart-top' },
					h('div', {}, h('h3', {}, `Outcomes (last ${dashDays} days)`), h('p', {}, closed.length ? `${count(closed.length, 'closed issue')} · ${shipped.length} shipped (${verifiedDeploys} verified deploys).` : 'No closed issues in this window.')),
					h('a', { class: 'btn icon-only', href: '#/done', title: 'View Done' }, icon('arrowUR', 'sm'))
				),
				outcomeCounts.length ? h('div', { class: 'hbar-list' }, ...outcomeCounts.map(({ o, n }) =>
					h('div', { class: 'hbar-row' },
						h('span', {}, outcomeName(o)),
						h('div', { class: 'hbar-track' }, h('div', { class: 'hbar-fill', style: `width:${(n / maxOut) * 100}%;background:${o === 'shipped' ? 'var(--series-3)' : 'var(--fg-subtle)'}` })),
						h('span', { class: 'hbar-val' }, n)
					)
				)) : h('p', { class: 'muted', style: 'font-size:12.5px' }, 'Shipped and closed issues will appear here.'),
				shipped.length ? h('div', { class: 'row', style: 'margin-top:auto;padding-top:6px' },
					chip(`${autoMerged} auto-merged`, 'accent'),
					chip(`${humanMerged} human-merged`),
					verifiedDeploys ? chip(`${verifiedDeploys} deploy verified`, 'ok') : null
				) : null
			)
		)
	)
	putCachedView('dashboard', dashSig, dashRoot)
	render(dashRoot)
}

// ---- Page: Board / Queue (#/) ----

function issueCopyLine(i) {
	const pr = prNumber(i.prUrl)
	const sz = i.size ? ` +${i.size.added}/-${i.size.deleted}` : ''
	return `${i.prUrl || location.origin + '/' + issueHref(i)} -> ${i.title}${pr ? ` (#${pr})` : ''}${sz}`
}

function queueRow(i) {
	const s = i.derived
	const next = inOrder(i.decisions || []).find(isOpenDec)
	const number = prNumber(i.prUrl)
	const subtitle = i.built || i.asked
	const showSubtitle = subtitle && subtitle.toLowerCase() !== i.title.toLowerCase()
	const dotColor = s.tone === 'warn' ? 'var(--warn-dot)' : s.tone === 'bad' ? 'var(--bad)' : s.tone === 'live' ? 'var(--accent)' : s.tone === 'ok' ? 'var(--ok)' : 'var(--fg-subtle)'
	const note = statusNote(s)

	return h('div', { class: 'q-row', 'data-list-row': '' },
		h('div', { class: 'q-main' },
			h('a', { class: 'q-title', href: issueHref(i), 'data-row-open': '', title: i.title }, i.title),
			showSubtitle ? h('div', { class: 'q-sub' }, subtitle) : null,
			h('div', { class: 'q-meta' },
				repoChip(i.repo),
				i.kind ? h('span', { class: 'subtle' }, i.kind) : null,
				number ? h('span', { class: 'mono subtle' }, `#${number}`) : null,
				diffstat(i.size),
				ciBadge(i.prChecks),
				i.autoShip ? chip('auto-ship', 'accent') : null,
				h('span', { class: 'subtle' }, when(i.updatedAt || i.createdAt))
			)
		),
		laneStrip(i),
		h('div', { class: 'q-next' },
			h('div', { class: `q-next-title ${s.tone}` },
				h('span', { class: 'dot', style: `background:${dotColor}` }),
				h('span', {}, statusLabel(s))
			),
			h('div', { class: 'q-next-detail' },
				next ? splitQuestion(next.question)[0]
					: note ? note
					: i.lastEvent ? [when(i.lastEvent.at), ' · ', i.lastEvent.text] : ''
			)
		),
		h('div', { class: 'q-act' },
			h('button', {
				type: 'button',
				class: 'btn icon-only row-copy',
				title: 'Copy link and summary',
				'aria-label': `Copy ${i.title}`,
				onclick: (e) => { e.stopPropagation(); copyText(issueCopyLine(i), 'Copied issue link') }
			}, icon('copy', 'sm')),
			i.needsYou
				? h('a', { class: 'btn primary sm', href: issueHref(i) }, s.actionLabel)
				: [out(i.prUrl, 'PR', 'pr', 'btn sm'), out(i.threadLink, 'Thread', 'thread', 'btn sm', 'Open in T3 Code')]
		)
	)
}

function drawBoard() {
	drawBreadcrumb(repoScope ? [{ label: 'Board', href: '#/', onclick: () => setRepoScope('') }, { label: repoShort(repoScope) }] : [])
	if (!loaded) return render()
	const boardSig = () => `${boardVersion}|${repoScope}|${boardFilter.quick}|${boardFilter.stage}|${boardFilter.sort}|${boardFilter.query}`
	const cachedView = getCachedView('board', boardSig())
	if (cachedView) return render(cachedView)
	const scoped = board.issues.filter(inScope)
	const scopedDoneShipped = board.done.filter((i) => inScope(i) && i.outcome === 'shipped').length
	const withStatus = scoped.map((i) => ({ i, s: i.derived }))

	const cntNeeds = withStatus.filter((x) => x.s.group === 'needs').length
	const cntWorking = withStatus.filter((x) => x.s.group === 'working').length
	const cntWaiting = withStatus.filter((x) => x.s.group === 'waiting').length
	const cntPaused = withStatus.filter((x) => x.s.group === 'paused').length
	const cntCiFail = scoped.filter((i) => i.prChecks === 'failing').length

	const diffTotal = (i) => (i.size ? i.size.added + i.size.deleted : 0)
	const sortItems = (arr) => arr.slice().sort((a, b) => {
		if (boardFilter.sort === 'newest') return b.i.createdAt - a.i.createdAt
		if (boardFilter.sort === 'oldest') return a.i.createdAt - b.i.createdAt
		if (boardFilter.sort === 'updated') return (b.i.updatedAt || b.i.createdAt) - (a.i.updatedAt || a.i.createdAt)
		if (boardFilter.sort === 'largest') return diffTotal(b.i) - diffTotal(a.i)
		return (a.i.updatedAt || a.i.createdAt) - (b.i.updatedAt || b.i.createdAt)
	})

	const GROUPS = [
		{ id: 'needs', title: 'Needs you', dot: 'var(--warn-dot)' },
		{ id: 'working', title: 'Agents working', dot: 'var(--accent)' },
		{ id: 'waiting', title: 'Waiting on GitHub & reviews', dot: 'var(--ok)' },
		{ id: 'paused', title: 'Paused & between runs', dot: 'var(--fg-subtle)' }
	]

	const toggleTile = (groupKey) => {
		boardFilter.quick = boardFilter.quick === groupKey ? '' : groupKey
		drawBoard()
	}

	const buildResults = () => {
		const q = boardFilter.query.trim().toLowerCase()
		const filtered = withStatus.filter(({ i, s }) => {
			if (boardFilter.stage && i.stage !== boardFilter.stage) return false
			if (boardFilter.quick === 'needs' && s.group !== 'needs') return false
			if (boardFilter.quick === 'working' && s.group !== 'working') return false
			if (boardFilter.quick === 'waiting' && s.group !== 'waiting') return false
			if (boardFilter.quick === 'paused' && s.group !== 'paused') return false
			if (boardFilter.quick === 'ci-fail' && i.prChecks !== 'failing') return false
			if (boardFilter.quick === 'attention' && !s.attention) return false
			if (q && !`${i.title} ${i.asked || ''} ${i.built || ''} ${i.repo} ${prNumber(i.prUrl) || ''}`.toLowerCase().includes(q)) return false
			return true
		})
		const groupSections = GROUPS.map((g) => {
			const rows = sortItems(filtered.filter((x) => x.s.group === g.id))
			if (!rows.length) return null
			return h('section', { class: 'q-group', id: `group-${g.id}` },
				h('div', { class: 'q-group-head' },
					h('h2', { class: 'q-group-title' },
						h('span', { class: 'dot', style: `background:${g.dot}` }),
						g.title,
						h('span', { class: 'cnt' }, rows.length)
					),
					g.id === 'needs' && rows.length > 1
						? h('a', { class: 'btn primary sm', href: issueHref(rows[0].i) }, `Start triaging (${rows.length})`)
						: null
				),
				h('div', { class: 'card' },
					h('div', { class: 'q-head' },
						h('span', {}, 'Issue'),
						h('span', { title: 'Research · Plan · Implement · Review · Land' }, 'Pipeline'),
						h('span', {}, 'Next step'),
						h('span', { style: 'text-align:right' }, 'Action')
					),
					...rows.map((r) => queueRow(r.i))
				)
			)
		}).filter(Boolean)
		return groupSections.length ? groupSections : h('section', { class: 'card' },
			!scoped.length
				? h('div', { class: 'empty' },
					h('h3', {}, repoScope ? `No open issues in ${repoScope}` : 'No issues in work'),
					h('p', {}, 'Start a new issue here, pick one from Intake, or tell a T3 Code thread to work an issue with the factory skill.'),
					h('div', { class: 'row', style: 'justify-content:center;margin-top:14px' },
						h('button', { type: 'button', class: 'btn primary', onclick: () => openNewSheet() }, icon('plus', 'sm'), 'New issue'),
						h('a', { class: 'btn', href: '#/intake' }, icon('inbox', 'sm'), 'Open Intake')
					)
				)
				: h('div', { class: 'empty' },
					h('h3', {}, 'No matching issues'),
					h('p', {}, 'Try clearing your search or stage filters.'),
					h('button', { type: 'button', class: 'btn', onclick: () => { Object.assign(boardFilter, { quick: '', stage: '', query: '' }); drawBoard() } }, 'Reset filters')
				)
		)
	}

	const hasFiltersNow = () => !!(boardFilter.quick || boardFilter.stage || boardFilter.query.trim())
	const resultsEl = h('div', { id: 'board-results' }, buildResults())
	const kbdEl = h('span', { class: 'kbd', hidden: !!boardFilter.query }, '/')
	const resetBtn = h('button', {
		type: 'button',
		class: 'btn quiet sm',
		hidden: !hasFiltersNow(),
		onclick: () => { Object.assign(boardFilter, { quick: '', stage: '', query: '' }); drawBoard() }
	}, icon('close', 'sm'), 'Reset')
	const syncSearch = (val) => {
		boardFilter.query = val
		fill(resultsEl, buildResults())
		kbdEl.hidden = !!val
		resetBtn.hidden = !hasFiltersNow()
		putCachedView('board', boardSig(), boardRoot)
	}

	const boardRoot = h('div', { class: 'page-enter' },
		h('div', { class: 'page-head' },
			h('div', {},
				h('h1', {}, 'Board', h('span', { class: 'count-pill' }, scoped.length)),
				h('p', { class: 'sub' }, repoScope ? `Open issues in ${repoScope}, grouped by their next step.` : 'Every open issue, grouped by its next step.')
			)
		),
		h('section', { class: 'stat-strip', 'aria-label': 'Board overview' },
			h('button', { type: 'button', class: `stat-tile${boardFilter.quick === 'needs' ? ' active' : ''}`, onclick: () => toggleTile('needs') },
				h('span', { class: 'stat-lbl' }, h('span', { class: 'dot', style: 'background:var(--warn-dot)' }), 'Needs you'),
				h('span', { class: 'stat-val-row' }, h('span', { class: `stat-val${cntNeeds ? ' warn' : ''}` }, cntNeeds), h('span', { class: 'arr' }, icon('arrowR', 'sm')))
			),
			h('button', { type: 'button', class: `stat-tile${boardFilter.quick === 'working' ? ' active' : ''}`, onclick: () => toggleTile('working') },
				h('span', { class: 'stat-lbl' }, h('span', { class: 'dot', style: 'background:var(--accent)' }), 'Working'),
				h('span', { class: 'stat-val-row' }, h('span', { class: 'stat-val' }, cntWorking), h('span', { class: 'arr' }, icon('arrowR', 'sm')))
			),
			h('button', { type: 'button', class: `stat-tile${boardFilter.quick === 'waiting' ? ' active' : ''}`, onclick: () => toggleTile('waiting') },
				h('span', { class: 'stat-lbl' }, h('span', { class: 'dot', style: 'background:var(--ok)' }), 'Waiting'),
				h('span', { class: 'stat-val-row' }, h('span', { class: 'stat-val' }, cntWaiting), h('span', { class: 'arr' }, icon('arrowR', 'sm')))
			),
			h('button', { type: 'button', class: `stat-tile${boardFilter.quick === 'paused' ? ' active' : ''}`, onclick: () => toggleTile('paused') },
				h('span', { class: 'stat-lbl' }, h('span', { class: 'dot', style: 'background:var(--fg-subtle)' }), 'Paused'),
				h('span', { class: 'stat-val-row' }, h('span', { class: 'stat-val' }, cntPaused), h('span', { class: 'arr' }, icon('arrowR', 'sm')))
			),
			h('a', { class: 'stat-tile', href: '#/done' },
				h('span', { class: 'stat-lbl' }, h('span', { class: 'dot', style: 'background:var(--ok)' }), 'Shipped (30d)'),
				h('span', { class: 'stat-val-row' }, h('span', { class: 'stat-val' }, scopedDoneShipped), h('span', { class: 'arr' }, icon('arrowR', 'sm')))
			)
		),
		scoped.length ? h('div', { class: 'filter-bar' },
			h('div', { class: 'filter-row' },
				h('div', { class: 'search-box' },
					icon('search', 'sm'),
					h('input', {
						type: 'search',
						class: 'search',
						placeholder: 'Filter by title, repo, or PR...',
						'aria-label': 'Filter issues',
						'data-draft': 'board-search',
						value: boardFilter.query,
						oninput: (e) => syncSearch(e.target.value),
						onkeydown: (e) => { if (e.key === 'Escape' && boardFilter.query) { e.preventDefault(); e.target.value = ''; syncSearch('') } }
					}),
					kbdEl
				),
				cntCiFail > 0 ? h('button', {
					type: 'button',
					class: `tpill${boardFilter.quick === 'ci-fail' ? ' on' : ''}`,
					style: 'height:34px;border-radius:8px;padding:0 11px',
					onclick: () => toggleTile('ci-fail')
				}, 'CI failing', h('span', { class: 'cnt' }, cntCiFail)) : null,
				h('select', {
					class: `select-ctrl${boardFilter.stage ? ' on' : ''}`,
					'aria-label': 'Filter by stage',
					onchange: (e) => { boardFilter.stage = e.target.value; drawBoard() }
				},
					h('option', { value: '', selected: !boardFilter.stage }, 'All stages'),
					...STAGES.map((s) => h('option', { value: s, selected: boardFilter.stage === s }, cap(s)))
				),
				h('select', {
					class: 'select-ctrl',
					'aria-label': 'Sort issues',
					onchange: (e) => { boardFilter.sort = e.target.value; drawBoard() }
				},
					...[
						['priority', 'Priority'],
						['newest', 'Newest'],
						['oldest', 'Oldest'],
						['updated', 'Recently updated'],
						['largest', 'Largest diff']
					].map(([k, lbl]) => h('option', { value: k, selected: boardFilter.sort === k }, lbl))
				),
				resetBtn
			)
		) : null,
		board.limited?.length ? h('div', { class: 'notice', style: 'margin:0 0 16px' },
			`${count(board.limited.length, 'issue')} paused on a provider usage limit: `,
			board.limited.map((l) => `${l.title} (until ${clock(l.until)})`).join(', ')
		) : null,
		resultsEl
	)
	putCachedView('board', boardSig(), boardRoot)
	render(boardRoot)
}

// ---- Page: Done (#/done) ----

let doneWarmTimer
async function drawDone() {
	drawBreadcrumb(repoScope ? [{ label: 'Done', href: '#/done', onclick: () => setRepoScope('') }, { label: repoShort(repoScope) }] : [])
	if (!loaded) return render()
	const local = historyFromBoard(30)
	const hist = local || await loadHistory(30)
	if (route().page !== 'done') return
	const histStamp = local ? 1 : historyCache.get(30)?.at || 0
	const doneSig = () => `${boardVersion}|${repoScope}|${doneFilter.outcome}|${doneFilter.sort}|${doneFilter.query}|${histStamp}`
	const scheduleDoneWarm = (rows) => {
		if (navigator.connection?.saveData || !rows.length) return
		clearTimeout(doneWarmTimer)
		const ids = rows.slice(0, 10).map((i) => i.id)
		doneWarmTimer = setTimeout(() => {
			if (route().page === 'done') prefetchIssuesBatch(ids)
		}, 180)
	}
	const cachedView = getCachedView('done', doneSig())
	if (cachedView) {
		render(cachedView)
		scheduleDoneWarm(board.done.filter(inScope))
		return
	}

	const allDone = local
		? board.done.filter(inScope)
		: (() => {
			const histById = new Map((hist.issues || []).map((i) => [i.id, i]))
			return board.done.filter(inScope).map((i) => ({ ...i, ...(histById.get(i.id) || {}) }))
		})()
	const outcomes = [...new Set(allDone.map((i) => i.outcome).filter(Boolean))].sort()
	const shipped = allDone.filter((i) => i.outcome === 'shipped')
	const avgMin = shipped.length ? Math.round(shipped.reduce((s, i) => s + (i.minutes || 0), 0) / shipped.length) : null
	const autoMerged = shipped.filter((i) => i.merged === 'factory').length
	const humanMerged = shipped.filter((i) => i.merged === 'person').length

	const filteredDone = () => {
		const q = doneFilter.query.trim().toLowerCase()
		return allDone.filter((i) => {
			if (doneFilter.outcome && i.outcome !== doneFilter.outcome) return false
			if (q && !`${i.title} ${i.summary || ''} ${i.repo}`.toLowerCase().includes(q)) return false
			return true
		}).sort((a, b) => {
			if (doneFilter.sort === 'fastest') return (a.minutes ?? 1e9) - (b.minutes ?? 1e9)
			if (doneFilter.sort === 'slowest') return (b.minutes ?? 0) - (a.minutes ?? 0)
			if (doneFilter.sort === 'largest') return ((b.size?.added || 0) + (b.size?.deleted || 0)) - ((a.size?.added || 0) + (a.size?.deleted || 0))
			return (b.closedAt || 0) - (a.closedAt || 0)
		})
	}
	const buildDoneRows = (rows) => rows.length ? rows.map((i) => h('div', { class: 'q-row', style: 'grid-template-columns:minmax(0,1fr) auto', 'data-list-row': '' },
		h('div', { class: 'q-main' },
			h('a', { class: 'q-title', href: issueHref(i), 'data-row-open': '' }, i.title),
			i.summary ? h('div', { class: 'q-sub' }, i.summary) : null,
			h('div', { class: 'q-meta' },
				repoChip(i.repo),
				chip(outcomeName(i.outcome), i.outcome === 'shipped' ? 'ok' : ''),
				i.deploy && i.deploy !== 'none' ? chip(`deploy ${i.deploy}`, i.deploy === 'verified' ? 'ok' : 'warn') : null,
				i.kind ? chip(i.kind) : null,
				diffstat(i.size),
				i.minutes !== undefined ? h('span', { class: 'mono subtle' }, span(i.minutes * 60000)) : null,
				i.reviewRounds ? h('span', { class: 'subtle' }, count(i.reviewRounds, 'review')) : null,
				h('span', { class: 'subtle' }, when(i.closedAt))
			)
		),
		h('div', { class: 'q-act' },
			out(i.prUrl, prNumber(i.prUrl) ? `PR #${prNumber(i.prUrl)}` : 'PR', 'pr', 'btn sm')
		)
	)) : h('div', { class: 'empty' }, h('h3', {}, allDone.length ? 'No matching closed issues' : 'Nothing closed yet'))

	const rows = filteredDone()
	const resultsEl = h('section', { class: 'card', id: 'done-results' }, buildDoneRows(rows))
	const kbdEl = h('span', { class: 'kbd', hidden: !!doneFilter.query }, '/')
	const syncDoneSearch = (val) => {
		doneFilter.query = val
		fill(resultsEl, buildDoneRows(filteredDone()))
		kbdEl.hidden = !!val
		putCachedView('done', doneSig(), doneRoot)
	}

	const doneRoot = h('div', { class: 'page-enter' },
		h('div', { class: 'page-head' },
			h('div', {},
				h('h1', {}, 'Done', h('span', { class: 'count-pill' }, allDone.length)),
				h('p', { class: 'sub' }, 'Issues shipped and closed in the last 30 days.')
			)
		),
		h('section', { class: 'stat-strip cols-4', 'aria-label': 'Done summary' },
			h('div', { class: 'stat-tile' },
				h('span', { class: 'stat-lbl' }, h('span', { class: 'dot', style: 'background:var(--ok)' }), 'Shipped'),
				h('span', { class: 'stat-val' }, shipped.length),
				h('span', { class: 'stat-sub' }, `${allDone.length - shipped.length} closed with other outcome`)
			),
			h('div', { class: 'stat-tile' },
				h('span', { class: 'stat-lbl' }, 'Avg cycle time'),
				h('span', { class: 'stat-val' }, avgMin !== null ? span(avgMin * 60000) : '-'),
				h('span', { class: 'stat-sub' }, 'From intake to ship')
			),
			h('div', { class: 'stat-tile' },
				h('span', { class: 'stat-lbl' }, 'Merged by'),
				h('span', { class: 'stat-val' }, shipped.length ? `${autoMerged} / ${humanMerged}` : '-'),
				h('span', { class: 'stat-sub' }, 'Factory auto / Human')
			),
			h('div', { class: 'stat-tile' },
				h('span', { class: 'stat-lbl' }, 'Verified deploys'),
				h('span', { class: 'stat-val' }, shipped.filter((i) => i.deploy === 'verified').length),
				h('span', { class: 'stat-sub' }, `${shipped.filter((i) => i.deploy === 'unverified').length} unverified`)
			)
		),
		allDone.length > 1 ? h('div', { class: 'filter-bar' },
			h('div', { class: 'filter-row' },
				h('div', { class: 'search-box' },
					icon('search', 'sm'),
					h('input', {
						type: 'search',
						class: 'search',
						placeholder: 'Filter closed issues...',
						'aria-label': 'Filter closed issues',
						'data-draft': 'done-search',
						value: doneFilter.query,
						oninput: (e) => syncDoneSearch(e.target.value),
						onkeydown: (e) => { if (e.key === 'Escape' && doneFilter.query) { e.preventDefault(); e.target.value = ''; syncDoneSearch('') } }
					}),
					kbdEl
				),
				h('select', { class: 'select-ctrl', 'aria-label': 'Sort closed', onchange: (e) => { doneFilter.sort = e.target.value; drawDone() } },
					...[['recent', 'Recently closed'], ['fastest', 'Fastest'], ['slowest', 'Slowest'], ['largest', 'Largest diff']]
						.map(([k, lbl]) => h('option', { value: k, selected: doneFilter.sort === k }, lbl))
				)
			),
			outcomes.length > 1 ? h('div', { class: 'toggle-pills' },
				h('button', { type: 'button', class: `tpill${!doneFilter.outcome ? ' on' : ''}`, onclick: () => { doneFilter.outcome = ''; drawDone() } }, 'All', h('span', { class: 'cnt' }, allDone.length)),
				...outcomes.map((o) => h('button', {
					type: 'button',
					class: `tpill${doneFilter.outcome === o ? ' on' : ''}`,
					onclick: () => { doneFilter.outcome = doneFilter.outcome === o ? '' : o; drawDone() }
				}, outcomeName(o), h('span', { class: 'cnt' }, allDone.filter((i) => i.outcome === o).length)))
			) : null
		) : null,
		resultsEl
	)
	putCachedView('done', doneSig(), doneRoot)
	render(doneRoot)
	scheduleDoneWarm(rows)
}

// ---- Page: Issue Detail (#/issue/:id[/tab]) ----

const planSheet = { el: null }
function openPlanSheet(title, markdown) {
	if (!planSheet.el) {
		planSheet.el = h('dialog', { class: 'sheet wide no-foot', 'aria-label': 'Full plan', onclick: (e) => { if (e.target === planSheet.el) planSheet.el.close() }, tabindex: '-1', onclose: () => emptyAfterClose(planSheet.el) })
		document.body.append(planSheet.el)
	}
	fill(planSheet.el,
		h('div', { class: 'view-bar' },
			h('strong', {}, title),
			h('button', { type: 'button', class: 'btn sm', onclick: () => planSheet.el.close() }, icon('close', 'sm'), 'Close', h('span', { class: 'kbd' }, 'Esc'))
		),
		h('div', { class: 'sheet-body' }, h('div', { class: 'md' }, md(markdown)))
	)
	showSheet(planSheet.el)
}

function pickedFor(d) {
	const saved = selections.get(d.id)
	if (saved) return saved
	if (d.provisional) return { mode: 'option', value: d.recommendation }
	return null
}

function answerValueOf(d) {
	const p = pickedFor(d)
	if (!p) return ''
	return p.mode === 'custom' ? (drafts.get(`custom:${d.id}`) || '').trim() : p.value
}

function decisionWorkbench(data, pending, planRes) {
	const issue = data.issue
	const held = pending.filter((d) => d.answer !== null)
	const openQuestions = inOrder(pending.filter((d) => isOpenDec(d) && d.kind === 'question'))
	const openPlan = pending.find((d) => isOpenDec(d) && d.kind === 'plan') || null
	const openBlocked = pending.filter((d) => isOpenDec(d) && d.kind === 'blocked')
	const openMerge = pending.find((d) => isOpenDec(d) && d.kind === 'merge') || null
	const retry = async (errEl) => {
		try { await api('POST', `/api/issues/${encodeURIComponent(issue.id)}/deliver`, {}) } catch (e) { errEl.textContent = e.message }
	}
	const cards = []

	const heldRow = (d) => {
		const err = h('span', { class: 'error' })
		return h('div', { class: 'answered-row' },
			h('span', { class: 'ok-mark' }, '✓'),
			h('span', {}, splitQuestion(d.question)[0]),
			h('span', { class: 'ans-val' }, d.answer),
			h('span', { class: 'subtle' }, d.delivery === 'failed' ? 'Delivery failed' : 'Held until the rest is answered'),
			d.delivery === 'failed' ? h('button', { type: 'button', class: 'btn sm', onclick: () => retry(err) }, 'Retry') : null,
			err
		)
	}

	if (openPlan || openQuestions.length) {
		const box = h('section', { class: 'card wb-card', id: 'decision-workbench' })
		const rebuild = () => {
			const errorEl = h('div', { class: 'error' })
			const unselectedBlocking = openQuestions.filter((d) => !answerValueOf(d))
			const differing = openPlan ? openQuestions.filter((d) => { const v = answerValueOf(d); return v && v !== d.recommendation }) : []
			const fbKey = `plan-fb:${issue.id}`
			const fbOpen = planChangeOpen.has(issue.id) || differing.length > 0
			const fbText = (drafts.get(fbKey) || '').trim()
			const willRevise = !!openPlan && (differing.length > 0 || planChangeOpen.has(issue.id))
			const planText = openPlan?.body || planRes?.plan || ''

			const submitAll = async () => {
				if (unselectedBlocking.length) return
				const answers = openQuestions.map((d) => ({ decision: d.id, answer: answerValueOf(d) }))
				if (openPlan) answers.push({ decision: openPlan.id, answer: willRevise ? (fbText ? `Change: ${fbText}` : 'Change') : 'Approve' })
				for (const b of box.querySelectorAll('button')) b.disabled = true
				errorEl.textContent = ''
				try {
					const res = await api('POST', `/api/issues/${encodeURIComponent(issue.id)}/answers`, {
						answers,
						autoShip: !!openPlan && !willRevise && !!autoShipDraft.get(issue.id)
					})
					for (const d of openQuestions) { selections.delete(d.id); drafts.delete(`custom:${d.id}`) }
					drafts.delete(fbKey); planChangeOpen.delete(issue.id); autoShipDraft.delete(issue.id)
					if (res.error) { errorEl.textContent = `Saved, but not delivered: ${res.error}`; for (const b of box.querySelectorAll('button')) b.disabled = false; return }
					justSubmitted = { issueId: issue.id, label: openPlan ? (willRevise ? 'Sent choices to revise the plan' : 'Plan approved, implementation starting') : 'Answers sent to thread' }
					markIssueDirty(issue.id)
					await refreshBoard(); draw()
				} catch (e) {
					errorEl.textContent = e.message
					for (const b of box.querySelectorAll('button')) b.disabled = false
				}
			}

			const hasUnpicked = openQuestions.some((d) => !pickedFor(d))
			const titleText = openPlan
				? (openQuestions.length ? `Review plan & ${count(openQuestions.length, 'choice')}` : 'Approve the plan')
				: count(openQuestions.length, 'decision')

			const head = h('div', { class: 'wb-head' },
				h('h2', {}, icon(openPlan ? 'doc' : 'help', 'sm'), titleText),
				h('div', { class: 'row' },
					hasUnpicked ? h('button', { type: 'button', class: 'btn sm', onclick: () => { for (const d of openQuestions) selections.set(d.id, { mode: 'option', value: d.recommendation }); rebuild() } }, 'Select recommended for all') : null,
					planText ? h('button', { type: 'button', class: 'btn sm', onclick: () => openPlanSheet(`Plan: ${issue.title}`, planText) }, icon('doc', 'sm'), 'Read full plan') : null
				)
			)

			let planBlock = null
			if (openPlan) {
				const outline = planRes?.outline || []
				const criteria = planRes?.criteria || []
				const later = planRes?.later || []
				const [ask, more] = splitQuestion(openPlan.question)
				planBlock = h('div', { class: 'wb-plan' },
					h('div', { class: 'wb-plan-top' }, h('h3', {}, ask), when(openPlan.askedAt)),
					more ? h('p', { class: 'q-more' }, more) : null,
					outline.length ? h('ul', { class: 'outline' }, ...outline.map((pt) => h('li', {}, mdInline(pt)))) : (!more && planRes?.planned ? h('p', { class: 'q-more', style: 'margin-top:8px' }, planRes.planned) : null),
					(criteria.length || later.length) ? h('div', { class: 'wb-facts' },
						criteria.length ? chip(criteria.length === 1 ? '1 acceptance criterion' : `${criteria.length} acceptance criteria`) : null,
						later.length ? chip(`${count(later.length, 'later slice')} deferred`) : null
					) : null
				)
			}

			const qCards = openQuestions.map((d, idx) => {
				const [ask, more] = splitQuestion(d.question)
				const picked = pickedFor(d)
				const opts = [d.recommendation, ...(d.options || []).filter((o) => o && o !== d.recommendation)]
				const isCustom = picked?.mode === 'custom'
				const customInput = isCustom ? h('textarea', {
					rows: 2, placeholder: 'Write your answer', 'aria-label': `Custom answer for ${ask}`, 'data-draft': `custom:${d.id}`,
					oninput: (e) => { drafts.set(`custom:${d.id}`, e.target.value); updateBarState() },
					onkeydown: (e) => { if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); submitAll() } }
				}, drafts.get(`custom:${d.id}`) || '') : null
				return h('div', { class: `need${!d.provisional ? ' blocking' : ''}` },
					h('div', { class: 'need-top' },
						openQuestions.length > 1 ? h('span', { class: 'q-num' }, idx + 1) : null,
						h('span', { class: `kind-lbl${d.provisional ? ' quiet' : ''}` }, d.provisional ? 'Default selected · override if needed' : 'Decision required'),
						when(d.askedAt)
					),
					h('p', { class: 'question' }, ask),
					more ? h('p', { class: 'q-more' }, more) : null,
					d.body ? h('div', { class: 'md', style: 'margin-top:8px' }, md(d.body)) : null,
					h('div', { class: 'opt-list', role: 'radiogroup', 'aria-label': ask },
						...opts.map((opt, n) => {
							const on = picked?.mode === 'option' && picked.value === opt
							return h('button', {
								type: 'button', class: `opt-card${on ? ' picked' : ''}`, role: 'radio', 'aria-checked': on ? 'true' : 'false',
								onclick: () => { selections.set(d.id, { mode: 'option', value: opt }); rebuild() }
							}, h('span', { class: 'radio' }), h('span', { class: 'opt-body' }, opt, n === 0 ? h('span', { class: 'opt-rec' }, 'Recommended') : null))
						}),
						h('button', {
							type: 'button', class: `opt-card custom-toggle${isCustom ? ' picked' : ''}`, role: 'radio', 'aria-checked': isCustom ? 'true' : 'false',
							onclick: () => { selections.set(d.id, { mode: 'custom', value: '' }); rebuild(); const el = box.querySelector(`[data-draft="${CSS.escape(`custom:${d.id}`)}"]`); if (el) el.focus() }
						}, h('span', { class: 'radio' }), h('span', { class: 'opt-body' }, 'Answer in your own words...')),
						isCustom ? h('div', { class: 'opt-custom-box' }, customInput) : null
					)
				)
			})

			const statusEl = h('span', { class: 'wb-status' })
			const submitBtn = h('button', { type: 'button', class: 'btn primary', onclick: submitAll })
			const updateBarState = () => {
				const missingNow = openQuestions.filter((d) => !answerValueOf(d))
				const diffNow = openPlan ? openQuestions.filter((d) => { const v = answerValueOf(d); return v && v !== d.recommendation }) : []
				const reviseNow = !!openPlan && (diffNow.length > 0 || planChangeOpen.has(issue.id))
				submitBtn.disabled = missingNow.length > 0
				statusEl.className = `wb-status${missingNow.length ? ' warn' : ''}`
				if (missingNow.length) statusEl.textContent = `${count(missingNow.length, 'decision')} still needs a selection`
				else if (openPlan && reviseNow) statusEl.textContent = diffNow.length ? `${count(diffNow.length, 'choice')} differs from the plan: sending back to revise` : 'Will send your notes back to revise the plan'
				else if (openPlan) statusEl.textContent = openQuestions.length ? `All ${count(openQuestions.length, 'choice')} ready · plan will start implementing` : 'Approving starts implementation immediately'
				else statusEl.textContent = `Ready to send ${count(openQuestions.length, 'answer')} to the thread`
				const label = openPlan ? (reviseNow ? 'Send choices & revise plan' : 'Approve plan & build') : (openQuestions.length === 1 ? 'Send answer' : `Send ${openQuestions.length} answers`)
				submitBtn.replaceChildren(label, h('span', { class: 'kbd' }, '⌘↵'))
			}
			updateBarState()

			const fbBox = fbOpen && openPlan ? h('div', { class: 'wb-feedback' },
				field(differing.length ? 'Optional notes for the planner' : 'What should change in the plan?',
					h('textarea', {
						rows: 2, placeholder: 'Tell the planner what to adjust', 'data-draft': fbKey,
						oninput: (e) => { drafts.set(fbKey, e.target.value); updateBarState() },
						onkeydown: (e) => { if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); submitAll() } }
					}, drafts.get(fbKey) || '')
				)
			) : null

			const autoCheck = openPlan && !willRevise && data.merge !== 'never' ? h('label', { class: 'wb-auto' },
				h('input', { type: 'checkbox', checked: !!autoShipDraft.get(issue.id), onchange: (e) => autoShipDraft.set(issue.id, e.target.checked) }),
				'Auto-merge once CI & reviews are green'
			) : null

			const bar = h('div', { class: 'wb-bar' },
				h('div', { class: 'wb-bar-meta' }, statusEl, autoCheck, errorEl),
				h('div', { class: 'row' },
					openPlan && !differing.length ? h('button', {
						type: 'button', class: 'btn',
						onclick: () => {
							if (planChangeOpen.has(issue.id)) planChangeOpen.delete(issue.id)
							else planChangeOpen.add(issue.id)
							rebuild()
							const el = box.querySelector(`[data-draft="${CSS.escape(fbKey)}"]`)
							if (el) el.focus()
						}
					}, planChangeOpen.has(issue.id) ? 'Cancel changes' : 'Request changes') : null,
					submitBtn
				)
			)
			box.onkeydown = (e) => { if (e.key === 'Enter' && (e.metaKey || e.ctrlKey) && !submitBtn.disabled) { e.preventDefault(); submitAll() } }
			fill(box, head, ...held.filter((d) => d.kind === 'question').map(heldRow), planBlock, ...qCards, fbBox, bar)
		}
		rebuild()
		cards.push(box)
	} else if (held.length) {
		cards.push(h('section', { class: 'card wb-card' }, h('div', { class: 'wb-head' }, h('h2', {}, 'Pending delivery')), ...held.map(heldRow)))
	}

	for (const d of openBlocked) cards.push(singleDecisionCard(issue, d))
	if (openMerge) cards.push(mergeDecisionCard(issue, openMerge, openQuestions.filter((d) => !d.provisional).length))
	return cards
}

function singleDecisionCard(issue, d) {
	const error = h('div', { class: 'error' })
	const words = h('textarea', { rows: 1, placeholder: 'Or answer in your own words', 'aria-label': 'Your answer', 'data-draft': d.id, oninput: () => drafts.set(d.id, words.value), onkeydown: (e) => { if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) sendOwn() } }, drafts.get(d.id) || '')
	const send = async (answer) => {
		for (const b of card.querySelectorAll('button')) b.disabled = true
		try {
			const res = await api('POST', `/api/issues/${encodeURIComponent(issue.id)}/answers`, { answers: [{ decision: d.id, answer }] })
			drafts.delete(d.id)
			if (res.error) { error.textContent = `Saved, but not delivered: ${res.error}`; for (const b of card.querySelectorAll('button')) b.disabled = false; return }
			justSubmitted = { issueId: issue.id, label: 'Answer sent to thread' }
			markIssueDirty(issue.id)
			await refreshBoard(); draw()
		} catch (e) { error.textContent = e.message; for (const b of card.querySelectorAll('button')) b.disabled = false }
	}
	const sendOwn = () => words.value.trim() && send(words.value.trim())
	const [ask, more] = splitQuestion(d.question)
	const fixed = d.round !== null
	const card = h('section', { class: 'card wb-card', id: 'decision-workbench' },
		h('div', { class: 'wb-head' }, h('h2', {}, icon('alert', 'sm'), fixed ? `Review round ${d.round} budget reached` : 'Blocked'), when(d.askedAt)),
		h('div', { class: 'need' },
			h('p', { class: 'question', style: 'margin-top:0' }, ask),
			more ? h('p', { class: 'q-more' }, more) : null,
			d.body ? h('div', { class: 'md', style: 'margin-top:8px' }, md(d.body)) : null,
			fixed
				? [
					h('p', { class: 'muted', style: 'margin-top:10px;font-size:12.5px' }, `Recommended: ${d.recommendation}`),
					h('div', { class: 'row', style: 'margin-top:10px' }, ...d.options.map((o, n) => h('button', { type: 'button', class: `btn long${n === 0 ? ' primary' : ''}`, onclick: () => send(o) }, o)))
				]
				: [
					h('div', { class: 'row', style: 'margin-top:12px' },
						h('button', { type: 'button', class: 'btn long primary', onclick: () => send(d.recommendation) }, d.recommendation),
						...(d.options || []).filter((o) => o !== d.recommendation).map((o) => h('button', { type: 'button', class: 'btn long', onclick: () => send(o) }, o))
					),
					h('div', { class: 'own' }, words, h('button', { type: 'button', class: 'btn', onclick: sendOwn }, 'Send'))
				],
			error
		)
	)
	return card
}

function mergeDecisionCard(issue, d, blockingBefore = 0) {
	const box = h('section', { class: 'card wb-card', id: 'decision-workbench' })
	const rebuild = () => {
		const error = h('div', { class: 'error' })
		const noteKey = `merge-note:${d.id}`
		const requesting = mergeChangeOpen.has(d.id)
		const [ask, more] = splitQuestion(d.question)
		const number = prNumber(issue.prUrl)
		const send = async (answer) => {
			for (const b of box.querySelectorAll('button')) b.disabled = true
			error.textContent = ''
			try {
				const res = await api('POST', `/api/issues/${encodeURIComponent(issue.id)}/answers`, { answers: [{ decision: d.id, answer }] })
				drafts.delete(noteKey); mergeChangeOpen.delete(d.id)
				if (res.error) { error.textContent = `Saved, but not delivered: ${res.error}`; for (const b of box.querySelectorAll('button')) b.disabled = false; return }
				justSubmitted = { issueId: issue.id, label: res.held ? 'Saved, waiting for the remaining blocking decision above' : answer === 'Merge' ? 'Merge approved, landing now' : 'Feedback sent to thread' }
				markIssueDirty(issue.id)
				await refreshBoard(); draw()
			} catch (e) { error.textContent = e.message; for (const b of box.querySelectorAll('button')) b.disabled = false }
		}
		const sendHold = () => {
			const notes = (drafts.get(noteKey) || '').trim()
			send(notes ? `Do not merge: ${notes}` : 'Do not merge')
		}
		const noteArea = requesting ? h('div', { class: 'wb-feedback' },
			field('What should change before merging? (optional)',
				h('textarea', {
					rows: 2, placeholder: 'Describe what to fix or adjust; leave blank to hold the PR', 'data-draft': noteKey,
					oninput: (e) => drafts.set(noteKey, e.target.value),
					onkeydown: (e) => { if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); sendHold() } }
				}, drafts.get(noteKey) || '')
			)
		) : null
		fill(box,
			h('div', { class: 'wb-head' },
				h('h2', {}, icon('merge', 'sm'), number ? `Ready to merge PR #${number}` : 'Ready to merge'),
				h('span', { class: 'mono subtle' }, dotted(d.head ? `commit ${shortSha(d.head)}` : null, when(d.askedAt)))
			),
			h('div', { class: 'need' },
				h('p', { class: 'question', style: 'margin-top:0' }, ask),
				more ? h('p', { class: 'q-more' }, more) : null,
				d.body ? h('div', { class: 'md', style: 'margin-top:8px' }, md(d.body)) : null
			),
			noteArea,
			h('div', { class: 'wb-bar' },
				h('div', { class: 'wb-bar-meta' },
					h('span', { class: `wb-status${blockingBefore ? ' warn' : ''}` }, blockingBefore
						? `Also answer the ${count(blockingBefore, 'blocking decision')} above so everything goes to the thread together`
						: `Recommended: ${d.recommendation}`),
					error
				),
				h('div', { class: 'row' },
					requesting
						? [h('button', { type: 'button', class: 'btn', onclick: () => { mergeChangeOpen.delete(d.id); rebuild() } }, 'Cancel'), h('button', { type: 'button', class: 'btn primary', onclick: sendHold }, 'Hold & send notes')]
						: [
							h('button', { type: 'button', class: 'btn', onclick: () => { mergeChangeOpen.add(d.id); rebuild(); const el = box.querySelector(`[data-draft="${CSS.escape(noteKey)}"]`); if (el) el.focus() } }, 'Do not merge / Request changes'),
							h('button', { type: 'button', class: 'btn primary', onclick: () => send('Merge') }, number ? `Merge PR #${number}` : 'Merge')
						]
				)
			)
		)
	}
	rebuild()
	return box
}

/** Relay-style Merge & Status Gate Box for the right column of an Issue page. */
function mergeGateBox(data, status, pending, activeRun) {
	const i = data.issue
	const pr = data.pr
	const gate = data.gate
	const openDecs = (data.decisions || []).filter(isOpenDec)
	const planRun = data.runs.findLast((r) => r.stage === 'plan' && r.result?.outcome === 'done')
	const reviews = data.runs.filter((r) => r.stage === 'review' && r.subject === 'pr' && r.result?.outcome === 'done').map((r) => r.result.result)
	const prFindings = (data.findings || []).filter((f) => f.subject === 'pr' && f.severity !== 'pre-existing')
	const openFindings = prFindings.filter(isOpenFinding)
	const openImportant = openFindings.filter((f) => f.severity === 'important')
	const ghNeeds = (data.items || []).filter((it) => it.needsAction).length

	const glyph = (state) => {
		const map = { ok: 'checkCircle', warn: 'alert', bad: 'xCircle', live: 'clock', muted: 'minusCircle' }
		return h('span', { class: `gate-glyph ${state}` }, icon(map[state] || 'minusCircle'))
	}

	const rows = []
	// 1. Decisions gate
	rows.push({
		state: openDecs.length ? (openDecs.some((d) => !d.provisional) ? 'warn' : 'live') : 'ok',
		label: 'Decisions',
		val: openDecs.length ? `${count(openDecs.length, 'open')} waiting on you` : (data.decisions.length ? `${data.decisions.length} settled` : 'None open'),
		req: true
	})
	// 2. Internal review gate
	if (reviews.length || prFindings.length) {
		const repro = reviews.findLast((r) => r.reproductionOnHead !== 'none')?.reproductionOnHead
		const st = openImportant.length || repro === 'fails' ? 'bad' : openFindings.length ? 'warn' : 'ok'
		const detail = [
			`${count(reviews.length, 'round')}`,
			prFindings.length ? `${openFindings.length} of ${prFindings.length} open` : 'clean',
			repro === 'passes' ? 'repro passes' : repro === 'fails' ? 'repro fails' : null
		].filter(Boolean).join(' · ')
		rows.push({ state: st, label: 'Internal review', val: detail, req: true })
	} else {
		rows.push({ state: i.stage === 'review' && activeRun ? 'live' : 'muted', label: 'Internal review', val: i.stage === 'review' && activeRun ? 'Reviewing now' : 'Not run yet', req: true })
	}
	// 3. GitHub checks
	if (pr) {
		const c = pr.checks
		const st = c.state === 'passing' ? 'ok' : c.state === 'failing' ? 'bad' : c.state === 'pending' ? 'live' : 'warn'
		const val = c.state === 'passing' ? 'All checks pass' : c.state === 'failing' ? `Failing: ${c.failing.join(', ')}` : c.state === 'absent' ? 'No CI checks' : `Checks ${c.state}`
		rows.push({ state: st, label: 'GitHub checks', val, req: true })
	}
	// 4. GitHub reviews & bots
	if (pr) {
		const st = pr.changesRequestedBy.length ? 'bad' : ghNeeds ? 'warn' : pr.approvedBy.length ? 'ok' : pr.requested.length ? 'live' : 'muted'
		const val = [
			...pr.approvedBy.map((a) => `approved by @${a.login}${a.commit && a.commit !== pr.head ? ' (older)' : ''}`),
			...pr.changesRequestedBy.map((l) => `changes requested by @${l}`),
			ghNeeds ? `${count(ghNeeds, 'comment')} to act on` : null,
			pr.requested.length ? `requested ${pr.requested.map((l) => `@${l}`).join(', ')}` : null,
			...pr.bots.map((b) => `${b.login} ${b.reviewedHead ? 'reviewed' : 'pending'}`)
		].filter(Boolean).join(' · ') || 'No GitHub reviews yet'
		rows.push({ state: st, label: 'GitHub review', val, req: true })
	}
	// 5. Merge policy
	rows.push({
		state: data.autoShip ? 'ok' : 'muted',
		label: 'Merge policy',
		val: dotted(data.merge, data.autoShip ? 'auto-ship enabled' : null, pr?.head ? `head ${shortSha(pr.head)}` : null),
		req: false
	})

	const reqRows = rows.filter((r) => r.req)
	const passedReq = reqRows.filter((r) => r.state === 'ok').length

	let headTitle = statusLabel(status)
	let headTone = status.tone === 'warn' ? 'warn' : status.tone === 'bad' ? 'bad' : status.tone === 'ok' ? 'ok' : ''
	let headDetail = statusNote(status) || (pr ? `PR #${pr.number} · ${pr.draft ? 'draft' : pr.state}` : `Stage: ${cap(i.stage)}`)
	if (i.state === 'open' && pr && gate?.ready && !openDecs.length) {
		headTitle = 'Merge gate ready'
		headTone = 'ok'
	}

	// Avoid duplicating a primary button when the Decision Workbench is right next to this box on Overview.
	const primaryAction = !openDecs.length && i.prUrl
		? out(i.prUrl, prNumber(i.prUrl) ? `Open PR #${prNumber(i.prUrl)} on GitHub` : 'Open PR on GitHub', 'out', 'btn', 'Open PR')
		: !openDecs.length && i.threadLink
			? out(i.threadLink, 'Open thread in T3 Code', 'thread', 'btn')
			: null

	return h('section', { class: 'card', 'aria-label': 'Status and gates' },
		h('div', { class: 'gate-box-top' },
			h('div', {},
				h('h2', { class: headTone }, headTitle),
				h('div', { class: 'gate-box-detail' }, headDetail),
				h('div', { class: 'gate-box-sum' }, `${passedReq} of ${reqRows.length} checks clear`)
			),
			primaryAction
		),
		h('ul', { class: 'gate-list' }, ...rows.map((r) =>
			h('li', { class: 'gate-row' },
				glyph(r.state),
				h('div', { class: 'gate-body' },
					h('span', { class: 'gate-label' }, r.label),
					h('span', { class: 'gate-val' }, r.val)
				)
			)
		)),
		pr && gate && !gate.ready && gate.blockers.length ? h('div', { class: 'gate-blockers' },
			h('h4', {}, `Merge gate blockers (${gate.blockers.length})`),
			h('ul', {}, ...gate.blockers.map((b) => h('li', {}, b.text)))
		) : null
	)
}

/** Relay-style horizontal Iteration Strip + expandable rounds list. */
function iterationsCard(data, compact = false) {
	const runs = data.runs || []
	if (!runs.length) return null
	const now = Date.now()
	const spans = runs.map((r) => ({ r, a: r.startedAt, b: r.endedAt ?? (r.state === 'running' ? now : r.startedAt) }))
	const keyEvents = (data.events || []).filter((e) => ['pr', 'answer', 'closed'].includes(e.kind))
	const t0 = Math.min(...spans.map((s) => s.a), ...keyEvents.map((e) => e.at))
	const t1 = Math.max(now, ...spans.map((s) => s.b), ...keyEvents.map((e) => e.at))
	const pos = (t) => ((t - t0) / Math.max(1, t1 - t0)) * 100
	const stagesSeen = [...new Set(runs.map((r) => r.stage))]

	const focusRun = (runId) => {
		const k = `iter:${runId}`
		opened.add(k)
		const el = document.getElementById(`iter-${runId}`)
		if (el) { el.open = true; el.scrollIntoView({ behavior: 'smooth', block: 'center' }); el.classList.remove('spotlight'); void el.offsetWidth; el.classList.add('spotlight') }
	}

	const ordered = runs.slice().reverse()
	const shown = compact ? ordered.slice(0, 6) : ordered

	return h('section', { class: 'card', 'aria-label': 'Iterations' },
		h('div', { class: 'card-head' },
			h('h2', {}, 'Iterations', h('span', { class: 'count-pill', style: 'height:19px;font-size:11px' }, count(runs.length, 'run'))),
			compact && runs.length > 6 ? h('a', { class: 'sec-link', style: 'font-size:12px', href: issueHref(data.issue, 'runs') }, `View all ${runs.length}`, icon('arrowR', 'sm')) : null
		),
		h('div', { class: 'iter-strip' },
			h('div', { class: 'iter-axis', role: 'img', 'aria-label': 'Stage runs over time' },
				h('span', { class: 'iter-line top' }),
				h('span', { class: 'iter-line bot' }),
				...spans.map(({ r, a, b }) => h('button', {
					type: 'button',
					class: 'iter-span',
					title: `${r.subject === 'plan' ? 'Plan review' : cap(r.stage)} (${r.model || 'orchestrator'}) · ${span(b - a)} · ${clock(a)}`,
					style: `left:${Math.min(pos(a), 97.5).toFixed(2)}%;width:${Math.max(1.2, pos(b) - pos(a)).toFixed(2)}%;background:${r.state === 'failed' ? 'var(--bad)' : STAGE_COLOR[r.stage] || 'var(--series-1)'}`,
					onclick: () => focusRun(r.id)
				})),
				...keyEvents.map((e) => h('span', {
					class: 'iter-pt',
					title: `${e.text} · ${clock(e.at)}`,
					style: `left:${Math.min(99, Math.max(1, pos(e.at))).toFixed(2)}%;background:${e.kind === 'answer' ? 'var(--warn-dot)' : e.kind === 'pr' ? 'var(--ok)' : 'var(--fg-muted)'}`
				}))
			),
			h('div', { class: 'iter-times' }, h('span', {}, clock(t0)), h('span', {}, 'now')),
			h('div', { class: 'legend', style: 'margin-top:7px' },
				...stagesSeen.map((s) => h('span', {}, h('i', { style: `background:${STAGE_COLOR[s]}` }), cap(s))),
				keyEvents.length ? h('span', {}, h('i', { style: 'background:var(--warn-dot);border-radius:50%' }), 'Decision / PR') : null
			)
		),
		...shown.map((r) => {
			const name = r.subject === 'plan' ? 'Plan review' : cap(r.stage)
			const stChip = r.state === 'running' ? chip('running', 'accent', true) : r.state === 'failed' ? chip('failed', 'bad') : chip('done', 'ok')
			const dur = r.endedAt ? span(r.endedAt - r.startedAt) : since(r.startedAt)
			const key = `iter:${r.id}`
			return foldLazy(
				key,
				[
					h('span', { style: `width:8px;height:8px;border-radius:50%;flex:none;background:${r.state === 'failed' ? 'var(--bad)' : STAGE_COLOR[r.stage]}` }),
					h('strong', { style: 'font-weight:600' }, name),
					stChip,
					r.model ? h('span', { class: 'mono subtle', style: 'overflow:hidden;text-overflow:ellipsis;white-space:nowrap' }, r.model) : null,
					r.head ? h('span', { class: 'mono subtle' }, shortSha(r.head)) : null,
					h('span', { class: 'iter-end' }, dotted(dur, when(r.startedAt)))
				],
				() => h('div', { class: 'iter-row-body' },
					r.summary ? h('p', { style: 'color:var(--fg)' }, r.summary) : null,
					r.provider || r.options ? h('div', { class: 'mono subtle' }, dotted(r.provider ? `${r.provider} / ${r.model || ''}` : null, plain(r.options))) : null,
					r.resultMissing ? h('p', { class: 'muted' }, cap(r.resultMissing)) : null,
					r.result ? foldLazy(`run-json:${r.id}`, `Structured result (${r.result.outcome})`, () => h('pre', { style: 'margin-top:6px' }, JSON.stringify(r.result, null, 2))) : null
				),
				{ class: 'iter-row', id: `iter-${r.id}` }
			)
		})
	)
}

/** Relay-style Findings card with severity bar filter + structured cards. */
function findingsCard(issueId, findings, compact = false) {
	if (!findings.length) return null
	const activeSev = findingSevFilter.get(issueId) || ''
	const sevs = [
		{ key: 'important', label: 'Important', color: 'var(--bad)' },
		{ key: 'nit', label: 'Nit', color: 'var(--warn-dot)' },
		{ key: 'pre-existing', label: 'Pre-existing', color: 'var(--fg-subtle)' }
	]
	const maxSev = Math.max(1, ...sevs.map((s) => findings.filter((f) => f.severity === s.key).length))
	const order = { important: 0, nit: 1, 'pre-existing': 2 }
	const filtered = findings
		.filter((f) => !activeSev || f.severity === activeSev)
		.slice()
		.sort((a, b) => Number(isOpenFinding(b)) - Number(isOpenFinding(a)) || order[a.severity] - order[b.severity])
	const openCnt = findings.filter(isOpenFinding).length

	return h('section', { class: 'card', 'aria-label': 'Internal review findings' },
		h('div', { class: 'card-head' },
			h('h2', {}, 'Findings', h('span', { class: 'count-pill', style: 'height:19px;font-size:11px' }, `${openCnt} open of ${findings.length}`)),
			activeSev ? h('button', { type: 'button', class: 'btn xs', onclick: () => { findingSevFilter.delete(issueId); draw() } }, `Showing ${activeSev} · Clear`) : null
		),
		findings.length > 1 ? h('div', { class: 'sev-chart' },
			...sevs.map((s) => {
				const mine = findings.filter((f) => f.severity === s.key)
				if (!mine.length) return null
				const openMine = mine.filter(isOpenFinding).length
				const settled = mine.length - openMine
				return h('button', {
					type: 'button',
					class: `sev-row${activeSev === s.key ? ' on' : ''}`,
					title: `Filter by ${s.label}: ${openMine} open, ${settled} settled`,
					onclick: () => { findingSevFilter.set(issueId, activeSev === s.key ? '' : s.key); draw() }
				},
					h('span', {}, s.label),
					h('div', { class: 'sev-bar' },
						openMine ? h('div', { style: `width:${(openMine / maxSev) * 100}%;background:${s.color}` }) : null,
						settled ? h('div', { style: `width:${(settled / maxSev) * 100}%;background:var(--ok);opacity:0.45` }) : null
					),
					h('span', { class: 'hbar-val' }, mine.length)
				)
			}).filter(Boolean)
		) : null,
		...(compact ? filtered.slice(0, 6) : filtered).map((f) => h('div', { class: 'finding-item' },
			h('div', { class: 'row', style: 'gap:6px' },
				chip(f.severity, f.severity === 'important' ? 'bad' : f.severity === 'nit' ? 'warn' : ''),
				chip(f.outcome || 'open', f.outcome === 'fixed' ? 'ok' : f.outcome === 'upheld' ? 'bad' : ''),
				h('span', { class: 'mono subtle' }, dotted(f.subject, f.id))
			),
			f.title ? h('strong', { style: 'font-size:13.5px;font-weight:600' }, f.title) : null,
			f.title && !isOpenFinding(f)
				? [
					f.outcomeNote ? h('div', { class: 'muted', style: 'font-size:12.5px' }, f.outcomeNote) : null,
					fold(`finding:${f.id}`, 'Details', h('div', { class: 'finding-code', style: 'margin-top:6px' }, f.file ? h('div', { class: 'finding-path' }, `${f.file}${f.line ? `:${f.line}` : ''}`) : null, f.text))
				]
				: [
					h('div', { class: 'finding-code' }, f.file ? h('div', { class: 'finding-path' }, `${f.file}${f.line ? `:${f.line}` : ''}`) : null, f.text),
					f.outcomeNote ? h('div', { class: 'muted', style: 'font-size:12.5px' }, `Outcome: ${f.outcomeNote}`) : null
				]
		))
	)
}

function steerCard(issue) {
	const key = `steer:${issue.id}`
	const error = h('div', { class: 'error' })
	const status = h('span', { class: 'subtle', style: 'font-size:12px' })
	const input = h('textarea', {
		rows: 1, placeholder: 'Send a note or steering instruction to this issue\'s thread...', 'aria-label': 'Message thread', 'data-draft': key,
		oninput: () => drafts.set(key, input.value),
		onkeydown: (e) => { if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); send() } }
	}, drafts.get(key) || '')
	const btn = h('button', { type: 'button', class: 'btn', onclick: () => send() }, 'Send', h('span', { class: 'kbd' }, '⌘↵'))
	const send = async () => {
		const message = input.value.trim()
		if (!message) return
		btn.disabled = true; error.textContent = ''; status.textContent = ''
		try {
			await api('POST', `/api/issues/${encodeURIComponent(issue.id)}/message`, { message })
			markIssueDirty(issue.id)
			drafts.delete(key); input.value = ''
			toast('Sent note to thread')
			status.textContent = 'Sent to thread'
		} catch (e) { error.textContent = e.message }
		btn.disabled = false
	}
	return h('section', { class: 'card steer', 'aria-label': 'Message thread' },
		h('div', { class: 'steer-row' }, input, btn),
		error, status
	)
}

function stationRail(issue, status, onPickStage) {
	return h('section', { class: 'card rail', 'aria-label': 'Pipeline stages' }, ...(status?.stages || []).map((st) => {
		const isNow = st.state === 'running' || st.state === 'current' || (st.state === 'findings' && st.stage === issue.stage && issue.state === 'open')
		const trackCls = isNow
			? `now${st.state === 'running' ? ' running' : ''}${status.tone === 'warn' ? ' warn' : status.tone === 'bad' ? ' bad' : ''}`
			: st.state === 'failed' ? 'bad'
			: st.state === 'done' || st.state === 'findings' ? 'done'
			: st.state === 'skipped' ? 'skip' : ''
		const sub = !st.runs ? (st.state === 'skipped' ? 'skip' : '')
			: st.state === 'running' && st.startedAt ? since(st.startedAt)
			: st.failed ? 'failed'
			: st.startedAt && st.endedAt ? span(st.endedAt - st.startedAt) : ''
		return h('button', {
			type: 'button',
			class: `stn${isNow ? ' on' : ''}`,
			title: st.runs ? `${cap(st.stage)}: ${count(st.runs, 'run')}` : cap(st.stage),
			onclick: () => onPickStage && onPickStage(st.stage)
		},
			h('div', { class: `stn-track ${trackCls}` }, h('i')),
			h('div', { class: 'stn-row' },
				h('span', { class: 'stn-name' }, cap(st.stage)),
				sub ? h('span', { class: `stn-sub${st.failed ? ' bad' : ''}` }, dotted(sub, st.runs > 1 ? `×${st.runs}` : null)) : null
			)
		)
	}))
}

/** Captures Lightbox Viewer (lives outside <main>). */
const viewer = { el: null, items: [], at: 0, sideBySide: false }
function pairFor(item) {
	if (!item || item.kind !== 'image' || (item.label !== 'before' && item.label !== 'after')) return null
	const before = viewer.items.find((s) => s.title === item.title && s.kind === 'image' && s.label === 'before')
	const after = viewer.items.find((s) => s.title === item.title && s.kind === 'image' && s.label === 'after')
	return before && after ? [before, after] : null
}
function showViewer() {
	const item = viewer.items[viewer.at]
	const many = viewer.items.length > 1
	const pair = pairFor(item)
	const showSide = !!(pair && viewer.sideBySide)
	const step = (by) => () => { viewer.at = (viewer.at + by + viewer.items.length) % viewer.items.length; showViewer() }
	const flipPair = () => {
		if (!pair) return
		viewer.at = viewer.items.indexOf(item === pair[0] ? pair[1] : pair[0])
		showViewer()
	}
	const stage = showSide
		? h('div', { class: 'view-stage side' }, ...pair.map((p) => h('div', { class: 'view-pane' },
			h('div', { class: 'view-pane-head' }, chip(cap(p.label)), p.head ? h('span', { class: 'mono subtle' }, `at ${shortSha(p.head)}`) : null),
			h('img', { src: p.url, alt: `${cap(p.label)}: ${p.title}` })
		)))
		: h('div', { class: 'view-stage' },
			item.kind === 'video'

function openViewer(items, at) {
	if (!viewer.el) {
		viewer.el = h('dialog', { class: 'view', 'aria-label': 'Capture', onkeydown: (e) => {
			if (e.target.tagName === 'VIDEO') return
			if (e.key === ' ' && pairFor(viewer.items[viewer.at])) {
				e.preventDefault()
				if (viewer.sideBySide) { viewer.sideBySide = false; showViewer(); return }
				const pair = pairFor(viewer.items[viewer.at])
				viewer.at = viewer.items.indexOf(viewer.items[viewer.at] === pair[0] ? pair[1] : pair[0])
				showViewer(); return
			}
			if (viewer.items.length < 2 || (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight')) return
			viewer.at = (viewer.at + (e.key === 'ArrowLeft' ? -1 : 1) + viewer.items.length) % viewer.items.length
			showViewer()
		}, onclose: () => viewer.el.replaceChildren() })
		document.body.append(viewer.el)
	}
	viewer.items = items; viewer.at = at
	viewer.sideBySide = !!(pairFor(items[at]) && window.innerWidth >= 900)
	showViewer(); viewer.el.showModal()
}

const probes = new Map()
async function probe(id) {
	const last = probes.get(id)
	if (last && Date.now() - last.at < 30000) return
	probes.set(id, { at: Date.now(), ok: last ? last.ok : new Map() })
	try {
		const { urls } = await api('GET', `/api/issues/${encodeURIComponent(id)}/preview`)
		const changed = !last || urls.some((u) => last.ok.get(u.url) !== u.ok)
		probes.set(id, { at: Date.now(), ok: new Map(urls.map((u) => [u.url, u.ok])) })
		if (changed && route().id === id) draw()
	} catch {}
}

function previewCard(i, preview, tryIt, prHead) {
	const error = h('p', { class: 'error' })
	const ask = (action) => async (e) => {
		e.target.disabled = true; error.textContent = ''
		try { await api('POST', `/api/issues/${encodeURIComponent(i.id)}/preview`, { action }); toast(action === 'start' ? 'Asked thread to start dev env' : 'Asked thread to stop dev env') }
		catch (err) { error.textContent = err.message; e.target.disabled = false }
	}
	const live = i.state === 'open' && !i.threadGone
	const start = (label) => live ? h('button', { type: 'button', class: 'btn primary sm', onclick: ask('start') }, icon('play', 'sm'), label) : null
	const state = preview ? preview.state : 'down'
	const seen = probes.get(i.id)?.ok
	const links = (preview?.urls || []).filter((u) => isUrl(u.url))

	let body
	if (state === 'up') {
		const dead = !!seen && links.length > 0 && links.every((u) => seen.get(u.url) === false)
		const moved = prHead && preview.head && !sameCommit(preview.head, prHead)
		const idled = !!preview.stopsAt && Date.now() > preview.stopsAt
		body = [
			h('div', { class: 'row' },
				...links.map((u, n) => h('a', {
					class: `btn sm${n === 0 && !dead ? ' primary' : ''}`, href: u.url, target: '_blank', rel: 'noreferrer',
					title: seen?.get(u.url) === false ? 'Nothing answers here' : u.url
				}, h('span', { class: `env-dot${seen?.get(u.url) === true ? ' ok' : seen?.get(u.url) === false ? ' dead' : ''}` }), `Open ${u.name}`)),
				dead ? start('Start again') : live ? h('button', { type: 'button', class: 'btn quiet danger sm', onclick: ask('stop') }, 'Stop') : null
			),
			h('p', { class: 'muted', style: 'font-size:12.5px' }, dead
				? (idled ? 'Stopped after standing idle.' : 'Nothing answers at these addresses.')
				: dotted('Running', preview.head ? `on ${shortSha(preview.head)}` : null, moved ? `PR moved to ${shortSha(prHead)}` : null, when(preview.at), preview.stopsAt && !idled ? `stops ~${hour(preview.stopsAt)}` : null)),
			preview.error ? fold(`preview:${i.id}`, 'Start output', h('pre', { style: 'margin-top:6px' }, preview.error)) : null
		]
	} else if (state === 'requested') {
		body = [h('div', { class: 'row' }, h('button', { type: 'button', class: 'btn primary sm', disabled: true }, 'Starting...')), h('p', { class: 'muted', style: 'font-size:12.5px' }, 'Requested ', when(preview.at), '. Links appear once ready.')]
	} else if (state === 'stopping') {
		body = [h('div', { class: 'row' }, h('button', { type: 'button', class: 'btn sm', disabled: true }, 'Stopping...')), h('p', { class: 'muted', style: 'font-size:12.5px' }, 'Requested ', when(preview.at), '.')]
	} else if (state === 'failed') {
		body = [h('div', { class: 'row' }, start('Try again')), h('p', { class: 'notice bad', style: 'margin-top:6px' }, 'Dev environment failed to start.'), preview.error ? h('pre', { style: 'margin-top:6px' }, preview.error) : null]
	} else {
		body = [h('div', { class: 'row' }, start('Start dev environment')), h('p', { class: 'muted', style: 'font-size:12.5px' }, i.threadGone ? 'Thread unavailable.' : 'Starts the app on this PR branch so you can test it live.')]
	}

	return h('section', { class: 'card' },
		h('div', { class: 'card-head' },
			h('h2', {}, 'Try it', state === 'up' ? chip('running', 'ok', true) : null)
		),
		h('div', { style: 'padding:14px 16px;display:grid;gap:10px' },
			...body, error,
			tryIt ? fold(`try:${i.id}`, 'Steps to try it', h('p', { class: 'tryit', style: 'margin-top:6px' }, tryIt)) : null
		)
	)
}

function markIssueDirty(id) {
	const entry = issueCache.get(id)
	if (entry) entry.dirty = true
}

function storeIssueCache(id, data) {
	data._seq = ++issueDataSeq
	issueCache.delete(id)
	issueCache.set(id, { data, dirty: false, at: Date.now() })
	while (issueCache.size > ISSUE_CACHE_MAX) {
		const oldest = issueCache.keys().next().value
		issueCache.delete(oldest)
	}
}

function fetchIssueData(id, { force = false } = {}) {
	if (!force && issueInflight.has(id)) return issueInflight.get(id)
	let rawReq
	if (!force && window.__boot?.issue && window.__boot.issue.id === id) {
		const p = window.__boot.issue.p
		window.__boot.issue = null
		rawReq = p.then(readJsonResponse)
	} else {
		rawReq = api('GET', `/api/issues/${encodeURIComponent(id)}`)
	}
	const req = rawReq.then((data) => {
		storeIssueCache(id, data)
		return data
	})
	issueInflight.set(id, req)
	req.then(
		() => { if (issueInflight.get(id) === req) issueInflight.delete(id) },
		() => { if (issueInflight.get(id) === req) issueInflight.delete(id) }
	)
	return req
}

function prefetchIssue(id) {
	if (!id) return
	const cached = issueCache.get(id)
	if ((cached && !cached.dirty) || issueInflight.has(id)) return
	fetchIssueData(id).catch(() => {})
}

function prefetchIssuesBatch(ids) {
	const todo = []
	for (const id of ids) {
		if (!id || todo.includes(id)) continue
		const cached = issueCache.get(id)
		if ((cached && !cached.dirty) || issueInflight.has(id)) continue
		todo.push(id)
		if (todo.length >= 16) break
	}
	if (!todo.length) return
	if (todo.length === 1) return prefetchIssue(todo[0])
	const batchReq = api('GET', `/api/issues/batch?ids=${todo.map(encodeURIComponent).join(',')}`)
		.then((res) => {
			const map = res.issues || {}
			for (const id of todo) {
				if (map[id]) storeIssueCache(id, map[id])
			}
			return map
		})
	for (const id of todo) {
		const perId = batchReq.then((map) => {
			if (map[id]) return map[id]
			throw new Error('issue not found')
		})
		issueInflight.set(id, perId)
		perId.then(
			() => { if (issueInflight.get(id) === perId) issueInflight.delete(id) },
			() => { if (issueInflight.get(id) === perId) issueInflight.delete(id) }
		)
	}
}
