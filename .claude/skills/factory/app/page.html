<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Factory</title>
<style>
	:root {
		--bg: #fafafa; --panel: #ffffff; --raised: #f4f4f5;
		--ink: #171717; --ink2: #525252; --muted: #737373;
		--line: rgba(23, 23, 23, .08); --line2: rgba(23, 23, 23, .16); --passed: #a3a3a3;
		--warn: #b45309; --warn-dot: #d97706; --warn-bg: #fffaf0; --warn-line: rgba(180, 83, 9, .3);
		--ok: #15803d; --ok-dot: #16a34a; --bad: #c62424; --bad-dot: #dc2626; --bad-bg: #fef4f4;
		--shadow: 0 1px 2px rgba(0, 0, 0, .05);
		--ease: cubic-bezier(.22, 1, .36, 1);
		--sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
		--mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
		color-scheme: light;
	}
	@media (prefers-color-scheme: dark) {
		:root {
			--bg: #141415; --panel: #19191b; --raised: #232325;
			--ink: #ededed; --ink2: #a1a1a6; --muted: #85858b;
			--line: rgba(237, 237, 237, .08); --line2: rgba(237, 237, 237, .16); --passed: #5f5f66;
			--warn: #f0a35c; --warn-dot: #f0a35c; --warn-bg: #211c16; --warn-line: rgba(240, 163, 92, .3);
			--ok: #4cc38a; --ok-dot: #4cc38a; --bad: #f2777a; --bad-dot: #e5484d; --bad-bg: #241819;
			--shadow: none;
			color-scheme: dark;
		}
	}
	* { box-sizing: border-box; }
	body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/20px var(--sans); -webkit-font-smoothing: antialiased; }
	h1, h2, h3, p { margin: 0; }
	a { color: inherit; }
	:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; border-radius: 4px; }
	.wrap { max-width: 1280px; margin: 0 auto; padding: 0 24px; }
	.mono { font-family: var(--mono); font-size: 12px; }
	.muted { color: var(--muted); }
	.ic { display: inline-flex; width: 16px; height: 16px; flex: none; }
	.ic svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }

	/* Top bar */
	.top { position: sticky; top: 0; z-index: 2; background: var(--panel); border-bottom: 1px solid var(--line); }
	.bar { display: flex; align-items: center; gap: 24px; min-height: 56px; }
	.brand { display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 600; text-decoration: none; }
	.brand svg { width: 20px; height: 20px; }
	nav { display: flex; gap: 4px; }
	nav a { display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 12px; border-radius: 8px; color: var(--ink2); text-decoration: none; transition: background-color .15s var(--ease), color .15s var(--ease); }
	nav a:hover { color: var(--ink); background: var(--raised); }
	nav a.on { color: var(--ink); background: var(--raised); font-weight: 500; }
	.count { font: 12px/16px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
	nav .count.warn { padding: 0 6px; border-radius: 6px; background: var(--warn-bg); color: var(--warn); box-shadow: inset 0 0 0 1px var(--warn-line); }
	.right { margin-left: auto; display: flex; align-items: center; gap: 16px; }
	.live { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); white-space: nowrap; }
	.live i { width: 8px; height: 8px; border-radius: 50%; background: var(--bad-dot); }
	.live.up i { background: var(--ok-dot); }

	/* Controls */
	.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 32px; padding: 0 12px; border: 1px solid var(--line2); border-radius: 8px; background: var(--panel); color: var(--ink); font: 500 13px/20px var(--sans); text-decoration: none; white-space: nowrap; cursor: pointer; transition: background-color .15s var(--ease), border-color .15s var(--ease), color .15s var(--ease), transform .15s var(--ease); }
	.btn:hover { background: var(--raised); }
	.btn:active { transform: scale(.98); }
	.btn:disabled { opacity: .5; cursor: default; transform: none; }
	.btn.primary { background: var(--ink); border-color: var(--ink); color: var(--bg); }
	.btn.primary:hover { background: color-mix(in srgb, var(--ink) 86%, var(--bg)); }
	.btn.sm { height: 28px; padding: 0 8px; color: var(--ink2); }
	.btn.sm:hover { color: var(--ink); }
	.btn.primary.sm { color: var(--bg); }
	.btn.primary.sm:hover { color: var(--bg); }
	.btn.quiet { border-color: transparent; background: transparent; color: var(--ink2); }
	.btn.quiet:hover { background: var(--raised); color: var(--bad); }
	.btn.long { height: auto; min-height: 32px; padding: 6px 12px; justify-content: flex-start; text-align: left; white-space: normal; }
	input, select, textarea { width: 100%; border: 1px solid var(--line2); border-radius: 8px; background: var(--panel); color: var(--ink); font: 14px/20px var(--sans); transition: border-color .15s var(--ease), box-shadow .15s var(--ease); }
	input, select { height: 36px; padding: 0 12px; }
	textarea { display: block; min-height: 76px; padding: 8px 12px; resize: vertical; }
	input:focus, select:focus, textarea:focus { outline: none; border-color: var(--ink2); box-shadow: 0 0 0 3px var(--line); }
	::placeholder { color: var(--muted); opacity: .8; }
	@media (prefers-color-scheme: dark) { input, select, textarea { background: var(--raised); } }
	.field { display: block; min-width: 0; }
	.flabel { display: block; margin-bottom: 6px; font-size: 13px; color: var(--ink2); }
	.fhint { display: block; margin-top: 4px; font-size: 12px; line-height: 16px; color: var(--muted); }
	.fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; }
	.stack { display: grid; gap: 16px; }
	.row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
	.error { color: var(--bad); font-size: 13px; }
	.error:empty { display: none; }

	/* Surfaces */
	main.wrap { container-type: inline-size; padding-top: 32px; padding-bottom: 80px; }
	.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); }
	.sec { display: flex; align-items: baseline; gap: 8px; margin: 32px 0 12px; }
	.sec h2 { font-size: 14px; font-weight: 500; }
	h1 { font-size: 24px; line-height: 32px; font-weight: 500; overflow-wrap: anywhere; }
	.lede { max-width: 72ch; margin-top: 8px; color: var(--ink2); }
	.chip { display: inline-flex; align-items: center; gap: 6px; min-height: 22px; padding: 1px 8px; border-radius: 6px; background: var(--raised); color: var(--ink2); font-size: 12px; line-height: 16px; }
	.chip.ok::before, .chip.warn::before, .chip.bad::before { content: ""; flex: none; width: 6px; height: 6px; border-radius: 50%; background: var(--ok-dot); }
	.chip.warn::before { background: var(--warn-dot); }
	.chip.bad::before { background: var(--bad-dot); }
	.chip.warn { color: var(--warn); }
	.chip.bad { color: var(--bad); }
	pre { margin: 0; padding: 12px; border-radius: 8px; background: var(--raised); font: 12px/18px var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; max-height: 420px; overflow: auto; }
	details summary { cursor: pointer; font-size: 13px; color: var(--ink2); }
	details[open] > summary { margin-bottom: 8px; }
	.notice { margin-top: 12px; padding: 12px 16px; border-radius: 10px; background: var(--warn-bg); color: var(--warn); font-size: 13px; box-shadow: inset 0 0 0 1px var(--warn-line); }
	.notice.bad { background: var(--bad-bg); color: var(--bad); box-shadow: none; }
	.empty { padding: 48px 20px; text-align: center; color: var(--ink2); }
	.empty p + p { margin-top: 4px; color: var(--muted); }
	.empty .btn { margin-top: 16px; }

	/* Overview figures */
	.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1px; overflow: hidden; background: linear-gradient(var(--line), var(--line)), var(--panel); }
	.stat { position: relative; display: block; width: 100%; border: 0; padding: 16px 20px; background: var(--panel); color: inherit; font: inherit; text-align: left; text-decoration: none; }
	a.stat, button.stat { cursor: pointer; transition: background-color .15s var(--ease); }
	a.stat:hover, button.stat:hover { background: var(--raised); }
	.stat.active { background: var(--raised); box-shadow: inset 0 -2px 0 var(--ink); }
	.stat.warn.active { box-shadow: inset 0 -2px 0 var(--warn); }
	.stat-l { font-size: 13px; color: var(--ink2); }
	.stat-n { margin-top: 8px; font-size: 28px; line-height: 32px; font-weight: 500; font-variant-numeric: tabular-nums; }
	.stat.warn .stat-l, .stat.warn .stat-n { color: var(--warn); }
	@container (max-width: 640px) { .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

	/* Board filters */
	.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-top: 16px; }
	.pills { display: flex; flex-wrap: wrap; gap: 4px; }
	.pill { height: 28px; padding: 0 10px; border: 1px solid var(--line2); border-radius: 8px; background: var(--panel); color: var(--ink2); font: 13px/20px var(--sans); cursor: pointer; transition: background-color .15s var(--ease), color .15s var(--ease), border-color .15s var(--ease); }
	.pill:hover { background: var(--raised); color: var(--ink); }
	.pill.on { border-color: var(--ink); background: var(--ink); color: var(--bg); font-weight: 500; }
	.search { margin-left: auto; width: 220px; height: 28px; padding: 0 10px; font-size: 13px; }
	@container (max-width: 640px) { .search { margin-left: 0; width: 100%; } }
	.kbd { display: inline-flex; align-items: center; padding: 1px 5px; border-radius: 4px; background: color-mix(in srgb, currentColor 12%, transparent); font: 11px/14px var(--mono); opacity: .75; }

	/* The line: five stations, the one an issue is at lit in its status colour */
	.t-idle { --tone: var(--ink); }
	.t-live { --tone: var(--ok-dot); }
	.t-warn { --tone: var(--warn-dot); }
	.t-bad { --tone: var(--bad-dot); }
	.track { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); }
	.st { position: relative; display: grid; place-items: center; height: 20px; }
	.st::before { content: ""; position: absolute; left: -50%; right: 50%; top: 9px; height: 2px; background: var(--line2); }
	.track .st:first-child::before, .stn:first-child .st::before { display: none; }
	.st.done::before, .st.skip::before, .st.now::before { background: var(--passed); }
	.st i { position: relative; width: 8px; height: 8px; border-radius: 50%; background: var(--panel); box-shadow: inset 0 0 0 1.5px var(--passed); }
	.st.done i { background: var(--passed); }
	.st.now i { width: 12px; height: 12px; background: var(--tone); box-shadow: 0 0 0 4px color-mix(in srgb, var(--tone) 20%, var(--panel)); }
	.st.now.running i::after { content: ""; position: absolute; inset: -4px; border-radius: 50%; border: 1.5px solid var(--tone); animation: ping 2s var(--ease) infinite; }
	@keyframes ping { from { transform: scale(.7); opacity: .8; } to { transform: scale(1.9); opacity: 0; } }
	@media (prefers-reduced-motion: reduce) { .st.now.running i::after { animation: none; opacity: 0; } }

	/* Board list */
	.lhead, .lrow { display: grid; grid-template-columns: minmax(0, 1fr) 88px 216px 200px 132px; column-gap: 24px; align-items: center; padding: 0 20px; }
	.lhead { min-height: 44px; font-size: 12px; line-height: 16px; color: var(--muted); }
	.lhead h2 { display: flex; align-items: baseline; gap: 8px; font-size: 14px; line-height: 20px; font-weight: 500; color: var(--ink); }
	.lrow { padding-top: 16px; padding-bottom: 16px; border-top: 1px solid var(--line); }
	.title { font-size: 15px; line-height: 22px; font-weight: 500; text-decoration: none; overflow-wrap: anywhere; }
	.title:hover { text-decoration: underline; text-underline-offset: 3px; }
	.meta { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
	.last { margin-top: 4px; font-size: 13px; color: var(--ink2); display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 1; overflow: hidden; overflow-wrap: anywhere; }
	a.last { text-decoration: none; }
	a.last:hover { color: var(--ink); }
	.last b { margin-right: 8px; font-weight: 500; color: var(--warn); }
	/* How large a change is: the lines its PR adds and deletes */
	.size { display: inline-flex; gap: 8px; font: 500 13px/16px var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
	.size .add { color: var(--ok); }
	.size .del { color: var(--bad); }
	.cell-size, .lhead .lines { text-align: right; }
	.size-m { display: none; }
	time, .num { font-family: var(--mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
	.last time { margin-right: 8px; }
	.cell-track { display: flex; align-items: center; gap: 12px; }
	.cell-track .track { flex: 1; }
	.stage-name { flex: none; width: 72px; font-size: 13px; color: var(--ink2); }
	.slabel { font-size: 13px; font-weight: 500; }
	.t-warn > .slabel { color: var(--warn); }
	.t-bad > .slabel { color: var(--bad); }
	.snote { font-size: 12px; line-height: 16px; margin-top: 2px; color: var(--muted); overflow-wrap: anywhere; }
	.snote.bad { color: var(--bad); }
	.cell-act { display: flex; justify-content: flex-end; gap: 8px; }
	@container (max-width: 980px) {
		.lhead { grid-template-columns: minmax(0, 1fr); }
		.lhead > :not(h2) { display: none; }
		.lrow { grid-template-columns: 96px minmax(0, 1fr); column-gap: 12px; row-gap: 12px; }
		.cell-main, .cell-act, .cell-status { grid-column: 1 / -1; }
		.cell-size { display: none; }
		.size-m { display: inline; }
		.last { -webkit-line-clamp: 2; }
		.cell-track { display: contents; }
		.stage-name { width: auto; }
		.cell-act { justify-content: flex-start; }
	}

	/* Needs you & Decision workbench */
	.needs { border-color: var(--warn-line); }
	.needs .lhead h2 { color: var(--warn); }
	.lhead-end { margin-left: auto; display: flex; align-items: center; gap: 8px; }
	.wb-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; padding: 14px 20px; border-bottom: 1px solid var(--line); background: var(--warn-bg); border-radius: 11px 11px 0 0; }
	.wb-head h2 { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; color: var(--warn); }
	.wb-plan { padding: 16px 20px; border-bottom: 1px solid var(--line); }
	.wb-plan-top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px; }
	.wb-plan-top h3 { font-size: 14px; font-weight: 500; }
	.wb-plan .outline { margin-top: 10px; }
	.wb-plan .wb-facts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
	.need { padding: 20px; border-top: 1px solid var(--line); }
	.need:first-child { border-top: 0; }
	.need.blocking { box-shadow: inset 3px 0 0 var(--warn-dot); }
	.need-top { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; font-size: 12px; color: var(--muted); }
	.need-top time { margin-left: auto; }
	.q-num { display: inline-flex; align-items: center; justify-content: center; width: 20px; height: 20px; border-radius: 6px; background: var(--raised); color: var(--ink2); font: 500 12px/1 var(--mono); }
	.kind { font-weight: 500; color: var(--warn); }
	.kind.bad { color: var(--bad); }
	.kind.quiet { color: var(--muted); font-weight: 400; }
	.question { max-width: 80ch; margin-top: 8px; font-size: 15px; line-height: 22px; font-weight: 500; overflow-wrap: anywhere; }
	.q-more { max-width: 80ch; margin-top: 4px; font-size: 13px; line-height: 20px; color: var(--ink2); overflow-wrap: anywhere; }
	.need > .meta, .need > .md, .need > details, .need > .answer, .need > .row, .outline { margin-top: 12px; }
	.outline { max-width: 80ch; padding-left: 20px; }
	.outline li + li { margin-top: 6px; }
	.need > .meta { max-width: 80ch; color: var(--ink2); }
	/* Radio-style selectable option cards */
	.opt-list { display: grid; gap: 8px; margin-top: 12px; max-width: 78ch; }
	.opt-card { display: flex; align-items: flex-start; gap: 10px; width: 100%; padding: 10px 12px; border: 1px solid var(--line2); border-radius: 10px; background: var(--panel); color: var(--ink); font: 13px/20px var(--sans); text-align: left; cursor: pointer; transition: border-color .15s var(--ease), background-color .15s var(--ease), box-shadow .15s var(--ease); }
	.opt-card:hover { background: var(--raised); }
	.opt-card.picked { border-color: var(--ink); background: var(--raised); box-shadow: inset 0 0 0 1px var(--ink); }
	.opt-card .radio { flex: none; width: 16px; height: 16px; margin-top: 2px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px var(--line2); transition: box-shadow .15s var(--ease); }
	.opt-card.picked .radio { box-shadow: inset 0 0 0 5px var(--ink); }
	.opt-card .opt-body { min-width: 0; flex: 1; overflow-wrap: anywhere; }
	.opt-card .opt-rec { display: inline-flex; margin-left: 8px; padding: 0 6px; border-radius: 4px; background: var(--panel); box-shadow: inset 0 0 0 1px var(--line2); color: var(--ink2); font-size: 11px; line-height: 18px; vertical-align: 1px; }
	.opt-card.custom-toggle { color: var(--ink2); border-style: dashed; }
	.opt-custom-box { margin-top: 8px; }
	.opt-custom-box textarea { min-height: 56px; font-size: 13px; }
	.answered-row { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 12px; padding: 12px 20px; border-top: 1px solid var(--line); font-size: 13px; color: var(--ink2); }
	.answered-row .ok-mark { color: var(--ok); font-weight: 600; }
	.answered-row .ans-val { color: var(--ink); font-weight: 500; }
	.wb-bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 16px; padding: 14px 20px; border-top: 1px solid var(--line); background: var(--raised); border-radius: 0 0 11px 11px; }
	.wb-bar-meta { display: grid; gap: 4px; min-width: 0; }
	.wb-status { font-size: 13px; color: var(--ink2); }
	.wb-status.warn { color: var(--warn); font-weight: 500; }
	.wb-auto { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink2); cursor: pointer; user-select: none; }
	.wb-auto input { width: 15px; height: 15px; margin: 0; accent-color: var(--ink); cursor: pointer; }
	.wb-feedback { padding: 12px 20px; border-top: 1px solid var(--line); background: var(--panel); }
	.wb-feedback textarea { min-height: 64px; font-size: 13px; }
	.own { display: flex; gap: 8px; align-items: flex-end; max-width: 720px; margin-top: 12px; }
	.own textarea { min-height: 36px; height: 36px; }
	.need .error, .wb-bar .error { margin-top: 4px; }

	/* Issue page */
	.itop { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; }
	.back { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; color: var(--muted); text-decoration: none; }
	.back:hover { color: var(--ink); }
	.triage-nav { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink2); }
	.triage-nav .count { padding: 2px 8px; border-radius: 6px; background: var(--warn-bg); color: var(--warn); box-shadow: inset 0 0 0 1px var(--warn-line); }
	.banner { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px; margin-top: 12px; padding: 10px 14px; border-radius: 10px; background: var(--panel); border: 1px solid var(--line2); font-size: 13px; }
	.banner strong { font-weight: 500; color: var(--ok); }
	.ititle { display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 12px 24px; margin-top: 12px; }
	.ititle h1 { flex: 1 1 320px; font-size: 22px; line-height: 30px; }
	.imeta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-top: 8px; font-size: 13px; color: var(--muted); }
	.imeta .slabel { color: var(--ink); }
	.imeta.t-warn .slabel { color: var(--warn); }
	.imeta.t-bad .slabel { color: var(--bad); }
	/* Compact interactive stage rail */
	.rail { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); margin-top: 16px; padding: 10px 8px; }
	.stn { min-width: 0; display: flex; flex-direction: column; align-items: center; padding: 4px; border: 0; border-radius: 8px; background: transparent; color: inherit; font: inherit; text-align: center; cursor: pointer; transition: background-color .15s var(--ease); }
	.stn:hover { background: var(--raised); }
	.stn .st { width: 100%; height: 18px; }
	.stn .st::before { top: 8px; }
	.stn-row { display: inline-flex; flex-wrap: wrap; align-items: baseline; justify-content: center; gap: 4px 6px; margin-top: 4px; }
	.stn-name { font-size: 12px; font-weight: 500; color: var(--muted); }
	.stn.on .stn-name { color: var(--ink); }
	.stn-sub { font: 11px/16px var(--mono); color: var(--muted); }
	.stn-sub.bad { color: var(--bad); }
	.ipage { max-width: 960px; margin: 0 auto; }
	/* Live activity while working */
	.live-feed { margin-top: 16px; padding: 14px 20px; }
	.live-feed-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; font-size: 13px; }
	.live-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok-dot); flex: none; }
	.live-feed-list { margin: 10px 0 0; padding: 0; list-style: none; display: grid; gap: 6px; }
	.live-feed-list li { display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 8px; font-size: 13px; color: var(--ink2); overflow-wrap: anywhere; }
	.live-feed-list li:first-child { color: var(--ink); }
	/* Inline heads-up before merge */
	.headsup { margin-top: 16px; padding: 14px 20px; border-color: var(--warn-line); }
	.headsup h3 { font-size: 13px; font-weight: 600; color: var(--warn); }
	.headsup-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px 20px; margin-top: 10px; }
	.headsup-col h4 { font-size: 12px; font-weight: 500; color: var(--ink2); margin-bottom: 4px; }
	.headsup-col ul { margin: 0; padding-left: 16px; font-size: 13px; color: var(--ink); }
	.headsup-col li + li { margin-top: 2px; }
	/* Quick steer / note box */
	.steer { margin-top: 16px; padding: 12px 16px; }
	.steer-row { display: flex; gap: 8px; align-items: flex-end; }
	.steer-row textarea { min-height: 36px; height: 36px; font-size: 13px; }
	.asked-sub { margin-top: 3px; font-size: 13px; color: var(--ink2); display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 1; overflow: hidden; overflow-wrap: anywhere; }
	/* Segmented control for New issue */
	.seg { display: inline-flex; padding: 3px; border-radius: 10px; background: var(--raised); border: 1px solid var(--line); gap: 2px; }
	.seg button { height: 28px; padding: 0 12px; border: 0; border-radius: 7px; background: transparent; color: var(--ink2); font: 500 13px/20px var(--sans); cursor: pointer; transition: background-color .15s var(--ease), color .15s var(--ease); }
	.seg button.on { background: var(--panel); color: var(--ink); box-shadow: var(--shadow); }
	.fetch-row { display: flex; gap: 8px; }
	.fetch-row input { flex: 1; }
	/* In brief: what was asked, what was built and what stands behind it, before anything else */
	.brief { margin-top: 16px; padding: 0 20px; }
	.brow { display: grid; grid-template-columns: 72px minmax(0, 1fr); gap: 4px 16px; padding: 16px 0; border-top: 1px solid var(--line); }
	.brow:first-child { border-top: 0; }
	.brow-l { font-size: 13px; line-height: 24px; color: var(--muted); }
	.brow-t { max-width: 72ch; font-size: 15px; line-height: 24px; white-space: pre-line; overflow-wrap: anywhere; }
	.brow .chip { min-height: 24px; }
	.clamp { max-height: 144px; overflow: hidden; }
	.clamp.cut { -webkit-mask-image: linear-gradient(#000 calc(100% - 48px), transparent); mask-image: linear-gradient(#000 calc(100% - 48px), transparent); }
	@container (max-width: 640px) { .brow { grid-template-columns: minmax(0, 1fr); } }
	/* The record: every part of the run, closed until someone wants it */
	.folds > details { border-top: 1px solid var(--line); }
	.folds > details:first-child { border-top: 0; }
	.folds > details > summary { display: flex; align-items: center; gap: 12px; min-height: 48px; margin: 0; padding: 8px 20px; list-style: none; font-size: 14px; color: var(--ink); transition: background-color .15s var(--ease); }
	.folds > details > summary::-webkit-details-marker { display: none; }
	.folds > details > summary:hover { background: var(--raised); }
	.folds > details:first-child > summary { border-radius: 11px 11px 0 0; }
	.folds > details:last-child:not([open]) > summary { border-radius: 0 0 11px 11px; }
	.folds > details:first-child:last-child:not([open]) > summary { border-radius: 11px; }
	.folds > details > summary::before { content: ""; flex: none; width: 6px; height: 6px; margin: 0 3px 0 1px; border: solid var(--muted); border-width: 0 1.5px 1.5px 0; transform: rotate(-45deg); transition: transform .15s var(--ease); }
	.folds > details[open] > summary::before { transform: rotate(45deg); }
	.folds > details[open] > summary { border-bottom: 1px solid var(--line); }
	.fold-t { flex: none; font-weight: 500; }
	.fold-s { min-width: 0; margin-left: auto; font-size: 13px; color: var(--muted); text-align: right; overflow-wrap: anywhere; }
	.fold-s.warn { color: var(--warn); }
	.fold-s.bad { color: var(--bad); }
	.fold-s.ok { color: var(--ok); }
	.folds .panel { border: 0; border-radius: 0; background: none; box-shadow: none; }
	.fold-h { padding: 16px 20px 0; font-size: 13px; line-height: 20px; font-weight: 500; color: var(--ink2); }
	.fold-h + .panel > .item:first-child { padding-top: 8px; }
	.folds .tl { margin: 12px 20px 12px 24px; }
	.folds .tl > div::before { box-shadow: 0 0 0 3px var(--panel); }
	.body { padding: 16px 20px; }
	.body > * + * { margin-top: 12px; }
	.gate { display: flex; align-items: center; gap: 8px; font-weight: 500; }
	.gate::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--passed); }
	.gate.ok::before { background: var(--ok-dot); }
	ul.plain { margin: 8px 0 0; padding-left: 20px; color: var(--ink2); }
	.item { padding: 16px 20px; border-top: 1px solid var(--line); overflow-wrap: anywhere; }
	.item:first-child { border-top: 0; }
	.item > * + * { margin-top: 8px; }
	.item-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
	.item-head strong { font-weight: 500; }
	.item-head .end { margin-left: auto; }
	.item-head .end a:not(.btn) { font-size: 13px; color: var(--ink2); text-underline-offset: 3px; }
	/* Markdown from reports, issues and comments */
	.md { max-width: 80ch; overflow-wrap: anywhere; }
	.md > * + * { margin-top: 10px; }
	.md h3, .md h4, .md h5, .md h6 { font-size: 14px; line-height: 20px; font-weight: 500; }
	.md h3 { font-size: 15px; }
	.md * + h3, .md * + h4, .md * + h5 { margin-top: 20px; }
	.md p, .md li { color: var(--ink); }
	.md ul, .md ol { margin: 0; padding-left: 20px; }
	.md li + li { margin-top: 4px; }
	.md li > * + * { margin-top: 4px; }
	.md strong { font-weight: 600; }
	.md code { padding: 1px 4px; border-radius: 4px; background: var(--raised); font: 12px/18px var(--mono); }
	.md pre code { padding: 0; background: none; }
	.md a { text-underline-offset: 3px; }
	.md blockquote { margin: 0; padding-left: 12px; border-left: 2px solid var(--line2); color: var(--ink2); }
	.md hr { border: 0; border-top: 1px solid var(--line); }
	.md .table { overflow-x: auto; }
	.md table { min-width: 100%; border-collapse: collapse; font-size: 13px; line-height: 20px; overflow-wrap: normal; }
	.md th, .md td { padding: 6px 12px 6px 0; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
	.md th { font-weight: 500; color: var(--ink2); }
	.md tr:last-child td { border-bottom: 0; }
	.quote { padding-left: 12px; border-left: 2px solid var(--line2); white-space: pre-wrap; }
	.quote.md { white-space: normal; }
	.quote.md > .meta + * { margin-top: 2px; }
	.quote .meta { margin-bottom: 2px; }
	.quote.hidden { color: var(--muted); }
	.tl { margin-left: 4px; padding: 4px 0 4px 16px; border-left: 1px solid var(--line2); }
	.tl > div { position: relative; padding: 6px 0; font-size: 13px; color: var(--ink2); overflow-wrap: anywhere; }
	.tl > div::before { content: ""; position: absolute; left: -20px; top: 13px; width: 7px; height: 7px; border-radius: 50%; background: var(--passed); box-shadow: 0 0 0 3px var(--bg); }
	.tl > div:first-child { color: var(--ink); }
	.tl time { display: block; }


	/* What the reviewer looks at: captures, the dev environment, and what the implementer proved */
	.shots { display: grid; gap: 24px; padding: 20px; }
	.shots h3 { font-size: 14px; line-height: 20px; font-weight: 500; overflow-wrap: anywhere; }
	.shots h3 + p { max-width: 72ch; margin-top: 2px; font-size: 13px; color: var(--ink2); overflow-wrap: anywhere; }
	.shot-row { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 260px), 1fr)); gap: 12px; margin-top: 12px; }
	.shot-row.pair { grid-template-columns: repeat(2, minmax(0, 1fr)); }
	.shot { position: relative; display: block; width: 100%; padding: 0; border: 0; border-radius: 10px; background: var(--raised); box-shadow: 0 0 0 1px var(--line2); overflow: hidden; cursor: zoom-in; transition: box-shadow .15s var(--ease); }
	.shot:hover { box-shadow: 0 0 0 1px var(--ink2); }
	.shot img { display: block; width: 100%; aspect-ratio: 16 / 10; object-fit: cover; object-position: top center; }
	.shot .blank { display: grid; place-items: center; aspect-ratio: 16 / 10; color: var(--muted); font-size: 13px; }
	.tag { position: absolute; left: 8px; top: 8px; padding: 1px 8px; border-radius: 6px; background: var(--panel); color: var(--ink); font: 500 12px/18px var(--sans); box-shadow: 0 0 0 1px var(--line2); }
	.play { position: absolute; left: 50%; top: 50%; display: grid; place-items: center; width: 48px; height: 48px; margin: -24px 0 0 -24px; border-radius: 50%; background: var(--ink); color: var(--bg); }
	.play svg { width: 20px; height: 20px; margin-left: 2px; fill: currentColor; stroke: none; }
	.env { gap: 8px; }
	.env i { width: 6px; height: 6px; border-radius: 50%; background: var(--passed); }
	.env.ok i { background: var(--ok-dot); }
	.env.dead i { background: var(--bad-dot); }
	.body .tryit { max-width: 72ch; color: var(--ink2); white-space: pre-wrap; overflow-wrap: anywhere; }
	.body .sub { font-size: 13px; line-height: 20px; font-weight: 500; }
	.claims-head, .claim { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 3fr); gap: 4px 24px; padding: 12px 20px; }
	.claims-head { padding-bottom: 8px; font-size: 12px; line-height: 16px; color: var(--muted); }
	.claim { border-top: 1px solid var(--line); overflow-wrap: anywhere; }
	.proof { font: 12px/18px var(--mono); color: var(--ink2); white-space: pre-wrap; }
	.measures-head, .measure { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 1fr) minmax(0, 1fr); gap: 4px 24px; padding: 12px 20px; }
	.measures-head { padding-bottom: 8px; font-size: 12px; line-height: 16px; color: var(--muted); }
	.measure { border-top: 1px solid var(--line); overflow-wrap: anywhere; }
	.measures-head span + span, .measure .num { text-align: right; font-variant-numeric: tabular-nums; }
	.measures + .body { border-top: 1px solid var(--line); }
	@container (max-width: 640px) {
		.claims-head { display: none; }
		.claim { grid-template-columns: minmax(0, 1fr); }
	}
	dialog.view { width: 100vw; max-width: 100vw; height: 100dvh; max-height: 100dvh; margin: 0; padding: 0; border: 0; background: var(--bg); color: var(--ink); }
	dialog.view[open] { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; }
	.view-bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; min-height: 56px; padding: 8px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
	.view-bar strong { font-size: 15px; font-weight: 500; overflow-wrap: anywhere; }
	.view-stage { display: grid; place-items: center; min-height: 0; padding: 16px; }
	.view-stage img, .view-stage video { max-width: 100%; max-height: 100%; min-height: 0; border-radius: 8px; box-shadow: 0 0 0 1px var(--line2); background: var(--raised); object-fit: contain; }
	.view-stage.side { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; align-items: stretch; }
	.view-pane { display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 8px; min-height: 0; min-width: 0; }
	.view-pane-head { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
	.view-pane img { justify-self: center; align-self: center; }
	.view-note { max-width: 80ch; margin: 0 auto; padding: 0 16px 16px; text-align: center; color: var(--ink2); overflow-wrap: anywhere; }
	.view-note:empty { display: none; }
	/* Full plan reading sheet */
	dialog.plan-view { width: min(860px, 100vw); max-width: 100vw; height: 100dvh; max-height: 100dvh; margin: 0 0 0 auto; padding: 0; border: 0; border-left: 1px solid var(--line); background: var(--panel); color: var(--ink); }
	dialog.plan-view::backdrop { background: rgba(0, 0, 0, .42); }
	dialog.plan-view[open] { display: grid; grid-template-rows: auto minmax(0, 1fr); }
	.plan-body { overflow-y: auto; padding: 24px 28px 64px; }
	.plan-body .md { max-width: 74ch; }

	/* Settings */
	.sgrid { display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 32px; align-items: start; margin-top: 24px; }
	.snav { position: sticky; top: 80px; display: grid; gap: 2px; }
	.snav-h { margin-top: 16px; padding: 0 12px 4px; font-size: 12px; line-height: 16px; color: var(--muted); }
	.snav button { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-width: 0; height: 36px; padding: 0 12px; border: 0; border-radius: 8px; background: transparent; color: var(--ink2); font: 14px/20px var(--sans); text-align: left; cursor: pointer; transition: background-color .15s var(--ease), color .15s var(--ease); }
	.snav button:hover, .snav button.on { background: var(--raised); color: var(--ink); }
	.snav button.on { font-weight: 500; box-shadow: inset 0 0 0 1px var(--line); }
	.snav button > span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
	.snav .where { flex: none; font-size: 12px; font-weight: 400; color: var(--muted); }
	.shead h2 { font-size: 18px; line-height: 24px; font-weight: 500; overflow-wrap: anywhere; }
	.shead p { max-width: 72ch; margin-top: 4px; color: var(--ink2); }
	.sgrid .panel, .sgrid .notice, .sgrid details { margin-top: 16px; }
	.choice { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
	.opt { display: flex; gap: 12px; padding: 16px; border: 1px solid var(--line2); border-radius: 10px; background: var(--panel); color: var(--ink); font: 14px/20px var(--sans); text-align: left; cursor: pointer; transition: border-color .15s var(--ease), background-color .15s var(--ease); }
	.opt:hover { background: var(--raised); }
	.opt.on { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); background: var(--panel); cursor: default; }
	.opt i { flex: none; width: 16px; height: 16px; margin-top: 2px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px var(--line2); }
	.opt.on i { box-shadow: inset 0 0 0 5px var(--ink); }
	.opt strong { display: block; font-weight: 500; }
	.opt span span { display: block; margin-top: 2px; font-size: 13px; color: var(--ink2); }
	.part { padding: 20px; border-top: 1px solid var(--line); }
	.part:first-child { border-top: 0; }
	.part > h2 { font-size: 14px; font-weight: 500; }
	.part > h2 + p { max-width: 72ch; margin-top: 2px; font-size: 13px; color: var(--ink2); }
	.part > h2 ~ div { margin-top: 16px; }
	.stages-head, .stage { display: grid; grid-template-columns: 200px repeat(3, minmax(0, 1fr)); gap: 8px 12px; align-items: start; }
	.stages-head { padding-bottom: 8px; font-size: 13px; color: var(--ink2); }
	.stage { padding: 16px 0; border-top: 1px solid var(--line); }
	.stage:last-child { padding-bottom: 0; }
	.stage .who { grid-row: span 2; padding-top: 8px; }
	.stage .who strong { display: block; font-weight: 500; text-transform: capitalize; }
	.stage .note { grid-column: 2 / -1; }
	.stage .note textarea { min-height: 56px; }
	.stage .flabel { display: none; }
	input:disabled, select:disabled, textarea:disabled { border-color: var(--line); background: var(--raised); color: var(--ink2); opacity: 1; resize: none; }
	.savebar { position: sticky; bottom: 0; display: flex; align-items: center; gap: 12px; padding: 12px 20px; border-top: 1px solid var(--line); border-radius: 0 0 11px 11px; background: var(--panel); }
	.savebar .state { font-size: 13px; color: var(--muted); }
	.foot { max-width: 72ch; margin-top: 32px; font-size: 13px; color: var(--muted); }
	.notice.quiet { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; background: var(--raised); color: var(--ink2); box-shadow: none; }
	@container (max-width: 1040px) {
		.stages-head { display: none; }
		.stage { grid-template-columns: repeat(3, minmax(0, 1fr)); }
		.stage .who { grid-column: 1 / -1; grid-row: auto; padding-top: 0; }
		.stage .note { grid-column: 1 / -1; }
		.stage .flabel { display: block; }
	}
	@container (max-width: 860px) {
		.sgrid { grid-template-columns: minmax(0, 1fr); gap: 24px; }
		.snav { position: static; }
	}
	@container (max-width: 560px) {
		.stage, .choice { grid-template-columns: minmax(0, 1fr); }
	}
	.narrow { max-width: 640px; }

	/* Intake workspace */
	.in-grid { display: grid; grid-template-columns: 248px minmax(0, 1fr); grid-template-rows: auto 1fr; column-gap: 28px; align-items: start; }
	.in-sources { grid-column: 1; grid-row: 1; }
	.in-conns { grid-column: 1; grid-row: 2; margin-top: 20px; border-top: 1px solid var(--line); padding-top: 16px; }
	.in-queue { grid-column: 2; grid-row: 1 / span 2; min-width: 0; }
	.in-sec-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 0 10px 6px; font-size: 12px; line-height: 16px; color: var(--muted); }
	.in-rail-add { display: inline-flex; align-items: center; gap: 4px; height: 24px; padding: 0 6px; border: 0; border-radius: 6px; background: transparent; color: var(--ink2); font: 500 12px/16px var(--sans); cursor: pointer; -webkit-tap-highlight-color: transparent; transition: background-color .15s var(--ease), color .15s var(--ease); }
	.in-rail-add .ic, .in-rail-add .ic svg { width: 14px; height: 14px; }
	.in-nav { display: grid; gap: 2px; }
	.in-nav-item { position: relative; display: flex; align-items: center; }
	.in-nav-btn { display: flex; align-items: center; gap: 8px; width: 100%; min-width: 0; height: 34px; padding: 0 10px; border: 0; border-radius: 8px; background: transparent; color: var(--ink2); font: 13.5px/20px var(--sans); text-align: left; cursor: pointer; -webkit-tap-highlight-color: transparent; transition: background-color .15s var(--ease), color .15s var(--ease); }
	.in-nav-btn.on { background: var(--raised); color: var(--ink); font-weight: 500; box-shadow: inset 0 0 0 1px var(--line); }
	.in-nav-btn .ic, .in-nav-btn .ic svg { width: 15px; height: 15px; color: var(--muted); }
	.in-nav-btn.on .ic, .in-nav-btn.on .ic svg { color: var(--ink2); }
	.in-nav-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
	.in-nav-cnt { flex: none; font: 12px/16px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
	.in-nav-err { flex: none; width: 6px; height: 6px; border-radius: 50%; background: var(--bad-dot); }
	.in-nav-edit { position: absolute; right: 6px; display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 24px; padding: 0; border: 0; border-radius: 6px; background: var(--raised); color: var(--muted); cursor: pointer; opacity: 0; pointer-events: none; transition: opacity .15s var(--ease), color .15s var(--ease), background-color .15s var(--ease); }
	.in-nav-edit .ic, .in-nav-edit .ic svg { width: 13px; height: 13px; }
	.in-nav-item:focus-within .in-nav-edit { opacity: 1; pointer-events: auto; }

	/* Compact Connections box in rail */
	.in-conn-list { display: grid; gap: 4px; }
	.in-conn { padding: 8px 10px; border-radius: 8px; }
	.in-conn-row { display: flex; align-items: center; gap: 8px; min-height: 22px; }
	.in-dot { flex: none; width: 6px; height: 6px; border-radius: 50%; background: var(--passed); }
	.in-dot.ok { background: var(--ok-dot); }
	.in-dot.bad { background: var(--bad-dot); }
	.in-conn-name { font-size: 13px; font-weight: 500; color: var(--ink); }
	.in-conn-val { flex: 1; min-width: 0; font-size: 12px; color: var(--muted); text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
	.in-conn-act { flex: none; margin-left: auto; padding: 2px 6px; border: 0; border-radius: 5px; background: transparent; color: var(--ink2); font: 500 12px/16px var(--sans); cursor: pointer; -webkit-tap-highlight-color: transparent; transition: background-color .15s var(--ease), color .15s var(--ease); }
	.in-conn-sub { margin-top: 4px; padding-left: 14px; font-size: 12px; line-height: 16px; color: var(--muted); overflow-wrap: anywhere; }
	.in-conn-sub.bad { color: var(--bad); }
	.in-conn-form { display: grid; gap: 8px; margin-top: 10px; padding: 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
	.in-conn-form input { height: 32px; padding: 0 10px; font-size: 13px; }
	.in-conn-form .fhint { margin-top: 0; }
	.in-conn-inline { display: flex; gap: 8px; align-items: center; }
	.in-conn-inline input { flex: 1; min-width: 0; }
	.in-setup-card .in-conn-form { margin-top: 0; padding: 0; border: 0; background: transparent; }

	/* Main queue header & filter bar */
	.in-head { display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 12px 16px; margin-bottom: 16px; }
	.in-head-main { min-width: 0; }
	.in-head h1 { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px; font-size: 20px; line-height: 28px; font-weight: 500; }
	.in-head-sub { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; margin-top: 4px; font-size: 13px; color: var(--muted); }
	.in-head-act { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
	.in-spin .ic svg { animation: spin .75s linear infinite; }
