			const rows = []
			i += 2
			while (i < lines.length && lines[i].trim() && lines[i].includes('|')) rows.push(mdCells(lines[i++]))
			blocks.push(h('div', { class: 'table' }, h('table', {},
				h('thead', {}, h('tr', {}, head.map((c, n) => cell('th', c, n)))),
				rows.length ? h('tbody', {}, rows.map((r) => h('tr', {}, head.map((_, n) => cell('td', r[n] || '', n))))) : null
			)))
			continue
		}
		if (MD_QUOTE.test(line)) {
			const body = []
			while (i < lines.length && lines[i].trim() && (MD_QUOTE.test(lines[i]) || !mdBlockStart(lines, i))) body.push(lines[i++].replace(/^ {0,3}> ?/, ''))
			blocks.push(h('blockquote', {}, md(body.join('\n'))))
			continue
		}
		const first = line.match(MD_ITEM)
		if (first) {
			const base = first[1].length
			const ordered = /\d/.test(first[2])
			const items = []
			while (i < lines.length) {
				const m = lines[i].match(MD_ITEM)
				if (m && indentOf(lines[i]) <= base + 1) {
					if (/\d/.test(m[2]) !== ordered) break
					items.push([m[3] || ''])
					i++
					continue
				}
				if (!lines[i].trim()) {
					// A blank line ends the list unless the next text belongs to it.
					let next = i + 1
					while (next < lines.length && !lines[next].trim()) next++
					if (next < lines.length && (indentOf(lines[next]) > base || (MD_ITEM.test(lines[next]) && indentOf(lines[next]) === base))) { items.at(-1).push(''); i++; continue }
					break
				}
				if (indentOf(lines[i]) > base) { items.at(-1).push(lines[i].slice(Math.min(indentOf(lines[i]), base + 2))); i++; continue }
				if (mdBlockStart(lines, i)) break
				items.at(-1).push(lines[i++])
			}
			const start = ordered ? parseInt(first[2], 10) : 1
			blocks.push(h(ordered ? 'ol' : 'ul', { start: ordered && start !== 1 ? start : null }, items.map((body) => {
				const inner = md(body.join('\n'))
				// A one-paragraph item is drawn without the paragraph, so the list stays tight.
				return h('li', {}, inner.length === 1 && inner[0].tagName === 'P' ? [...inner[0].childNodes] : inner)
			})))
			continue
		}
		const para = [line]
		i++
		while (i < lines.length && lines[i].trim() && !mdBlockStart(lines, i)) para.push(lines[i++])
		// Line breaks are kept, as GitHub keeps them in comments: reports put one field per line.
		blocks.push(h('p', {}, para.flatMap((l, n) => (n ? [h('br'), ...mdInline(l.trim())] : mdInline(l.trim())))))
	}
	return blocks
}
const out = (url, label, name, cls = 'btn sm', title) => (isUrl(url) ? h('a', { class: cls, href: url, target: '_blank', rel: 'noreferrer', title }, icon(name), label) : null)
const issueHref = (issue) => `#/issue/${encodeURIComponent(issue.id)}`
const short = (sha) => (sha ? sha.slice(0, 7) : '')
const sameCommit = (a, b) => !!a && !!b && (a.startsWith(b) || b.startsWith(a))
const count = (n, word) => `${n} ${word}${n === 1 ? '' : 's'}`
const chip = (text, kind) => h('span', { class: `chip${kind ? ` ${kind}` : ''}` }, text)
const field = (label, control, hint) => h('label', { class: 'field' }, h('span', { class: 'flabel' }, label), control, hint ? h('span', { class: 'fhint' }, hint) : null)
const fold = (key, summary, ...body) => h('details', { open: opened.has(key), ontoggle: (e) => (e.target.open ? opened.add(key) : opened.delete(key)) }, h('summary', {}, summary), ...body)

async function api(method, path, body) {
	const res = await fetch(path, { method, headers: { 'content-type': 'application/json' }, body: body === undefined ? undefined : JSON.stringify(body) })
	const json = await res.json().catch(() => ({ error: `HTTP ${res.status}` }))
	if (!res.ok) throw new Error(json.error || `HTTP ${res.status}`)
	return json
}

function route() {
	const hash = location.hash.replace(/^#\/?/, '')
	const [page, id] = hash.split('/')
	return { page: page || 'board', id: id && decodeURIComponent(id) }
}

function drawNav() {
	const { page } = route()
	const on = (name) => (page === name || (name === 'board' && page === 'issue') ? 'on' : '')
	document.getElementById('nav').replaceChildren(
		h('a', { href: '#/', class: on('board') }, 'Board', board.needsYou ? h('span', { class: 'count warn', title: `${board.needsYou} for you` }, board.needsYou) : null),
		h('a', { href: '#/intake', class: on('intake') }, 'Intake'),
		h('a', { href: '#/done', class: on('done') }, 'Done'),
		h('a', { href: '#/settings', class: on('settings') }, 'Settings')
	)
	document.title = board.needsYou ? `(${board.needsYou}) Factory` : 'Factory'
}

/** One line for where an issue stands: who has to act, and since when. */
function statusOf(i) {
	if (i.state && i.state !== 'open') return { tone: 'idle', label: outcomeName(i.outcome || i.state) }
	if (i.threadGone) return { tone: 'bad', label: 'Thread gone', note: ['T3 Code cannot find its thread'] }
	if (i.undelivered) return { tone: 'bad', label: 'Message stuck', note: ["A factory message has not reached the idle thread: open it in T3 Code and resume its queue"] }
	if (i.stuck) return { tone: 'bad', label: 'Stuck', note: ['No report after being asked to go on'] }
	const open = (i.decisions || []).filter(isOpenDec)
	if (open.length) {
		const questions = open.filter((d) => d.kind === 'question').length
		const has = (kind) => open.some((d) => d.kind === kind)
		const what = [questions ? count(questions, 'question') : null, has('plan') ? 'plan to approve' : null, has('merge') ? 'merge to decide' : null, has('blocked') ? 'blocked' : null].filter(Boolean)
		return { tone: 'warn', label: cap(what.join(', ')), note: open.some((d) => !d.provisional) ? ['Paused ', lasting(Math.min(...open.map((d) => d.askedAt)))] : ['Work goes on, the merge waits'] }
	}
	if (i.decisions && i.decisions.length) return { tone: 'warn', label: 'Answer not delivered' }
	const w = i.waiting
	if (w && w.on === 'limit') {
		return { tone: 'idle', label: `Usage limit until ${clock(w.until)}`, note: dotted(w.note, 'Goes on by itself at the reset') }
	}
	if (w) {
		return {
			tone: w.overdue ? 'warn' : 'idle',
			label: `Waiting on ${w.on}${w.overdue ? ', overdue' : ''}`,
			note: dotted(w.who.length ? w.who.join(', ') : null, w.note, lasting(w.since)),
			alarm: w.safetyNet !== 'on' ? `Safety net ${w.safetyNet}` : null
		}
	}
	if (i.run) return { tone: 'live', label: 'Working', running: true, note: dotted(i.run.model, lasting(i.run.startedAt)) }
	return { tone: 'idle', label: i.ran && !i.ran.length ? 'Starting' : 'Between runs' }
}

function track(issue, status) {
	const closed = issue.state && issue.state !== 'open'
	const at = issue.outcome === 'shipped' ? STAGES.length : STAGES.indexOf(issue.stage)
	const ran = issue.ran || STAGES
	return h('div', { class: `track t-${status.tone}`, role: 'img', 'aria-label': closed ? outcomeName(issue.outcome) : `At ${issue.stage}` }, ...STAGES.map((stage, n) => {
		const state = n === at && !closed ? `now${status.running ? ' running' : ''}` : n <= at ? (ran.includes(stage) ? 'done' : 'skip') : ''
		return h('span', { class: `st ${state}`, title: cap(stage) }, h('i'))
	}))
}

/** What waits for the user in one issue: blocking questions first, then provisional questions, then plan/merge/blocked. */
const inOrder = (decisions) => decisions.slice().sort((a, b) => {
	const rank = (d) => (d.kind === 'question' ? (d.provisional ? 1 : 0) : d.kind === 'plan' ? 2 : d.kind === 'blocked' ? 3 : 4)
	return rank(a) - rank(b) || a.askedAt - b.askedAt
})

const isOpenDec = (d) => d.answer === null && !d.supersededBy

/** Returns the current chosen answer for an open question (provisional questions default to their recommendation). */
function pickedFor(d) {
	const saved = selections.get(d.id)
	if (saved) return saved
	if (d.provisional) return { mode: 'option', value: d.recommendation }
	return null
}

function answerValueOf(d) {
	const p = pickedFor(d)
	if (!p) return ''
	return p.mode === 'custom' ? (drafts.get(`custom:${d.id}`) || '').trim() : p.value
}

/** Full plan reading sheet outside <main>, so live SSE updates never close or scroll-jump it. */
const planSheet = { el: null }
function openPlanSheet(title, markdown) {
	if (!planSheet.el) {
		planSheet.el = h('dialog', { class: 'plan-view', 'aria-label': 'Full plan', onclick: (e) => { if (e.target === planSheet.el) planSheet.el.close() }, onclose: () => planSheet.el.replaceChildren() })
		document.body.append(planSheet.el)
	}
	planSheet.el.replaceChildren(
		h('div', { class: 'view-bar' },
			h('strong', {}, title),
			h('button', { class: 'btn sm', onclick: () => planSheet.el.close(), 'aria-label': 'Close' }, icon('close'), 'Close', h('span', { class: 'kbd' }, 'Esc'))
		),
		h('div', { class: 'plan-body' }, h('div', { class: 'md' }, md(markdown)))
	)
	planSheet.el.showModal()
}

/** Unified Decision Workbench for plan approval and/or open questions (with single atomic submit). */
function decisionWorkbench(data, pending, planRes) {
	const issue = data.issue
	const held = pending.filter((d) => d.answer !== null)
	const openQuestions = inOrder(pending.filter((d) => isOpenDec(d) && d.kind === 'question'))
	const openPlan = pending.find((d) => isOpenDec(d) && d.kind === 'plan') || null
	const openBlocked = pending.filter((d) => isOpenDec(d) && d.kind === 'blocked')
	const openMerge = pending.find((d) => isOpenDec(d) && d.kind === 'merge') || null
	const retry = async (errEl) => {
		try { await api('POST', `/api/issues/${encodeURIComponent(issue.id)}/deliver`, {}) } catch (e) { errEl.textContent = e.message }
	}
	const cards = []

	// Already answered on the page, waiting for delivery or remaining blocking items: one compact row each.
	const heldRow = (d) => {
		const err = h('span', { class: 'error' })
		return h('div', { class: 'answered-row' },
			h('span', { class: 'ok-mark' }, '✓'),
			h('span', {}, splitQuestion(d.question)[0]),
			h('span', { class: 'ans-val' }, d.answer),
			h('span', { class: 'meta' }, d.delivery === 'failed' ? 'Delivery failed' : 'Held until the rest is answered'),
			d.delivery === 'failed' ? h('button', { class: 'btn sm', onclick: () => retry(err) }, 'Retry') : null,
			err
		)
	}

	// 1. Plan + Questions unified workbench
	if (openPlan || openQuestions.length) {
		const box = h('section', { class: 'panel needs', style: 'margin-top:20px' })
		const rebuild = () => {
			const errorEl = h('div', { class: 'error' })
			const unselectedBlocking = openQuestions.filter((d) => !answerValueOf(d))
			const differing = openPlan ? openQuestions.filter((d) => { const v = answerValueOf(d); return v && v !== d.recommendation }) : []
			const fbKey = `plan-fb:${issue.id}`
			const fbOpen = planChangeOpen.has(issue.id) || differing.length > 0
			const fbText = (drafts.get(fbKey) || '').trim()
			const willRevise = !!openPlan && (differing.length > 0 || planChangeOpen.has(issue.id))
			const planText = openPlan?.body || planRes?.plan || ''

			const submitAll = async () => {
				if (unselectedBlocking.length) return
				const answers = openQuestions.map((d) => ({ decision: d.id, answer: answerValueOf(d) }))
				if (openPlan) {
					const planAns = willRevise ? (fbText ? `Change: ${fbText}` : 'Change') : 'Approve'
					answers.push({ decision: openPlan.id, answer: planAns })
				}
				for (const b of box.querySelectorAll('button')) b.disabled = true
				errorEl.textContent = ''
				try {
					const res = await api('POST', `/api/issues/${encodeURIComponent(issue.id)}/answers`, {
						answers,
						autoShip: !!openPlan && !willRevise && !!autoShipDraft.get(issue.id)
					})
					for (const d of openQuestions) { selections.delete(d.id); drafts.delete(`custom:${d.id}`) }
					drafts.delete(fbKey)
					planChangeOpen.delete(issue.id)
					autoShipDraft.delete(issue.id)
					if (res.error) { errorEl.textContent = `Saved, but not delivered: ${res.error}`; for (const b of box.querySelectorAll('button')) b.disabled = false; return }
					justSubmitted = { issueId: issue.id, label: openPlan ? (willRevise ? 'Sent choices to revise the plan' : 'Plan approved, implementation starting') : 'Answers sent to thread' }
					await refreshBoard()
					draw()
				} catch (e) {
					errorEl.textContent = e.message
					for (const b of box.querySelectorAll('button')) b.disabled = false
				}
			}

			const hasUnpicked = openQuestions.some((d) => !pickedFor(d))
			const pickAllRec = () => {
				for (const d of openQuestions) selections.set(d.id, { mode: 'option', value: d.recommendation })
				rebuild()
			}

			const titleText = openPlan
				? (openQuestions.length ? `Review plan & ${count(openQuestions.length, 'choice')}` : 'Approve the plan')
				: count(openQuestions.length, 'decision')

			const head = h('div', { class: 'wb-head' },
				h('h2', {}, titleText),
				h('div', { class: 'row' },
					hasUnpicked ? h('button', { class: 'btn sm', onclick: pickAllRec }, 'Select recommended for all') : null,
					planText ? h('button', { class: 'btn sm', onclick: () => openPlanSheet(`Plan: ${issue.title}`, planText) }, icon('doc'), 'Read full plan') : null
				)
			)

			let planBlock = null
			if (openPlan) {
				const outline = planRes?.outline || []
				const criteria = planRes?.criteria || []
				const later = planRes?.later || []
				const [ask, more] = splitQuestion(openPlan.question)
				planBlock = h('div', { class: 'wb-plan' },
					h('div', { class: 'wb-plan-top' },
						h('h3', {}, ask),
						when(openPlan.askedAt)
					),
					more ? h('p', { class: 'q-more' }, more) : null,
					outline.length
						? h('ul', { class: 'outline' }, ...outline.map((point) => h('li', {}, mdInline(point))))
						: (!more && planRes?.planned ? h('p', { class: 'q-more', style: 'margin-top:8px' }, planRes.planned) : null),
					(criteria.length || later.length) ? h('div', { class: 'wb-facts' },
						criteria.length ? chip(criteria.length === 1 ? '1 acceptance criterion' : `${criteria.length} acceptance criteria`) : null,
						later.length ? chip(`${count(later.length, 'later slice')} deferred`) : null
					) : null
				)
			}

			const qCards = openQuestions.map((d, idx) => {
				const [ask, more] = splitQuestion(d.question)
				const picked = pickedFor(d)
				const opts = [d.recommendation, ...(d.options || []).filter((o) => o && o !== d.recommendation)]
				const isCustom = picked?.mode === 'custom'
				const customInput = isCustom ? h('textarea', {
					rows: 2,
					placeholder: 'Write your answer',
					'aria-label': `Custom answer for ${ask}`,
					'data-draft': `custom:${d.id}`,
					oninput: (e) => { drafts.set(`custom:${d.id}`, e.target.value); updateBarState() },
					onkeydown: (e) => { if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); submitAll() } }
				}, drafts.get(`custom:${d.id}`) || '') : null

				return h('div', { class: `need${!d.provisional ? ' blocking' : ''}` },
					h('div', { class: 'need-top' },
						openQuestions.length > 1 ? h('span', { class: 'q-num' }, idx + 1) : null,
						h('span', { class: `kind${d.provisional ? ' quiet' : ''}` }, d.provisional ? 'Default selected · override if needed' : 'Decision required'),
						when(d.askedAt)
					),
					h('p', { class: 'question' }, ask),
					more ? h('p', { class: 'q-more' }, more) : null,
					d.body ? h('div', { class: 'md' }, md(d.body)) : null,
					h('div', { class: 'opt-list', role: 'radiogroup', 'aria-label': ask },
						...opts.map((opt, n) => {
							const on = picked?.mode === 'option' && picked.value === opt
							return h('button', {
								type: 'button',
								class: `opt-card${on ? ' picked' : ''}`,
								role: 'radio',
								'aria-checked': on ? 'true' : 'false',
								onclick: () => { selections.set(d.id, { mode: 'option', value: opt }); rebuild() }
							},
								h('span', { class: 'radio' }),
								h('span', { class: 'opt-body' }, opt, n === 0 ? h('span', { class: 'opt-rec' }, 'Recommended') : null)
							)
						}),
						h('button', {
							type: 'button',
							class: `opt-card custom-toggle${isCustom ? ' picked' : ''}`,
							role: 'radio',
							'aria-checked': isCustom ? 'true' : 'false',
							onclick: () => {
								selections.set(d.id, { mode: 'custom', value: '' })
								rebuild()
								const el = box.querySelector(`[data-draft="${CSS.escape(`custom:${d.id}`)}"]`)
								if (el) el.focus()
							}
						}, h('span', { class: 'radio' }), h('span', { class: 'opt-body' }, 'Answer in your own words...')),
						isCustom ? h('div', { class: 'opt-custom-box' }, customInput) : null
					)
				)
			})

			const statusEl = h('span', { class: 'wb-status' })
			const submitBtn = h('button', { type: 'button', class: 'btn primary', onclick: submitAll })
			const updateBarState = () => {
				const missingNow = openQuestions.filter((d) => !answerValueOf(d))
				const diffNow = openPlan ? openQuestions.filter((d) => { const v = answerValueOf(d); return v && v !== d.recommendation }) : []
				const reviseNow = !!openPlan && (diffNow.length > 0 || planChangeOpen.has(issue.id))
				submitBtn.disabled = missingNow.length > 0
				statusEl.className = `wb-status${missingNow.length ? ' warn' : ''}`
				if (missingNow.length) {
					statusEl.textContent = `${count(missingNow.length, 'decision')} still needs a selection`
				} else if (openPlan && reviseNow) {
					statusEl.textContent = diffNow.length
						? `${count(diffNow.length, 'choice')} differs from the plan: sending back to revise`
						: 'Will send your notes back to revise the plan'
				} else if (openPlan) {
					statusEl.textContent = openQuestions.length
						? `All ${count(openQuestions.length, 'choice')} ready · plan will start implementing`
						: 'Approving starts implementation immediately'
				} else {
					statusEl.textContent = `Ready to send ${count(openQuestions.length, 'answer')} to the thread`
				}
				const label = openPlan
					? (reviseNow ? 'Send choices & revise plan' : 'Approve plan & build')
					: (openQuestions.length === 1 ? 'Send answer' : `Send ${openQuestions.length} answers`)
				submitBtn.replaceChildren(label, h('span', { class: 'kbd' }, '⌘↵'))
			}
			updateBarState()

			const fbBox = fbOpen && openPlan ? h('div', { class: 'wb-feedback' },
				field(differing.length ? 'Optional notes for the planner' : 'What should change in the plan?',
					h('textarea', {
						rows: 2,
						placeholder: 'Tell the planner what to adjust',
						'data-draft': fbKey,
						oninput: (e) => { drafts.set(fbKey, e.target.value); updateBarState() },
						onkeydown: (e) => { if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); submitAll() } }
					}, drafts.get(fbKey) || '')
				)
			) : null

			const autoCheck = openPlan && !willRevise && data.merge !== 'never' ? h('label', { class: 'wb-auto' },
				h('input', {
					type: 'checkbox',
					checked: !!autoShipDraft.get(issue.id),
					onchange: (e) => autoShipDraft.set(issue.id, e.target.checked)
				}),
				'Auto-merge once CI & reviews are green'
			) : null

			const bar = h('div', { class: 'wb-bar' },
				h('div', { class: 'wb-bar-meta' }, statusEl, autoCheck, errorEl),
				h('div', { class: 'row' },
					openPlan && !differing.length ? h('button', {
						type: 'button',
						class: 'btn',
						onclick: () => {
							if (planChangeOpen.has(issue.id)) planChangeOpen.delete(issue.id)
							else planChangeOpen.add(issue.id)
							rebuild()
							const el = box.querySelector(`[data-draft="${CSS.escape(fbKey)}"]`)
							if (el) el.focus()
						}
					}, planChangeOpen.has(issue.id) ? 'Cancel changes' : 'Request changes') : null,
					submitBtn
				)
			)

			box.onkeydown = (e) => { if (e.key === 'Enter' && (e.metaKey || e.ctrlKey) && !submitBtn.disabled) { e.preventDefault(); submitAll() } }
			fill(box, head, ...held.filter((d) => d.kind === 'question').map(heldRow), planBlock, ...qCards, fbBox, bar)
		}
		rebuild()
		cards.push(box)
	} else if (held.length) {
		cards.push(h('section', { class: 'panel needs', style: 'margin-top:20px' },
			h('div', { class: 'wb-head' }, h('h2', {}, 'Pending delivery')),
			...held.map(heldRow)
		))
	}

	// 2. Blocked decisions (provider wall, config error, review round budget)
	for (const d of openBlocked) cards.push(singleDecisionCard(issue, d))

	// 3. Merge decision (shown with Merge + Request changes with notes)
	if (openMerge) cards.push(mergeDecisionCard(issue, openMerge, openQuestions.filter((d) => !d.provisional).length))

	return cards
}

function singleDecisionCard(issue, d) {
	const error = h('div', { class: 'error' })
	const words = h('textarea', { rows: 1, placeholder: 'Or answer in your own words', 'aria-label': 'Your answer', 'data-draft': d.id, oninput: () => drafts.set(d.id, words.value), onkeydown: (e) => { if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) sendOwn() } }, drafts.get(d.id) || '')
	const send = async (answer) => {
		for (const b of card.querySelectorAll('button')) b.disabled = true
		try {
			const result = await api('POST', `/api/decisions/${encodeURIComponent(d.id)}/answer`, { answer })
			drafts.delete(d.id)
			if (result.error) { error.textContent = `Saved, but not delivered: ${result.error}`; for (const b of card.querySelectorAll('button')) b.disabled = false; return }
			justSubmitted = { issueId: issue.id, label: 'Answer sent to thread' }
			await refreshBoard()
			draw()
		} catch (e) {
			error.textContent = e.message
			for (const b of card.querySelectorAll('button')) b.disabled = false
		}
	}
	const sendOwn = () => words.value.trim() && send(words.value.trim())
	const [ask, more] = splitQuestion(d.question)
	const fixed = d.round !== null
	const card = h('section', { class: 'panel needs', style: 'margin-top:20px' },
		h('div', { class: 'wb-head' }, h('h2', {}, d.round !== null ? `Review round ${d.round} budget reached` : 'Blocked'), when(d.askedAt)),
		h('div', { class: 'need' },
			h('p', { class: 'question', style: 'margin-top:0' }, ask),
			more ? h('p', { class: 'q-more' }, more) : null,
			d.body ? h('div', { class: 'md' }, md(d.body)) : null,
			fixed
				? [
					h('p', { class: 'meta' }, `Recommended: ${d.recommendation}`),
					h('div', { class: 'row' }, ...d.options.map((o, n) => h('button', { class: `btn long${n === 0 ? ' primary' : ''}`, onclick: () => send(o) }, o)))
				]
				: [
					h('div', { class: 'row' },
						h('button', { class: 'btn long primary', onclick: () => send(d.recommendation) }, d.recommendation),
						...(d.options || []).filter((o) => o !== d.recommendation).map((o) => h('button', { class: 'btn long', onclick: () => send(o) }, o))
					),
					h('div', { class: 'own' }, words, h('button', { class: 'btn', onclick: sendOwn }, 'Send'))
				],
			error
		)
	)
	return card
}

function mergeDecisionCard(issue, d, blockingBefore = 0) {
	const box = h('section', { class: 'panel needs', style: 'margin-top:20px' })
	const rebuild = () => {
		const error = h('div', { class: 'error' })
		const noteKey = `merge-note:${d.id}`
		const requesting = mergeChangeOpen.has(d.id)
		const [ask, more] = splitQuestion(d.question)
		const number = prNumber(issue.prUrl)
		const send = async (answer) => {
			for (const b of box.querySelectorAll('button')) b.disabled = true
			error.textContent = ''
			try {
				const result = await api('POST', `/api/decisions/${encodeURIComponent(d.id)}/answer`, { answer })
				drafts.delete(noteKey)
				mergeChangeOpen.delete(d.id)
				if (result.error) { error.textContent = `Saved, but not delivered: ${result.error}`; for (const b of box.querySelectorAll('button')) b.disabled = false; return }
				justSubmitted = { issueId: issue.id, label: result.held ? 'Saved, waiting for the remaining blocking decision above' : answer === 'Merge' ? 'Merge approved, landing now' : 'Feedback sent to thread' }
				await refreshBoard()
				draw()
			} catch (e) {
				error.textContent = e.message
				for (const b of box.querySelectorAll('button')) b.disabled = false
			}
		}
		const sendHold = () => {
			const notes = (drafts.get(noteKey) || '').trim()
			send(notes ? `Do not merge: ${notes}` : 'Do not merge')
		}
		const noteArea = requesting ? h('div', { class: 'wb-feedback' },
			field('What should change before merging? (optional)',
				h('textarea', {
					rows: 2,
					placeholder: 'Describe what to fix or adjust; leave blank to simply hold the PR',
					'data-draft': noteKey,
					oninput: (e) => drafts.set(noteKey, e.target.value),
					onkeydown: (e) => { if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); sendHold() } }
				}, drafts.get(noteKey) || '')
			)
		) : null

		fill(box,
			h('div', { class: 'wb-head' },
				h('h2', {}, number ? `Ready to merge PR #${number}` : 'Ready to merge'),
				h('span', { class: 'num' }, dotted(d.head ? `commit ${d.head.slice(0, 7)}` : null, when(d.askedAt)))
			),
			h('div', { class: 'need' },
				h('p', { class: 'question', style: 'margin-top:0' }, ask),
				more ? h('p', { class: 'q-more' }, more) : null,
				d.body ? h('div', { class: 'md' }, md(d.body)) : null
			),
			noteArea,
			h('div', { class: 'wb-bar' },
				h('div', { class: 'wb-bar-meta' },
					h('span', { class: `wb-status${blockingBefore ? ' warn' : ''}` }, blockingBefore
						? `Also answer the ${count(blockingBefore, 'blocking decision')} above so everything goes to the thread together`
						: `Recommended: ${d.recommendation}`),
					error
				),
				h('div', { class: 'row' },
					requesting
						? [
							h('button', { type: 'button', class: 'btn', onclick: () => { mergeChangeOpen.delete(d.id); rebuild() } }, 'Cancel'),
							h('button', { type: 'button', class: 'btn primary', onclick: sendHold }, 'Hold & send notes')
						]
						: [
							h('button', { type: 'button', class: 'btn', onclick: () => {
								mergeChangeOpen.add(d.id)
								rebuild()
								const el = box.querySelector(`[data-draft="${CSS.escape(noteKey)}"]`)
								if (el) el.focus()
							} }, 'Do not merge / Request changes'),
							h('button', { type: 'button', class: 'btn primary', onclick: () => send('Merge') }, number ? `Merge PR #${number}` : 'Merge')
						]
				)
			)
		)
	}
	rebuild()
	return box
}

function dropButton(issue, then) {
	const error = h('span', { class: 'error' })
	const button = h('button', { class: 'btn quiet', onclick: async () => {
		if (!confirm(`Drop "${issue.title}"? It closes as dropped, and its thread is told to stop.`)) return
		button.disabled = true
		try { await api('POST', `/api/issues/${encodeURIComponent(issue.id)}/drop`, {}); then && then() } catch (e) { error.textContent = e.message; button.disabled = false }
	} }, 'Drop')
	return [button, error]
}

/** The lines an issue's PR adds and deletes. */
const sizeOf = (size) => size
	? h('span', { class: 'size', title: `${count(size.files, 'file')} changed` }, h('span', { class: 'add' }, `+${size.added}`), h('span', { class: 'del' }, `−${size.deleted}`))
	: null
const prNumber = (url) => (url && url.match(/\/pull\/(\d+)/)?.[1]) || null

/** Context-aware button label on a waiting board row. */
function actionLabelOf(i) {
	const open = (i.decisions || []).filter(isOpenDec)
	if (open.some((d) => d.kind === 'plan')) return 'Review plan'
	if (open.some((d) => d.kind === 'merge')) return 'Review & merge'
	if (open.some((d) => d.kind === 'blocked')) return 'Unblock'
	if (open.length) return 'Decide'
	return 'Open'
}

/** One issue on the board: what it is, how large, where it stands and who acts next. Its page holds the rest. */
function issueRow(i) {
	const s = statusOf(i)
	const next = inOrder(i.decisions || []).find(isOpenDec)
	const number = prNumber(i.prUrl)
	const subtitle = i.built || i.asked
	const showSubtitle = subtitle && subtitle.toLowerCase() !== i.title.toLowerCase()
	return h('div', { class: 'lrow' },
		h('div', { class: 'cell-main' },
			h('a', { class: 'title', href: issueHref(i) }, i.title),
			showSubtitle ? h('div', { class: 'asked-sub' }, subtitle) : null,
			h('div', { class: 'meta' }, dotted(
				i.repo,
				i.kind,
				number ? `PR #${number}` : null,
				i.captures ? count(i.captures, 'capture') : null,
				i.preview === 'up' ? 'dev env up' : null,
				i.autoShip ? 'auto-ship' : null
			),
				// A narrow board has no column for the size.
				i.size ? h('span', { class: 'size-m' }, ' · ', sizeOf(i.size)) : null),
			// What waits for the user is the one thing to read; otherwise the newest line of the run.
			next ? h('a', { class: 'last', href: issueHref(i) }, h('b', {}, 'Next'), splitQuestion(next.question)[0])
				: i.lastEvent ? h('div', { class: 'last' }, when(i.lastEvent.at), i.lastEvent.text) : null
		),
		h('div', { class: 'cell-size' }, sizeOf(i.size)),
		h('div', { class: 'cell-track' }, track(i, s), h('span', { class: 'stage-name' }, cap(i.stage))),
		h('div', { class: `cell-status t-${s.tone}` },
			h('div', { class: 'slabel' }, s.label),
			s.note && s.note.length ? h('div', { class: 'snote' }, s.note) : null,
			s.alarm ? h('div', { class: 'snote bad' }, s.alarm) : null
		),
		h('div', { class: 'cell-act' }, i.needsYou
			? h('a', { class: 'btn primary', href: issueHref(i) }, actionLabelOf(i))
			: [out(i.prUrl, 'PR', 'pr'), out(i.threadLink, 'Thread', 'thread', 'btn sm', 'Open in T3 Code')])
	)
}

function drawBoard() {
	if (!loaded) return render()
	const allOpen = board.issues
	const allYours = allOpen.filter((i) => i.needsYou)
	const allRest = allOpen.filter((i) => !i.needsYou)
	const allOthers = allRest.filter((i) => i.waiting).length
	const repos = [...new Set(allOpen.map((i) => i.repo))].sort()
	if (boardFilter.repo && !repos.includes(boardFilter.repo)) boardFilter.repo = ''

	const q = boardFilter.query.trim().toLowerCase()
	const matches = (i) => {
		if (boardFilter.repo && i.repo !== boardFilter.repo) return false
		if (q && !`${i.title} ${i.asked || ''} ${i.built || ''} ${i.repo}`.toLowerCase().includes(q)) return false
		if (boardFilter.status === 'needs') return i.needsYou
		if (boardFilter.status === 'working') return !i.needsYou && !i.waiting
		if (boardFilter.status === 'waiting') return !i.needsYou && !!i.waiting
		return true
	}
	const filtered = allOpen.filter(matches)
	const yours = filtered.filter((i) => i.needsYou)
	const rest = filtered.filter((i) => !i.needsYou)

	const toggleStatus = (key) => {
		boardFilter.status = boardFilter.status === key ? 'all' : key
		drawBoard()
	}
	const statBtn = (key, label, value, cls) => h('button', {
		type: 'button',
		class: `stat${cls ? ` ${cls}` : ''}${boardFilter.status === key ? ' active' : ''}`,
		'aria-pressed': boardFilter.status === key ? 'true' : 'false',
		onclick: () => toggleStatus(key)
	}, h('div', { class: 'stat-l' }, label), h('div', { class: 'stat-n' }, value))

	const list = (title, cls, rows, extraHead) => h('section', { class: `panel${cls}`, style: 'margin-top:20px' },
		h('div', { class: 'lhead' },
			h('h2', {}, title, h('span', { class: 'count' }, rows.length)),
			h('span', { class: 'lines' }, 'Lines'),
			h('span', {}, 'Stage'),
			h('span', {}, 'Status'),
			extraHead || h('span', {})
		),
		rows.map(issueRow)
	)

	const toolbar = allOpen.length > 1 ? h('div', { class: 'toolbar' },
		repos.length > 1 ? h('div', { class: 'pills', role: 'group', 'aria-label': 'Filter by repository' },
			h('button', { type: 'button', class: `pill${!boardFilter.repo ? ' on' : ''}`, onclick: () => { boardFilter.repo = ''; drawBoard() } }, 'All repos'),
			...repos.map((r) => h('button', { type: 'button', class: `pill${boardFilter.repo === r ? ' on' : ''}`, onclick: () => { boardFilter.repo = r; drawBoard() } }, r.split('/').pop()))
		) : null,
		boardFilter.status !== 'all' ? h('button', { type: 'button', class: 'pill', onclick: () => { boardFilter.status = 'all'; drawBoard() } }, 'Clear filter') : null,
		h('input', {
			type: 'search',
			class: 'search',
			placeholder: 'Filter issues...',
			'aria-label': 'Filter issues',
			'data-draft': 'board-search',
			value: boardFilter.query,
			oninput: (e) => { boardFilter.query = e.target.value; drawBoard() }
		})
	) : null

	render(
		h('section', { class: 'panel stats', 'aria-label': 'Overview' },
			statBtn('needs', 'Needs you', allYours.length, allYours.length ? 'warn' : ''),
			statBtn('working', 'Working', allRest.length - allOthers),
			statBtn('waiting', 'Waiting on others', allOthers),
			h('a', { class: 'stat', href: '#/done' }, h('div', { class: 'stat-l' }, 'Shipped, last 30 days'), h('div', { class: 'stat-n' }, board.done.filter((i) => i.outcome === 'shipped').length))
		),
		toolbar,
		yours.length ? list('Needs you', ' needs', yours,
			yours.length > 1 ? h('div', { class: 'lhead-end' }, h('a', { class: 'btn sm primary', href: issueHref(yours[0]) }, `Start triaging (${yours.length})`)) : h('span', {})
		) : null,
		rest.length ? list('In work', '', rest) : null,
		!allOpen.length ? h('section', { class: 'panel', style: 'margin-top:20px' }, h('div', { class: 'empty' },
			h('p', {}, 'No issues in work'),
			h('p', {}, 'Start one here, or tell a T3 Code thread to work an issue with the factory skill'),
			h('a', { class: 'btn', href: '#/new' }, 'New issue')
		)) : !filtered.length ? h('section', { class: 'panel', style: 'margin-top:20px' }, h('div', { class: 'empty' },
			h('p', {}, 'No matching issues'),
			h('button', { type: 'button', class: 'btn', onclick: () => { boardFilter.status = 'all'; boardFilter.repo = ''; boardFilter.query = ''; drawBoard() } }, 'Reset filters')
		)) : null
	)
}

function drawDone() {
	if (!loaded) return render()
	const repos = [...new Set(board.done.map((i) => i.repo))].sort()
	const outcomes = [...new Set(board.done.map((i) => i.outcome).filter(Boolean))].sort()
	const q = doneFilter.query.trim().toLowerCase()
	const rows = board.done.filter((i) => {
		if (doneFilter.repo && i.repo !== doneFilter.repo) return false
		if (doneFilter.outcome && i.outcome !== doneFilter.outcome) return false
		if (q && !`${i.title} ${i.summary || ''} ${i.repo}`.toLowerCase().includes(q)) return false
		return true
	})
	const toolbar = board.done.length > 1 ? h('div', { class: 'toolbar' },
		outcomes.length > 1 ? h('div', { class: 'pills' },
			h('button', { type: 'button', class: `pill${!doneFilter.outcome ? ' on' : ''}`, onclick: () => { doneFilter.outcome = ''; drawDone() } }, 'All'),
			...outcomes.map((o) => h('button', { type: 'button', class: `pill${doneFilter.outcome === o ? ' on' : ''}`, onclick: () => { doneFilter.outcome = o; drawDone() } }, outcomeName(o)))
		) : null,
		repos.length > 1 ? h('div', { class: 'pills' },
			h('button', { type: 'button', class: `pill${!doneFilter.repo ? ' on' : ''}`, onclick: () => { doneFilter.repo = ''; drawDone() } }, 'All repos'),
			...repos.map((r) => h('button', { type: 'button', class: `pill${doneFilter.repo === r ? ' on' : ''}`, onclick: () => { doneFilter.repo = r; drawDone() } }, r.split('/').pop()))
		) : null,
		h('input', {
			type: 'search',
			class: 'search',
			placeholder: 'Filter closed...',
			'aria-label': 'Filter closed issues',
			'data-draft': 'done-search',
			value: doneFilter.query,
			oninput: (e) => { doneFilter.query = e.target.value; drawDone() }
		})
	) : null
	render(
		h('h1', {}, 'Closed in the last 30 days'),
		toolbar,
		h('section', { class: 'panel', style: 'margin-top:20px' }, rows.length ? rows.map((i) => h('div', { class: 'item' },
			h('div', { class: 'item-head' },
				h('a', { class: 'title', href: issueHref(i) }, i.title),
				chip(outcomeName(i.outcome), i.outcome === 'shipped' ? 'ok' : ''),
				i.deploy && i.deploy !== 'none' ? chip(`deploy ${i.deploy}`, i.deploy === 'verified' ? 'ok' : 'warn') : null,
				h('span', { class: 'end row' }, sizeOf(i.size), out(i.prUrl, 'PR', 'pr'))
			),
			i.summary ? h('p', { style: 'max-width:80ch;color:var(--ink2)' }, i.summary) : null,
			h('div', { class: 'meta' }, dotted(i.repo, i.kind, when(i.closedAt)))
		)) : h('div', { class: 'empty' }, h('p', {}, board.done.length ? 'No matching closed issues' : 'Nothing closed yet')))
	)
}

function stationLine(issue, runs, status, onPickStage) {
	const closed = issue.state !== 'open'
	const at = issue.outcome === 'shipped' ? STAGES.length : STAGES.indexOf(issue.stage)
	return h('section', { class: `panel rail t-${status.tone}`, 'aria-label': 'Stages' }, ...STAGES.map((stage, n) => {
		const mine = runs.filter((r) => r.stage === stage)
		const last = mine.at(-1)
		const now = n === at && !closed
		const state = now ? `now${status.running ? ' running' : ''}` : n <= at ? (mine.length ? 'done' : 'skip') : ''
		const sub = !last ? (n < at ? 'skip' : '')
			: last.state === 'running' ? since(last.startedAt)
			: last.state === 'failed' ? 'failed'
			: span(last.endedAt - last.startedAt)
		return h('button', {
			type: 'button',
			class: `stn${now ? ' on' : ''}`,
			title: mine.length ? `${cap(stage)}: ${count(mine.length, 'run')}` : cap(stage),
			onclick: () => onPickStage && onPickStage(stage)
		},
			h('div', { class: `st ${state}` }, h('i')),
			h('div', { class: 'stn-row' },
				h('span', { class: 'stn-name' }, cap(stage)),
				sub ? h('span', { class: `stn-sub${last && last.state === 'failed' ? ' bad' : ''}` }, dotted(sub, mine.length > 1 ? `×${mine.length}` : null)) : null
			)
		)
	}))
}

function runRow(r) {
	const name = r.subject === 'plan' ? 'Plan review' : cap(r.stage)
	const state = r.state === 'running' ? chip('running', 'ok') : r.state === 'failed' ? chip('failed', 'bad') : chip('done')
	return h('div', { class: 'item' },
		h('div', { class: 'item-head' },
			h('strong', {}, name), state,
			r.model ? h('span', { class: 'mono muted' }, dotted(`${r.provider} / ${r.model}`, plain(r.options))) : null,
			h('span', { class: 'end num' }, dotted(clock(r.startedAt), r.endedAt ? span(r.endedAt - r.startedAt) : null, r.head ? `head ${r.head.slice(0, 7)}` : null))
		),
		r.summary ? h('p', {}, r.summary) : null,
		r.result ? fold(`run:${r.id}`, `Result: ${r.result.outcome}`, h('pre', {}, JSON.stringify(r.result, null, 2))) : null,
		r.resultMissing ? h('div', { class: 'meta' }, cap(r.resultMissing)) : null
	)
}

/** A question as its headline, up to the first question mark, and what follows it. */
function splitQuestion(text) {
	const at = text.search(/\?(\s|$)/)
	return at < 0 ? [text, ''] : [text.slice(0, at + 1), text.slice(at + 1).trim()]
}

/** A finding still to act on: no outcome yet, or declined and then upheld by a later review. */
const isOpenFinding = (f) => f.outcome === null || f.outcome === 'upheld'
const REACH = { local: 'reaches one place', module: 'reaches one module', app: 'reaches the whole app', data: 'reaches stored data' }

/** What stands behind the change, from what the service holds: the checks, the reviews, the tests and the risk. */
function checkedChips(data) {
	const chips = []
	const pr = data.pr
	if (pr?.state === 'merged') chips.push(chip('merged', 'ok'))
	else if (pr) {
		const c = pr.checks
		chips.push(c.state === 'passing' ? chip('CI passes', 'ok') : c.state === 'failing' ? chip(`CI fails: ${c.failing.join(', ')}`, 'bad') : c.state === 'absent' ? chip('no CI checks', 'warn') : chip(`CI ${c.state}`))
	}
	const reviews = data.runs.filter((r) => r.stage === 'review' && r.subject === 'pr' && r.result?.outcome === 'done').map((r) => r.result.result)
	if (reviews.length) {
		const found = (data.findings || []).filter((f) => f.subject === 'pr' && f.severity !== 'pre-existing')
		const open = found.filter(isOpenFinding)
		const tone = open.some((f) => f.severity === 'important') ? 'bad' : open.length ? 'warn' : 'ok'
		chips.push(chip(`${count(reviews.length, 'review round')}: ${found.length ? `${count(found.length, 'finding')}, ${open.length || 'none'} open` : 'no findings'}`, tone))
		const reproduced = reviews.findLast((r) => r.reproductionOnHead !== 'none')?.reproductionOnHead
		if (reproduced) chips.push(reproduced === 'passes' ? chip('the reproduction passes now', 'ok') : chip('the reproduction still fails', 'bad'))
		const proved = reviews.findLast((r) => r.testsFailWithoutFix !== 'no-new-tests')?.testsFailWithoutFix
		if (proved !== undefined) chips.push(proved ? chip('new tests fail without the change', 'ok') : chip('new tests pass without the change', 'warn'))
	}
	if (pr) {
		const needs = (data.items || []).filter((item) => item.needsAction).length
		if (needs) chips.push(chip(`${count(needs, 'comment')} on GitHub to act on`, 'warn'))
		chips.push(...pr.approvedBy.map((a) => chip(`approved by @${a.login}${a.commit && a.commit !== pr.head ? ' (older head)' : ''}`, 'ok')))
		chips.push(...pr.changesRequestedBy.map((l) => chip(`changes requested by @${l}`, 'bad')))
	}
	const risk = data.reviewRisk
	if (risk) chips.push(chip(`${risk.door} door`, risk.door === 'one-way' ? 'warn' : ''), chip(REACH[risk.reach], risk.reach === 'data' || risk.reach === 'app' ? 'warn' : ''))
	if (data.autoShip && data.issue.state === 'open') chips.push(chip('auto-ship on', 'ok'))
	return chips
}

/** The top of the page, for a reader who has not followed the run: each stage's own plain words, then the facts. */
function briefPanel(data, result) {
	const asked = result('research')?.asked
	const built = result('implement')?.built
	const planned = result('plan')?.planned
	const chips = checkedChips(data)
	const row = (label, ...body) => h('div', { class: 'brow' }, h('div', { class: 'brow-l' }, label), h('div', {}, ...body))
	const text = (words) => h('p', { class: 'brow-t' }, words)
	return h('section', { class: 'panel brief', 'aria-label': 'In brief' },
		// An issue research has not read yet, or one from before stages wrote these lines, shows the start of its own text.
		row('Asked', asked ? text(asked) : data.body ? h('div', { class: 'md clamp' }, md(data.body)) : h('p', { class: 'brow-t muted' }, '(no text)')),
		built ? row('Built', text(built)) : planned ? row('Planned', text(planned)) : null,
		chips.length ? row('Checked', h('div', { class: 'row' }, ...chips)) : null
	)
}

/** Inline heads-up surfaced before a merge decision so caveats are visible without opening an accordion. */
function headsupPanel(built, risk) {
	const low = (built?.decisions || []).filter((d) => d.confidence === 'low').map((d) => d.decision)
	const cols = [
		['Changed beyond ask', risk?.unrelated],
		['Where to look first', risk?.focus],
		['Not checked', built?.notChecked],
		['Low-confidence choices', low]
	].filter(([, rows]) => rows && rows.length)
	if (!cols.length) return null
	return h('section', { class: 'panel headsup', 'aria-label': 'Heads up before merging' },
		h('h3', {}, 'Heads up before merging'),
		h('div', { class: 'headsup-grid' }, ...cols.map(([title, rows]) =>
			h('div', { class: 'headsup-col' }, h('h4', {}, title), h('ul', {}, ...rows.map((r) => h('li', {}, r))))
		))
	)
}

/** Live progress feed while a stage is actively running. */
function liveActivityPanel(run, events) {
	const recent = events.filter((e) => !run || e.run_id === run.id || e.at >= run.startedAt).slice(-5).reverse()
	return h('section', { class: 'panel live-feed', 'aria-label': 'Live activity' },
		h('div', { class: 'live-feed-head' },
			h('span', { class: 'live-dot' }),
			h('strong', { style: 'font-weight:500' }, `${run.subject === 'plan' ? 'Plan review' : cap(run.stage)} running`),
			run.model ? h('span', { class: 'mono muted' }, run.model) : null,
			h('span', { class: 'muted' }, since(run.startedAt))
		),
		recent.length ? h('ul', { class: 'live-feed-list' }, ...recent.map((e) =>
			h('li', {}, when(e.at), h('span', {}, cap(e.text)))
		)) : null
	)
}

/** Quick note bar to steer an open issue's thread without leaving the factory page. */
function steerBox(issue) {
	const key = `steer:${issue.id}`
	const error = h('div', { class: 'error' })
	const status = h('span', { class: 'meta' })
	const input = h('textarea', {
		rows: 1,
		placeholder: 'Send a note or steering instruction to this issue\'s thread...',
		'aria-label': 'Message thread',
		'data-draft': key,
		oninput: () => drafts.set(key, input.value),
		onkeydown: (e) => { if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); send() } }
	}, drafts.get(key) || '')
	const btn = h('button', { type: 'button', class: 'btn', onclick: () => send() }, 'Send note')
	const send = async () => {
		const message = input.value.trim()
		if (!message) return
		btn.disabled = true
		error.textContent = ''
		status.textContent = ''
		try {
			await api('POST', `/api/issues/${encodeURIComponent(issue.id)}/message`, { message })
			drafts.delete(key)
			input.value = ''
			status.textContent = 'Sent to thread'
		} catch (e) {
			error.textContent = e.message
		}
		btn.disabled = false
	}
	return h('section', { class: 'panel steer', 'aria-label': 'Message thread' },
		h('div', { class: 'steer-row' }, input, btn),
		error,
		status
	)
}

/** One part of the record: its name, what it holds in a few words (in `tone` when that needs a look), and the rest once opened. */
function part(key, title, { note, tone }, ...body) {
	return h('details', { id: `fold-${key.replace(/[^a-z0-9_-]/gi, '-')}`, open: opened.has(key), ontoggle: (e) => (e.target.open ? opened.add(key) : opened.delete(key)) },
		h('summary', {}, h('span', { class: 'fold-t' }, title), note ? h('span', { class: `fold-s${tone ? ` ${tone}` : ''}` }, note) : null),
		...body
	)
}

async function drawIssue(id) {
	let data
	try { data = await api('GET', `/api/issues/${encodeURIComponent(id)}`) } catch (e) { render(h('p', { class: 'error' }, e.message)); return }
	if (route().id !== id) return
	const i = data.issue
	const pending = data.decisions.filter((d) => isOpenDec(d) || (d.answeredVia === 'page' && d.delivery !== 'sent'))
	const activeRun = data.runs.findLast((r) => r.state === 'running')
	const status = statusOf({ ...i, decisions: pending, waiting: data.waiting, run: activeRun })
	const section = (title, cnt, ...body) => [h('div', { class: 'sec' }, h('h2', {}, title), cnt ? h('span', { class: 'count' }, cnt) : null), ...body]
	const result = (stage, subject = null) => data.runs.findLast((r) => r.stage === stage && r.subject === subject && r.result?.outcome === 'done')?.result.result
	const built = result('implement')
	const planRes = result('plan')
	const shots = data.evidence || []
	const latest = data.events.at(-1)
	const key = (name) => `${name}:${id}`
	if (data.preview?.state === 'up') probe(id)
	else probes.delete(id)

	// Triage queue navigation across waiting issues.
	const waitingIssues = board.issues.filter((item) => item.needsYou)
	const idxInQueue = waitingIssues.findIndex((item) => item.id === id)
	const otherWaiting = waitingIssues.filter((item) => item.id !== id)
	const prevWaiting = idxInQueue > 0 ? waitingIssues[idxInQueue - 1] : null
	const nextWaiting = idxInQueue >= 0 && idxInQueue + 1 < waitingIssues.length ? waitingIssues[idxInQueue + 1] : otherWaiting[0] || null
	const triageNav = waitingIssues.length > 1 || (idxInQueue < 0 && otherWaiting.length > 0) ? h('div', { class: 'triage-nav' },
		idxInQueue >= 0 ? h('span', { class: 'count' }, `Needs you ${idxInQueue + 1} / ${waitingIssues.length}`) : h('span', { class: 'count' }, `${otherWaiting.length} waiting`),
		prevWaiting ? h('a', { class: 'btn sm', href: issueHref(prevWaiting), title: prevWaiting.title }, icon('prev'), 'Prev') : null,
		nextWaiting ? h('a', { class: 'btn sm', href: issueHref(nextWaiting), title: nextWaiting.title }, 'Next', icon('next')) : null
	) : null

	const submittedBanner = justSubmitted && justSubmitted.issueId === id ? h('div', { class: 'banner' },
		h('span', {}, h('strong', {}, '✓ '), justSubmitted.label),
		h('div', { class: 'row' },
			otherWaiting.length ? h('a', { class: 'btn sm primary', href: issueHref(otherWaiting[0]), onclick: () => { justSubmitted = null } }, `Review next (${otherWaiting.length} left)`) : null,
			h('button', { type: 'button', class: 'btn sm quiet', onclick: () => { justSubmitted = null; draw() } }, 'Dismiss')
		)
	) : null

	const claims = built?.claims || []
	const aware = built ? awarePanel(built, data.reviewRisk, planRes?.later) : null
	const findings = data.findings || []
	const items = data.items || []
	const openFindings = findings.filter(isOpenFinding).length
	const needs = items.filter((item) => item.needsAction).length
	const gate = data.gate
	const answered = data.decisions.filter((d) => d.answer !== null).length
	const openCount = data.decisions.filter(isOpenDec).length
	const supersededCount = data.decisions.filter((d) => d.supersededBy).length
	const running = data.runs.filter((r) => r.state === 'running').length
	const runsFoldKey = key('runs')
	const record = [
		claims.length ? part(key('proof'), 'Proof', { note: count(claims.length, 'claim') }, claimsTable(claims)) : null,
		aware ? part(key('aware'), 'Be aware of', aware, aware.body) : null,
		data.pr ? part(key('pr'), `Pull request #${data.pr.number}`,
			data.pr.state !== 'open' ? { note: data.pr.state, tone: data.pr.state === 'merged' ? 'ok' : '' }
				: gate.ready ? { note: 'merge gate ready', tone: 'ok' }
				: { note: `merge gate blocked by ${count(gate.blockers.length, 'thing')}` },
			prPanel(data)) : null,
		findings.length || items.length ? part(key('reviews'), 'Reviews',
			{
				note: dotted(
					findings.length ? `${count(findings.length, 'finding')}, ${openFindings || 'none'} open` : null,
					items.length ? `${count(items.length, 'comment')} on GitHub, ${needs || 'none'} to act on` : null
				),
				tone: openFindings || needs ? 'warn' : ''
			},
			findings.length ? [h('h3', { class: 'fold-h' }, 'Internal review'), findingsList(findings)] : null,
			items.length ? [h('h3', { class: 'fold-h' }, 'On GitHub'), reviewItems(items)] : null) : null,
		data.decisions.length ? part(key('decisions'), 'Decisions',
			{ note: dotted(answered ? `${answered} answered` : null, openCount ? `${openCount} open` : null, supersededCount ? `${supersededCount} superseded` : null) },
			h('div', { class: 'panel' }, ...data.decisions.map(decisionRow))) : null,
		data.runs.length ? part(runsFoldKey, 'Runs', { note: dotted(data.runs.length, running ? `${running} running` : null) }, h('div', { class: 'panel' }, ...data.runs.map(runRow))) : null,
		data.events.length ? part(key('timeline'), 'Timeline', { note: [count(data.events.length, 'event'), ', latest ', when(latest.at)] },
			h('div', { class: 'tl' }, ...data.events.slice().reverse().map((e) => h('div', {}, cap(e.text), h('time', {}, clock(e.at)))))) : null,
		part(key('taken'), 'The issue as taken in', { note: i.source && !isUrl(i.source) ? i.source : '' },
			data.body ? h('div', { class: 'body md' }, md(data.body)) : h('div', { class: 'body' }, h('p', { class: 'muted' }, '(no text)')))
	]

	const jumpToRuns = () => {
		opened.add(runsFoldKey)
		const el = document.getElementById(`fold-${runsFoldKey.replace(/[^a-z0-9_-]/gi, '-')}`)
		if (el) { el.open = true; el.scrollIntoView({ behavior: 'smooth', block: 'start' }) }
	}

	// On a merge review, show visual proof, measurements, caveats and Try-it BEFORE the Merge button.
	const hasOpenMerge = pending.some((d) => isOpenDec(d) && d.kind === 'merge')
	const hasVisualSection = shots.length || built?.media
	const hasMeasured = !!built?.measured?.rows?.length
	const hasTryIt = (i.state === 'open' && (built || data.preview)) || data.preview?.state === 'up'
	const visualBlocks = [
		hasVisualSection ? section('What it looks like', shots.length, gallery(shots, built?.media)) : null,
		hasMeasured ? section('Measured', null, measuredPanel(built.measured, data.pr?.head)) : null,
		hasOpenMerge && built ? headsupPanel(built, data.reviewRisk) : null,
		hasTryIt ? section('Try it', null, previewPanel(i, data.preview, built?.tryIt, data.pr?.head)) : null
	]
	const decisionBlocks = pending.length ? decisionWorkbench(data, pending, planRes) : []

	render(h('div', { class: 'ipage' },
		h('div', { class: 'itop' },
			h('a', { class: 'back', href: i.state === 'open' ? '#/' : '#/done' }, icon('back'), i.state === 'open' ? 'Board' : 'Done'),
			triageNav
		),
		submittedBanner,
		h('div', { class: 'ititle' },
			h('h1', {}, i.title),
			h('div', { class: 'row' },
				out(i.prUrl, prNumber(i.prUrl) ? `PR #${prNumber(i.prUrl)}` : 'PR', 'pr', 'btn'),
				overviewLink(i, data.overview),
				out(i.threadLink, 'Open in T3 Code', 'thread', 'btn'),
				out(i.source, 'Source', 'source', 'btn'),
				i.state === 'open' ? dropButton(i, () => draw()) : null
			)
		),
		h('div', { class: `imeta t-${status.tone}` },
			h('span', { class: 'slabel' }, status.label),
			status.note && status.note.length ? h('span', {}, status.note) : null,
			h('span', {}, dotted(i.repo, i.kind, h('span', {}, 'started ', when(i.createdAt)), sizeOf(i.size)))
		),
		stationLine(i, data.runs, status, jumpToRuns),
		i.configError ? h('p', { class: 'notice bad' }, i.configError) : null,
		i.threadGone ? h('p', { class: 'notice bad' }, 'T3 Code cannot find this thread any more.') : null,
		status.alarm ? h('p', { class: 'notice bad' }, status.alarm) : null,
		...(data.warnings || []).map((w) => h('p', { class: 'notice' }, w)),
		// A closed issue's report is its brief: what happened, the fix and what to be aware of.
		data.report ? section('Closing report', null, h('div', { class: 'panel body' }, h('div', { class: 'md' }, md(data.report)))) : briefPanel(data, result),
		// Live activity while a stage is working and nothing waits on the user.
		status.running && activeRun && !pending.length ? liveActivityPanel(activeRun, data.events) : null,
		// Merge decision comes AFTER proof & caveats; plan & questions come FIRST.
		...(hasOpenMerge ? [...visualBlocks, ...decisionBlocks] : [...decisionBlocks, ...visualBlocks]),
		i.state === 'open' && !i.threadGone ? steerBox(i) : null,
		section('The record', null, h('div', { class: 'panel folds' }, ...record.filter(Boolean)))
	))
	for (const el of main.querySelectorAll('.clamp')) el.classList.toggle('cut', el.scrollHeight > el.clientHeight)
}

/** A decision in the record: the question's headline and what was answered or superseded. */
function decisionRow(d) {
	return h('div', { class: 'item' },
		h('div', { class: 'item-head' },
			chip(d.provisional ? `${d.kind}, provisional` : d.kind),
			d.supersededBy ? chip('superseded') : null,
			h('span', { class: 'end' }, when(d.askedAt))
		),
		h('p', {}, splitQuestion(d.question)[0]),
		h('p', { class: 'meta' }, d.supersededBy
			? `Replaced by a newer question (${d.supersededBy})`
			: d.answer === null ? `Recommended: ${d.recommendation}` : `Answer (${d.answeredVia}): ${d.answer}`)
	)
}

/** The viewer sits outside <main>, so a live redraw never closes it or restarts a video. */
const viewer = { el: null, items: [], at: 0, sideBySide: false }
function pairFor(item) {
	if (!item || item.kind !== 'image' || (item.label !== 'before' && item.label !== 'after')) return null
	const before = viewer.items.find((s) => s.title === item.title && s.kind === 'image' && s.label === 'before')
	const after = viewer.items.find((s) => s.title === item.title && s.kind === 'image' && s.label === 'after')
	return before && after ? [before, after] : null
}
function showViewer() {
	const item = viewer.items[viewer.at]
	const many = viewer.items.length > 1
	const pair = pairFor(item)
	const showSide = !!(pair && viewer.sideBySide)
	const step = (by) => () => { viewer.at = (viewer.at + by + viewer.items.length) % viewer.items.length; showViewer() }
	const flipPair = () => {
		if (!pair) return
		const other = item === pair[0] ? pair[1] : pair[0]
		viewer.at = viewer.items.indexOf(other)
		showViewer()
	}
	const stage = showSide
		? h('div', { class: 'view-stage side' },
			...pair.map((p) => h('div', { class: 'view-pane' },
				h('div', { class: 'view-pane-head' }, chip(cap(p.label)), p.head ? h('span', { class: 'num' }, `at ${short(p.head)}`) : null),
				h('img', { src: p.url, alt: `${cap(p.label)}: ${p.title}` })
			))
		)
		: h('div', { class: 'view-stage' },
			item.kind === 'video'
				? h('video', { src: item.url, poster: item.poster, controls: true, autoplay: true, playsinline: true })
				: h('img', { src: item.url, alt: item.label ? `${cap(item.label)}: ${item.title}` : item.title })
		)
	const noteText = showSide ? [...new Set(pair.map((p) => p.note).filter(Boolean))].join(' ') : (item.note || '')
	viewer.el.replaceChildren(
		h('div', { class: 'view-bar' },
			h('div', { class: 'row' },
				h('strong', {}, item.title),
				!showSide && item.label ? chip(cap(item.label)) : null,
				showSide ? chip('Before / After') : null,
				h('span', { class: 'num' }, dotted(many && !showSide ? `${viewer.at + 1} / ${viewer.items.length}` : null, !showSide && item.head ? `at ${short(item.head)}` : null, item.github ? 'on GitHub' : 'on this page only'))
			),
			h('div', { class: 'row' },
				pair ? h('button', { class: 'btn sm', onclick: () => { viewer.sideBySide = !viewer.sideBySide; showViewer() } }, icon('split'), viewer.sideBySide ? 'Single (Space to flip)' : 'Side by side') : null,
				pair && !showSide ? h('button', { class: 'btn sm', onclick: flipPair, title: 'Swap before/after (Space)' }, 'Flip ', h('span', { class: 'kbd' }, 'Space')) : null,
				many ? h('button', { class: 'btn sm', onclick: step(-1), title: 'Previous (left arrow)', 'aria-label': 'Previous' }, icon('prev')) : null,
				many ? h('button', { class: 'btn sm', onclick: step(1), title: 'Next (right arrow)', 'aria-label': 'Next' }, icon('next')) : null,
				out(new URL(item.url, location.href).href, 'Original', 'out'),
				h('button', { class: 'btn sm', onclick: () => viewer.el.close(), 'aria-label': 'Close' }, icon('close'), 'Close')
			)
		),
		stage,
		h('p', { class: 'view-note' }, noteText)
	)
}
function openViewer(items, at) {
	if (!viewer.el) {
		viewer.el = h('dialog', { class: 'view', 'aria-label': 'Capture', onkeydown: (e) => {
			if (e.target.tagName === 'VIDEO') return
			if (e.key === ' ' && pairFor(viewer.items[viewer.at])) {
				e.preventDefault()
				if (viewer.sideBySide) { viewer.sideBySide = false; showViewer(); return }
				const pair = pairFor(viewer.items[viewer.at])
				const other = viewer.items[viewer.at] === pair[0] ? pair[1] : pair[0]
				viewer.at = viewer.items.indexOf(other)
				showViewer()
				return
			}
			if (viewer.items.length < 2 || (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight')) return
			viewer.at = (viewer.at + (e.key === 'ArrowLeft' ? -1 : 1) + viewer.items.length) % viewer.items.length
			showViewer()
		}, onclose: () => viewer.el.replaceChildren() })
		document.body.append(viewer.el)
	}
	viewer.items = items
	viewer.at = at
	viewer.sideBySide = !!(pairFor(items[at]) && window.innerWidth >= 900)
	showViewer()
	viewer.el.showModal()
}

/** Captures under one title sit together; a before and an after sit side by side. */
function gallery(shots, why) {
	if (!shots.length) return h('div', { class: 'panel body' }, h('p', { class: 'tryit' }, why))
	// Before comes first, so the arrows in the viewer flip between the two.
	const rank = { before: 0, after: 1 }
	const titles = [...new Set(shots.map((s) => s.title))]
	const ordered = titles.flatMap((title) => shots.filter((s) => s.title === title).sort((a, b) => (rank[a.label] ?? 2) - (rank[b.label] ?? 2)))
	const tile = (shot) => {
		const still = shot.kind === 'video' ? shot.poster : shot.url
		const name = `${shot.label ? `${cap(shot.label)}: ` : ''}${shot.title}`
		return h('button', { class: 'shot', onclick: () => openViewer(ordered, ordered.indexOf(shot)), 'aria-label': `${shot.kind === 'video' ? 'Play' : 'Open'} ${name}` },
			still ? h('img', { src: still, alt: name, loading: 'lazy' }) : h('div', { class: 'blank' }, 'Video'),
			shot.label ? h('span', { class: 'tag' }, cap(shot.label)) : null,
			shot.kind === 'video' ? h('span', { class: 'play', 'aria-hidden': 'true' }, icon('play').firstChild) : null
		)
	}
	return h('div', { class: 'panel shots' }, ...titles.map((title) => {
		const mine = ordered.filter((s) => s.title === title)
		const notes = [...new Set(mine.map((s) => s.note).filter(Boolean))]
		const pair = mine.length === 2 && mine[0].label === 'before' && mine[1].label === 'after'
		return h('div', {}, h('h3', {}, title), notes.length ? h('p', {}, notes.join(' ')) : null, h('div', { class: `shot-row${pair ? ' pair' : ''}` }, ...mine.map(tile)))
	}))
}

/** Whether each address of a running dev environment answers, asked at most every 30 seconds. */
const probes = new Map()
async function probe(id) {
	const last = probes.get(id)
	if (last && Date.now() - last.at < 30000) return
	probes.set(id, { at: Date.now(), ok: last ? last.ok : new Map() })
	try {
		const { urls } = await api('GET', `/api/issues/${encodeURIComponent(id)}/preview`)
		const changed = !last || urls.some((u) => last.ok.get(u.url) !== u.ok)
		probes.set(id, { at: Date.now(), ok: new Map(urls.map((u) => [u.url, u.ok])) })
		if (changed && route().id === id) draw()
	} catch {}
}

/** The dev environment runs in the issue's own checkout, so its thread starts and stops it when asked here. */
/** The PR's overview page. A relative address, so it opens under the host the page is read at. */
function overviewLink(i, overview) {
	if (!overview) return null
	const title = overview.stale
		? `Written for ${short(overview.head)}; the PR has moved since`
		: 'What the PR changes and why, without the full diff'
	return h('a', { class: 'btn', href: `/overview/${encodeURIComponent(i.id)}`, target: '_blank', rel: 'noreferrer', title },
		icon('doc'), overview.stale ? 'Overview (older head)' : 'Overview')
}

function previewPanel(i, preview, tryIt, prHead) {
	const error = h('p', { class: 'error' })
	const ask = (action) => async (e) => {
		e.target.disabled = true
		error.textContent = ''
		try { await api('POST', `/api/issues/${encodeURIComponent(i.id)}/preview`, { action }) } catch (err) { error.textContent = err.message; e.target.disabled = false }
	}
	// A closed issue's thread no longer works on it, so there is nobody to ask.
	const live = i.state === 'open' && !i.threadGone
	const start = (label) => live ? h('button', { class: 'btn primary', onclick: ask('start') }, label) : null
	const thread = out(i.threadLink, 'Open the thread', 'thread', 'btn')
	const state = preview ? preview.state : 'down'
	const seen = probes.get(i.id)?.ok
	const links = (preview?.urls || []).filter((u) => isUrl(u.url))
	let parts
	if (state === 'up') {
		const dead = !!seen && links.length > 0 && links.every((u) => seen.get(u.url) === false)
		const moved = prHead && preview.head && !sameCommit(preview.head, prHead)
		const idled = !!preview.stopsAt && Date.now() > preview.stopsAt
		parts = [
			h('div', { class: 'row' },
				...links.map((u, n) => h('a', { class: `btn env${n === 0 && !dead ? ' primary' : ''}${seen?.get(u.url) === true ? ' ok' : seen?.get(u.url) === false ? ' dead' : ''}`, href: u.url, target: '_blank', rel: 'noreferrer', title: seen?.get(u.url) === false ? 'Nothing answers here' : u.url }, h('i'), `Open ${u.name}`)),
				dead ? start('Start it again') : live ? h('button', { class: 'btn quiet', onclick: ask('stop') }, 'Stop') : null
			),
			h('p', { class: 'meta' }, dead
				? (idled ? 'It stopped by itself after standing idle.' : 'Nothing answers at these addresses any more. It was probably stopped.')
				: dotted('Running', preview.head ? `on ${short(preview.head)}` : null, moved ? `the PR has moved to ${short(prHead)} since` : null, h('span', {}, 'started ', when(preview.at)), preview.stopsAt && !idled ? `stops by itself around ${hour(preview.stopsAt)}` : null)),
			preview.error ? fold(`preview:${i.id}`, 'What the start reported', h('pre', {}, preview.error)) : null
		]
	} else if (state === 'requested') {
		parts = [h('div', { class: 'row' }, h('button', { class: 'btn primary', disabled: true }, 'Starting'), thread), h('p', { class: 'meta' }, 'The thread was asked to start it ', when(preview.at), '. The links show here when it is up.')]
	} else if (state === 'stopping') {
		parts = [h('div', { class: 'row' }, h('button', { class: 'btn', disabled: true }, 'Stopping'), thread), h('p', { class: 'meta' }, 'The thread was asked to stop it ', when(preview.at), '.')]
	} else if (state === 'failed') {
		parts = [h('div', { class: 'row' }, start('Try again'), thread), h('p', { class: 'notice bad', style: 'margin-top:0' }, 'It did not start.'), preview.error ? h('pre', {}, preview.error) : null]
	} else {
		parts = [h('div', { class: 'row' }, start('Start the dev environment')), h('p', { class: 'meta' }, i.threadGone ? 'T3 Code cannot find the thread that would start it.' : 'The issue\'s thread starts it in its own checkout, on the branch of the PR. It takes a minute or two.')]
	}
	return h('div', { class: 'panel body' }, ...parts, error, tryIt ? fold(`try:${i.id}`, 'Steps to try it', h('p', { class: 'tryit' }, tryIt)) : null)
}

/** The numbers of a change made to move one: the same run on the base commit and on the head. */
function measuredPanel(m, prHead) {
	const stale = prHead && m.head && !sameCommit(m.head, prHead) ? ", before the PR's last commit" : ''
	return h('div', { class: 'panel' },
		h('div', { class: 'measures' },
			h('div', { class: 'measures-head' }, h('span', {}, 'What'), h('span', {}, `Before, at ${short(m.base)}`), h('span', {}, `After, at ${short(m.head)}${stale}`)),
			...m.rows.map((r) => h('div', { class: 'measure' }, h('div', {}, r.what), h('div', { class: 'num' }, r.before), h('div', { class: 'num' }, r.after)))
		),
		h('div', { class: 'body' }, h('p', { class: 'tryit' }, m.how), m.same ? h('p', { class: 'tryit' }, m.same) : null)
	)
}

/** What the implementer says it proved: each thing asked for, with what showed it. */
function claimsTable(claims) {
	return h('div', { class: 'claims' },
		h('div', { class: 'claims-head' }, h('span', {}, 'Asked for'), h('span', {}, 'Proof')),
		...claims.map((c) => h('div', { class: 'claim' }, h('div', {}, c.claim), h('div', { class: 'proof' }, c.evidence)))
	)
}

/** What a merge leaves open: where the reviews say to look, and what the implementer did not check, left out or decided alone. */
function awarePanel(built, risk, later) {
	const order = ['low', 'medium', 'high']
	const decided = (built.decisions || []).slice().sort((a, b) => order.indexOf(a.confidence) - order.indexOf(b.confidence)).map((d) => `${d.decision} (${d.confidence} confidence)`)
	const left = [...(built.leftOut || []), ...(later || []).map((slice) => `${slice.title} (a later slice of the plan)`)]
	const lists = [
		['Changed beyond what was asked', risk?.unrelated, 'beyond what was asked'],
		['Where to look first', risk?.focus],
		['Not checked', built.notChecked, 'not checked'],
		['Not in this change', left, 'left out'],
		['Decided without you, least sure first', decided, 'decided without you']
	].filter(([, rows]) => rows && rows.length)
	if (!lists.length) return null
	return {
		note: dotted(...lists.filter(([, , word]) => word).map(([, rows, word]) => `${rows.length} ${word}`)),
		tone: risk?.unrelated?.length ? 'warn' : '',
		body: h('div', { class: 'body' }, ...lists.map(([title, rows]) => h('div', {}, h('h3', { class: 'sub' }, title), h('ul', { class: 'plain' }, ...rows.map((r) => h('li', {}, r))))))
	}
}

function prPanel(data) {
	const pr = data.pr
	const gate = data.gate
	const checks = pr.checks.state === 'passing' ? chip('checks pass', 'ok') : pr.checks.state === 'failing' ? chip(`failing: ${pr.checks.failing.join(', ')}`, 'bad') : pr.checks.state === 'absent' ? chip('no CI checks', 'warn') : chip(`checks ${pr.checks.state}`)
	return h('div', { class: 'panel body' },
		h('div', {},
			h('div', { class: `gate${gate.ready ? ' ok' : ''}` }, gate.ready ? 'Merge gate ready' : 'Merge gate blocked'),
			gate.blockers.length ? h('ul', { class: 'plain' }, ...gate.blockers.map((b) => h('li', {}, b.text))) : null
		),
		h('div', { class: 'row' },
			chip(pr.state === 'open' ? (pr.draft ? 'draft' : 'ready for review') : pr.state, pr.state === 'merged' ? 'ok' : ''),
			checks,
			...pr.bots.map((b) => chip(`${b.login} ${b.reviewedHead ? 'reviewed' : 'pending'}`, b.reviewedHead ? 'ok' : '')),
			...pr.approvedBy.map((a) => chip(`approved by @${a.login}${a.commit && a.commit !== pr.head ? ' (older head)' : ''}`, 'ok')),
			...pr.changesRequestedBy.map((l) => chip(`changes requested by @${l}`, 'bad')),

		),
