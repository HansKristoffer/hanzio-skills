<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<!--
	One <section class="scene" data-id="..."> per scene in the part's JSON, in the same order.
	data-f="0.4" reveals an element 40 % into that scene's narration.
	Reveal classes: .r rises in, .pop pops in, .glow pulses after it appears.
	Restyle the :root variables to the project's brand before anything else.
-->
<style>
:root {
	--bg: #0f1115;
	--surface: #171a21;
	--surface-2: #1f232c;
	--line: #2b303b;
	--text: #f4f2ee;
	--muted: #9aa3b2;
	--accent: #4f8cff;
	--accent-soft: rgba(79, 140, 255, 0.14);
	--good: #2fb36d;
	--good-soft: rgba(47, 179, 109, 0.14);
	--warn: #e8a33d;
	--warn-soft: rgba(232, 163, 61, 0.14);
	--bad: #e5584d;
	--bad-soft: rgba(229, 88, 77, 0.14);
	--font: -apple-system, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif;
	--mono: 'SF Mono', Menlo, monospace;
}
* { box-sizing: border-box; }
html, body {
	margin: 0; width: 1920px; height: 1080px; overflow: hidden;
	background: var(--bg); color: var(--text); font-family: var(--font);
	-webkit-font-smoothing: antialiased;
}
.scene {
	position: absolute; inset: 0; padding: 110px 140px;
	display: flex; flex-direction: column; justify-content: center; gap: 40px;
	opacity: 0; transition: opacity 0.6s ease;
}
.scene.on { opacity: 1; }

.r { opacity: 0; transform: translateY(24px); }
.scene.on .r { animation: rise 0.7s cubic-bezier(.2,.8,.2,1) forwards; animation-delay: var(--delay, 0s); }
@keyframes rise { to { opacity: 1; transform: none; } }
.pop { opacity: 0; transform: scale(0.85); }
.scene.on .pop { animation: pop 0.5s cubic-bezier(.2,1.4,.4,1) forwards; animation-delay: var(--delay, 0s); }
@keyframes pop { to { opacity: 1; transform: none; } }
.scene.on .pop.glow {
	animation: pop 0.5s cubic-bezier(.2,1.4,.4,1) forwards, glow 1.4s ease-out 2;
	animation-delay: var(--delay, 0s), calc(var(--delay, 0s) + 0.5s);
}
@keyframes glow { 0% { box-shadow: 0 0 0 0 var(--accent); } 100% { box-shadow: 0 0 0 26px transparent; } }
/* preview(): every scene in its finished state, no motion. */
.static .scene { transition: none; }
.static .scene.on .r, .static .scene.on .pop { animation: none; opacity: 1; transform: none; }

.eyebrow { font-size: 26px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent); font-weight: 600; }
h1 { font-size: 76px; line-height: 1.05; margin: 0; font-weight: 700; letter-spacing: -0.02em; }
h2 { font-size: 60px; line-height: 1.1; margin: 0; font-weight: 700; letter-spacing: -0.015em; }
p.lead { font-size: 32px; color: var(--muted); margin: 0; line-height: 1.4; max-width: 1400px; }
.small { font-size: 22px; color: var(--muted); }
.mono { font-family: var(--mono); font-size: 22px; color: var(--muted); }
.big { font-size: 140px; font-weight: 800; letter-spacing: -0.03em; color: var(--accent); line-height: 1; }

.row { display: flex; gap: 28px; align-items: stretch; }
.col { display: flex; flex-direction: column; gap: 18px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 30px 34px; }
.num {
	width: 64px; height: 64px; border-radius: 18px; background: var(--accent); color: var(--bg);
	display: grid; place-items: center; font-size: 34px; font-weight: 800; flex-shrink: 0;
}
.pill { display: inline-flex; align-items: center; gap: 10px; font-size: 22px; font-weight: 600; padding: 8px 18px; border-radius: 999px; white-space: nowrap; }
.pill.accent { background: var(--accent-soft); color: var(--accent); }
.pill.good { background: var(--good-soft); color: var(--good); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.arrow { font-size: 40px; color: var(--accent); align-self: center; }
.bubble { font-size: 26px; padding: 18px 24px; border-radius: 22px; max-width: 760px; line-height: 1.35; }
.bubble.them { background: var(--surface-2); border: 1px solid var(--line); align-self: flex-start; border-bottom-left-radius: 6px; }
.bubble.us { background: var(--text); color: var(--bg); align-self: flex-end; border-bottom-right-radius: 6px; }
.btn { display: inline-flex; align-items: center; gap: 12px; padding: 14px 26px; border-radius: 14px; font-size: 24px; font-weight: 600; border: 1px solid var(--line); background: var(--surface-2); }
.btn.primary { background: var(--accent); color: var(--bg); border-color: var(--accent); }
/* A real screenshot of the product: <img class="shot" src="shots/cases.png"> */
.shot { max-width: 100%; max-height: 720px; border-radius: 18px; border: 1px solid var(--line); box-shadow: 0 30px 80px rgba(0,0,0,0.45); align-self: center; }

.footer { position: absolute; left: 140px; bottom: 44px; font-size: 22px; color: var(--muted); }
.progress { position: absolute; left: 0; bottom: 0; height: 6px; background: var(--accent); width: 0; }
</style>
</head>
<body>

<section class="scene" data-id="intro">
	<div class="eyebrow r" data-f="0">Product name · what changed</div>
	<h1 class="r" data-f="0.05">The change in one line.<br/>Why it matters in another.</h1>
	<p class="lead r" data-f="0.5">A sentence of context that lands while the narration explains it.</p>
</section>

<section class="scene" data-id="how">
	<div class="eyebrow r" data-f="0">How it works</div>
	<div class="row" style="align-items:center">
		<div class="card col r" data-f="0.1" style="width:420px"><div class="small">Before</div><div style="font-size:30px;font-weight:700">What used to happen</div></div>
		<div class="arrow r" data-f="0.3">→</div>
		<div class="card col pop glow" data-f="0.45" style="width:420px; border-color:var(--accent)"><div class="small">Now</div><div style="font-size:30px;font-weight:700">What happens now</div><span class="pill good" style="align-self:flex-start">Shipped</span></div>
	</div>
</section>

<div class="footer" id="label"></div>
<div class="progress" id="progress"></div>

<script>
// Replaced at build time with [{ id, dur }] in seconds.
const TIMING = __TIMING__
const LABEL = document.title || ''
const scenes = [...document.querySelectorAll('.scene')]

function show(index) {
	scenes.forEach((scene) => scene.classList.remove('on'))
	scenes[index].classList.add('on')
	document.getElementById('label').textContent = `${LABEL ? `${LABEL} · ` : ''}${index + 1} / ${scenes.length}`
}

window.start = () => {
	const total = TIMING.reduce((sum, scene) => sum + scene.dur, 0)
	let at = 0
	TIMING.forEach((timing, index) => {
		scenes[index].querySelectorAll('[data-f]').forEach((el) => {
			el.style.setProperty('--delay', `${Number(el.dataset.f) * timing.dur}s`)
		})
		setTimeout(() => show(index), at * 1000)
		at += timing.dur
	})
	document.getElementById('progress').animate([{ width: '0%' }, { width: '100%' }], {
		duration: total * 1000, easing: 'linear', fill: 'forwards'
	})
	return total
}

window.preview = (index) => {
	document.body.classList.add('static')
	show(index)
}
</script>
</body>
</html>
